name: WB Raid UI i18n hotfix

on:
  push:
    branches:
      - hotfix/world-boss-raid-ui-i18n

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/world-boss-raid-ui-i18n
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply UI and locale hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          template_path = root / 'templates' / 'world_boss.html'
          template = template_path.read_text(encoding='utf-8')

          start = template.index('                {% if raid %}\n      <section class="gc-world-boss-raid-strip" data-wb-raid-state')
          end_marker = '                {% if is_active %}'
          end = template.index(end_marker, start)

          block = '''                {% if raid %}
                <section class="gc-world-boss-raid-strip" data-wb-raid-state
                         aria-label="{{ T('wb_raid_status', 'Raid-Status') }}">
                  <div class="gc-world-boss-raid-strip__head">
                    <strong class="gc-world-boss-raid-strip__title gc-mono">
                      {{ T("wb_raid_status", "Raid-Status") }}
                    </strong>
                    <div class="gc-world-boss-raid-strip__badges">
                      {% if raid.containment and raid.containment.active %}
                      <span class="gc-world-boss-status-badge" data-wb-containment>
                        🛡 {{ T("wb_raid_containment", "Eindämmung") }} ·
                        <span data-countdown-at="{{ raid.containment.ends_at|int }}" data-countdown-format="eta">—</span>
                      </span>
                      {% endif %}
                      {% if raid.last_stand and raid.last_stand.active %}
                      <span class="gc-world-boss-status-badge gc-world-boss-status-badge--active" data-wb-last-stand>
                        🚨 {{ T("wb_raid_last_stand", "Letztes Aufgebot") }} +25%
                      </span>
                      {% endif %}
                    </div>
                  </div>

                  {% if raid.resonance %}
                  <div class="gc-world-boss-raid-strip__meter">
                    <div class="gc-world-boss-raid-strip__label-row">
                      {% if raid.resonance.active %}
                      <span class="gc-world-boss-status-badge gc-world-boss-status-badge--active" data-wb-resonance-active>
                        ⚡ {{ T("wb_raid_resonance", "Flottenresonanz") }} +50% ·
                        <span data-countdown-at="{{ raid.resonance.ends_at|int }}" data-countdown-format="eta">—</span>
                      </span>
                      {% else %}
                      <span class="gc-world-boss-raid-strip__label">⚡ {{ T("wb_raid_resonance", "Flottenresonanz") }}</span>
                      <span class="gc-mono" data-wb-resonance-label>{{ raid.resonance.points }} / {{ raid.resonance.threshold }}</span>
                      {% endif %}
                    </div>
                    <div class="gc-world-boss-hp gc-world-boss-raid-strip__bar"
                         role="meter" aria-valuemin="0" aria-valuemax="100"
                         aria-valuenow="{{ raid.resonance.progress_pct|int }}" data-wb-resonance-meter>
                      <div class="gc-world-boss-hp-fill" data-wb-resonance-fill
                           style="width:{{ raid.resonance.progress_pct }}%;"></div>
                    </div>
                  </div>
                  {% endif %}

                  {% if raid.target_lock %}
                  <div class="gc-world-boss-raid-strip__meter">
                    <div class="gc-world-boss-raid-strip__label-row">
                      <span class="gc-world-boss-raid-strip__label">🎯 {{ T("wb_raid_target_lock", "Zielerfassung") }}</span>
                      <span class="gc-mono">{{ raid.target_lock.charge }}%</span>
                    </div>
                    <div class="gc-world-boss-hp gc-world-boss-raid-strip__bar"
                         role="meter" aria-valuemin="0" aria-valuemax="100"
                         aria-valuenow="{{ raid.target_lock.charge|int }}" data-wb-target-lock-meter>
                      <div class="gc-world-boss-hp-fill" data-wb-target-lock-fill
                           style="width:{{ raid.target_lock.charge }}%;"></div>
                    </div>
                  </div>
                  {% endif %}
                </section>
                {% endif %}

'''
          template_path.write_text(template[:start] + block + template[end:], encoding='utf-8')

          css_path = root / 'static' / 'style.css'
          css = css_path.read_text(encoding='utf-8')
          marker = '/* GC-WB-RAID-HUD-CANONICAL */'
          canonical_css = r'''

/* GC-WB-RAID-HUD-CANONICAL */
.gc-world-boss-raid-strip {
  position: relative;
  z-index: 4;
  display: grid;
  gap: .7rem;
  margin: .7rem 0 .8rem;
  padding: .8rem .9rem;
  border: 1px solid rgba(89, 221, 255, .34);
  border-radius: 0;
  background: rgba(3, 14, 27, .96);
  box-shadow: none;
}

.gc-world-boss-raid-strip__head,
.gc-world-boss-raid-strip__label-row {
  display: flex;
  gap: .6rem;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  min-width: 0;
}

.gc-world-boss-raid-strip__badges {
  display: flex;
  gap: .45rem;
  align-items: center;
  flex-wrap: wrap;
}

.gc-world-boss-raid-strip__title {
  color: #74e8ff;
  font-size: .76rem;
  letter-spacing: .09em;
  text-transform: uppercase;
}

.gc-world-boss-raid-strip__meter {
  display: grid;
  gap: .35rem;
}

.gc-world-boss-raid-strip__label {
  color: #a9deea;
  font-weight: 700;
}

.gc-world-boss-raid-strip__bar {
  height: .72rem;
  min-height: .72rem;
}

.gc-world-boss-raid-strip,
.gc-world-boss-raid-strip .gc-world-boss-status-badge,
.gc-world-boss-raid-strip .gc-world-boss-hp,
.gc-world-boss-raid-strip .gc-world-boss-hp-fill {
  border-radius: 0 !important;
}
'''
          if marker not in css:
              css_path.write_text(css.rstrip() + canonical_css + '\n', encoding='utf-8')

          translations = {
              'de': {
                  'wb_raid_status': 'Raid-Status',
                  'wb_raid_containment': 'Eindämmung',
                  'wb_raid_resonance': 'Flottenresonanz',
                  'wb_raid_target_lock': 'Zielerfassung',
                  'wb_raid_last_stand': 'Letztes Aufgebot',
              },
              'en': {
                  'wb_raid_status': 'Raid Status',
                  'wb_raid_containment': 'Containment',
                  'wb_raid_resonance': 'Fleet Resonance',
                  'wb_raid_target_lock': 'Target Lock',
                  'wb_raid_last_stand': 'Last Stand',
              },
              'fr': {
                  'wb_raid_status': 'Statut du raid',
                  'wb_raid_containment': 'Confinement',
                  'wb_raid_resonance': 'Résonance de flotte',
                  'wb_raid_target_lock': 'Verrouillage de cible',
                  'wb_raid_last_stand': 'Dernier rempart',
              },
              'es': {
                  'wb_raid_status': 'Estado de incursión',
                  'wb_raid_containment': 'Contención',
                  'wb_raid_resonance': 'Resonancia de flota',
                  'wb_raid_target_lock': 'Fijación de objetivo',
                  'wb_raid_last_stand': 'Última resistencia',
              },
              'pl': {
                  'wb_raid_status': 'Status rajdu',
                  'wb_raid_containment': 'Powstrzymanie',
                  'wb_raid_resonance': 'Rezonans floty',
                  'wb_raid_target_lock': 'Namierzanie celu',
                  'wb_raid_last_stand': 'Ostatni bastion',
              },
              'tr': {
                  'wb_raid_status': 'Baskın Durumu',
                  'wb_raid_containment': 'Sınırlama',
                  'wb_raid_resonance': 'Filo Rezonansı',
                  'wb_raid_target_lock': 'Hedef Kilidi',
                  'wb_raid_last_stand': 'Son Direniş',
              },
              'ru': {
                  'wb_raid_status': 'Статус рейда',
                  'wb_raid_containment': 'Сдерживание',
                  'wb_raid_resonance': 'Резонанс флота',
                  'wb_raid_target_lock': 'Захват цели',
                  'wb_raid_last_stand': 'Последний рубеж',
              },
              'pt': {
                  'wb_raid_status': 'Estado da incursão',
                  'wb_raid_containment': 'Contenção',
                  'wb_raid_resonance': 'Ressonância da frota',
                  'wb_raid_target_lock': 'Travamento de alvo',
                  'wb_raid_last_stand': 'Última resistência',
              },
          }

          for locale, values in translations.items():
              path = root / 'locales' / f'{locale}.json'
              text = path.read_text(encoding='utf-8')
              data = json.loads(text)
              missing = [k for k in values if k not in data]
              if not missing:
                  continue
              stripped = text.rstrip()
              assert stripped.endswith('}'), path
              body = stripped[:-1].rstrip()
              sep = '\n' if body.endswith(',') else ',\n'
              lines = []
              for idx, key in enumerate(missing):
                  comma = ',' if idx < len(missing) - 1 else ''
                  lines.append(f'  {json.dumps(key, ensure_ascii=False)}: {json.dumps(values[key], ensure_ascii=False)}{comma}')
              path.write_text(body + sep + '\n'.join(lines) + '\n}\n', encoding='utf-8')

          # Hard validation before commit.
          for locale, values in translations.items():
              data = json.loads((root / 'locales' / f'{locale}.json').read_text(encoding='utf-8'))
              for key, expected in values.items():
                  assert data.get(key) == expected, (locale, key, data.get(key), expected)

          rendered = template_path.read_text(encoding='utf-8')
          raid_start = rendered.index('<section class="gc-world-boss-raid-strip"')
          raid_end = rendered.index('</section>', raid_start)
          raid_block = rendered[raid_start:raid_end]
          assert 'border-radius' not in raid_block
          assert 'style="position:' not in raid_block
          assert 'Fleet Resonance' not in raid_block
          assert 'Target Lock' not in raid_block
          assert 'Containment' not in raid_block
          assert 'Last Stand' not in raid_block
          PY

      - name: Validate locale JSON and key parity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('locales').glob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          print('All locale JSON files parse.')
          PY
          python scripts/check_locale_keys.py

      - name: Commit generated hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/world_boss.html static/style.css locales/de.json locales/en.json locales/fr.json locales/es.json locales/pl.json locales/tr.json locales/ru.json locales/pt.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "fix(world-boss): align raid HUD with canonical UI and locales"
          git push origin HEAD:hotfix/world-boss-raid-ui-i18n
