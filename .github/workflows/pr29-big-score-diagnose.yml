name: PR29 Big Score Diagnose

on:
  pull_request:

jobs:
  diagnose:
    if: github.head_ref == 'feature/fullwidth-ranking-exact-scores'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-big-score-diagnose-secret
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Run exact big-score suite and capture trace
        id: pytest
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=long \
            tests/test_ranking.py tests/test_number_format.py tests/test_noob_protection.py \
            tests/test_big_score_migration.py \
            tests/test_gc622_integer_overflow.py::TestGC622SchemaTypes::test_player_scores_use_decimal_text \
            tests/test_gc622_integer_overflow.py::TestGC622Ranking \
            > pr29-big-score-pytest.log 2>&1
          status=$?
          cat pr29-big-score-pytest.log
          printf '%s\n' "$status" > pr29-big-score-exit-code.txt
          exit "$status"
      - name: Upload diagnostic trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr29-big-score-trace
          path: |
            pr29-big-score-pytest.log
            pr29-big-score-exit-code.txt
          if-no-files-found: error
          retention-days: 1
