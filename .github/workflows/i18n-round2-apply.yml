name: I18N Visible Cleanup Round 2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/i18n-visible-cleanup-round2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply targeted visible locale cleanup
        run: python scripts/i18n_round2_patch.py

      - name: Run locale guards
        run: |
          python scripts/audit_locale_keys.py
          python scripts/audit_visible_i18n.py --locales-only
          python -m pytest -q --tb=line tests/test_gc900_multilanguage.py tests/test_i18n_hardening.py

      - name: Commit targeted locale cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add locales tests/test_i18n_hardening.py
          git commit -m "fix(i18n): clean visible PE language debt round 2"
          git push origin HEAD:fix/i18n-visible-cleanup-round2
