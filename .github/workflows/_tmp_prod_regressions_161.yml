name: TEMP Apply Prod Regressions 161

on:
  push:
    branches:
      - hotfix/prod-regressions-records-build-switch-161

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/prod-regressions-records-build-switch-161
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scoped dependencies
        run: python -m pip install -r requirements-prod.txt pytest
      - name: Apply exact production hotfix
        run: python scripts/_apply_prod_regressions_161.py
      - name: Verify source and regressions
        run: |
          python -m py_compile app.py game/buildings.py game/records.py tests/test_gc_pg_prod_regressions_161.py
          python -m pytest -q tests/test_gc_pg_prod_regressions_161.py tests/test_records.py tests/test_gc845_planet_switch_payload.py
      - name: Commit generated product diff
        run: |
          if git diff --quiet -- app.py game/buildings.py game/records.py; then
            echo "Production regression patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py game/buildings.py game/records.py
          git commit -m "fix(pg): repair records, build checkout and planet switch reads"
          git push origin HEAD:hotfix/prod-regressions-records-build-switch-161
