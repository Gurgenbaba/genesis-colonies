name: GC PERF 174 Sentinel PJAX Matrix Apply

on:
  push:
    branches:
      - perf/pg-174-sentinel-pjax-matrix

concurrency:
  group: gc-perf-174-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: '0'
      SECRET_KEY: ci-perf-174-secret-key-not-for-production-use
      GC_SKIP_MIGRATION_CHECK: '1'
      GC_EMBEDDED_CRON: '0'
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/pg-174-sentinel-pjax-matrix
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Apply Sentinel PJAX matrix
        run: python scripts/apply_gc_perf_174_sentinel_nav_matrix.py
      - name: Run navigation matrix regressions
        run: |
          python -m pytest -q \
            tests/test_gc_perf_174_sentinel_nav_matrix.py \
            tests/test_gc_perf_002_nav_latency.py \
            tests/test_gc_request_perf_trace.py
          python -m py_compile game/live_state.py scripts/browser_sentinel.py scripts/browser_test_support.py
          node --check static/main.js
          git diff --check
      - name: Commit validated production patch
        run: |
          rm scripts/apply_gc_perf_174_sentinel_nav_matrix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            game/live_state.py static/main.js \
            scripts/browser_sentinel.py scripts/browser_test_support.py \
            tests/test_gc_perf_174_sentinel_nav_matrix.py \
            scripts/apply_gc_perf_174_sentinel_nav_matrix.py
          git commit -m 'perf(nav): measure real PJAX journeys in Sentinel'
          git push origin HEAD:perf/pg-174-sentinel-pjax-matrix
