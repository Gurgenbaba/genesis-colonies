name: Endgame Economy Hotfix

on:
  pull_request:
    paths:
      - "game/production_formula.py"
      - "game/economy_balance.py"
      - "game/effects/effect_resolver.py"
      - "game/mine_evolution/**"
      - "tests/test_endgame_economy_guardrail.py"
      - "tests/test_production_formula.py"
      - "tests/test_gc_big_number_runtime_production.py"
      - "tests/test_gc_ferro_l388_001.py"
      - "tests/test_gc_mando_storage_001.py"
      - "tests/test_mine_evolution.py"
      - ".github/workflows/endgame-economy-hotfix.yml"
  push:
    branches: [main]
    paths:
      - "game/production_formula.py"
      - "game/economy_balance.py"
      - "game/effects/effect_resolver.py"
      - "game/mine_evolution/**"
      - "tests/test_endgame_economy_guardrail.py"
      - "tests/test_production_formula.py"
      - "tests/test_gc_big_number_runtime_production.py"
      - "tests/test_gc_ferro_l388_001.py"
      - "tests/test_gc_mando_storage_001.py"
      - "tests/test_mine_evolution.py"
      - ".github/workflows/endgame-economy-hotfix.yml"

concurrency:
  group: endgame-economy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  endgame-economy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-endgame-economy-secret-key-not-for-production-use
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
      GC_ENDGAME_ECONOMY_MODE: legacy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Compile production owners
        run: |
          python -m py_compile game/production_formula.py game/economy_balance.py game/effects/effect_resolver.py game/mine_evolution/service.py game/mine_evolution/nodebuster.py
          git diff --check
      - name: Guardrail + canonical production regression
        run: |
          python -m pytest -q --tb=line \
            tests/test_endgame_economy_guardrail.py \
            tests/test_production_formula.py
      - name: Big-number production regression (isolated DB lifecycle)
        run: python -m pytest -q --tb=line tests/test_gc_big_number_runtime_production.py
      - name: Mando/high-level economy regression (isolated DB lifecycle)
        run: |
          python -m pytest -q --tb=line tests/test_gc_ferro_l388_001.py
          python -m pytest -q --tb=line tests/test_gc_mando_storage_001.py
      - name: Nodebuster mine production regression
        run: |
          python -m pytest -q --tb=line \
            tests/test_mine_evolution.py \
            tests/test_gc_mine_ascension_nexus_001.py
