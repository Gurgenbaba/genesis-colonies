name: GC Current Performance Audit

on:
  push:
    branches:
      - perf/current-hotspot-pass

permissions:
  contents: read

env:
  APP_ENV: development
  FLASK_ENV: development
  FLASK_DEBUG: '0'
  SECRET_KEY: ci-perf-audit-secret-key-not-for-production
  GC_SKIP_MIGRATION_CHECK: '1'
  GC_EMBEDDED_CRON: '0'
  GC_DB_BACKEND: sqlite
  GC_REQUEST_PERF_DEBUG: '1'
  GC_REQUEST_PERF_SLOW_MS: '0'
  GC_REQUEST_PERF_SAMPLE: '1.0'
  GC_PERF_INTEL: '1'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Run representative request matrix
        shell: bash
        run: |
          cat > tests/_tmp_perf_current_audit.py <<'PY'
          from __future__ import annotations

          import logging
          import re

          import pytest

          pytest_plugins = ["tests.test_game_state_live"]

          ROUTES = [
              ("diet", "/api/game-state", {}),
              ("panel_buildings", "/api/game-state?include_panel=1&panel_page=buildings", {}),
              ("panel_research", "/api/game-state?include_panel=1&panel_page=research", {}),
              ("panel_overview", "/api/game-state?include_panel=1&panel_page=overview", {}),
              ("panel_fleet", "/api/game-state?include_panel=1&panel_page=fleet", {}),
              ("page_overview", "/overview", {}),
              ("page_buildings", "/buildings", {}),
              ("page_research", "/research", {}),
              ("page_fleet", "/fleet", {}),
          ]

          KEYS = (
              "total_ms",
              "sql_count",
              "sql_write_count",
              "db_connection_open_count",
              "live_context_ms",
              "payload_ms",
              "page_context_ms",
              "panel_total_ms",
              "payload_panel_ms",
              "panel_buildings_rows_ms",
              "hud_research_ms",
              "live_hud_reads_ms",
              "payload_nav_badges_ms",
              "payload_fleets_hud_ms",
          )

          def parse(msg: str):
              out = {}
              for key in KEYS:
                  m = re.search(rf"(?:^| )({re.escape(key)})=([^ ]+)", msg)
                  if m:
                      out[key] = m.group(2)
              return out

          def test_current_request_perf_matrix(game_client, caplog):
              client, _pid = game_client
              # Warm imports/caches and establish the normal poll state first.
              client.get("/api/game-state")
              print("\n=== GC PERF CURRENT AUDIT ===")
              for label, route, headers in ROUTES:
                  # Warm this exact route once, then capture a repeat request.
                  client.get(route, headers=headers)
                  caplog.clear()
                  with caplog.at_level(logging.INFO):
                      resp = client.get(route, headers=headers)
                  assert resp.status_code == 200, (label, resp.status_code, resp.get_data(as_text=True)[:300])
                  logs = [r.message for r in caplog.records if "[GC REQUEST PERF]" in r.message]
                  if not logs:
                      print(f"AUDIT {label}: NO_PERF_LOG")
                      continue
                  msg = logs[-1]
                  fields = parse(msg)
                  print("AUDIT", label, "route=" + route, " ".join(f"{k}={fields[k]}" for k in KEYS if k in fields))
                  print("RAW", label, msg)
          PY
          python -m pytest -q -s tests/_tmp_perf_current_audit.py
          rm -f tests/_tmp_perf_current_audit.py
