name: Fix asteroid fuel i18n marker

on:
  push:
    branches:
      - fix/asteroid-fuel-preview-layout
    paths:
      - .github/workflows/fix-asteroid-fuel-i18n-marker.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/asteroid-fuel-preview-layout
          fetch-depth: 0
      - name: Apply scanner annotation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('static/js/galaxy-quick-action.js')
          text = p.read_text(encoding='utf-8')
          old = '      line.textContent = `${fuelIcon} ${formatNumber(fuelCost)}${missing > 0 ? " ⚠" : ""}`;'
          new = old + ' // i18n-ok: language-neutral fuel glyph and formatted number'
          if old not in text:
              raise SystemExit('target line not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/fix-asteroid-fuel-i18n-marker.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/js/galaxy-quick-action.js
          git commit -m "fix: mark language-neutral asteroid fuel preview"
          git push origin HEAD:fix/asteroid-fuel-preview-layout
      - name: Verify scanner and syntax
        run: |
          node --check static/js/galaxy-quick-action.js
          python scripts/audit_visible_i18n.py --raw-only --diff-base origin/main --max-findings 200
