name: Apply Mega Belt Share Lifecycle

on:
  push:
    branches:
      - fix/mega-belt-player-share-lifecycle

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mega-belt-player-share-lifecycle
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply lifecycle and share patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_str, old, new):
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing anchor in {path}: {old[:120]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          ast = Path('game/asteroids.py')
          text = ast.read_text(encoding='utf-8')

          old = "MEGA_BELT_STORAGE_FRACTION = 0.02\nMEGA_BELT_MIN_POOL_PER_RESOURCE = 5_000_000\n"
          new = "MEGA_BELT_STORAGE_FRACTION = 0.02\nMEGA_BELT_MIN_POOL_PER_RESOURCE = 5_000_000\n# Each player may harvest at most 10% of the original mega-belt pool.\n# The cap is per resource so ten fully equipped players can cleanly split a belt,\n# while smaller fleets may make repeated trips until their own share is exhausted.\nMEGA_BELT_PLAYER_SHARE = 0.10\n"
          if old not in text:
              raise SystemExit('missing mega constant anchor')
          text = text.replace(old, new, 1)

          old = '''    engaged = bool(aid and (aid in engaged_ids or fleet.get("engaged")))\n    status = str(fleet.get("fleet_status") or "")\n    arrival = fleet.get("arrival_at")\n    try:\n        arrival_f = float(arrival) if arrival is not None else None\n    except (TypeError, ValueError):\n        arrival_f = None\n    ts = float(now if now is not None else _now())\n    # Consistent "Unterwegs": any outbound hunt, including ETA still in the future.\n    en_route = bool(status == "outbound")\n    if not en_route and engaged and arrival_f is not None and arrival_f > ts:\n        en_route = True\n    out["viewer_engaged"] = engaged\n    out["viewer_fleet_status"] = status if engaged else ""\n    out["viewer_arrival_at"] = arrival_f\n    out["viewer_en_route"] = en_route\n    out["viewer_harvest_locked"] = en_route\n    return out\n'''
          new = '''    status = str(fleet.get("fleet_status") or "").strip().lower()\n    arrival = fleet.get("arrival_at")\n    try:\n        arrival_f = float(arrival) if arrival is not None else None\n    except (TypeError, ValueError):\n        arrival_f = None\n    active_fleet = bool(fleet.get("engaged") and status in ("outbound", "returning"))\n    en_route = bool(active_fleet and status == "outbound")\n    returning = bool(active_fleet and status == "returning")\n    # Durable engagement history must never masquerade as a live flight.\n    # It is retained separately for audit/history, while UI locking follows\n    # only an actually active outbound/returning fleet.\n    out["viewer_has_engaged"] = bool(aid and (aid in engaged_ids or active_fleet))\n    out["viewer_engaged"] = active_fleet\n    out["viewer_fleet_status"] = status if active_fleet else ""\n    out["viewer_arrival_at"] = arrival_f if active_fleet else None\n    out["viewer_en_route"] = en_route\n    out["viewer_returning"] = returning\n    out["viewer_harvest_locked"] = active_fleet\n    return out\n'''
          if old not in text:
              raise SystemExit('missing viewer state anchor')
          text = text.replace(old, new, 1)

          marker = '\n\ndef build_asteroid_board_entries(\n'
          if marker not in text:
              raise SystemExit('missing board function marker')
          helper = r'''


def mega_belt_player_share_state(
    asteroid_id: int,
    player_id: int,
    *,
    conn,
    row: Optional[Mapping[str, Any]] = None,
) -> Dict[str, Any]:
    """Return the canonical per-player 10% Mega Belt entitlement.

    The original spawn pool is reconstructed losslessly as current remaining
    resources + the append-only claim ledger. This avoids another mutable
    "initial pool" column and stays correct across repeated small-fleet trips.
    """
    zero = {"metal": 0, "crystal": 0, "fuel_cells": 0}
    aid = int(asteroid_id or 0)
    pid = int(player_id or 0)
    if aid <= 0 or pid <= 0 or not table_exists(conn, "asteroid_field_claims"):
        return {
            "original_pool": dict(zero),
            "player_claimed": dict(zero),
            "player_quota": dict(zero),
            "player_remaining": dict(zero),
            "player_remaining_total": 0,
            "share_percent": 0.0,
            "quota_exhausted": False,
        }
    source = row
    if source is None:
        source = conn.execute(
            "SELECT * FROM asteroid_fields WHERE id = ? LIMIT 1;", (aid,)
        ).fetchone()
    if not source:
        return {
            "original_pool": dict(zero),
            "player_claimed": dict(zero),
            "player_quota": dict(zero),
            "player_remaining": dict(zero),
            "player_remaining_total": 0,
            "share_percent": 0.0,
            "quota_exhausted": False,
        }
    try:
        tier = str(source["tier"] or TIER_STANDARD)
    except (KeyError, IndexError, TypeError):
        tier = TIER_STANDARD
    if tier != TIER_MEGA:
        return {
            "original_pool": dict(zero),
            "player_claimed": dict(zero),
            "player_quota": dict(zero),
            "player_remaining": dict(zero),
            "player_remaining_total": 0,
            "share_percent": 0.0,
            "quota_exhausted": False,
        }

    all_claims = conn.execute(
        """
        SELECT COALESCE(SUM(metal), 0) AS metal,
               COALESCE(SUM(crystal), 0) AS crystal,
               COALESCE(SUM(fuel_cells), 0) AS fuel_cells
        FROM asteroid_field_claims WHERE asteroid_id = ?;
        """,
        (aid,),
    ).fetchone()
    own_claims = conn.execute(
        """
        SELECT COALESCE(SUM(metal), 0) AS metal,
               COALESCE(SUM(crystal), 0) AS crystal,
               COALESCE(SUM(fuel_cells), 0) AS fuel_cells
        FROM asteroid_field_claims WHERE asteroid_id = ? AND player_id = ?;
        """,
        (aid, pid),
    ).fetchone()

    current = {
        "metal": max(0, int(source["metal"] or 0)),
        "crystal": max(0, int(source["crystal"] or 0)),
        "fuel_cells": max(0, int(source["fuel_cells"] or 0)),
    }
    claimed_all = {
        key: max(0, int(all_claims[key] or 0)) for key in zero
    }
    claimed_own = {
        key: max(0, int(own_claims[key] or 0)) for key in zero
    }
    original = {key: current[key] + claimed_all[key] for key in zero}
    quota = {
        key: max(1, int(math.floor(original[key] * MEGA_BELT_PLAYER_SHARE)))
        if original[key] > 0
        else 0
        for key in zero
    }
    remaining = {key: max(0, quota[key] - claimed_own[key]) for key in zero}
    original_total = sum(original.values())
    claimed_total = sum(claimed_own.values())
    remaining_total = sum(remaining.values())
    share_percent = (
        min(float(MEGA_BELT_PLAYER_SHARE) * 100.0, (claimed_total / original_total) * 100.0)
        if original_total > 0
        else 0.0
    )
    return {
        "original_pool": original,
        "player_claimed": claimed_own,
        "player_quota": quota,
        "player_remaining": remaining,
        "player_remaining_total": remaining_total,
        "share_percent": share_percent,
        "quota_exhausted": remaining_total <= 0,
    }


def enrich_mega_belt_player_state(
    asteroid: Mapping[str, Any],
    *,
    player_id: Optional[int],
    conn,
) -> Dict[str, Any]:
    out = dict(asteroid)
    if str(out.get("tier") or TIER_STANDARD) != TIER_MEGA or not player_id:
        return out
    state = mega_belt_player_share_state(
        int(out.get("id") or 0), int(player_id), conn=conn, row=out
    )
    remaining = dict(state.get("player_remaining") or {})
    out["viewer_mega_share_percent"] = float(state.get("share_percent") or 0.0)
    out["viewer_mega_quota_exhausted"] = bool(state.get("quota_exhausted"))
    out["viewer_mega_quota_remaining"] = int(state.get("player_remaining_total") or 0)
    out["viewer_harvest_locked"] = bool(
        out.get("viewer_harvest_locked") or state.get("quota_exhausted")
    )
    # For Mega Belts the CTA should size a fleet for the viewer's remaining
    # personal share, not for the entire public belt pool.
    out["recycler_slots_needed"] = estimate_reclaimer_slots_needed(
        int(remaining.get("metal") or 0),
        int(remaining.get("crystal") or 0),
        int(remaining.get("fuel_cells") or 0),
    )
    return out
'''
          text = text.replace(marker, helper + marker, 1)

          old = '''        enriched = enrich_asteroid_viewer_state(\n            row, engaged_ids=engaged_ids, fleet_map=fleet_map, now=ts\n        )\n        # Keep engaged hunts visible with en-route state (no silent vanish).\n'''
          new = '''        enriched = enrich_asteroid_viewer_state(\n            row, engaged_ids=engaged_ids, fleet_map=fleet_map, now=ts\n        )\n        if viewer_player_id is not None and int(viewer_player_id) > 0:\n            enriched = enrich_mega_belt_player_state(\n                enriched, player_id=int(viewer_player_id), conn=conn\n            )\n        # Keep active hunts visible with their exact flight phase.\n'''
          if old not in text:
              raise SystemExit('missing board enrich anchor')
          text = text.replace(old, new, 1)

          text = text.replace(
              '"SELECT COUNT(*) AS n FROM asteroid_field_claims WHERE asteroid_id = ?;",',
              '"SELECT COUNT(DISTINCT player_id) AS n FROM asteroid_field_claims WHERE asteroid_id = ?;",',
              1,
          )

          old = '''                "viewer_arrival_at": enriched.get("viewer_arrival_at"),\n                "viewer_en_route": bool(enriched.get("viewer_en_route")),\n                "viewer_harvest_locked": bool(enriched.get("viewer_harvest_locked")),\n'''
          new = '''                "viewer_arrival_at": enriched.get("viewer_arrival_at"),\n                "viewer_en_route": bool(enriched.get("viewer_en_route")),\n                "viewer_returning": bool(enriched.get("viewer_returning")),\n                "viewer_mega_share_percent": float(enriched.get("viewer_mega_share_percent") or 0.0),\n                "viewer_mega_quota_exhausted": bool(enriched.get("viewer_mega_quota_exhausted")),\n                "viewer_mega_quota_remaining": int(enriched.get("viewer_mega_quota_remaining") or 0),\n                "viewer_harvest_locked": bool(enriched.get("viewer_harvest_locked")),\n'''
          if old not in text:
              raise SystemExit('missing board output anchor')
          text = text.replace(old, new, 1)

          old = '''            0 if e.get("viewer_en_route") else 1 if e.get("viewer_engaged") else 2,\n'''
          new = '''            0 if e.get("viewer_en_route") else 1 if e.get("viewer_returning") else 2,\n'''
          if old not in text:
              raise SystemExit('missing board sort anchor')
          text = text.replace(old, new, 1)

          old = '''        payload = enrich_asteroid_viewer_state(\n            _row_to_asteroid(row),\n            engaged_ids=engaged_ids,\n            fleet_map=fleet_map,\n            now=ts,\n        )\n        out[int(payload["position"])] = payload\n'''
          new = '''        payload = enrich_asteroid_viewer_state(\n            _row_to_asteroid(row),\n            engaged_ids=engaged_ids,\n            fleet_map=fleet_map,\n            now=ts,\n        )\n        if viewer_player_id is not None and int(viewer_player_id) > 0:\n            payload = enrich_mega_belt_player_state(\n                payload, player_id=int(viewer_player_id), conn=conn\n            )\n        out[int(payload["position"])] = payload\n'''
          if old not in text:
              raise SystemExit('missing system enrich anchor')
          text = text.replace(old, new, 1)

          old = '''    harvested = _split_load(pool, int(cargo_capacity))\n\n    if tier == TIER_MEGA:\n        return _claim_mega_harvest(\n            conn,\n            row=row,\n            aid=aid,\n            pool=pool,\n            harvested=harvested,\n            player_id=int(player_id),\n            ts=ts,\n        )\n\n    cur = conn.execute(\n'''
          new = '''    if tier == TIER_MEGA:\n        share = mega_belt_player_share_state(\n            aid, int(player_id), conn=conn, row=row\n        )\n        if share.get("quota_exhausted"):\n            return {\n                "status": "quota_exhausted",\n                "harvested": {"metal": 0, "crystal": 0, "fuel_cells": 0},\n                "asteroid_id": aid,\n                "asteroid_key": str(row["asteroid_key"] or ""),\n                "player_share": share,\n            }\n        allowance = dict(share.get("player_remaining") or {})\n        eligible_pool = {\n            key: min(int(pool[key]), max(0, int(allowance.get(key) or 0)))\n            for key in ("metal", "crystal", "fuel_cells")\n        }\n        harvested = _split_load(eligible_pool, int(cargo_capacity))\n        if sum(int(v or 0) for v in harvested.values()) <= 0:\n            return {\n                "status": "quota_exhausted",\n                "harvested": {"metal": 0, "crystal": 0, "fuel_cells": 0},\n                "asteroid_id": aid,\n                "asteroid_key": str(row["asteroid_key"] or ""),\n                "player_share": share,\n            }\n        return _claim_mega_harvest(\n            conn,\n            row=row,\n            aid=aid,\n            pool=pool,\n            harvested=harvested,\n            player_id=int(player_id),\n            ts=ts,\n        )\n\n    harvested = _split_load(pool, int(cargo_capacity))\n    cur = conn.execute(\n'''
          if old not in text:
              raise SystemExit('missing claim tier anchor')
          text = text.replace(old, new, 1)

          old = '''    return {\n        "status": "claimed",\n        "harvested": harvested,\n        "asteroid_id": aid,\n        "asteroid_key": asteroid.get("asteroid_key"),\n        "pool": pool,\n        "remaining_pool": remaining,\n        "asteroid": asteroid,\n    }\n'''
          new = '''    player_share = mega_belt_player_share_state(\n        aid, int(player_id), conn=conn\n    )\n    return {\n        "status": "claimed",\n        "harvested": harvested,\n        "asteroid_id": aid,\n        "asteroid_key": asteroid.get("asteroid_key"),\n        "pool": pool,\n        "remaining_pool": remaining,\n        "player_share": player_share,\n        "asteroid": asteroid,\n    }\n'''
          if old not in text:
              raise SystemExit('missing mega return anchor')
          text = text.replace(old, new, 1)
          ast.write_text(text, encoding='utf-8')

          # Fleet reporting: distinguish a fair-share cap from a stale/race miss.
          fleet = Path('game/fleet.py')
          text = fleet.read_text(encoding='utf-8')
          old = '''    missed: bool = False,\n    expired: bool = False,\n    locale: str | None = None,\n'''
          new = '''    missed: bool = False,\n    expired: bool = False,\n    quota_exhausted: bool = False,\n    locale: str | None = None,\n'''
          if old not in text:
              raise SystemExit('missing asteroid report signature anchor')
          text = text.replace(old, new, 1)
          old = '''    if expired:\n        return tr(\n'''
          new = '''    if quota_exhausted:\n        return tr(\n            "fleet_asteroid_report_quota_exhausted",\n            "Your 10% share of the Mega Belt at %(coords)s is exhausted. Fleet returning empty to %(origin)s.",\n            locale=locale,\n            coords=coords,\n            origin=origin_name,\n        )\n    if expired:\n        return tr(\n'''
          if old not in text:
              raise SystemExit('missing asteroid report expired anchor')
          text = text.replace(old, new, 1)
          old = '''        asteroid_missed = False\n        asteroid_harvested = False\n        asteroid_expired = False\n'''
          new = '''        asteroid_missed = False\n        asteroid_harvested = False\n        asteroid_expired = False\n        asteroid_quota_exhausted = False\n'''
          if old not in text:
              raise SystemExit('missing asteroid flags anchor')
          text = text.replace(old, new, 1)
          old = '''                if status == "missed":\n                    asteroid_missed = True\n                else:\n                    asteroid_expired = True\n'''
          new = '''                if status == "missed":\n                    asteroid_missed = True\n                elif status == "quota_exhausted":\n                    asteroid_quota_exhausted = True\n                else:\n                    asteroid_expired = True\n'''
          if old not in text:
              raise SystemExit('missing asteroid miss/expired anchor')
          text = text.replace(old, new, 1)
          text = text.replace(
              'if not (asteroid_harvested or asteroid_missed or asteroid_expired):',
              'if not (asteroid_harvested or asteroid_missed or asteroid_expired or asteroid_quota_exhausted):',
              1,
          )
          text = text.replace(
              'if asteroid_harvested or asteroid_missed or asteroid_expired:',
              'if asteroid_harvested or asteroid_missed or asteroid_expired or asteroid_quota_exhausted:',
          )
          old = '''                missed=asteroid_missed,\n                expired=asteroid_expired,\n                locale=sender_locale,\n'''
          new = '''                missed=asteroid_missed,\n                expired=asteroid_expired,\n                quota_exhausted=asteroid_quota_exhausted,\n                locale=sender_locale,\n'''
          if old not in text:
              raise SystemExit('missing report call anchor')
          text = text.replace(old, new, 1)
          old = '''            "asteroid_expired": asteroid_expired,\n            **({"asteroid": asteroid_meta} if asteroid_meta else {}),\n'''
          new = '''            "asteroid_expired": asteroid_expired,\n            "asteroid_quota_exhausted": asteroid_quota_exhausted,\n            **({"asteroid": asteroid_meta} if asteroid_meta else {}),\n'''
          if old not in text:
              raise SystemExit('missing report metadata anchor')
          text = text.replace(old, new, 1)
          fleet.write_text(text, encoding='utf-8')

          # Board: exact outbound vs returning phase; 10% progress and cap lock.
          board = Path('templates/partials/galaxy_asteroid_board.html')
          text = board.read_text(encoding='utf-8')
          text = text.replace(
              '{% set harvest_locked = entry.viewer_harvest_locked if entry.viewer_harvest_locked is defined else false %}\n',
              '{% set harvest_locked = entry.viewer_harvest_locked if entry.viewer_harvest_locked is defined else false %}\n{% set returning = entry.viewer_returning if entry.viewer_returning is defined else false %}\n{% set mega_limit = entry.viewer_mega_quota_exhausted if entry.viewer_mega_quota_exhausted is defined else false %}\n',
              1,
