name: Hotfix Big Score Display

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'hotfix/big-score-display'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/big-score-display
      - name: Patch BigInt compact score suffixes
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("static/main.js")
          src = path.read_text(encoding="utf-8")

          threshold_pattern = re.compile(
              r'if\s*\(abs\s*>=\s*1_000_000_000_000_000n\)\s*\{\s*'
              r'return\s+formatHugeBigIntScientific\(value\);\s*\}'
          )
          src, threshold_count = threshold_pattern.subn(
              'if (abs >= 10n ** 33n) {\n    return formatHugeBigIntScientific(value);\n  }',
              src,
              count=1,
          )
          if threshold_count != 1:
              raise SystemExit(f"expected exactly one legacy scientific threshold, got {threshold_count}")

          suffix_pattern = re.compile(
              r'const\s+suffixes\s*=\s*\[\s*\[1_000_000_000_000n,\s*"T"\],'
          )
          suffix_head = '''const suffixes = [
    [10n ** 30n, "Q"],
    [10n ** 27n, "R"],
    [10n ** 24n, "Y"],
    [10n ** 21n, "Z"],
    [10n ** 18n, "E"],
    [10n ** 15n, "P"],
    [1_000_000_000_000n, "T"],'''
          src, suffix_count = suffix_pattern.subn(suffix_head, src, count=1)
          if suffix_count != 1:
              raise SystemExit(f"expected exactly one suffix table head, got {suffix_count}")

          path.write_text(src, encoding="utf-8")
          PY

      - name: Verify syntax and display contract
        shell: bash
        run: |
          node --check static/main.js
          python - <<'PY'
          from pathlib import Path
          src = Path("static/main.js").read_text(encoding="utf-8")
          assert 'if (abs >= 10n ** 33n)' in src
          assert '[10n ** 30n, "Q"]' in src
          assert '[10n ** 15n, "P"]' in src
          assert 'if (abs >= 1_000_000_000_000_000n)' not in src
          PY

      - name: Commit hotfix
        shell: bash
        run: |
          if git diff --quiet -- static/main.js; then
            echo "No patch needed; already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/main.js
          git commit -m "fix(ui): keep huge scores human-readable"
          git push origin HEAD:hotfix/big-score-display
