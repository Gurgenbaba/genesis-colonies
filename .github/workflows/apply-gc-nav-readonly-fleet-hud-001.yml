name: Apply GC Nav Readonly Fleet HUD 001

on:
  push:
    branches: [fix/nav-readonly-fleet-hud-001]
    paths:
      - "scripts/apply_gc_nav_readonly_fleet_hud_001.py"
      - ".github/workflows/apply-gc-nav-readonly-fleet-hud-001.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nav-readonly-fleet-hud-001
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply guarded patch
        run: |
          python scripts/apply_gc_nav_readonly_fleet_hud_001.py
          python -m py_compile game/live_state.py
          git diff --check
      - name: Commit runtime patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/live_state.py
          git commit -m "perf(nav): keep Fleet HUD payload read-only"
          git push origin HEAD:fix/nav-readonly-fleet-hud-001
