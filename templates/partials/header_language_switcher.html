{% set _locale_api = url_for('api_options_locale') if AUTH_USER and AUTH_USER.id else url_for('api_locale') %}
<div class="gc-language-switcher"
     id="gc-language-switcher"
     data-locale="{{ GC_LOCALE }}"
     data-api="{{ _locale_api }}">
  <select id="gc-language-select"
          data-gc-hud-select
          data-gc-language-select
          aria-label="{{ T('language_switcher_label', 'Sprache') }}">
    {% for code, meta in SUPPORTED_LANGUAGES.items() %}
    <option value="{{ code }}"
            data-lang-flag="{{ meta.flag }}"
            data-lang-label="{{ T('language_name_' ~ code, meta.label) }}"
            {% if GC_LOCALE == code %}selected{% endif %}>{{ meta.flag }}</option>
    {% endfor %}
  </select>
</div>
