name: Extract focused fleet send UX snippets
on:
  push:
    branches: [feature/fleet-action-reasons]
permissions:
  contents: read
jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact fleet reason mapper
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('static/main.js').read_text(encoding='utf-8')
          start=s.index('    const reasonText = (reason, preview) => {')
          end=s.index('\n    };', start) + len('\n    };')
          print(s[start:end])
          print('\n===== RUN PREVIEW BLOCK =====')
          p=s.index('    const runPreview = async (page) => {')
          q=s.index('\n    const schedulePreview = (page) => {', p)
          print(s[p:q])
          PY