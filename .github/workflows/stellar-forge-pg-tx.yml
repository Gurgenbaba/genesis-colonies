name: Stellar Forge PG Transaction Safety

on:
  pull_request:
    paths:
      - "game/stellar_forge/**"
      - "tests/test_gc_pg_stellar_forge_tx_safety.py"
      - ".github/workflows/stellar-forge-pg-tx.yml"
  push:
    branches: [main]
    paths:
      - "game/stellar_forge/**"
      - "tests/test_gc_pg_stellar_forge_tx_safety.py"
      - ".github/workflows/stellar-forge-pg-tx.yml"

jobs:
  stellar-forge-pg-tx:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-stellar-forge-pg-tx-not-production
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Compile transaction-safe hooks
        run: |
          python -m py_compile game/stellar_forge/safe_hooks.py game/stellar_forge/__init__.py
          git diff --check
      - name: Stellar Forge transaction regression
        run: python -m pytest -q --tb=line tests/test_gc_pg_stellar_forge_tx_safety.py tests/test_stellar_forge.py
