name: GC Performance Pass 03 Implement

on:
  push:
    branches:
      - perf/game-state-readonly-pass-03

permissions:
  contents: write

env:
  APP_ENV: development
  FLASK_ENV: development
  FLASK_DEBUG: '0'
  SECRET_KEY: ci-perf-pass-03-not-for-production
  GC_SKIP_MIGRATION_CHECK: '1'
  GC_EMBEDDED_CRON: '0'
  GC_DB_BACKEND: sqlite
  GC_REQUEST_PERF_DEBUG: '1'
  GC_REQUEST_PERF_SLOW_MS: '0'
  GC_REQUEST_PERF_SAMPLE: '1.0'
  GC_PERF_INTEL: '1'

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/game-state-readonly-pass-03
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Apply minimal read-only poll cuts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Battle Pass serialization: synthesize missing current-period Ops for display
          # instead of INSERT/UPDATE self-heal writes. Real progress/claim mutations keep
          # ensure_ops_for_period() unchanged.
          bp_path = Path('game/battle_pass.py')
          bp = bp_path.read_text(encoding='utf-8')
          start = bp.find('def serialize_ops(\n')
          end = bp.find('\n\ndef credit_xp(\n', start)
          if start < 0 or end < 0 or bp.find('def serialize_ops(\n', start + 1) >= 0:
              raise SystemExit('battle_pass serialize_ops anchors invalid')
          old_block = bp[start:end]
          if 'ensure_ops_for_period(pid, sid, conn=conn, now=ts)' not in old_block:
              raise SystemExit('battle_pass ensure anchor missing')
          new_block = '''def _op_row_for_serialize(
              player_id: int,
              season_id: int,
              period_key: str,
              op_key: str,
              *,
              conn,
          ) -> Dict[str, Any]:
              """Read-only current-period row; missing Ops are virtual until a real mutation."""
              meta = OPS_CATALOG[str(op_key)]
              row = _get_op_row(
                  int(player_id),
                  int(season_id),
                  str(period_key),
                  str(op_key),
                  conn=conn,
              )
              if row is None:
                  return {
                      "player_id": int(player_id),
                      "season_id": int(season_id),
                      "period_key": str(period_key),
                      "op_key": str(op_key),
                      "progress": 0,
                      "target": int(meta["target"]),
                      "xp_reward": int(meta["xp_reward"]),
                      "claimed_at": None,
                      "updated_at": 0.0,
                  }
              # Unclaimed rows reflect live catalog retunes in the client without
              # rewriting the same target/xp values on every poll.
              if row.get("claimed_at") is None:
                  row = dict(row)
                  row["target"] = int(meta["target"])
                  row["xp_reward"] = int(meta["xp_reward"])
              return row


          def serialize_ops(
              player_id: int,
              season_id: int,
              *,
              conn,
              now: Optional[float] = None,
          ) -> Dict[str, Any]:
              if not ops_schema_ready(conn):
                  return {"daily": [], "weekly": [], "drip_cap": PASSIVE_DRIP_DAILY_CAP, "drip_today": 0}
              ts = float(now if now is not None else time.time())
              pid = int(player_id)
              sid = int(season_id)
              daily_key = daily_period_key(ts)
              weekly_key = weekly_period_key(ts)
              drip_today = _drip_granted_today(pid, sid, daily_key, conn=conn)

              daily: List[Dict[str, Any]] = []
              for op_key in DAILY_OP_KEYS:
                  meta = OPS_CATALOG[op_key]
                  row = _op_row_for_serialize(pid, sid, daily_key, op_key, conn=conn)
                  daily.append(_serialize_op_row(row, meta))

              weekly: List[Dict[str, Any]] = []
              for op_key in WEEKLY_OP_KEYS:
                  meta = OPS_CATALOG[op_key]
                  row = _op_row_for_serialize(pid, sid, weekly_key, op_key, conn=conn)
                  weekly.append(_serialize_op_row(row, meta))

              return {
                  "daily": daily,
                  "weekly": weekly,
                  "drip_cap": PASSIVE_DRIP_DAILY_CAP,
                  "drip_today": drip_today,
                  "daily_period_key": daily_key,
                  "weekly_period_key": weekly_key,
              }
          '''
          # Dedent the embedded source exactly once.
          import textwrap
          new_block = textwrap.dedent(new_block)
          bp_path.write_text(bp[:start] + new_block.rstrip() + bp[end:], encoding='utf-8')

          # 2) Timekeeper reads: a missing balance row semantically means 0. Explicit
          # credits still call _ensure_balance_row() before mutation.
          tk_path = Path('game/timekeeper.py')
          tk = tk_path.read_text(encoding='utf-8')
          old_tk = '''def get_balance(player_id: int, *, conn) -> int:\n    if not schema_ready(conn):\n        return 0\n    _ensure_balance_row(int(player_id), conn=conn)\n    cur = conn.cursor()\n'''
          new_tk = '''def get_balance(player_id: int, *, conn) -> int:\n    if not schema_ready(conn):\n        return 0\n    cur = conn.cursor()\n'''
          if tk.count(old_tk) != 1:
              raise SystemExit(f'timekeeper get_balance anchor count={tk.count(old_tk)}')
          tk_path.write_text(tk.replace(old_tk, new_tk, 1), encoding='utf-8')

          # 3) Game-state serializes Battle Pass once and reuses it for nav badge + payload.
          ls_path = Path('game/live_state.py')
          ls = ls_path.read_text(encoding='utf-8')
          old_sig = 'def nav_badges_for_game_state(user_id: int, *, conn) -> Dict[str, Any]:\n'
          new_sig = '''def nav_badges_for_game_state(\n    user_id: int,\n    *,\n    conn,\n    battle_pass: Optional[Dict[str, Any]] = None,\n) -> Dict[str, Any]:\n'''
          if ls.count(old_sig) != 1:
              raise SystemExit(f'nav badge signature anchor count={ls.count(old_sig)}')
          ls = ls.replace(old_sig, new_sig, 1)
          old_bp_nav = '''    try:\n        from game.battle_pass import serialize_for_client as bp_serialize\n\n        bp = bp_serialize(uid, conn=conn)\n        bp_claimable = int(bp.get("claimable_count") or 0) if bp.get("ready") else 0\n    except Exception:\n        bp_claimable = 0\n'''
          new_bp_nav = '''    if isinstance(battle_pass, dict):\n        bp_claimable = (\n            int(battle_pass.get("claimable_count") or 0)\n            if battle_pass.get("ready")\n            else 0\n        )\n    else:\n        try:\n            from game.battle_pass import serialize_for_client as bp_serialize\n\n            bp = bp_serialize(uid, conn=conn)\n            bp_claimable = int(bp.get("claimable_count") or 0) if bp.get("ready") else 0\n        except Exception:\n            bp_claimable = 0\n'''
          if ls.count(old_bp_nav) != 1:
              raise SystemExit(f'nav badge battle pass anchor count={ls.count(old_bp_nav)}')
          ls_path.write_text(ls.replace(old_bp_nav, new_bp_nav, 1), encoding='utf-8')

          app_path = Path('app.py')
          app = app_path.read_text(encoding='utf-8')
          nav_anchor = '''    with perf_span("payload.nav_badges"):\n        try:\n            from game.live_state import nav_badges_for_game_state\n\n            payload["nav_badges"] = nav_badges_for_game_state(user_id, conn=conn)\n'''
          nav_repl = '''    try:\n        from game.battle_pass import serialize_for_client as bp_serialize\n\n        # Build once per game-state request. The same state feeds the premium payload\n        # and the nav claimable badge.\n        battle_pass_state = bp_serialize(\n            int(user_id), conn=conn, include_tracks=not lightweight\n        )\n    except Exception:\n        battle_pass_state = {"ready": False}\n\n    with perf_span("payload.nav_badges"):\n        try:\n            from game.live_state import nav_badges_for_game_state\n\n            payload["nav_badges"] = nav_badges_for_game_state(\n                user_id, conn=conn, battle_pass=battle_pass_state\n            )\n'''
          if app.count(nav_anchor) != 1:
              raise SystemExit(f'app nav anchor count={app.count(nav_anchor)}')
          app = app.replace(nav_anchor, nav_repl, 1)
          old_payload_bp = '''    try:\n        from game.battle_pass import serialize_for_client as bp_serialize\n\n        # Full tracks only when not diet — premium page / include_panel keep cards.\n        # Diet needs claimable_count + ops for nav badge / toast (GC-PERF live-safe).\n        payload["battle_pass"] = bp_serialize(\n            int(user_id), conn=conn, include_tracks=not lightweight\n        )\n    except Exception:\n        payload["battle_pass"] = {"ready": False}\n'''
          new_payload_bp = '''    payload["battle_pass"] = battle_pass_state\n'''
          if app.count(old_payload_bp) != 1:
              raise SystemExit(f'app battle pass payload anchor count={app.count(old_payload_bp)}')
          app_path.write_text(app.replace(old_payload_bp, new_payload_bp, 1), encoding='utf-8')
          PY

          cat > tests/test_gc_perf_pass_03.py <<'PYTEST'
          """GC-PERF-PASS-03 — keep diet polling read-heavy, not write-heavy."""

          from __future__ import annotations

          pytest_plugins = ["tests.test_game_state_live"]


          def test_battle_pass_serialize_synthesizes_ops_without_writes(game_client):
              from game.battle_pass import (
                  DAILY_OP_KEYS,
                  WEEKLY_OP_KEYS,
                  get_active_season,
                  serialize_for_client,
              )
              from game.db import db

              _client, uid = game_client
              conn = db()
              try:
                  # Ensure player/season state exists, then deliberately remove current Ops.
                  state = serialize_for_client(int(uid), conn=conn)
                  assert state.get("ready") is True
                  conn.commit()
                  season = get_active_season(conn)
                  assert season is not None
                  conn.execute(
                      "DELETE FROM battle_pass_ops_progress WHERE player_id = ? AND season_id = ?;",
                      (int(uid), int(season["id"])),
                  )
                  conn.commit()

                  writes = []

                  def trace(statement):
                      sql = str(statement or "").lstrip().upper()
                      if sql.startswith(("INSERT", "UPDATE", "DELETE", "REPLACE")):
                          writes.append(sql)

                  conn.set_trace_callback(trace)
                  fresh = serialize_for_client(int(uid), conn=conn)
                  conn.set_trace_callback(None)

                  assert writes == []
                  ops = fresh.get("ops") or {}
                  assert len(ops.get("daily") or []) == len(DAILY_OP_KEYS)
                  assert len(ops.get("weekly") or []) == len(WEEKLY_OP_KEYS)
                  assert all(int(row.get("progress") or 0) == 0 for row in ops.get("daily") or [])
              finally:
                  conn.close()


          def test_game_state_serializes_battle_pass_once(game_client, monkeypatch):
              import game.battle_pass as battle_pass

              client, _uid = game_client
              real = battle_pass.serialize_for_client
              calls = []

              def wrapped(player_id, *, conn, now=None, include_tracks=False):
                  calls.append((int(player_id), bool(include_tracks)))
                  return real(
                      player_id,
                      conn=conn,
                      now=now,
                      include_tracks=include_tracks,
                  )

              monkeypatch.setattr(battle_pass, "serialize_for_client", wrapped)
              resp = client.get("/api/game-state")
              assert resp.status_code == 200
              assert len(calls) == 1


          def test_timekeeper_read_missing_row_is_zero_without_insert(game_client):
              from game.db import db
              from game.timekeeper import credit, get_balance

              _client, uid = game_client
              conn = db()
              try:
                  conn.execute("DELETE FROM timekeeper_balances WHERE player_id = ?;", (int(uid),))
                  conn.commit()
                  writes = []

                  def trace(statement):
                      sql = str(statement or "").lstrip().upper()
                      if sql.startswith(("INSERT", "UPDATE", "DELETE", "REPLACE")):
                          writes.append(sql)

                  conn.set_trace_callback(trace)
                  assert get_balance(int(uid), conn=conn) == 0
                  conn.set_trace_callback(None)
                  assert writes == []
                  row = conn.execute(
                      "SELECT 1 FROM timekeeper_balances WHERE player_id = ?;", (int(uid),)
                  ).fetchone()
                  assert row is None

                  # Real mutation remains authoritative and creates the row.
                  assert credit(int(uid), 60, "perf-pass-03-test", conn=conn) == 60
                  assert get_balance(int(uid), conn=conn) == 60
              finally:
                  conn.rollback()
                  conn.close()
          PYTEST

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest

      - name: Focused regression
        run: |
          python -m py_compile app.py game/live_state.py game/battle_pass.py game/timekeeper.py
          python -m pytest -q \
            tests/test_gc_perf_pass_03.py \
            tests/test_liveops_retention.py \
            tests/test_nav_badges.py \
            tests/test_gc_perf_core_001.py
          git diff --check

      - name: Measure five warm diet samples
        shell: bash
        run: |
          cat > tests/_tmp_perf_pass_03_measure.py <<'PY'
          from __future__ import annotations

          import logging
          import re
          import statistics

          pytest_plugins = ["tests.test_game_state_live"]

          KEYS = ("total_ms", "sql_count", "sql_write_count", "db_connection_open_count", "live_context_ms", "live_hud_reads_ms", "payload_ms")

          def parse(message):
              out = {}
              for key in KEYS:
                  m = re.search(rf"(?:^| ){key}=([^ ]+)", message)
                  if m:
                      try:
                          out[key] = float(m.group(1))
                      except ValueError:
                          pass
              return out

          def test_measure(game_client, caplog):
              client, _uid = game_client
              for _ in range(2):
                  assert client.get("/api/game-state").status_code == 200
              samples = []
              for idx in range(5):
                  caplog.clear()
                  with caplog.at_level(logging.INFO):
                      resp = client.get("/api/game-state")
                  assert resp.status_code == 200
                  logs = [r.message for r in caplog.records if "[GC REQUEST PERF]" in r.message]
                  assert logs
                  samples.append(parse(logs[-1]))
                  print(f"\nPASS03 SAMPLE #{idx + 1} {logs[-1]}")
              med = {}
              for key in KEYS:
                  vals = [s[key] for s in samples if key in s]
                  if vals:
                      med[key] = statistics.median(vals)
              print("\nPASS03 MEDIAN " + " ".join(f"{k}={v:g}" for k, v in med.items()))
              assert med.get("sql_write_count", 999) <= 2
              assert med.get("sql_count", 9999) < 845
          PY
          python -m pytest -q -s tests/_tmp_perf_pass_03_measure.py
          rm -f tests/_tmp_perf_pass_03_measure.py

      - name: Trace remaining warm diet writes
        shell: bash
        run: |
          cat > tests/_tmp_perf_pass_03_trace_after.py <<'PY'
          from __future__ import annotations

          import collections
          import re
          import traceback
          from unittest.mock import patch

          pytest_plugins = ["tests.test_game_state_live"]
          WRITE_RE = re.compile(r"^\s*(INSERT|UPDATE|DELETE|REPLACE)\b", re.I)

          def caller():
              stack = traceback.extract_stack(limit=40)[:-2]
              out = []
              for f in stack:
                  name = f.filename.replace("\\", "/")
                  if "/genesis-colonies/" not in name:
                      continue
                  rel = name.split("/genesis-colonies/", 1)[1]
                  if rel.startswith("tests/"):
                      continue
                  out.append(f"{rel}:{f.lineno}:{f.name}")
              return " <- ".join(out[-7:]) or "unknown"

          def test_trace(game_client):
              import game.live_state as live_state

              client, _uid = game_client
              assert client.get("/api/game-state").status_code == 200
              grouped = collections.Counter()
              total = []

              def cb(statement):
                  m = WRITE_RE.match(str(statement or ""))
                  if not m:
                      return
                  sql = " ".join(str(statement).strip().split())[:280]
                  grouped[(m.group(1).upper(), sql, caller())] += 1
                  total.append(sql)

              def attach(conn):
                  try:
                      conn.set_trace_callback(cb)
                  except Exception:
                      pass

              with patch.object(live_state, "attach_request_perf_sql_trace", side_effect=attach):
                  assert client.get("/api/game-state").status_code == 200
              print("\nPASS03 REMAINING_WRITE_STATEMENTS", len(total))
              for (kind, sql, call), n in grouped.most_common(30):
                  print(f"WRITE x{n} [{kind}] {sql}\n  CALLER {call}")
              assert len(total) <= 2
          PY
          python -m pytest -q -s tests/_tmp_perf_pass_03_trace_after.py
          rm -f tests/_tmp_perf_pass_03_trace_after.py

      - name: Commit implementation and remove helper
        shell: bash
        run: |
          rm -f .github/workflows/gc-perf-pass-03-write-trace.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py game/live_state.py game/battle_pass.py game/timekeeper.py tests/test_gc_perf_pass_03.py .github/workflows/gc-perf-pass-03-write-trace.yml
          git commit -m "perf(game-state): remove battle-pass and timekeeper poll writes"
          git push origin HEAD:perf/game-state-readonly-pass-03
