name: Promote UNI1 manually

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Optional current main SHA to promote (defaults to current main)
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: promote-uni1-manual
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward UNI1 release branch
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main u2/staging-runtime --prune

          main_sha="$(git rev-parse origin/main)"
          target_sha="${INPUT_SHA:-$main_sha}"

          if [[ "${GITHUB_REF}" != "refs/heads/main" || "${GITHUB_SHA}" != "$main_sha" ]]; then
            echo "::error::Refusing stale/non-main promotion dispatch: workflow=${GITHUB_SHA} current-main=$main_sha ref=${GITHUB_REF}"
            exit 1
          fi

          if [[ "$target_sha" != "$main_sha" ]]; then
            echo "::error::Refusing promotion: target $target_sha is not current main $main_sha"
            exit 1
          fi

          u2_sha="$(git rev-parse origin/u2/staging-runtime)"
          if [[ "$u2_sha" == "$target_sha" ]]; then
            echo "UNI1 already matches main: $target_sha"
            exit 0
          fi

          merge_base="$(git merge-base "$u2_sha" "$target_sha")"
          if [[ "$merge_base" != "$u2_sha" ]]; then
            echo "::error::Refusing non-fast-forward promotion: uni1=$u2_sha target=$target_sha"
            exit 1
          fi

          git push origin "$target_sha:refs/heads/u2/staging-runtime"
          echo "Manually promoted UNI1 to $target_sha"

      - name: Signal SystemOS deployment start
        shell: bash
        env:
          SYSTEMOS_URL: https://mail-hub-production-f6d2.up.railway.app
          SYSTEMOS_AUDIENCE: gurgenbaba-systemos
        run: |
          set -euo pipefail
          oidc_json="$(
            curl --fail --silent --show-error               -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"               "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${SYSTEMOS_AUDIENCE}"
          )"
          oidc_token="$(
            printf '%s' "${oidc_json}" |
              python -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          )"
          curl --fail-with-body --silent --show-error             -X POST             -H "Authorization: Bearer ${oidc_token}"             -H "Accept: application/json"             "${SYSTEMOS_URL}/api/v1/providers/github/deployment-started"
