name: Extract alliance action reason snippets
on:
  push:
    branches: [hotfix/alliance-action-reasons]
permissions:
  contents: write
jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact snippets
        run: |
          python - <<'PY'
          from pathlib import Path
          out=[]
          specs=[
            ('static/main.js',['function allianceErrorMessage','const allianceErrorMessage','allianceErrorMessage =']),
            ('templates/alliance.html',['data-alliance-panel="diplomacy"','alliance_diplomacy_title','alliance_relation_war']),
          ]
          for path, needles in specs:
            s=Path(path).read_text(encoding='utf-8')
            out.append(f'===== {path} =====')
            seen=[]
            for needle in needles:
              start=0
              while True:
                i=s.find(needle,start)
                if i<0: break
                if all(abs(i-j)>5000 for j in seen):
                  seen.append(i)
                  lo=max(0,i-5000); hi=min(len(s),i+9000)
                  out.append(f'\n--- {needle} @ {i} ---\n{s[lo:hi]}')
                start=i+len(needle)
            if not seen:
              out.append('\nNO MATCHES')
          Path('.tmp').mkdir(exist_ok=True)
          Path('.tmp/alliance-action-reasons.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp/alliance-action-reasons.txt
          git commit -m 'chore: capture alliance action reason snippets'
          git push