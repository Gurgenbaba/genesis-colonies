name: GC Request Single PG Checkout

on:
  push:
    branches: [fix/prod-request-single-pg-checkout-p0]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prod-request-single-pg-checkout-p0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply request scoped PG checkout
        run: python scripts/apply_gc_request_single_pg_checkout.py
      - name: Install dependencies
        run: pip install -r requirements-prod.txt pytest
      - name: Regression tests
        run: |
          python -m py_compile game/db.py tests/test_gc_request_single_pg_checkout.py
          python -m pytest -q tests/test_gc_request_single_pg_checkout.py tests/test_gc_pg_request_pool_guard.py tests/test_gc_pg_busy_nav_001.py tests/test_gc_pg_pool_timeout_auth.py tests/test_gc_pg_lock_softfail_hotpath.py
          git diff --check
      - name: Commit generated fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/db.py tests/test_gc_request_single_pg_checkout.py
          git commit -m 'fix(db): reuse one PostgreSQL checkout per request'
          git push origin HEAD:fix/prod-request-single-pg-checkout-p0
