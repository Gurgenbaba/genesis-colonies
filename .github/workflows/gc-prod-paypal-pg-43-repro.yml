name: GC Production PayPal PG 43 Repro

on:
  push:
    branches:
      - fix/prod-paypal-fulfillment-p0-43

permissions:
  contents: write

jobs:
  postgres-payment-repro:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: genesis
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d genesis"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-paypal-pg-43-secret-not-production
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: postgres
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/genesis
      SHOP_ENABLED: "1"
      SHOP_TEST_PROVIDER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Apply P0 fix
        run: python scripts/apply_gc_prod_paypal_pg_43.py
      - name: Bootstrap production-shaped PostgreSQL schema
        run: python migrate.py
      - name: Verify paid Timekeeper fulfillment on PostgreSQL 16
        run: >-
          python -m pytest -vv -s
          tests/test_gc_prod_paypal_pg_fulfillment_43.py
      - name: Verify existing shop regressions
        run: >-
          python -m pytest -q
          tests/test_shop_payments.py
          tests/test_shop_promos.py
      - name: Compile changed Python
        run: python -m py_compile game/shop.py game/shop_promos.py tests/test_gc_prod_paypal_pg_fulfillment_43.py
      - name: Materialize source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gc-prod-paypal-pg-43-repro.yml scripts/apply_gc_prod_paypal_pg_43.py
          git add game/shop.py game/shop_promos.py templates/shop_return.html locales tests/test_gc_prod_paypal_pg_fulfillment_43.py
          git diff --cached --check
          git commit -m "fix(shop): keep paid fulfillment valid on postgres"
          git push origin HEAD:fix/prod-paypal-fulfillment-p0-43
