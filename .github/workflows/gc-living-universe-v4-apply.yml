name: GC Living Universe V4 Apply

on:
  push:
    branches:
      - feature/living-universe-diversity-v4

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/living-universe-diversity-v4
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply GC-2622 strategic diversity
        run: |
          python scripts/_apply_gc_living_universe_v4.py
          python - <<'PY'
          from pathlib import Path
          path = Path('game/inactive_autoplay.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('\\"strategic_phase\\"', '"strategic_phase"')
          text = text.replace('\\"ambition_scale\\"', '"ambition_scale"')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Public wording guard
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('game/inactive_autoplay.py').read_text(encoding='utf-8')
          start = text.index('def _send_autoplay_report')
          public = text[start:]
          forbidden = [
              'Automatisierter Betriebsbericht',
              'automatisch weitergeführt',
              'Inactive Autoplay',
              'Bot-Aktivität',
          ]
          hits = [token for token in forbidden if token in public]
          if hits:
              raise SystemExit(f'implementation wording leaked into player-facing section: {hits}')
          PY
      - name: Syntax check
        run: python -m py_compile game/auto_empire.py game/inactive_autoplay.py tests/test_living_universe_gc2622.py
      - name: Install test dependencies
        run: pip install -r requirements.txt pytest
      - name: Focused living universe tests
        run: pytest -q tests/test_living_universe_gc2622.py tests/test_inactive_autoplay_gc2621.py tests/test_inactive_autoplay.py
      - name: Commit tested implementation
        run: |
          rm -f \
            .github/workflows/gc-living-universe-v4-apply.yml \
            .github/workflows/gc-living-universe-v4-apply2.yml \
            scripts/_apply_gc_living_universe_v4.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: diversify living universe progression'
          git push origin HEAD:feature/living-universe-diversity-v4
