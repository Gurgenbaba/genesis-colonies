name: GC PERF 174C Sentinel Lifecycle Noise Apply

on:
  push:
    branches:
      - perf/pg-174-sentinel-pjax-matrix

concurrency:
  group: gc-perf-174c-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: '0'
      SECRET_KEY: ci-perf-174c-secret-key-not-for-production-use
      GC_SKIP_MIGRATION_CHECK: '1'
      GC_EMBEDDED_CRON: '0'
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/pg-174-sentinel-pjax-matrix
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Apply lifecycle-noise patch
        run: python scripts/apply_gc_perf_174c_sentinel_lifecycle_noise.py
      - name: Run regressions
        run: |
          python -m pytest -q tests/test_gc_perf_174_sentinel_nav_matrix.py tests/test_gc_perf_002_nav_latency.py
          python -m py_compile scripts/browser_sentinel.py
          git diff --check
      - name: Commit validated patch
        run: |
          rm scripts/apply_gc_perf_174c_sentinel_lifecycle_noise.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/browser_sentinel.py tests/test_gc_perf_174_sentinel_nav_matrix.py scripts/apply_gc_perf_174c_sentinel_lifecycle_noise.py
          git commit -m 'test(nav): classify Sentinel lifecycle abort noise'
          git push origin HEAD:perf/pg-174-sentinel-pjax-matrix
