# Railway deploy config — https://docs.railway.com/reference/config-as-code
# GC-DEPLOY-20260827: redeploy after Galaxy action-feedback hardening and CI stabilization.
[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"
# Deploy only when app-relevant paths change (gitignore-style; negation after **).
# Docs/tests/.cursor-only commits skip a new deployment.
watchPatterns = [
  "**",
  "!docs/**",
  "!.cursor/**",
  "!.github/**",
  "!tests/**",
  "!tools/**",
  "!**/*.md",
  "!*.md",
  "/CHANGELOG.md",
]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
# Migrations run automatically in scripts/docker-entrypoint.sh (main container + /data volume).
# Do NOT use preDeployCommand — that container cannot mount Railway volumes.
# Do NOT set cronSchedule on this web service — Railway cron expects the process to exit.
# Production maintenance (ranking/fleet/vote/backup) = embedded cron in game/internal_cron.py
#   GC_EMBEDDED_CRON=1 (default when APP_ENV=production), interval GC_EMBEDDED_CRON_SEC=60
# Optional manual/force HTTP: POST /api/internal/cron/ranking
#   Authorization: Bearer $GC_INTERNAL_CRON_TOKEN
# Do NOT run scripts/run_ranking_worker.py as a separate Railway service on SQLite.
#
# One-time: enable Wait for CI in Railway UI (needs .github/workflows/ci.yml).
# Operator checklist: docs/RAILWAY_OPERATOR.md
