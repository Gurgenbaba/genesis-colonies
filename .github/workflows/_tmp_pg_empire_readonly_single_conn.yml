name: TEMP Apply PG Empire Readonly Single Conn

on:
  push:
    branches:
      - perf/pg-empire-readonly-single-conn

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/pg-empire-readonly-single-conn
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scoped test dependencies
        run: python -m pip install -r requirements-prod.txt pytest
      - name: Apply exact Empire patch
        run: python scripts/_apply_pg_empire_readonly_single_conn.py
      - name: Verify source boundary
        run: |
          python -m py_compile app.py game/empire_page.py tests/test_gc_pg_empire_readonly_single_conn.py
          python -m pytest -q tests/test_gc_pg_empire_readonly_single_conn.py
      - name: Commit generated product diff
        run: |
          if git diff --quiet -- app.py game/empire_page.py; then
            echo "Empire patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py game/empire_page.py
          git commit -m "perf(pg): make Empire SSR readonly and single-connection"
          git push origin HEAD:perf/pg-empire-readonly-single-conn
