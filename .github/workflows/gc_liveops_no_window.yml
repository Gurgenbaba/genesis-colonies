name: GC LiveOps No Window

on:
  push:
    branches: [fix/prod-liveops-no-window-noise]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prod-liveops-no-window-noise
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply LiveOps fix
        run: python scripts/apply_gc_liveops_no_window_fix.py
      - name: Install dependencies
        run: pip install -r requirements-prod.txt pytest
      - name: Regression tests
        run: |
          python -m py_compile game/server_events.py game/fleet_worker.py tests/test_gc_liveops_schedule_idle_contract.py
          python -m pytest -q tests/test_gc_liveops_schedule_idle_contract.py tests/test_server_events.py
          git diff --check
      - name: Commit generated fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/server_events.py game/fleet_worker.py tests/test_gc_liveops_schedule_idle_contract.py
          git commit -m 'fix(liveops): treat no-window schedules as skipped'
          git push origin HEAD:fix/prod-liveops-no-window-noise
