name: TEMP Apply PG Defense Single Request Conn

on:
  push:
    branches:
      - perf/pg-defense-single-request-conn

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/pg-defense-single-request-conn
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scoped test dependencies
        run: python -m pip install -r requirements-prod.txt pytest
      - name: Apply exact Defense patch
        run: python scripts/_apply_pg_defense_single_request_conn.py
      - name: Verify source boundary
        run: |
          python -m py_compile app.py tests/test_gc_pg_defense_single_request_conn.py
          python -m pytest -q tests/test_gc_pg_defense_single_request_conn.py
      - name: Commit generated product diff
        run: |
          if git diff --quiet -- app.py; then
            echo "Defense patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "perf(pg): reuse one request connection for Defense SSR"
          git push origin HEAD:perf/pg-defense-single-request-conn
