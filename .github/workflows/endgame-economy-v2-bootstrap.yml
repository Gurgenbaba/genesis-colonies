name: Endgame Economy V2 Bootstrap

on:
  push:
    branches:
      - feature/endgame-economy-v2-rebase

permissions:
  contents: write

concurrency:
  group: endgame-economy-v2-bootstrap
  cancel-in-progress: false

jobs:
  patch-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[v2-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-endgame-v2-secret-key-not-for-production-use
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
      GC_ENDGAME_ECONOMY_MODE: legacy
      GC_ENDGAME_PRODUCTION_PIVOT: "120"
      GC_ENDGAME_PRODUCTION_TAIL_POWER: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Apply one-shot V2 patch
        run: python scripts/apply_endgame_v2_rebase_patch.py
      - name: Static checks
        run: |
          python -m py_compile \
            game/production_formula.py \
            game/economy_balance.py \
            game/progression_valuation.py \
            game/endgame_economy_shadow.py \
            game/ranking_core.py \
            game/effects/effect_resolver.py \
            scripts/endgame_economy_shadow_report.py \
            scripts/endgame_economy_rebuild_scores.py
          git diff --check
      - name: Guardrail regression
        run: python -m pytest -q --tb=line tests/test_endgame_economy_guardrail.py
      - name: Coordinated V2 regression
        run: python -m pytest -q --tb=line tests/test_endgame_economy_v2_rebase.py
      - name: Production regression
        run: python -m pytest -q --tb=line tests/test_production_formula.py
      - name: Ranking regression
        run: python -m pytest -q --tb=line tests/test_gc_score_b_ranking.py
      - name: PvP protection regression
        run: python -m pytest -q --tb=line tests/test_noob_protection.py
      - name: Commit generated source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION game/production_formula.py game/economy_balance.py game/ranking_core.py game/effects/effect_resolver.py
          git diff --cached --quiet && exit 0
          git commit -m "feat: wire coordinated endgame economy v2 [v2-generated]"
          git push origin HEAD:feature/endgame-economy-v2-rebase
