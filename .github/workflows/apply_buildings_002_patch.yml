name: Apply buildings 002 patch

on:
  push:
    branches: [perf/buildings-002-resolver-snapshot]
    paths:
      - scripts/gc_perf_buildings_002_patch.py
      - .github/workflows/apply_buildings_002_patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/buildings-002-resolver-snapshot
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply exact BUILDINGS-002 transformations
        run: python scripts/gc_perf_buildings_002_patch.py

      - name: Commit source patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/effects/effect_resolver.py game/buildings.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "perf(buildings): share external resolver probes"
          git push origin HEAD:perf/buildings-002-resolver-snapshot
