          text = text.replace(old, new, 1)
          old = '''                    title="{% if harvest_locked %}{{ T('galaxy_asteroid_en_route_title', 'Harvest-Flotte unterwegs') }}{% else %}{{ T('galaxy_asteroid_harvest_click', 'Harvest Reclaimer zum Asteroiden senden') }}{% endif %}">\n'''
          new = '''                    title="{% if mega_limit %}{{ T('galaxy_asteroid_mega_limit_reached', 'Dein 10%-Anteil an diesem Mega-Belt ist ausgeschöpft.') }}{% elif returning %}{{ T('fleet_status_returning', 'Rückflug') }}{% elif harvest_locked %}{{ T('galaxy_asteroid_en_route_title', 'Harvest-Flotte unterwegs') }}{% else %}{{ T('galaxy_asteroid_harvest_click', 'Harvest Reclaimer zum Asteroiden senden') }}{% endif %}">\n'''
          if old not in text:
