name: UNI1 Mobile RC Gate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: uni1-mobile-rc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile-rc:
    name: uni1-mobile-rc
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-uni1-mobile-rc-secret-not-for-production
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
      SHOP_TEST_PROVIDER: "1"
      SHOP_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Mobile shell and current progression contracts
        run: |
          python -m pytest -q --tb=line \
            tests/test_gc_p0_mobile_nav_drawer.py \
            --deselect=tests/test_gc_p0_mobile_nav_drawer.py::test_mobile_drawer_has_no_duplicate_nav_ids \
            tests/test_progression_pages.py \
            --deselect=tests/test_progression_pages.py::test_locale_mechanics_descriptions \
            tests/test_uni1_rc_mobile_contracts.py
