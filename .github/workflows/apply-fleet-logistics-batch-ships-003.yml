name: Apply Fleet Logistics Ship Batch

on:
  push:
    branches: [perf/fleet-logistics-readonly-ssr]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/fleet-logistics-readonly-ssr
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply focused patch
        run: python scripts/apply_gc_perf_fleet_logistics_batch_ships_003.py
      - name: Verify target diff
        run: |
          python -m py_compile game/fleet.py
          git diff --check
          git diff -- game/fleet.py
          grep -n "GC-PERF-FLEET-LOGISTICS-003" game/fleet.py
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- game/fleet.py; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/fleet.py
          git commit -m "perf(fleet): batch logistics hangar reads"
          git push origin HEAD:perf/fleet-logistics-readonly-ssr
