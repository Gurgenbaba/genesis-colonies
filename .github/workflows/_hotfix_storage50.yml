name: Apply storage tech 50 hotfix

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/_hotfix_storage50.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'hotfix/storage-tech-50'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/storage-tech-50
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install test dependencies
        run: pip install -r requirements-prod.txt pytest
      - name: Apply focused balance hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('game/effects/effect_resolver.py')
          s = p.read_text(encoding='utf-8')
          old = 'STORAGE_TECH_PER_LEVEL = 0.15'
          assert s.count(old) == 1, f'expected one canonical storage constant, got {s.count(old)}'
          s = s.replace(old, 'STORAGE_TECH_PER_LEVEL = 0.50')
          s = s.replace('Research: storage_tech (+15% storage per level, additive)', 'Research: storage_tech (+50% storage per level, additive)')
          p.write_text(s, encoding='utf-8')

          for name in ('docs/RESEARCH_SYSTEM.md', 'docs/ECONOMY_SYSTEM.md'):
              q = Path(name)
              text = q.read_text(encoding='utf-8')
              assert '+15 %/Lvl' in text, f'missing expected 15% wording in {name}'
              q.write_text(text.replace('+15 %/Lvl', '+50 %/Lvl'), encoding='utf-8')
          PY

          cat > tests/test_storage_tech_hotfix_50.py <<'PY'
          from game.effects.effect_resolver import EffectResolver, STORAGE_TECH_PER_LEVEL


          def test_storage_tech_hotfix_is_fifty_percent_per_level():
              assert STORAGE_TECH_PER_LEVEL == 0.50
              assert EffectResolver.storage_bonus_pct(1) == 50
              assert EffectResolver.storage_bonus_pct(10) == 500


          def test_storage_tech_hotfix_is_additive_in_canonical_modifier():
              resolver = EffectResolver({}, {'storage_tech': 2}, settings={})
              assert resolver.get_modifiers()['storage_factor'] == 2.0
          PY

          git diff --check
          python -m pytest -q tests/test_storage_tech_hotfix_50.py tests/test_effects.py tests/test_gc821_economy_rebalance.py

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/effects/effect_resolver.py docs/RESEARCH_SYSTEM.md docs/ECONOMY_SYSTEM.md tests/test_storage_tech_hotfix_50.py
          git commit -m 'hotfix: restore storage tech to 50 percent per level'
          git push origin HEAD:hotfix/storage-tech-50
