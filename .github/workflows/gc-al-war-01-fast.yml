name: GC-AL-WAR-01 Focused Gate

on:
  push:
    branches: [ci/alliance-war-fast]

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-alliance-war-focused-secret-key-not-for-production-use
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alliance-war-peace
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Apply deterministic product patch
        run: python scripts/_gc_al_war_01_apply.py
      - name: Focused diplomacy regressions
        run: |
          python -m pytest -q --tb=line tests/test_alliance.py \
            -k 'gc_al_war_01 or diplomacy_war_and_duplicate_request or gc_al_dip_01_fleet_mission_hooks'
      - name: Locale and syntax gates
        run: |
          python scripts/audit_locale_keys.py
          python scripts/audit_visible_i18n.py --locales-only
          python scripts/audit_visible_i18n.py --raw-only --diff-base origin/main --max-findings 200
          node --check static/main.js
          git diff --check
      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            game/alliance.py game/alliance_catalog.py templates/alliance.html \
            tests/test_alliance.py docs/ALLIANCE_SYSTEM.md docs/CAPABILITY_STATUS.md \
            locales/de.json locales/en.json locales/fr.json locales/es.json \
            locales/pl.json locales/tr.json locales/ru.json locales/pt.json
          git commit -m "feat(alliance): add peace workflow and harden war transitions"
          git push origin HEAD:feature/alliance-war-peace
