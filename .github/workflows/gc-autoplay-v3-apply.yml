name: GC Autoplay V3 Apply

on:
  push:
    branches:
      - feature/inactive-autoplay-living-universe-v3

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/inactive-autoplay-living-universe-v3
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply GC-2621
        run: python scripts/_apply_gc2621_inactive_living_universe.py

      - name: Preserve first-wake activity contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("game/inactive_autoplay.py")
          text = p.read_text(encoding="utf-8")
          old = '''    action_domain = None if personal_cooldown else _action_domain_for_player(
              player_id, personality, seq
          )
          '''
          new = '''    action_domain = (
              "building"
              if is_wake
              else None
              if personal_cooldown
              else _action_domain_for_player(player_id, personality, seq)
          )
          '''
          if old not in text:
              raise SystemExit("missing GC-2621 first-wake action anchor")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Syntax check
        run: python -m py_compile game/inactive_autoplay.py tests/test_inactive_autoplay_gc2621.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; else python -m pip install pytest; fi

      - name: Focused GC-2621 tests
        env:
          GC_SKIP_MIGRATION_CHECK: '1'
        run: python -m pytest tests/test_inactive_autoplay_gc2621.py -q

      - name: Existing inactive autoplay regression
        env:
          GC_SKIP_MIGRATION_CHECK: '1'
        run: python -m pytest tests/test_inactive_autoplay.py -q

      - name: Commit tested implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gc-autoplay-v3-apply.yml scripts/_apply_gc2621_inactive_living_universe.py
          git add game/inactive_autoplay.py tests/test_inactive_autoplay_gc2621.py docs/INACTIVE_AUTOPLAY.md
          git commit -m "feat: make inactive autoplay feel alive"
          git push origin HEAD:feature/inactive-autoplay-living-universe-v3
