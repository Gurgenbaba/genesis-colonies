name: GC PE Clarity Backend Apply

on:
  push:
    branches: [feature/planet-evolution-clarity]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: '0'
      SECRET_KEY: ci-pe-clarity-not-for-production
      GC_SKIP_MIGRATION_CHECK: '1'
      GC_EMBEDDED_CRON: '0'
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/planet-evolution-clarity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Apply canonical impact wiring
        shell: bash
        run: |
          cat > /tmp/apply_pe_clarity.py <<'PY'
          from pathlib import Path

          def replace_one(path, old, new, label):
              p = Path(path)
              src = p.read_text(encoding='utf-8')
              count = src.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, got {count}')
              p.write_text(src.replace(old, new, 1), encoding='utf-8')

          # events.py — one authoritative preview function, reused by mutation.
          path = Path('game/planet_evolution/events.py')
          src = path.read_text(encoding='utf-8')
          anchor = '\n\nclass PlanetEventEngine:\n'
          helper = '''\n\ndef preview_event_choice(edef: Dict[str, Any], choice_key: str) -> Optional[Dict[str, Any]]:\n    """Return the exact outcome payload resolve_choice() would apply."""\n    outcome_key = PlanetEventEngine._map_choice_to_outcome(edef, choice_key)\n    if not outcome_key:\n        return None\n    return {\n        "outcome_key": outcome_key,\n        "outcome": dict(_OUTCOME_DEFAULTS.get(outcome_key, {})),\n    }\n\n\nclass PlanetEventEngine:\n'''
          if src.count(anchor) != 1:
              raise SystemExit(f'events helper anchor={src.count(anchor)}')
          src = src.replace(anchor, helper, 1)
          old = '''        outcome_key = PlanetEventEngine._map_choice_to_outcome(edef, choice_key)\n        if not outcome_key:\n            return False, "invalid_choice", None\n\n        outcome = dict(_OUTCOME_DEFAULTS.get(outcome_key, {}))\n'''
          new = '''        preview = preview_event_choice(edef, choice_key)\n        if not preview:\n            return False, "invalid_choice", None\n\n        outcome_key = str(preview["outcome_key"])\n        outcome = dict(preview["outcome"])\n'''
          if src.count(old) != 1:
              raise SystemExit(f'events mutation anchor={src.count(old)}')
          path.write_text(src.replace(old, new, 1), encoding='utf-8')

          # failures.py — single canonical source for live failure culture drift.
          path = Path('game/planet_evolution/failures.py')
          src = path.read_text(encoding='utf-8')
          anchor = '''FAILURE_AGGREGATE: Dict[str, str] = {\n    "reactor_crisis": "crisis",\n    "stability_collapse": "crisis",\n    "population_crisis": "crisis",\n    "ai_runaway": "crisis",\n    "research_containment_breach": "degraded",\n    "reactor_degraded": "degraded",\n    "smuggling_crackdown": "degraded",\n    "corruption_scandal": "degraded",\n    "resource_depletion": "degraded",\n    "quantum_instability": "degraded",\n}\n'''
          addition = anchor + '''\n\ndef failure_runtime_culture_drift(active_keys: Set[str]) -> Dict[str, float]:\n    """Per-day culture drift caused by currently active failure states."""\n    drift: Dict[str, float] = {}\n    if "reactor_crisis" in active_keys:\n        drift["stability"] = drift.get("stability", 0.0) - 0.5\n    if "stability_collapse" in active_keys:\n        drift["stability"] = drift.get("stability", 0.0) - 1.0\n    return drift\n'''
          if src.count(anchor) != 1:
              raise SystemExit(f'failure drift anchor={src.count(anchor)}')
          path.write_text(src.replace(anchor, addition, 1), encoding='utf-8')

          # culture.py — consume canonical failure drift instead of duplicating it.
          replace_one(
              'game/planet_evolution/culture.py',
              '''    from .failures import active_failure_keys\n\n    if "reactor_crisis" in active_failure_keys(planet_id, conn):\n        drift["stability"] = drift.get("stability", 0.0) - 0.5 * day_frac\n    if "stability_collapse" in active_failure_keys(planet_id, conn):\n        drift["stability"] = drift.get("stability", 0.0) - 1.0 * day_frac\n''',
              '''    from .failures import active_failure_keys, failure_runtime_culture_drift\n\n    failure_drift = failure_runtime_culture_drift(active_failure_keys(planet_id, conn))\n    for stat, per_day in failure_drift.items():\n        drift[stat] = drift.get(stat, 0.0) + float(per_day) * day_frac\n''',
              'culture failure drift',
          )

          # impact.py — remove a redundant no-op branch.
          path = Path('game/planet_evolution/impact.py')
          src = path.read_text(encoding='utf-8')
          src = src.replace('''        if token.startswith("chain:") and token in required_chain_tokens:\n            pass\n''', '')
          path.write_text(src, encoding='utf-8')

          # dashboard imports.
          replace_one(
              'game/planet_evolution/dashboard.py',
              'from .history import get_history\n',
              'from .history import get_history\nfrom .impact import impact_scopes, mechanics_impact_rows, policy_tradeoff_rows\n',
              'dashboard impact import',
          )

          # Research current -> after contract.
          replace_one(
              'game/planet_evolution/dashboard.py',
              '''    xp_reward = compute_planet_research_reward_xp(tech_key)\n\n    return {\n''',
              '''    xp_reward = compute_planet_research_reward_xp(tech_key)\n    impact_after_level = min(max_level, current + max(1, q_count))\n    impact_rows = mechanics_impact_rows(cfg.get("mechanics") or {}) if current <= 0 else []\n    impact = {\n        "current": current,\n        "after": impact_after_level,\n        "change": impact_after_level - current,\n        "rows": impact_rows,\n        "scopes": impact_scopes(impact_rows),\n    }\n\n    return {\n''',
              'research impact pre-return',
          )
          replace_one(
              'game/planet_evolution/dashboard.py',
              '''        "choice_made": tech.get("choice_made"),\n        **planet_tech_info_locale_keys(tech_key),\n''',
              '''        "choice_made": tech.get("choice_made"),\n        "impact": impact,\n        **planet_tech_info_locale_keys(tech_key),\n''',
              'research impact payload',
          )

          # Policy options: current and selected policy impact from live mechanics + live culture drift.
          replace_one(
              'game/planet_evolution/dashboard.py',
              '''            active_payload = {\n                "policy_key": active.get("policy_key"),\n                "label_key": pdef.get("label_key") or f"policy_{active.get('policy_key')}",\n                "cooldown_until": cooldown_until if on_cooldown else None,\n            }\n''',
              '''            active_rows = mechanics_impact_rows(pdef.get("mechanics") or {})\n            active_rows.extend(policy_tradeoff_rows(pdef.get("tradeoffs") or {}))\n            active_payload = {\n                "policy_key": active.get("policy_key"),\n                "label_key": pdef.get("label_key") or f"policy_{active.get('policy_key')}",\n                "cooldown_until": cooldown_until if on_cooldown else None,\n                "impact_rows": active_rows,\n                "impact_scopes": impact_scopes(active_rows),\n            }\n''',
              'policy active impact',
          )
          replace_one(
              'game/planet_evolution/dashboard.py',
              '''            options.append(\n                {\n                    "policy_key": policy_key,\n                    "label_key": pdef.get("label_key") or f"policy_{policy_key}",\n                    "eligible": eligible,\n                    "locked_reason_key": locked_reason_key,\n                    "min_slot": min_slot,\n                }\n            )\n''',
              '''            option_rows = mechanics_impact_rows(pdef.get("mechanics") or {})\n            option_rows.extend(policy_tradeoff_rows(pdef.get("tradeoffs") or {}))\n            options.append(\n                {\n                    "policy_key": policy_key,\n                    "label_key": pdef.get("label_key") or f"policy_{policy_key}",\n                    "eligible": eligible,\n                    "locked_reason_key": locked_reason_key,\n                    "min_slot": min_slot,\n                    "impact": {\n                        "current_label_key": active_payload.get("label_key") if active_payload else None,\n                        "after_label_key": pdef.get("label_key") or f"policy_{policy_key}",\n                        "rows": option_rows,\n                        "scopes": impact_scopes(option_rows),\n                    },\n                }\n            )\n''',
              'policy option impact',
          )

          # Crisis payload: active failure, recovery time and only canonical runtime drift.
          path = Path('game/planet_evolution/dashboard.py')
          src = path.read_text(encoding='utf-8')
          anchor = '''def _next_action(\n'''
          crisis_helper = '''def _crisis_ux(planet_id: int, *, conn: sqlite3.Connection) -> Dict[str, Any]:\n    from .failures import active_failure_keys, failure_runtime_culture_drift\n\n    active_keys = active_failure_keys(planet_id, conn)\n    if not active_keys:\n        return {"active": False, "failures": [], "rows": [], "scopes": []}\n    cur = conn.cursor()\n    cur.execute(\n        """\n        SELECT failure_key, state, started_at, resolve_at\n        FROM planet_failure_states\n        WHERE planet_id = ? AND state IN ('active','recovering')\n        ORDER BY resolve_at ASC, failure_key ASC;\n        """,\n        (int(planet_id),),\n    )\n    now = time.time()\n    failures = []\n    for row in cur.fetchall():\n        item = dict(row)\n        resolve_at = float(item.get("resolve_at") or 0)\n        failures.append(\n            {\n                "failure_key": str(item.get("failure_key") or ""),\n                "state": str(item.get("state") or "active"),\n                "started_at": float(item.get("started_at") or 0),\n                "resolve_at": resolve_at or None,\n                "remaining_seconds": max(0, int(resolve_at - now)) if resolve_at else None,\n            }\n        )\n    rows = [\n        {\n            "kind": "culture_drift",\n            "label_key": f"pe_culture_{stat}",\n            "value": f"{float(delta):+g}",\n            "scope_key": "pe_impact_scope_culture",\n        }\n        for stat, delta in failure_runtime_culture_drift(active_keys).items()\n    ]\n    return {\n        "active": True,\n        "failures": failures,\n        "rows": rows,\n        "scopes": impact_scopes(rows) or ["pe_impact_scope_risk"],\n    }\n\n\n'''
          if src.count(anchor) != 1:
              raise SystemExit(f'crisis helper anchor={src.count(anchor)}')
          src = src.replace(anchor, crisis_helper + anchor, 1)
          old = '''        "warnings": warnings,\n        "events_feed": _events_feed(planet_id, conn),\n'''
          new = '''        "warnings": warnings,\n        "crisis_ux": _crisis_ux(planet_id, conn=conn),\n        "events_feed": _events_feed(planet_id, conn),\n'''
          if src.count(old) != 1:
              raise SystemExit(f'crisis payload anchor={src.count(old)}')
          path.write_text(src.replace(old, new, 1), encoding='utf-8')

          # Ascension cards: permanent effect preview from the exact compiler parser.
          replace_one(
              'game/planet_evolution/ascension.py',
              'from .history import append_history\n',
              'from .history import append_history\nfrom .impact import impact_scopes, mechanics_impact_rows\n',
              'ascension impact import',
          )
          replace_one(
              'game/planet_evolution/ascension.py',
              '''        for ascension_key, adef in sorted(get_ascensions().items()):\n            ok, _missing = check_ascension_requirements(planet_id, ascension_key, conn)\n            ascensions.append(\n''',
              '''        for ascension_key, adef in sorted(get_ascensions().items()):\n            ok, _missing = check_ascension_requirements(planet_id, ascension_key, conn)\n            impact_rows = mechanics_impact_rows(adef.get("permanent_mechanics") or {})\n            ascensions.append(\n''',
              'ascension rows',
          )
          replace_one(
              'game/planet_evolution/ascension.py',
              '''                    "duration_days": float(adef.get("duration_days") or 7),\n                    "eligible": ok and not completed_key and not has_active,\n''',
              '''                    "duration_days": float(adef.get("duration_days") or 7),\n                    "impact": {\n                        "current_label_key": f"ascension_{completed_key}" if completed_key else None,\n                        "after_label_key": adef.get("label_key") or ascension_key,\n                        "rows": impact_rows,\n                        "scopes": impact_scopes(impact_rows),\n                    },\n                    "eligible": ok and not completed_key and not has_active,\n''',
              'ascension impact payload',
          )

          # Service event choices: attach exact outcome preview before any click.
          replace_one(
              'game/planet_evolution/service.py',
              '''            active_event = dict(event)\n            active_event["choices"] = edef.get("choices") or []\n            active_event["label_key"] = edef.get("label_key") or event.get("event_key")\n''',
              '''            from .events import preview_event_choice\n            from .impact import event_outcome_impact_rows, impact_scopes\n\n            active_event = dict(event)\n            choice_rows = []\n            for raw_choice in edef.get("choices") or []:\n                choice = dict(raw_choice) if isinstance(raw_choice, dict) else {"key": str(raw_choice)}\n                preview = preview_event_choice(edef, str(choice.get("key") or ""))\n                rows = event_outcome_impact_rows(\n                    (preview or {}).get("outcome") or {},\n                    culture,\n                )\n                choice["impact"] = {\n                    "rows": rows,\n                    "scopes": impact_scopes(rows),\n                    "outcome_key": (preview or {}).get("outcome_key"),\n                }\n                choice_rows.append(choice)\n            active_event["choices"] = choice_rows\n            active_event["label_key"] = edef.get("label_key") or event.get("event_key")\n''',
              'service event impact',
          )
          PY
          python /tmp/apply_pe_clarity.py

          cat > tests/test_gc_pe_clarity.py <<'PYTEST'
          """GC-PE-UX-01 — player-facing actions must expose canonical gameplay impact."""
          from __future__ import annotations

          from game.planet_evolution.events import preview_event_choice
          from game.planet_evolution.failures import failure_runtime_culture_drift
          from game.planet_evolution.impact import (
              event_outcome_impact_rows,
              mechanics_impact_rows,
              policy_tradeoff_rows,
          )


          def test_mechanics_preview_uses_live_parser_and_ignores_uncompiled_raw_keys():
              rows = mechanics_impact_rows(
                  {
                      "planet_research_speed_flag": 0.15,
                      "contraband_output_bonus": 0.50,  # not consumed by live compiler
                  }
              )
              assert any(r["label_key"] == "pe_impact_effect_research_speed" and r["value"] == "+15%" for r in rows)
              assert not any(r.get("target") == "contraband_output_bonus" for r in rows)


          def test_policy_tradeoff_preview_matches_live_culture_stats_only():
              rows = policy_tradeoff_rows(
                  {"stability_drift": -2.0, "industrial_pressure_drift": 3.0, "not_live_drift": 99}
              )
              assert {(r["label_key"], r["value"]) for r in rows} == {
                  ("pe_culture_stability", "-2"),
                  ("pe_culture_industrial_pressure", "+3"),
              }


          def test_event_preview_is_same_authoritative_outcome_payload():
              edef = {"choices": [{"key": "overload", "outcome": "overload"}]}
              preview = preview_event_choice(edef, "overload")
              assert preview is not None
              assert preview["outcome_key"] == "overload"
              assert preview["outcome"]["culture_delta"] == {"stability": -15, "industrial_pressure": 10}
              assert preview["outcome"]["add_failure"] == "reactor_degraded"


          def test_event_impact_exposes_current_after_and_change():
              rows = event_outcome_impact_rows(
                  {"culture_delta": {"stability": -15}, "grant_special_resource": {"refined_ferronit": 2000}},
                  {"stability": 80},
              )
              culture = next(r for r in rows if r["kind"] == "culture_change")
              assert culture["current"] == 80
              assert culture["after"] == 65
              assert culture["value"] == "-15"
              reward = next(r for r in rows if r["kind"] == "resource")
              assert reward["value"] == "+2000"


          def test_failure_runtime_drift_is_single_canonical_projection():
              assert failure_runtime_culture_drift({"reactor_crisis"}) == {"stability": -0.5}
              assert failure_runtime_culture_drift({"stability_collapse"}) == {"stability": -1.0}
              assert failure_runtime_culture_drift({"reactor_crisis", "stability_collapse"}) == {"stability": -1.5}
          PYTEST
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Focused backend regression
        run: |
          python -m py_compile \
            game/planet_evolution/impact.py \
            game/planet_evolution/events.py \
            game/planet_evolution/failures.py \
            game/planet_evolution/culture.py \
            game/planet_evolution/dashboard.py \
            game/planet_evolution/ascension.py \
            game/planet_evolution/service.py
          python -m pytest -q \
            tests/test_gc_pe_clarity.py \
            tests/test_planet_evolution_dashboard.py \
            tests/test_planet_evolution.py \
            tests/test_planet_instancing.py
          git diff --check
      - name: Commit backend contract and remove helper
        shell: bash
        run: |
          rm -f .github/workflows/gc-pe-clarity-backend-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            game/planet_evolution/impact.py \
            game/planet_evolution/events.py \
            game/planet_evolution/failures.py \
            game/planet_evolution/culture.py \
            game/planet_evolution/dashboard.py \
            game/planet_evolution/ascension.py \
            game/planet_evolution/service.py \
            tests/test_gc_pe_clarity.py \
            .github/workflows/gc-pe-clarity-backend-apply.yml
          git commit -m "feat(pe): expose canonical action impact previews"
          git push origin HEAD:feature/planet-evolution-clarity
