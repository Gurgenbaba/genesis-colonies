name: Due Queue Probe Performance Gate

on:
  pull_request:
    paths:
      - "game/queue_poll.py"
      - "tests/test_gc_perf_due_probe_001.py"
      - ".github/workflows/due-probe-perf.yml"
  push:
    branches: [main]
    paths:
      - "game/queue_poll.py"
      - "tests/test_gc_perf_due_probe_001.py"
      - ".github/workflows/due-probe-perf.yml"

jobs:
  due-probe-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-due-probe-perf-not-production
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Compile and diff gate
        run: |
          python -m py_compile game/queue_poll.py tests/test_gc_perf_due_probe_001.py
          git diff --check
      - name: Due probe regressions
        run: |
          python -m pytest -q --tb=line \
            tests/test_gc_perf_due_probe_001.py \
            tests/test_gc_prod_sqlite_stall_001a.py \
            tests/test_gc_perf_queue_worker_001.py
