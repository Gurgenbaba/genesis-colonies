name: GC State 007B Codemod

on:
  push:
    branches:
      - fix/gc-perf-state-007

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply focused state 007B patch
        run: python scripts/gc_perf_state_007b.py
      - name: Commit generated source
        shell: bash
        run: |
          if git diff --quiet -- game/inventory_boosters.py game/overview_page.py; then
            echo "No generated change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/inventory_boosters.py game/overview_page.py
          git commit -m "perf: skip duplicate server event booster merge in overview"
          git push origin "HEAD:${GITHUB_REF_NAME}"
