name: GC PERF STATE 010 Apply

on:
  push:
    branches:
      - fix/gc-perf-state-010
    paths:
      - .github/workflows/gc_perf_state_010_apply.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: gc-perf-state-010-gate
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Apply STATE-010
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('game/auction_house.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def count_auction_nav_attention(')
          end = text.index('\ndef resolve_inventory_key(', start)
          new_func = '''def count_auction_nav_attention(player_id: int, *, conn=None) -> int:
              """
              Nav badge count: outbid lots + new active listings since last visit.

              Never-visited players get attention for any active listing (discoverability).
              The Diet/nav path intentionally returns only scalar counts and performs one
              data SELECT after the schema readiness checks.
              """
              own = conn is None
              if own:
                  conn = db()
              try:
                  if not auction_schema_ready(conn):
                      return 0
                  pid = int(player_id)
                  if pid <= 0:
                      return 0
                  now_i = int(time.time())
                  cur = conn.cursor()

                  if auction_visits_schema_ready(conn):
                      cur.execute(
                          """
                          WITH visit AS (
                              SELECT last_visited_at
                              FROM auction_house_player_visits
                              WHERE player_id = ?
                              LIMIT 1
                          )
                          SELECT
                              (
                                  SELECT COUNT(*)
                                  FROM auction_house_listings l
                                  WHERE l.status = 'active'
                                    AND l.ends_at > ?
                                    AND l.current_bidder_id IS NOT NULL
                                    AND l.current_bidder_id != ?
                                    AND EXISTS (
                                        SELECT 1
                                        FROM auction_house_bids b
                                        WHERE b.listing_id = l.id
                                          AND b.player_id = ?
                                    )
                              ) AS outbid,
                              (
                                  SELECT COUNT(*)
                                  FROM auction_house_listings n
                                  WHERE n.status = 'active'
                                    AND n.ends_at > ?
                                    AND (
                                        NOT EXISTS (SELECT 1 FROM visit)
                                        OR n.created_at > COALESCE(
                                            (SELECT last_visited_at FROM visit LIMIT 1),
                                            0
                                        )
                                    )
                              ) AS new_listings;
                          """,
                          (pid, now_i, pid, pid, now_i),
                      )
                  else:
                      cur.execute(
                          """
                          SELECT
                              (
                                  SELECT COUNT(*)
                                  FROM auction_house_listings l
                                  WHERE l.status = 'active'
                                    AND l.ends_at > ?
                                    AND l.current_bidder_id IS NOT NULL
                                    AND l.current_bidder_id != ?
                                    AND EXISTS (
                                        SELECT 1
                                        FROM auction_house_bids b
                                        WHERE b.listing_id = l.id
                                          AND b.player_id = ?
                                    )
                              ) AS outbid,
                              (
                                  SELECT COUNT(*)
                                  FROM auction_house_listings n
                                  WHERE n.status = 'active'
                                    AND n.ends_at > ?
                              ) AS new_listings;
                          """,
                          (now_i, pid, pid, now_i),
                      )

                  row = cur.fetchone()
                  return int(row["outbid"] or 0) + int(row["new_listings"] or 0)
              finally:
                  if own and conn is not None:
                      conn.close()
          '''
          # Keep module-level indentation at column zero.
          import textwrap
          new_func = textwrap.dedent(new_func)
          path.write_text(text[:start] + new_func + text[end:], encoding='utf-8')
          PY

          cat > tests/test_gc_perf_state_010.py <<'PY'
          import sqlite3

          from game import auction_house


          def _conn(*, with_visits=True):
              conn = sqlite3.connect(":memory:")
              conn.row_factory = sqlite3.Row
              conn.execute("CREATE TABLE lootbox_inventory (id INTEGER PRIMARY KEY);")
              conn.execute(
                  "CREATE TABLE auction_house_listings ("
                  "id INTEGER PRIMARY KEY, status TEXT, ends_at INTEGER, "
                  "current_bidder_id INTEGER, created_at INTEGER"
                  ");"
              )
              conn.execute(
                  "CREATE TABLE auction_house_bids ("
                  "id INTEGER PRIMARY KEY, listing_id INTEGER, player_id INTEGER"
                  ");"
              )
              if with_visits:
                  conn.execute(
                      "CREATE TABLE auction_house_player_visits ("
                      "player_id INTEGER PRIMARY KEY, last_visited_at INTEGER"
                      ");"
                  )
              conn.commit()
              return conn


          def _selects(trace):
              return [sql for sql in trace if sql.lstrip().upper().startswith(("SELECT", "WITH"))]


          def _seed_listing(conn, listing_id, *, status="active", ends_at=2000, bidder=None, created_at=500):
              conn.execute(
                  "INSERT INTO auction_house_listings "
                  "(id, status, ends_at, current_bidder_id, created_at) VALUES (?, ?, ?, ?, ?);",
                  (listing_id, status, ends_at, bidder, created_at),
              )


          def _seed_bid(conn, listing_id, player_id):
              conn.execute(
                  "INSERT INTO auction_house_bids (listing_id, player_id) VALUES (?, ?);",
                  (listing_id, player_id),
              )


          def test_auction_attention_visited_player_preserves_semantics_and_uses_three_selects(monkeypatch):
              monkeypatch.setattr(auction_house.time, "time", lambda: 1000)
              conn = _conn(with_visits=True)
              try:
                  conn.execute(
                      "INSERT INTO auction_house_player_visits (player_id, last_visited_at) VALUES (7, 700);"
                  )
                  _seed_listing(conn, 1, bidder=9, created_at=800)
                  _seed_bid(conn, 1, 7)  # outbid + new
                  _seed_listing(conn, 2, bidder=9, created_at=600)
                  _seed_bid(conn, 2, 7)  # outbid, but not new
                  _seed_listing(conn, 3, bidder=7, created_at=900)  # new, still leading
                  _seed_bid(conn, 3, 7)
                  _seed_listing(conn, 4, bidder=9, created_at=900, ends_at=900)  # ended
                  _seed_bid(conn, 4, 7)
                  _seed_listing(conn, 5, status="completed", bidder=9, created_at=900)
                  _seed_bid(conn, 5, 7)
                  conn.commit()

                  trace = []
                  conn.set_trace_callback(trace.append)
                  assert auction_house.count_auction_nav_attention(7, conn=conn) == 4
                  selects = _selects(trace)
                  assert len(selects) == 3
                  assert sum("sqlite_master" in sql.lower() for sql in selects) == 2
                  data_sql = selects[-1].lower()
                  assert data_sql.lstrip().startswith("with visit as")
                  assert " join " not in f" {data_sql} "
                  assert "count(*)" in data_sql
                  assert not conn.in_transaction
              finally:
                  conn.close()


          def test_auction_attention_never_visited_counts_all_active(monkeypatch):
              monkeypatch.setattr(auction_house.time, "time", lambda: 1000)
              conn = _conn(with_visits=True)
              try:
                  _seed_listing(conn, 1, bidder=9, created_at=100)
                  _seed_bid(conn, 1, 8)  # outbid + active listing
                  _seed_listing(conn, 2, bidder=None, created_at=200)
                  conn.commit()
                  assert auction_house.count_auction_nav_attention(8, conn=conn) == 3
              finally:
                  conn.close()


          def test_auction_attention_missing_optional_visits_table_is_supported(monkeypatch):
              monkeypatch.setattr(auction_house.time, "time", lambda: 1000)
              conn = _conn(with_visits=False)
              try:
                  _seed_listing(conn, 1, bidder=9, created_at=100)
                  _seed_bid(conn, 1, 11)
                  _seed_listing(conn, 2, bidder=None, created_at=200)
                  conn.commit()

                  trace = []
                  conn.set_trace_callback(trace.append)
                  assert auction_house.count_auction_nav_attention(11, conn=conn) == 3
                  selects = _selects(trace)
                  assert len(selects) == 3
                  assert sum("sqlite_master" in sql.lower() for sql in selects) == 2
                  data_sql = selects[-1].lower()
                  assert "auction_house_player_visits" not in data_sql
                  assert " join " not in f" {data_sql} "
                  assert not conn.in_transaction
              finally:
                  conn.close()
          PY

          python -m py_compile game/auction_house.py tests/test_gc_perf_state_010.py
          git diff --check
      - name: Focused STATE-010 regression
        run: python -m pytest -q --tb=line tests/test_gc_perf_state_010.py
      - name: Commit product and regression files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/auction_house.py tests/test_gc_perf_state_010.py
          git commit -m "perf: collapse Auction nav attention reads"
          git push origin HEAD:fix/gc-perf-state-010
