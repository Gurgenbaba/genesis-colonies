name: TEMP Presence Secondary Apply 166
on: [push]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/perf/pg-presence-secondary-readers-166' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/pg-presence-secondary-readers-166
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply secondary presence cutover
        run: python scripts/_tmp_presence_secondary_apply_166.py
      - name: Verify secondary presence regressions
        run: |
          python -m pip install -r requirements-prod.txt pytest
          python -m py_compile game/pirates/accounts.py game/shop_promos.py game/alliance.py
          python -m pytest -q tests/test_gc_pg_166_presence_secondary.py tests/test_shop_promos.py tests/test_alliance.py tests/test_gc_pg_142_presence_pool_starvation.py
      - name: Commit product diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/pirates/accounts.py game/shop_promos.py game/alliance.py tests/test_gc_pg_166_presence_secondary.py
          git commit -m "perf(pg): move secondary activity paths to player_presence"
          git push origin HEAD:perf/pg-presence-secondary-readers-166
