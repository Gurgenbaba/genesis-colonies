name: GC Player Changelog apply and test

on:
  push:
    branches:
      - fix/version-changelog-surface
    paths:
      - .github/workflows/gc-player-changelog-apply.yml
      - scripts/apply_gc_player_changelog.py

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/version-changelog-surface
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Apply canonical changelog patch
        run: python scripts/apply_gc_player_changelog.py

      - name: Compile and syntax check
        run: |
          python -m py_compile game/player_changelog.py scripts/apply_gc_player_changelog.py tests/test_player_changelog_surface.py
          node --check static/js/player_changelog.js
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          locales = ['de','en','fr','es','pl','tr','ru','pt']
          data = {loc: json.loads((root/'locales'/f'{loc}.json').read_text(encoding='utf-8')) for loc in locales}
          base = set(data['de'])
          for loc, payload in data.items():
              assert set(payload) == base, f'locale key parity mismatch: {loc}'
          print(f'locale parity OK: {len(base)} keys x {len(locales)} locales')
          PY

      - name: Run focused regression tests
        env:
          APP_ENV: development
          GC_SKIP_MIGRATION_CHECK: "1"
          SECRET_KEY: ci-player-changelog-secret-key-32chars
        run: |
          python -m pytest -q --tb=line \
            tests/test_player_changelog_surface.py \
            tests/test_community_hub.py

      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app.py \
            game/player_changelog.py \
            templates/base.html \
            templates/partials/bottom_utility_bar.html \
            templates/partials/special_panel.html \
            templates/partials/player_changelog_dialog.html \
            static/js/player_changelog.js \
            static/css/player_changelog.css \
            tests/test_player_changelog_surface.py \
            tests/test_community_hub.py \
            locales/de.json locales/en.json locales/fr.json locales/es.json \
            locales/pl.json locales/tr.json locales/ru.json locales/pt.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "fix: restore full git-backed version changelog"
            git push origin HEAD:fix/version-changelog-surface
          fi
