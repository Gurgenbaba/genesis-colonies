name: GC Big Score Apply

on:
  push:
    branches:
      - feature/big-score-ranking
    paths:
      - scripts/apply_big_score_ranking.py
      - .github/workflows/gc_big_score_apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/big-score-ranking
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install pytest; fi

      - name: Apply big-score patch
        run: python scripts/apply_big_score_ranking.py

      - name: Compile changed Python
        run: python -m py_compile game/ranking.py game/scoring.py game/number_format.py

      - name: Focused regression suite
        env:
          GC_SKIP_MIGRATION_CHECK: '1'
          SECRET_KEY: test-secret-key-for-big-score-ranking-123456789
          APP_ENV: development
        run: |
          python -m pytest tests/test_ranking.py tests/test_gc622_integer_overflow.py tests/test_number_format.py -q

      - name: Commit generated implementation
        if: success()
        run: |
          rm -f scripts/apply_big_score_ranking.py .github/workflows/gc_big_score_apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat(score): remove ranking ceiling with arbitrary precision"
          git push origin HEAD:feature/big-score-ranking
