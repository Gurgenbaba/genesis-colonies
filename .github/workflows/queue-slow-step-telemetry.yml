name: Queue Slow-Step Telemetry Gate

on:
  pull_request:
    paths:
      - game/queue_engine.py
      - tests/test_gc_perf_queue_slow_step_telemetry.py
      - .github/workflows/queue-slow-step-telemetry.yml
  push:
    branches:
      - main
    paths:
      - game/queue_engine.py
      - tests/test_gc_perf_queue_slow_step_telemetry.py
      - .github/workflows/queue-slow-step-telemetry.yml

jobs:
  queue-slow-step-telemetry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile and diff gate
        run: |
          python -m py_compile game/queue_engine.py tests/test_gc_perf_queue_slow_step_telemetry.py
          git diff --check
      - name: Slow-step telemetry regression
        run: python -m pytest tests/test_gc_perf_queue_slow_step_telemetry.py -q
