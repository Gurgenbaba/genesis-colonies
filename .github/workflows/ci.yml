# Smoke CI for Railway "Wait for CI" — keep this job fast and green on push to main.
# Full suite remains local / optional; focused feature gates run on pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-smoke-secret-key-not-for-production-use
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Smoke tests (deploy + cron)
        run: |
          python -m pytest -q --tb=line \
            tests/test_deployment.py tests/test_internal_cron.py tests/test_embedded_cron.py \
            tests/test_fleet_worker.py tests/test_gc_perf_tk_005.py tests/test_gc_perf_fleet_write_001.py \
            tests/test_gc_perf_resource_persist_001.py tests/test_gc_perf_buildings_002.py \
            tests/test_galactic_diplomacy.py::test_ensure_get_set_galaxy_personality \
            tests/test_commander_classes.py::test_linear_gate_and_sp_unlock \
            tests/test_commander_classes.py::test_effect_resolver_includes_class_mods \
            tests/test_inventory_booster_visibility.py::test_use_duration_booster_creates_active_entry \
            tests/test_inventory_booster_visibility.py::test_production_booster_tier_ladder_25_then_50

  big-score:
    name: big-score-ranking
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-big-score-secret-key-not-for-production-use
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Compile and browser syntax
        run: |
          python -m py_compile game/ranking.py game/scoring.py game/number_format.py game/pirates/threat.py game/fleet.py
          node --check static/main.js
          git diff --check
      - name: Big-score regression suite
        run: |
          python -m pytest -q --tb=line \
            tests/test_ranking.py tests/test_number_format.py tests/test_noob_protection.py \
            tests/test_big_score_migration.py \
            tests/test_gc622_integer_overflow.py::TestGC622SchemaTypes::test_player_scores_use_decimal_text \
            tests/test_gc622_integer_overflow.py::TestGC622Ranking

  i18n:
    name: i18n-hardening
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-i18n-secret-key-not-for-production-use
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Locale key and translation audit (all 8 languages)
        run: |
          python scripts/audit_locale_keys.py
          python scripts/audit_visible_i18n.py --locales-only
      - name: I18N regression tests
        run: |
          python -m pytest -q --tb=line tests/test_gc900_multilanguage.py tests/test_i18n_hardening.py
      - name: Full visible raw-string inventory (advisory)
        run: python scripts/audit_visible_i18n.py --raw-only --report-only --max-findings 120
      - name: Block newly introduced player-facing raw strings
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then BASE="${{ github.event.pull_request.base.sha }}"; else BASE="${{ github.event.before }}"; fi
          python scripts/audit_visible_i18n.py --raw-only --diff-base "$BASE" --max-findings 200

  apply-big-score-display-hotfix:
    name: apply-big-score-display-hotfix
    if: github.event_name == 'pull_request' && github.head_ref == 'hotfix/big-score-display-v2'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/big-score-display-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply exact display-only patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path("static/main.js")
          src = js_path.read_text(encoding="utf-8")
          old = '''    if (abs >= 1_000_000_000_000_000n) return _scientificBigInt(abs, negative);
    const sign = negative ? "-" : "";
    if (abs >= 1_000_000_000_000n) return `${sign}${_compactBigIntBody(abs, 1_000_000_000_000n)} Bio.`;
'''
          new = '''    if (abs >= 1_000_000_000_000_000_000_000_000_000_000_000n) return _scientificBigInt(abs, negative);
    const sign = negative ? "-" : "";
    if (abs >= 1_000_000_000_000_000_000_000_000_000_000n) return `${sign}${_compactBigIntBody(abs, 1_000_000_000_000_000_000_000_000_000_000n)} Q`;
    if (abs >= 1_000_000_000_000_000_000_000_000_000n) return `${sign}${_compactBigIntBody(abs, 1_000_000_000_000_000_000_000_000_000n)} R`;
    if (abs >= 1_000_000_000_000_000_000_000_000n) return `${sign}${_compactBigIntBody(abs, 1_000_000_000_000_000_000_000_000n)} Y`;
    if (abs >= 1_000_000_000_000_000_000_000n) return `${sign}${_compactBigIntBody(abs, 1_000_000_000_000_000_000_000n)} Z`;
    if (abs >= 1_000_000_000_000_000_000n) return `${sign}${_compactBigIntBody(abs, 1_000_000_000_000_000_000n)} E`;
    if (abs >= 1_000_000_000_000_000n) return `${sign}${_compactBigIntBody(abs, 1_000_000_000_000_000n)} P`;
    if (abs >= 1_000_000_000_000n) return `${sign}${_compactBigIntBody(abs, 1_000_000_000_000n)} Bio.`;
'''
          count = src.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one canonical formatter block, found {count}")
          js_path.write_text(src.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/test_number_format.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "def test_frontend_big_score_suffixes_before_scientific_notation():"
          if marker in tests:
              raise SystemExit("Frontend display regression test already exists unexpectedly")
          tests += r'''


def test_frontend_big_score_suffixes_before_scientific_notation():
    """Huge score display uses readable BigInt suffixes through 10^30."""
    from pathlib import Path

    source = (Path(__file__).resolve().parents[1] / "static" / "main.js").read_text(encoding="utf-8")
    old_scientific = "if (abs >= 1_000_000_000_000_000n) return _scientificBigInt(abs, negative);"
    new_scientific = "if (abs >= 1_000_000_000_000_000_000_000_000_000_000_000n) return _scientificBigInt(abs, negative);"
    assert old_scientific not in source
    assert new_scientific in source

    suffixes = (
        ("1_000_000_000_000_000_000_000_000_000_000n", "Q"),
        ("1_000_000_000_000_000_000_000_000_000n", "R"),
        ("1_000_000_000_000_000_000_000_000n", "Y"),
        ("1_000_000_000_000_000_000_000n", "Z"),
        ("1_000_000_000_000_000_000n", "E"),
        ("1_000_000_000_000_000n", "P"),
    )
    previous = source.index(new_scientific)
    for value, suffix in suffixes:
        branch = f"if (abs >= {value})"
        pos = source.index(branch)
        assert pos > previous
        fragment = source[pos : pos + 220]
        assert f"_compactBigIntBody(abs, {value})" in fragment
        assert f"}} {suffix}`;" in fragment
        previous = pos
'''
          test_path.write_text(tests, encoding="utf-8")
          PY
      - name: Verify patched files
        shell: bash
        run: |
          node --check static/main.js
          python -m pip install --quiet pytest
          python -m pytest -q tests/test_number_format.py
          git diff --check
      - name: Restore CI and commit only final hotfix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git rm .github/workflows/apply-big-score-display-hotfix.yml
          git add static/main.js tests/test_number_format.py .github/workflows/ci.yml
          git diff --cached --check
          git commit -m 'fix(ui): keep huge scores readable with bigint suffixes'
          git push origin HEAD:hotfix/big-score-display-v2
