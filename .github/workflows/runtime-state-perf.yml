name: Runtime State Performance Gate

on:
  pull_request:
    paths:
      - "game/runtime_state.py"
      - "game/queue_poll.py"
      - "tests/test_gc_perf_runtime_state_ddl.py"
      - ".github/workflows/runtime-state-perf.yml"
  push:
    branches: [main]
    paths:
      - "game/runtime_state.py"
      - "game/queue_poll.py"
      - "tests/test_gc_perf_runtime_state_ddl.py"
      - ".github/workflows/runtime-state-perf.yml"

jobs:
  runtime-state-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-runtime-state-perf-not-production
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Compile and diff gate
        run: |
          python -m py_compile game/runtime_state.py tests/test_gc_perf_runtime_state_ddl.py
          git diff --check
      - name: Runtime-state regression
        run: |
          python -m pytest -q --tb=line \
            tests/test_gc_perf_runtime_state_ddl.py \
            tests/test_gc_prod_sqlite_stall_001a.py \
            tests/test_gc_pg_lock_softfail_hotpath.py
