# Smoke CI for Railway "Wait for CI" — keep this job fast and green on push to main.
# Full suite remains local / optional; this gate blocks broken deploy config + cron owners.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-smoke-secret-key-not-for-production-use
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest

      - name: Smoke tests (deploy + cron)
        run: |
          python -m pytest -q --tb=line \
            tests/test_deployment.py \
            tests/test_internal_cron.py \
            tests/test_embedded_cron.py \
            tests/test_fleet_worker.py \
            tests/test_gc_perf_tk_005.py \
            tests/test_gc_perf_fleet_write_001.py \
            tests/test_gc_perf_resource_persist_001.py

  i18n:
    name: i18n-hardening
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-i18n-secret-key-not-for-production-use
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest

      - name: Locale key and translation audit (all 8 languages)
        run: |
          python scripts/audit_locale_keys.py
          python scripts/audit_visible_i18n.py --locales-only

      - name: I18N regression tests
        run: |
          python -m pytest -q --tb=line \
            tests/test_gc900_multilanguage.py \
            tests/test_i18n_hardening.py

      - name: Full visible raw-string inventory (advisory)
        run: |
          python scripts/audit_visible_i18n.py --raw-only --report-only --max-findings 120

      - name: Block newly introduced player-facing raw strings
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          python scripts/audit_visible_i18n.py --raw-only --diff-base "$BASE" --max-findings 200
