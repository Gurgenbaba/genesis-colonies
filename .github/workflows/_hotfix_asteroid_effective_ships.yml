name: one-shot asteroid effective ships hotfix

on:
  push:
    branches:
      - hotfix/asteroid-harvest-effective-ships

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[asteroid-hotfix-built]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/asteroid-harvest-effective-ships
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply server-authoritative asteroid ship clamp
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('game/fleet.py')
          s = p.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              s = s.replace(old, new, 1)

          helper_marker = '\n\ndef validate_fleet_send(\n'
          helper = r'''


def _effective_asteroid_recycle_ships(
    mission: str,
    target_info: Mapping[str, Any] | None,
    origin_planet_id: int,
    ships: Mapping[str, int],
    *,
    conn,
) -> Dict[str, int]:
    """Clamp asteroid Harvest Reclaimers to what can actually launch and is useful.

    This is deliberately asteroid-only. Generic recycle/debris and every other
    mission keep their existing all-or-nothing ship semantics.
    """
    ships_n = normalize_ships(ships)
    if (
        str(mission or "").strip().lower() != "recycle"
        or str((target_info or {}).get("target_type") or "") != "asteroid"
    ):
        return ships_n

    asteroid = (target_info or {}).get("asteroid") or {}
    requested = max(0, int(ships_n.get("harvest_reclaimer") or 0))
    available = max(
        0,
        int(
            get_planet_ships(int(origin_planet_id), conn=conn).get(
                "harvest_reclaimer", 0
            )
            or 0
        ),
    )
    needed = max(0, int(asteroid.get("recycler_slots_needed") or 0))
    effective = min(requested, available, needed)

    out = dict(ships_n)
    if effective > 0:
        out["harvest_reclaimer"] = int(effective)
    else:
        out.pop("harvest_reclaimer", None)
    return normalize_ships(out)
'''
          replace_once(helper_marker, helper + helper_marker, 'insert helper')

          validate_anchor = '''    if mission in ("attack", "spy") and target_info:\n'''
          validate_insert = '''    if (\n        mission == "recycle"\n        and target_info\n        and str(target_info.get("target_type") or "") == "asteroid"\n    ):\n        ships_n = _effective_asteroid_recycle_ships(\n            mission,\n            target_info,\n            int(origin_planet_id),\n            ships_n,\n            conn=conn,\n        )\n        if int(ships_n.get("harvest_reclaimer") or 0) <= 0:\n            return False, "recycle_requires_reclaimer", {\n                "target": target_info,\n                "effective_ships": dict(ships_n),\n            }\n\n'''
          replace_once(validate_anchor, validate_insert + validate_anchor, 'validate clamp')

          success_old = '''    out: Dict[str, Any] = {\n        "target": target_info,\n        "preview": preview,\n        "origin_planet": origin_planet,\n        "resolved_target": target,\n    }\n'''
          success_new = '''    out: Dict[str, Any] = {\n        "target": target_info,\n        "preview": preview,\n        "origin_planet": origin_planet,\n        "resolved_target": target,\n        "effective_ships": dict(ships_n),\n    }\n'''
          replace_once(success_old, success_new, 'validate success context')

          preview_anchor = '''        if mission_locked:\n            mission_ok = False\n            mission_reason = "mission_locked"\n        origin_galaxy = int(origin_planet.get("galaxy") or 0) or None\n'''
          preview_new = '''        if mission_locked:\n            mission_ok = False\n            mission_reason = "mission_locked"\n        if (\n            mission == "recycle"\n            and target_info\n            and str(target_info.get("target_type") or "") == "asteroid"\n        ):\n            ships_n = _effective_asteroid_recycle_ships(\n                mission,\n                target_info,\n                int(origin_planet.get("id") or 0),\n                ships_n,\n                conn=conn,\n            )\n        origin_galaxy = int(origin_planet.get("galaxy") or 0) or None\n'''
          replace_once(preview_anchor, preview_new, 'preview clamp')

          payload_old = '''        payload = {\n            **flight,\n            "target": target_info,\n'''
          payload_new = '''        payload = {\n            **flight,\n            "effective_ships": dict(ships_n),\n            "target": target_info,\n'''
          replace_once(payload_old, payload_new, 'preview payload effective ships')

          send_anchor = '''        if not ok_send:\n            if own:\n                rollback(conn)\n            extra = send_ctx if isinstance(send_ctx, dict) else None\n            return False, send_reason, extra\n\n        origin_planet = send_ctx["origin_planet"]\n'''
          send_new = '''        if not ok_send:\n            if own:\n                rollback(conn)\n            extra = send_ctx if isinstance(send_ctx, dict) else None\n            return False, send_reason, extra\n\n        if isinstance(send_ctx, dict) and "effective_ships" in send_ctx:\n            ships_n = normalize_ships(send_ctx.get("effective_ships") or {})\n        if not ships_n:\n            if own:\n                rollback(conn)\n            return False, "no_ships", None\n\n        origin_planet = send_ctx["origin_planet"]\n'''
          replace_once(send_anchor, send_new, 'send authoritative effective ships')

          p.write_text(s, encoding='utf-8')

          version = Path('VERSION')
          current = version.read_text(encoding='utf-8').strip()
          if current != '0.5.9.167':
              raise SystemExit(f'unexpected VERSION before hotfix: {current}')
          version.write_text('0.5.9.168\n', encoding='utf-8')

          t = Path('tests/test_asteroids.py')
          tests = t.read_text(encoding='utf-8')
          import_old = '''from game.fleet import (\n    add_planet_ships,\n    evaluate_fleet_mission_target,\n    process_fleet_tick,\n    resolve_fleet_target,\n    send_fleet,\n)\n'''
          import_new = '''from game.fleet import (\n    add_planet_ships,\n    build_fleet_send_preview,\n    evaluate_fleet_mission_target,\n    get_planet_ships,\n    preview_fleet_flight,\n    process_fleet_tick,\n    resolve_fleet_target,\n    send_fleet,\n)\n'''
          if tests.count(import_old) != 1:
              raise SystemExit('asteroid test import block changed')
          tests = tests.replace(import_old, import_new, 1)

          regression = r'''


def test_asteroid_send_clamps_to_available_reclaimers_and_exact_fuel(ast_db):
    uid = _player("FuelClamp")
    home_id, g, s, _ = _home(uid)
    pos = _free_slot_near(g, s)
    conn = db()
    try:
        begin_write_transaction(conn)
        ins = insert_asteroid(
            conn=conn,
            galaxy=g,
            system=s,
            position=pos,
            asteroid_key="mixed_belt",
            rng=random.Random(818),
        )
        assert ins["ok"]
        # Plenty of asteroid cargo demand; availability (7) is the limiting factor.
        conn.execute(
            "UPDATE asteroid_fields SET metal = 50000000, crystal = 50000000, fuel_cells = 50000000 WHERE id = ?;",
            (int(ins["asteroid"]["id"]),),
        )
        conn.execute(
            "UPDATE planets SET metal = 500000, crystal = 500000, fuel_cells = 500000, last_update = ? WHERE id = ?;",
            (time.time() + 60, home_id),
        )
        add_planet_ships(home_id, uid, {"harvest_reclaimer": 7}, conn=conn)
        commit(conn)

        origin = dict(conn.execute("SELECT * FROM planets WHERE id = ?;", (home_id,)).fetchone())
        expected = preview_fleet_flight(
            origin_planet=origin,
            target_galaxy=g,
            target_system=s,
            target_position=pos,
            ships={"harvest_reclaimer": 7},
            resources={},
            speed_percent=100,
            player_id=uid,
            mission_type="recycle",
            conn=conn,
        )
        expected_fuel = int(expected["fuel_cost"])

        begin_write_transaction(conn)
        ok, err, result = send_fleet(
            player_id=uid,
            origin_planet_id=home_id,
            mission_type="recycle",
            target_galaxy=g,
            target_system=s,
            target_position=pos,
            ships={"harvest_reclaimer": 100},
            resources={},
            speed_percent=100,
            conn=conn,
        )
        assert ok, err
        fleet_id = int(result["fleet"]["id"])
        commit(conn)

        row = conn.execute(
            "SELECT ships_json, fuel_cost FROM fleet_movements WHERE id = ?;",
            (fleet_id,),
        ).fetchone()
        assert json.loads(row["ships_json"] or "{}") == {"harvest_reclaimer": 7}
        assert int(row["fuel_cost"]) == expected_fuel
        assert int(result["fuel_cost"]) == expected_fuel
        assert int(get_planet_ships(home_id, conn=conn).get("harvest_reclaimer") or 0) == 0
        fuel_after = int(float(conn.execute(
            "SELECT fuel_cells FROM planets WHERE id = ?;", (home_id,)
        ).fetchone()["fuel_cells"]))
        assert fuel_after == 500000 - expected_fuel
    finally:
        conn.close()


def test_asteroid_send_clamps_to_current_asteroid_need(ast_db):
    uid = _player("NeedClamp")
    home_id, g, s, _ = _home(uid)
    pos = _free_slot_near(g, s)
    conn = db()
    try:
        begin_write_transaction(conn)
        ins = insert_asteroid(
            conn=conn,
            galaxy=g,
            system=s,
            position=pos,
            asteroid_key="ferronite_rock",
            rng=random.Random(919),
        )
        assert ins["ok"]
        # A one-unit field needs exactly one Harvest Reclaimer.
        conn.execute(
            "UPDATE asteroid_fields SET metal = 1, crystal = 0, fuel_cells = 0 WHERE id = ?;",
            (int(ins["asteroid"]["id"]),),
        )
        conn.execute(
            "UPDATE planets SET fuel_cells = 500000, last_update = ? WHERE id = ?;",
            (time.time() + 60, home_id),
        )
        add_planet_ships(home_id, uid, {"harvest_reclaimer": 20}, conn=conn)
        commit(conn)

        begin_write_transaction(conn)
        ok, err, result = send_fleet(
            player_id=uid,
            origin_planet_id=home_id,
            mission_type="recycle",
            target_galaxy=g,
            target_system=s,
            target_position=pos,
            ships={"harvest_reclaimer": 20},
            resources={},
            speed_percent=100,
            conn=conn,
        )
        assert ok, err
        fleet_id = int(result["fleet"]["id"])
        commit(conn)

        row = conn.execute(
            "SELECT ships_json FROM fleet_movements WHERE id = ?;", (fleet_id,)
        ).fetchone()
        assert json.loads(row["ships_json"] or "{}") == {"harvest_reclaimer": 1}
        assert int(get_planet_ships(home_id, conn=conn).get("harvest_reclaimer") or 0) == 19
    finally:
        conn.close()


def test_asteroid_preview_uses_effective_ship_map_and_fuel(ast_db):
    uid = _player("PreviewClamp")
    home_id, g, s, _ = _home(uid)
    pos = _free_slot_near(g, s)
    conn = db()
    try:
        begin_write_transaction(conn)
        ins = insert_asteroid(
            conn=conn,
            galaxy=g,
            system=s,
            position=pos,
            asteroid_key="mixed_belt",
            rng=random.Random(1010),
        )
        assert ins["ok"]
        add_planet_ships(home_id, uid, {"harvest_reclaimer": 7}, conn=conn)
        conn.execute(
            "UPDATE planets SET fuel_cells = 500000, last_update = ? WHERE id = ?;",
            (time.time() + 60, home_id),
        )
        commit(conn)

        origin = dict(conn.execute("SELECT * FROM planets WHERE id = ?;", (home_id,)).fetchone())
        expected = preview_fleet_flight(
            origin_planet=origin,
            target_galaxy=g,
            target_system=s,
            target_position=pos,
            ships={"harvest_reclaimer": 7},
            resources={},
            speed_percent=100,
            player_id=uid,
            mission_type="recycle",
            conn=conn,
        )
        preview = build_fleet_send_preview(
            player_id=uid,
            origin_planet=origin,
            target_galaxy=g,
            target_system=s,
            target_position=pos,
            mission_type="recycle",
            ships={"harvest_reclaimer": 100},
            resources={},
            speed_percent=100,
            conn=conn,
        )
        assert preview["effective_ships"] == {"harvest_reclaimer": 7}
        assert int(preview["fuel_cost"]) == int(expected["fuel_cost"])
        assert preview["can_send"] is True
    finally:
        conn.close()
'''
          if 'test_asteroid_send_clamps_to_available_reclaimers_and_exact_fuel' in tests:
              raise SystemExit('regression tests already present unexpectedly')
          tests += regression
          t.write_text(tests, encoding='utf-8')
          PY

      - name: Remove one-shot workflow from final branch tree
        run: rm .github/workflows/_hotfix_asteroid_effective_ships.yml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Focused regression suite
        run: |
          python -m py_compile game/fleet.py
          pytest -q tests/test_asteroids.py tests/test_recycler.py tests/test_asteroid_value_preview.py

      - name: Commit tested hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/fleet.py tests/test_asteroids.py VERSION .github/workflows/_hotfix_asteroid_effective_ships.yml
          git diff --cached --check
          git commit -m "fix(fleet): charge asteroid harvest fuel for effective ships [asteroid-hotfix-built]"
          git push origin HEAD:hotfix/asteroid-harvest-effective-ships
