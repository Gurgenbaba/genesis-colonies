name: GC PG 177 Messages Trade Apply

on:
  push:
    branches:
      - fix/pg-177-messages-trade-like

concurrency:
  group: gc-pg-177-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: '0'
      SECRET_KEY: ci-pg-177-secret-key-not-for-production-use
      GC_SKIP_MIGRATION_CHECK: '1'
      GC_EMBEDDED_CRON: '0'
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pg-177-messages-trade-like
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Apply portability patch
        run: python scripts/apply_gc_pg_177_messages_trade.py
      - name: Run regressions
        run: |
          python -m pytest -q tests/test_gc_pg_177_messages_trade_filter.py tests/test_messages.py
          python -m py_compile game/messages.py
          git diff --check
      - name: Commit validated patch
        run: |
          rm scripts/apply_gc_pg_177_messages_trade.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/messages.py tests/test_gc_pg_177_messages_trade_filter.py scripts/apply_gc_pg_177_messages_trade.py
          git commit -m 'fix(pg): bind message trade LIKE patterns'
          git push origin HEAD:fix/pg-177-messages-trade-like
