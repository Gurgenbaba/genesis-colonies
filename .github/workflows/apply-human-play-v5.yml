name: Apply Human Play V5

on:
  push:
    branches:
      - feature/human-play-loop-v5

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-play-loop-v5
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Human Play V5
        run: python scripts/apply_human_play_v5.py

      - name: Compile changed Python
        run: |
          python -m py_compile \
            game/inactive_autoplay.py \
            tests/test_living_universe_gc2622.py \
            tests/test_human_play_loop_v5.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Focused Human Play V5 tests
        run: |
          pytest -q \
            tests/test_human_play_loop_v5.py \
            tests/test_living_universe_gc2622.py \
            tests/test_inactive_autoplay.py

      - name: Commit deployable patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: humanize dormant commander play loop"
          git push origin HEAD:feature/human-play-loop-v5
