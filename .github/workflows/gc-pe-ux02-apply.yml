name: GC PE UX02 Apply

on:
  push:
    branches: [ux/pe-decision-first]

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: pe-ux02-not-for-production
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/pe-decision-first
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Apply product patch
        run: python scripts/_tmp_apply_pe_ux02.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Planet Evolution clarity regression gate
        shell: bash
        run: |
          python -m pytest -q --tb=line tests/test_gc_pe_clarity.py
          python -m pytest -q --tb=line tests/test_planet_evolution_dashboard.py -k "not test_trait_effect_lines_from_definitions and not test_trait_effect_lines_include_blocks"
          git diff --check
      - name: Commit product diff and remove temporary executor
        shell: bash
        run: |
          rm -f scripts/_tmp_apply_pe_ux02.py .github/workflows/gc-pe-ux02-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(pe): make evolution dashboard decision-first"
          git push origin HEAD:ux/pe-decision-first
