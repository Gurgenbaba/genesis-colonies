          for lang, labels in failure_labels.items():
              translations[lang].update({f'pe_failure_{k}':v for k,v in zip(failure_keys,labels)})

          expected=set(translations['en'])
          for lang,data in translations.items():
              if set(data)!=expected: raise SystemExit(f'locale key mismatch in patch data: {lang}')
              p=Path('locales')/f'{lang}.json'; text=p.read_text(encoding='utf-8'); parsed=json.loads(text)
              dup=expected.intersection(parsed)
              if dup: raise SystemExit(f'locale keys already exist in {lang}: {sorted(dup)[:3]}')
              idx=text.rfind('\n}')
              if idx<0: raise SystemExit(f'bad locale tail {lang}')
              insertion=',\n' + ',\n'.join('  '+json.dumps(k,ensure_ascii=False)+': '+json.dumps(v,ensure_ascii=False) for k,v in data.items())
              p.write_text(text[:idx]+insertion+text[idx:],encoding='utf-8')
          PY
          python /tmp/apply_pe_clarity_ui.py

          cat >> tests/test_gc_pe_clarity.py <<'PYTEST'

          def test_planet_evolution_template_exposes_impact_before_actions():
              from pathlib import Path
              src=(Path(__file__).resolve().parents[1]/'templates'/'planet_evolution.html').read_text(encoding='utf-8')
              assert 'macro pe_impact_contract' in src
              assert 'pe-tech-impact-inline' in src
              assert 'pe-policy-option-card' in src
              assert 'pe-event-choice-card' in src
              assert 'pe_impact_contract(card.impact, true)' in src
              assert 'pe-crisis-clarity' in src
              assert 'pe_hero_current_research_xp' not in src
              assert 'pe_activity_xp_expedition_progress' not in src


          def test_impact_locale_contract_has_exact_parity():
              from pathlib import Path
              import json
              root=Path(__file__).resolve().parents[1]/'locales'
              langs=('de','en','fr','es','pl','tr','ru','pt')
              payloads={lang:json.loads((root/f'{lang}.json').read_text(encoding='utf-8')) for lang in langs}
              keys={k for k in payloads['en'] if k.startswith('pe_impact_') or k.startswith('pe_crisis_clarity_') or k.startswith('pe_failure_')}
              assert keys
              for lang in langs:
                  assert keys.issubset(payloads[lang])
                  assert all(str(payloads[lang][k]).strip() for k in keys)
          PYTEST
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: UI, locale and PE regression gate
        shell: bash
        run: |
          python -m py_compile game/planet_evolution/impact.py
          python scripts/audit_locale_keys.py
          python scripts/audit_visible_i18n.py --locales-only
          python -m pytest -q tests/test_gc_pe_clarity.py tests/test_i18n_hardening.py
          python -m pytest -q tests/test_planet_evolution_dashboard.py -k "not test_trait_effect_lines_from_definitions and not test_trait_effect_lines_include_blocks"
          git diff --check
      - name: Commit UI and remove helper
        shell: bash
        run: |
          rm -f .github/workflows/gc-pe-clarity-ui-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/planet_evolution/impact.py templates/planet_evolution.html static/style.css locales/de.json locales/en.json locales/fr.json locales/es.json locales/pl.json locales/tr.json locales/ru.json locales/pt.json tests/test_gc_pe_clarity.py .github/workflows/gc-pe-clarity-ui-apply.yml
          git commit -m "feat(pe): show gameplay impact before evolution actions"
          git push origin HEAD:feature/planet-evolution-clarity
