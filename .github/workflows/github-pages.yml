# Optional canonical Pages workflow — enable via:
# Settings → Pages → Build and deployment → Source: GitHub Actions → this workflow.
#
# The default branch-based Pages workflow (pages-build-deployment) cannot set a
# deploy timeout; this workflow uses timeout-minutes: 30 to avoid 10m infra timeouts.
name: GitHub Pages (GitHub Actions source)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
