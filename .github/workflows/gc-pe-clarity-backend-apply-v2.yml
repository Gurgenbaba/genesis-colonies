name: GC PE Clarity Backend Apply V2

on:
  push:
    branches: [feature/planet-evolution-clarity]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: '0'
      SECRET_KEY: ci-pe-clarity-not-for-production
      GC_SKIP_MIGRATION_CHECK: '1'
      GC_EMBEDDED_CRON: '0'
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/planet-evolution-clarity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Reuse fail-closed patch recipe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/gc-pe-clarity-backend-apply.yml').read_text(encoding='utf-8').splitlines()
          def extract(start_marker, end_marker):
              out=[]; active=False
              for line in src:
                  stripped=line.strip()
                  if not active and start_marker in stripped:
                      active=True
                      continue
                  if active and stripped == end_marker:
                      break
                  if active:
                      out.append(line[10:] if line.startswith('          ') else line)
              if not out:
                  raise SystemExit(f'could not extract {start_marker}')
              return '\n'.join(out) + '\n'
          Path('/tmp/apply_pe_clarity.py').write_text(extract("cat > /tmp/apply_pe_clarity.py <<'PY'", 'PY'), encoding='utf-8')
          Path('tests/test_gc_pe_clarity.py').write_text(extract("cat > tests/test_gc_pe_clarity.py <<'PYTEST'", 'PYTEST'), encoding='utf-8')
          PY
          python /tmp/apply_pe_clarity.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Focused PE clarity regression
        run: |
          python -m py_compile \
            game/planet_evolution/impact.py \
            game/planet_evolution/events.py \
            game/planet_evolution/failures.py \
            game/planet_evolution/culture.py \
            game/planet_evolution/dashboard.py \
            game/planet_evolution/ascension.py \
            game/planet_evolution/service.py
          python -m pytest -q \
            tests/test_gc_pe_clarity.py \
            tests/test_planet_evolution_dashboard.py \
            tests/test_planet_evolution.py \
            tests/test_planet_instancing.py \
            -k "not test_trait_effect_lines_from_definitions and not test_trait_effect_lines_include_blocks and not test_colonize_planet_never_overflows_dna_seed and not test_main_js_planet_research_cancel_ui"
          git diff --check
      - name: Commit backend contract and remove helpers
        shell: bash
        run: |
          rm -f \
            .github/workflows/gc-pe-clarity-backend-apply.yml \
            .github/workflows/gc-pe-clarity-backend-apply-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            game/planet_evolution/impact.py \
            game/planet_evolution/events.py \
            game/planet_evolution/failures.py \
            game/planet_evolution/culture.py \
            game/planet_evolution/dashboard.py \
            game/planet_evolution/ascension.py \
            game/planet_evolution/service.py \
            tests/test_gc_pe_clarity.py \
            .github/workflows/gc-pe-clarity-backend-apply.yml \
            .github/workflows/gc-pe-clarity-backend-apply-v2.yml
          git commit -m "feat(pe): expose canonical action impact previews"
          git push origin HEAD:feature/planet-evolution-clarity
