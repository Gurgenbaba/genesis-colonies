name: WAR-02 focused gate

on:
  push:
    branches:
      - feature/alliance-war-meta

permissions:
  contents: write

jobs:
  war02:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-war02-secret-key-not-for-production-use
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alliance-war-meta
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Compile WAR-02 paths
        run: |
          python -m py_compile game/alliance_war.py game/alliance.py game/messages.py
          node --check static/js/messages.js
          git diff --check
      - name: WAR-02 regression suite
        run: |
          python -m pytest -q --tb=line \
            tests/test_alliance_war_meta.py \
            tests/test_alliance.py \
            tests/test_combat.py
      - name: Remove temporary focused gate
        run: rm -f .github/workflows/war02-gate.yml
      - name: Commit gate cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove WAR-02 focused gate"
          git push origin HEAD:feature/alliance-war-meta
