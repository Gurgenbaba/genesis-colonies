name: GC I18N Hardening Apply

on:
  push:
    branches: [feature/gc-i18n-hardening]

permissions:
  contents: write

concurrency:
  group: gc-i18n-hardening-apply
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gc-i18n-hardening
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Repair legacy Story Ark placeholders
        run: python scripts/gc_i18n_fix_story_placeholders.py

      - name: Verify diff
        run: git diff --check

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- locales; then
            echo "No locale repairs needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add locales/*.json
          git commit -m "fix(i18n): preserve Story Ark amount placeholders"
          git push origin HEAD:feature/gc-i18n-hardening
