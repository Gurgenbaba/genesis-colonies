name: Apply WB performance hotfix

on:
  push:
    branches:
      - hotfix/perf-wb-news-state

permissions:
  contents: write

jobs:
  apply-hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('app.py')
          app = app_path.read_text(encoding='utf-8')

          old_auto = '''    state, _ = _build_game_state_payload(\n        include_panel=True,\n        finish_source="api_world_boss_auto_attack",\n    )'''
          new_auto = '''    # GC-PERF-WB-HOT-010: the mutation already committed authoritative WB state.\n    # The response only needs the global HUD/action slice; do not finish queues,\n    # materialize resources, or rebuild page catalogs a second time.\n    state, _ = _build_game_state_payload(\n        include_panel=False,\n        finish_source="api_world_boss_auto_attack",\n        action_slim=True,\n        post_mutation_committed=bool(result.get("ok")),\n    )'''
          if app.count(old_auto) != 1:
              raise SystemExit(f'auto-attack state block match count={app.count(old_auto)}')
          app = app.replace(old_auto, new_auto, 1)

          old_claim = '''    state, _ = _build_game_state_payload(\n        include_panel=True,\n        finish_source="api_world_boss_claim",\n    )'''
          new_claim = '''    # GC-PERF-WB-HOT-010: claim already owns and commits the reward mutation.\n    # Reconcile the shell through the canonical post-mutation read path instead\n    # of paying another empire queue/resource finish before returning the click.\n    state, _ = _build_game_state_payload(\n        include_panel=False,\n        finish_source="api_world_boss_claim",\n        action_slim=True,\n        post_mutation_committed=bool(result.get("ok")),\n    )'''
          if app.count(old_claim) != 1:
              raise SystemExit(f'claim state block match count={app.count(old_claim)}')
          app = app.replace(old_claim, new_claim, 1)
          app_path.write_text(app, encoding='utf-8')

          news_path = Path('game/universe_news.py')
          news = news_path.read_text(encoding='utf-8')
          start = news.index('def sidebar_release_nav(*, conn: sqlite3.Connection | None = None) -> Dict[str, Any]:')
          new_func = '''def sidebar_release_nav(*, conn: sqlite3.Connection | None = None) -> Dict[str, Any]:\n    """Label + deep-link for sidebar version chip → Genesis Timeline (/news).\n\n    GC-PERF-WB-HOT-010: this shell helper needs release metadata only. The old\n    500-row news path localized every World-Boss news row, and each localization\n    loaded its event again. With a large LiveOps history that turned one shell\n    render into ~500 identical ``get_event_by_id`` queries. Read the tiny version\n    metadata set directly; full localization remains owned by /news.\n    """\n    own = conn is None\n    if own:\n        conn = db()\n    try:\n        ensure_legacy_motd_migrated(conn)\n        rows = conn.execute(\n            """\n            SELECT version_tag, is_major_release\n            FROM universe_news\n            WHERE is_draft = 0\n              AND audience = ?\n              AND TRIM(COALESCE(version_tag, '')) <> ''\n              AND COALESCE(category, '') <> 'EVENT'\n              AND COALESCE(source_ref, '') NOT LIKE 'world_boss:%'\n              AND COALESCE(source_ref, '') NOT LIKE 'pirate%'\n            ORDER BY published_at DESC, id DESC\n            LIMIT 500;\n            """,\n            (AUDIENCE_PLAYER,),\n        ).fetchall()\n\n        published = [\n            {\n                "version_tag": str(row["version_tag"] or "").strip(),\n                "is_major_release": bool(int(row["is_major_release"] or 0)),\n            }\n            for row in rows\n        ]\n        has_dev_stream = False\n\n        major_tags: List[Tuple[Tuple[int, int, str], str]] = []\n        for row in published:\n            version_tag = str(row.get("version_tag") or "").strip()\n            if row.get("is_major_release") and version_tag:\n                major_tags.append((_version_sort_key(version_tag), version_tag))\n\n        label = ""\n        anchor_id = ""\n        version_tag = ""\n\n        if major_tags:\n            major_tags.sort(key=lambda item: item[0], reverse=True)\n            version_tag = major_tags[0][1]\n            label = _format_sidebar_version_label(version_tag)\n            anchor_id = f"version-{version_tag.replace('.', '-')}"\n        elif published:\n            version_tags = sorted(\n                {str(row.get("version_tag") or "").strip() for row in published if row.get("version_tag")},\n                key=_version_sort_key,\n                reverse=True,\n            )\n            if version_tags:\n                version_tag = version_tags[0]\n                label = _format_sidebar_version_label(version_tag)\n                if version_tag:\n                    anchor_id = f"version-{version_tag.replace('.', '-')}"\n\n        if not label:\n            label = _player_release_fallback_label()\n            fallback_tag = str(_latest_changelog_version() or "").strip()\n            if fallback_tag:\n                version_tag = fallback_tag\n                anchor_id = f"version-{fallback_tag.replace('.', '-')}"\n\n        news_url = "/news"\n        href = f"{news_url}#{anchor_id}" if anchor_id else news_url\n        return {\n            "label": label,\n            "version_tag": version_tag,\n            "url": news_url,\n            "href": href,\n            "anchor_id": anchor_id,\n            "has_dev_stream": has_dev_stream,\n        }\n    finally:\n        if own:\n            conn.close()\n'''
          news = news[:start] + new_func
          news_path.write_text(news, encoding='utf-8')

          test_path = Path('tests/test_gc_perf_wb_hot_010.py')
          test_path.write_text('''from pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\n\ndef _read(path: str) -> str:\n    return (ROOT / path).read_text(encoding="utf-8")\n\ndef _route_block(src: str, marker: str, next_marker: str) -> str:\n    return src.split(marker, 1)[1].split(next_marker, 1)[0]\n\ndef test_world_boss_auto_attack_uses_post_mutation_slim_state():\n    src = _read("app.py")\n    block = _route_block(src, "def api_world_boss_auto_attack():", "def api_world_boss_claim():")\n    assert "include_panel=False" in block\n    assert "action_slim=True" in block\n    assert 'post_mutation_committed=bool(result.get("ok"))' in block\n    assert "include_panel=True" not in block\n\ndef test_world_boss_claim_uses_post_mutation_slim_state():\n    src = _read("app.py")\n    block = _route_block(src, "def api_world_boss_claim():", "def api_world_boss_catch():")\n    assert "include_panel=False" in block\n    assert "action_slim=True" in block\n    assert 'post_mutation_committed=bool(result.get("ok"))' in block\n    assert "include_panel=True" not in block\n\ndef test_sidebar_release_nav_never_localizes_500_liveops_rows():\n    src = _read("game/universe_news.py")\n    block = src.split("def sidebar_release_nav(", 1)[1]\n    assert "list_news(" not in block\n    assert "SELECT version_tag, is_major_release" in block\n    assert "world_boss:%" in block\n    assert "pirate%" in block\n    assert "LIMIT 500" in block\n''', encoding='utf-8')

          version = Path('VERSION')
          current = version.read_text(encoding='utf-8').strip()
          if current != '0.5.9.160':
              raise SystemExit(f'unexpected VERSION {current!r}')
          version.write_text('0.5.9.161\n', encoding='utf-8')

          perf = Path('docs/PERFORMANCE.md')
          perf.write_text(perf.read_text(encoding='utf-8') + '''\n\n### GC-PERF-WB-HOT-010 — World Boss action reconcile + shell release N+1\n\nProduction spike evidence showed `api_world_boss_auto_attack` at ~4.1s and `api_world_boss_claim` at ~2.4–3.5s because both rebuilt a full game-state after their mutation had already committed. The same sample showed `admin_panel` executing the World-Boss event lookup **501×**: the persistent shell release chip loaded 500 news rows and localized each World-Boss row through `get_event_by_id()`.\n\n- Auto-Attack and Claim now use the same canonical `action_slim + post_mutation_committed` read path as instant World-Boss Attack: no second empire queue finish, resource materialization, or page catalog build after a successful mutation.\n- `sidebar_release_nav()` reads only release metadata in one SQL query and explicitly excludes LiveOps rows. Full localized World-Boss news remains owned by `/news` / banner rendering.\n- No gameplay formulas, reward ordering, queue authority, or World-Boss mutation semantics changed.\n''', encoding='utf-8')
          PY

      - name: Syntax and focused contract gate
        run: |
          python -m py_compile app.py game/universe_news.py tests/test_gc_perf_wb_hot_010.py
          python - <<'PY'
          from pathlib import Path
          app = Path('app.py').read_text(encoding='utf-8')
          auto = app.split('def api_world_boss_auto_attack():',1)[1].split('def api_world_boss_claim():',1)[0]
          claim = app.split('def api_world_boss_claim():',1)[1].split('def api_world_boss_catch():',1)[0]
          news = Path('game/universe_news.py').read_text(encoding='utf-8').split('def sidebar_release_nav(',1)[1]
          assert 'action_slim=True' in auto and 'post_mutation_committed=bool(result.get("ok"))' in auto
          assert 'action_slim=True' in claim and 'post_mutation_committed=bool(result.get("ok"))' in claim
          assert 'list_news(' not in news and 'world_boss:%' in news
          assert Path('VERSION').read_text().strip() == '0.5.9.161'
          print('GC-PERF-WB-HOT-010 static gate OK')
          PY

      - name: Commit hotfix and remove applier
        shell: bash
        run: |
          rm -f .github/workflows/hotfix_perf_wb_apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py game/universe_news.py tests/test_gc_perf_wb_hot_010.py docs/PERFORMANCE.md VERSION .github/workflows/hotfix_perf_wb_apply.yml
          git commit -m "perf: cut World Boss post-mutation and shell N+1"
          git push origin HEAD:hotfix/perf-wb-news-state
