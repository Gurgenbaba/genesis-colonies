services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      APP_ENV: production
      FLASK_ENV: production
      FLASK_DEBUG: "0"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env or shell}
      GC_DB_PATH: /data/game.db
    volumes:
      - gc_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  gc_data:
