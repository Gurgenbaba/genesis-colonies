# Smoke CI for Railway "Wait for CI" — keep this job fast and green on push to main.
# Full suite remains local / optional; focused feature gates run on pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-smoke-secret-key-not-for-production-use
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Smoke tests (deploy + cron)
        run: |
          python -m pytest -q --tb=line \
            tests/test_deployment.py tests/test_internal_cron.py tests/test_embedded_cron.py \
            tests/test_fleet_worker.py tests/test_gc_fleet_pg_abort_001.py tests/test_gc_perf_tk_005.py tests/test_gc_tk_atomic_delivery_001.py tests/test_gc_perf_fleet_write_001.py \
            tests/test_gc_perf_fleet_idle_001.py tests/test_gc_perf_fleet_tabs_001.py tests/test_gc_perf_fleet_logistics_readonly_002.py tests/test_gc_perf_fleet_shared_request_004.py tests/test_gc_perf_mass_expo_002.py tests/test_gc_perf_mass_expo_003.py tests/test_gc_perf_mass_expo_004.py tests/test_gc_perf_common_001.py tests/test_gc_perf_sql_hot_002.py tests/test_gc_pg_numeric_readiness_001.py tests/test_gc_pg_numeric_core_resources_a1.py tests/test_gc_pg_numeric_salvage_a2.py tests/test_gc_pg_numeric_resource_consumers_a3.py tests/test_gc_pg_numeric_money_amounts_b1.py tests/test_gc_pg_numeric_unit_amounts_b2.py tests/test_gc_pg_exact_paid_queue_snapshots_c1.py tests/test_gc_pg_numeric_p1_combat_progression.py tests/test_gc_pg_numeric_p1_stocks_troops.py tests/test_gc_pg_numeric_p1_planet_economy.py tests/test_gc_pg_schema_final_pass.py tests/test_gc_pg_numeric_final_no_max.py tests/test_world_boss_raid.py tests/test_gc_big_number_runtime_expeditions.py tests/test_gc_big_number_runtime_pirates.py tests/test_gc_big_number_runtime_planet_evolution.py tests/test_imperial_directives_scaling.py tests/test_imperial_directives_balancing.py tests/test_gc_big_number_runtime_directives.py tests/test_case_battles.py tests/test_gc_big_number_runtime_case_battles.py tests/test_gc_big_number_runtime_fleet.py tests/test_gc_big_number_runtime_stellar_forge.py tests/test_gc_big_number_runtime_production.py tests/test_gc_big_number_runtime_economy_curves.py tests/test_gc_ferro_l388_001.py tests/test_auction_house.py::test_auction_house_state_endpoint_uses_read_path_and_returns_200 tests/test_fleet_logistics.py::test_logistics_page_context_shows_funded_colony_resources tests/test_gc_perf_shipyard_catalog_001.py tests/test_shipyard.py::test_buildable_ships_by_level tests/test_gc_perf_state_006.py tests/test_gc_perf_state_007.py tests/test_gc_perf_state_008.py tests/test_gc_perf_state_009.py tests/test_gc_perf_state_010.py tests/test_gc_perf_state_011.py \
            tests/test_gc_perf_resource_persist_001.py tests/test_gc_perf_buildings_002.py tests/test_gc_flt_scope_001.py \
            tests/test_gc_mine_ascension_nexus_001.py tests/test_gc_effect_cache_conn_001.py tests/test_nexus_building_caps.py tests/test_ascension_queue_cap_contract.py \
            tests/test_mine_evolution.py::TestMineEvolutionCaps tests/test_mine_evolution.py::TestMineEvolutionAction::test_build_queue_max_stops_at_next_ascension_gate \
            tests/test_effects.py::TestBuildingEffects::test_geothermal_boosts_solar_and_max_levels tests/test_effects.py::TestBuildingEffects::test_geothermal_and_core_stack_max_levels \
            tests/test_gc_perf_002_nav_latency.py tests/test_gc_nav_fleet_readonly_001.py \
            tests/test_gc_perf_174_sentinel_nav_matrix.py \
            tests/test_gc_pjax_resilience.py tests/test_gc861b_pjax_lcp_preload.py \
            tests/test_gc_pg_175_planet_context_hot_row.py \
            tests/test_gc_pg_142_presence_pool_starvation.py \
            tests/test_gc_pg_166_presence_secondary.py \
            tests/test_gc_pg_167_autoplay_admin_presence.py \
            tests/test_gc_pg_168_vote_presence.py \
            tests/test_gc_pg_169_pirate_target_presence.py \
            tests/test_gc_pg_170_admin_legacy_presence.py \
            tests/test_gc_pg_171_presence_history_backfill.py \
            tests/test_inactive_storage_boost.py \
            tests/test_gc_pg_world_boss_readonly_payload.py \
            tests/test_gc_pg_shipyard_single_request_conn.py \
            tests/test_gc_pg_defense_single_request_conn.py \
            tests/test_gc_pg_world_boss_single_request_conn.py \
            tests/test_gc_pg_empire_readonly_single_conn.py \
            tests/test_gc_pg_schema_ready_connection_leaks.py \
            tests/test_gc_pg_imperial_directives_single_conn.py \
            tests/test_gc_pg_trader_hub_single_conn.py \
            tests/test_gc_pg_prod_regressions_161.py \
            tests/test_galactic_diplomacy.py::test_ensure_get_set_galaxy_personality \
            tests/test_commander_classes.py::test_linear_gate_and_sp_unlock \
            tests/test_commander_classes.py::test_effect_resolver_includes_class_mods \
            tests/test_inventory_booster_visibility.py::test_use_duration_booster_creates_active_entry \
            tests/test_inventory_booster_visibility.py::test_production_booster_tier_ladder_25_then_50

  big-score:
    name: big-score-ranking
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-big-score-secret-key-not-for-production-use
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Compile and browser syntax
        run: |
          python -m py_compile app.py game/ws_hub.py game/ranking.py game/scoring.py game/number_format.py game/pirates/threat.py game/fleet.py game/live_state.py game/perf_intel.py game/db_pg.py game/shipyard.py game/buildings.py game/models.py game/queue_refund.py game/effects/effect_resolver.py game/production_formula.py game/economy_balance.py game/exact_math.py game/mine_evolution/formulas.py game/mine_evolution/service.py game/timekeeper.py game/inventory_use.py game/json_transport.py game/world_boss.py game/world_boss_companions.py game/inactive_autoplay.py game/pirates/bases.py game/combat_hof.py game/directives/progress.py game/directives/generator.py game/case_battles.py game/troops.py scripts/pg_numeric_readiness_audit.py
          node --check static/main.js
          node --check static/admin.js
          node --check static/js/core/gc.js
          node --check static/js/pages/shipyard.js
          node --check static/js/pages/defense.js
          node --check static/js/ranking_page.js
          git diff --check
      - name: Big-score regression suite
        run: |
          python -m pytest -q --tb=line \
            tests/test_ranking.py tests/test_number_format.py tests/test_playercard_exact_scores.py tests/test_noob_protection.py \
            tests/test_big_score_migration.py \
            tests/test_gc622_integer_overflow.py::TestGC622SchemaTypes::test_player_scores_use_decimal_text \
            tests/test_gc622_integer_overflow.py::TestGC622Ranking \
            tests/test_gc_js_safe_integer_transport_d1.py

  i18n:
    name: i18n-hardening
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-i18n-secret-key-not-for-production-use
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Locale key and translation audit (all 8 languages)
        run: |
          python scripts/audit_locale_keys.py
          python scripts/audit_visible_i18n.py --locales-only
      - name: I18N regression tests
        run: |
          python -m pytest -q --tb=line tests/test_gc900_multilanguage.py tests/test_i18n_hardening.py
      - name: Full visible raw-string inventory (advisory)
        run: python scripts/audit_visible_i18n.py --raw-only --report-only --max-findings 120
      - name: Block newly introduced player-facing raw strings
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then BASE="${{ github.event.pull_request.base.sha }}"; else BASE="${{ github.event.before }}"; fi
          python scripts/audit_visible_i18n.py --raw-only --diff-base "$BASE" --max-findings 200
