name: GC PERF 173 Navigation Measurement Apply

on:
  push:
    branches:
      - perf/pg-173-nav-measurement-contract

concurrency:
  group: gc-perf-173-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GC_SKIP_MIGRATION_CHECK: '1'
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/pg-173-nav-measurement-contract
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Apply measurement contract
        run: python scripts/apply_gc_pg_173_nav_measurement.py
      - name: Run navigation regressions
        run: |
          python -m pytest -q \
            tests/test_gc_perf_002_nav_latency.py \
            tests/test_gc_request_perf_trace.py
          python -m py_compile game/live_state.py
          node --check static/main.js
          git diff --check
      - name: Commit validated production patch
        run: |
          rm scripts/apply_gc_pg_173_nav_measurement.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            game/live_state.py static/main.js \
            tests/test_gc_perf_002_nav_latency.py \
            scripts/apply_gc_pg_173_nav_measurement.py
          git commit -m 'perf(nav): expose machine-readable PJAX timings'
          git push origin HEAD:perf/pg-173-nav-measurement-contract
