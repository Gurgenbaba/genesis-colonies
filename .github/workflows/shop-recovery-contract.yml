name: Shop Recovery Contract

on:
  pull_request:
    paths:
      - "game/shop.py"
      - "game/shop_recovery.py"
      - "scripts/recover_paid_shop_orders.py"
      - "scripts/repair_verified_paid_shop_order.py"
      - "tests/test_gc_prod_shop_fulfillment_hardening.py"
      - "tests/test_gc_verified_paid_shop_recovery.py"
      - ".github/workflows/shop-recovery-contract.yml"
  push:
    branches:
      - main
    paths:
      - "game/shop.py"
      - "game/shop_recovery.py"
      - "scripts/recover_paid_shop_orders.py"
      - "scripts/repair_verified_paid_shop_order.py"
      - "tests/test_gc_prod_shop_fulfillment_hardening.py"
      - "tests/test_gc_verified_paid_shop_recovery.py"
      - ".github/workflows/shop-recovery-contract.yml"

permissions:
  contents: read

jobs:
  recovery-contract:
    runs-on: ubuntu-24.04
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-shop-recovery-secret-key-not-for-production-use
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Compile recovery code
        run: |
          python -m py_compile game/shop_recovery.py scripts/repair_verified_paid_shop_order.py
          git diff --check
      - name: Paid-order recovery contracts
        run: |
          python -m pytest -q --tb=line \
            tests/test_gc_prod_shop_fulfillment_hardening.py \
            tests/test_gc_verified_paid_shop_recovery.py
