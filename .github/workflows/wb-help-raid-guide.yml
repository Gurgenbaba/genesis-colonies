name: WB Help Raid Guide

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/world-boss-help-raid-guide
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply raid help guide
        run: python scripts/_apply_wb_help_raid_guide.py

      - name: Validate locale JSON and key parity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('locales').glob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          print('All locale JSON files parse.')
          PY
          python scripts/check_locale_keys.py

      - name: Commit generated product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/world_boss.html locales/de.json locales/en.json locales/fr.json locales/es.json locales/pl.json locales/tr.json locales/ru.json locales/pt.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "docs(world-boss): explain community raid mechanics in help"
          git push origin HEAD:hotfix/world-boss-help-raid-guide
