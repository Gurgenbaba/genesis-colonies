name: Apply No Scientific UI Hotfix

on:
  push:
    branches: [hotfix/no-scientific-ui]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/no-scientific-ui
          fetch-depth: 0

      - name: Patch canonical JS number formatter
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('static/main.js')
          source = path.read_text(encoding='utf-8')

          old_helper = '''  function _scientificBigInt(abs, negative) {
    const digits = abs.toString();
    let fraction = digits.slice(1, 3).replace(/0+$/, "");
    const mantissa = fraction ? `${digits[0]},${fraction}` : digits[0];
    return `${negative ? "-" : ""}${mantissa}e${digits.length - 1}`;
  }

'''
          if old_helper in source:
              source = source.replace(old_helper, '', 1)
          elif '_scientificBigInt' in source:
              raise SystemExit('unexpected _scientificBigInt helper shape')

          old_fallback = '''    if (exact === null) {
      const num = parseIntNumber(n);
      if (Math.abs(num) < Number(COMPACT_THRESHOLD)) return formatNumber(num);
      return formatNumberCompact(String(Math.trunc(num)));
    }
'''
          new_fallback = '''    if (exact === null) {
      const num = parseIntNumber(n);
      if (!Number.isFinite(num)) return "0";
      if (Math.abs(num) < Number(COMPACT_THRESHOLD)) return formatNumber(num);
      return formatNumberCompact(BigInt(Math.trunc(num)));
    }
'''
          if old_fallback not in source:
              if new_fallback not in source:
                  raise SystemExit('formatNumberCompact fallback shape changed')
          else:
              source = source.replace(old_fallback, new_fallback, 1)

          old_high = '    if (abs >= 1_000_000_000_000_000_000_000_000_000_000_000n) return _scientificBigInt(abs, negative);'
          new_high = '    if (abs >= 1_000_000_000_000_000_000_000_000_000_000_000n) return _deIntFormatter.format(exact);'
          if old_high in source:
              source = source.replace(old_high, new_high, 1)
          elif new_high not in source:
              raise SystemExit('high-value compact fallback shape changed')

          if '_scientificBigInt' in source:
              raise SystemExit('scientific BigInt formatter still present')
          if 'toExponential(' in source or 'toPrecision(' in source:
              raise SystemExit('explicit scientific formatter present in main.js')

          path.write_text(source, encoding='utf-8')
          PY

          node --check static/main.js
          python -m py_compile game/number_format.py
          git diff --check

      - name: Commit JS hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/main.js
          if git diff --cached --quiet; then
            echo "No JS changes to commit."
            exit 0
          fi
          git commit -m "fix: remove scientific notation from client formatter"
          git push origin HEAD:hotfix/no-scientific-ui
