name: GC World Boss Poll Consolidation

on:
  push:
    branches:
      - perf/world-boss-poll-consolidate
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize one-shot cooldown refresh
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('static/main.js')
          src = main.read_text(encoding='utf-8')
          old = 'const wbFlushAutoUntilFired = (card, { attemptsLeft = 12 } = {}) => {'
          new = 'const wbFlushAutoUntilFired = (card, { attemptsLeft = 1 } = {}) => {'
          if old in src:
              assert src.count(old) == 1, src.count(old)
              src = src.replace(old, new, 1)
              main.write_text(src, encoding='utf-8')
          else:
              assert new in src, 'World Boss cooldown refresh signature not found'

          test = Path('tests/test_gc_world_boss_poll_perf.py')
          text = test.read_text(encoding='utf-8')
          marker = 'def test_world_boss_cooldown_refresh_is_one_shot():'
          if marker not in text:
              text += '''\n\ndef test_world_boss_cooldown_refresh_is_one_shot():\n    js = _main_js()\n    assert 'const wbFlushAutoUntilFired = (card, { attemptsLeft = 1 } = {}) =>' in js\n    assert 'const wbFlushAutoUntilFired = (card, { attemptsLeft = 12 } = {}) =>' not in js\n'''
              test.write_text(text, encoding='utf-8')
          PY
      - name: World Boss regressions
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          pytest -q tests/test_gc_world_boss_poll_perf.py tests/test_world_boss.py
      - name: Commit materialized fix
        run: |
          if git diff --quiet -- static/main.js tests/test_gc_world_boss_poll_perf.py; then
            echo "No materialization changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/main.js tests/test_gc_world_boss_poll_perf.py
          git commit -m "perf(world-boss): stop cooldown refresh retry storm"
          git push origin HEAD:perf/world-boss-poll-consolidate
