# Railway deploy config — https://docs.railway.com/reference/config-as-code
[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
# Migrations run automatically in scripts/docker-entrypoint.sh (main container + /data volume).
# Includes 020_player_messages.sql and all pending *.sql — no manual shell needed.
# Do NOT use preDeployCommand — that container cannot mount Railway volumes.
#
# Optional: Ranking batch (10 min) — HTTP cron on the web service (same SQLite volume).
#   POST /api/internal/cron/ranking
#   Authorization: Bearer $GC_INTERNAL_CRON_TOKEN
#   Schedule: external HTTP cron every 10 min (e.g. cron-job.org, UptimeRobot).
# Do NOT run scripts/run_ranking_worker.py as a separate Railway service on SQLite.
