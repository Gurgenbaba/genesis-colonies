name: TMP WB Fastlane

on:
  push:
    branches:
      - hotfix/world-boss-action-fastlane

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Apply patch
        run: python .github/tmp_wb_fastlane_patch.py
      - name: Focused gates
        run: |
          python -m py_compile app.py
          node --check static/main.js
          pytest -q tests/test_gc_perf_wb_hot_010.py tests/test_gc_perf_wb_hot_012.py
          git diff --check
      - name: Commit hotfix and remove temporary runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/tmp_wb_fastlane_patch.py .github/workflows/tmp-wb-inspect.yml
          git add -A
          git diff --cached --check
          git commit -m "perf: fastlane World Boss action responses"
          git push
