name: GC Autoplay V3 Patch

on:
  push:
    branches:
      - feature/inactive-autoplay-living-universe-v3

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/inactive-autoplay-living-universe-v3
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply GC-2621 living universe patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('game/inactive_autoplay.py')
          text = p.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f'missing patch anchor: {label}')
              text = text.replace(old, new, 1)

          replace_once(
              'import json\nimport logging\n',
              'import hashlib\nimport json\nimport logging\n',
              'hashlib import',
          )

          replace_once(
              'INACTIVE_CHAIN_LIMIT = 1\n\n# Soft floor so empty dormant empires can enqueue (far below pirate seed).\n',
              '''INACTIVE_CHAIN_LIMIT = 1\n\n# GC-2621 — Living Universe V3. Inactive humans make one progression decision\n# at a time and keep a stable-but-varied personal cadence. This spreads ranking\n# growth without increasing the global SQLite writer budget.\nINACTIVE_ACTION_DOMAINS = ("building", "research", "defense")\nINACTIVE_ACTION_WEIGHTS = {\n    "economy": {"building": 65, "research": 25, "defense": 10},\n    "aggressive": {"building": 40, "research": 25, "defense": 35},\n    "turtle": {"building": 45, "research": 15, "defense": 40},\n    "spy": {"building": 35, "research": 50, "defense": 15},\n    "swarm": {"building": 45, "research": 25, "defense": 30},\n    "elite": {"building": 45, "research": 35, "defense": 20},\n}\nINACTIVE_ACTION_PACE_RANGES_SEC = {\n    "aggressive": (5 * 60, 14 * 60),\n    "swarm": (6 * 60, 16 * 60),\n    "elite": (8 * 60, 20 * 60),\n    "economy": (10 * 60, 24 * 60),\n    "spy": (12 * 60, 28 * 60),\n    "turtle": (15 * 60, 35 * 60),\n}\n# Token participation only: one instant strike per active boss and inactive\n# commander. Never attack during the final 5% so autoplay cannot steal a kill.\nINACTIVE_WORLD_BOSS_SAFE_HP_RATIO = 0.05\n\n# Soft floor so empty dormant empires can enqueue (far below pirate seed).\n''',
              'living universe constants',
          )

          anchor = '''def online_visible_cap(*, conn=None, now: Optional[float] = None) -> int:\n    """GC-INACTIVE-SHIFT-001: shift size (== visible online)."""\n    return shift_cap(now=now, conn=conn)\n\n\n'''
          helpers = '''def online_visible_cap(*, conn=None, now: Optional[float] = None) -> int:\n    """GC-INACTIVE-SHIFT-001: shift size (== visible online)."""\n    return shift_cap(now=now, conn=conn)\n\n\ndef _stable_roll(player_id: int, namespace: str, sequence: int, modulo: int) -> int:\n    """Process-stable deterministic roll; never use Python's salted hash()."""\n    cap = max(1, int(modulo))\n    payload = f"inactive:{namespace}:{int(player_id)}:{int(sequence)}".encode("utf-8")\n    digest = hashlib.sha256(payload).hexdigest()\n    return int(digest[:16], 16) % cap\n\n\ndef _action_domain_for_player(player_id: int, personality: str, action_seq: int) -> str:\n    """Weighted progression domain for one decision; stable for this sequence."""\n    weights = INACTIVE_ACTION_WEIGHTS.get(str(personality)) or INACTIVE_ACTION_WEIGHTS["economy"]\n    total = sum(max(0, int(weights.get(domain) or 0)) for domain in INACTIVE_ACTION_DOMAINS)\n    if total <= 0:\n        return "building"\n    roll = _stable_roll(int(player_id), "domain", int(action_seq), total)\n    cursor = 0\n    for domain in INACTIVE_ACTION_DOMAINS:\n        cursor += max(0, int(weights.get(domain) or 0))\n        if roll < cursor:\n            return domain\n    return "building"\n\n\ndef _next_action_delay_sec(player_id: int, personality: str, action_seq: int) -> int:\n    """Individual 5–35 minute cadence so dormant empires do not move in lockstep."""\n    low, high = INACTIVE_ACTION_PACE_RANGES_SEC.get(\n        str(personality), INACTIVE_ACTION_PACE_RANGES_SEC["economy"]\n    )\n    low_i, high_i = max(60, int(low)), max(int(low), int(high))\n    span = max(1, high_i - low_i + 1)\n    return low_i + _stable_roll(int(player_id), "pace", int(action_seq), span)\n\n\n'''
          replace_once(anchor, helpers, 'action helpers')

          # Persist cadence state inside the existing runtime-state roster JSON; no migration.\n          text = text.replace(
              '"defense_done": int(item.get("defense_done") or 0),\n',
              '"defense_done": int(item.get("defense_done") or 0),\n                    "action_seq": int(item.get("action_seq") or 0),\n                    "next_action_at": item.get("next_action_at"),\n',
          )

          replace_once(
              '''def _run_player_economy(\n    conn,\n    player_id: int,\n    *,\n    now: float,\n    is_wake: bool = False,\n) -> Dict[str, Any]:\n''',
              '''def _run_player_economy(\n    conn,\n    player_id: int,\n    *,\n    now: float,\n    is_wake: bool = False,\n    action_seq: int = 0,\n    next_action_at: Optional[float] = None,\n) -> Dict[str, Any]:\n''',
              'economy signature',
          )

          start = text.index('def _run_player_economy(')
          end = text.index('\ndef get_roster_snapshot', start)
          new_run = r'''def _weakest_combat_ship_for_player(\n    conn,\n    player_id: int,\n    planets: Sequence[Mapping[str, Any]],\n) -> Optional[Dict[str, Any]]:\n    """Return exactly one weakest combat-capable hangar ship across owned planets."""\n    from .combat_models import combat_stats_for_ship\n    from .fleet import get_planet_ships\n\n    best: Optional[Tuple[int, str, int]] = None\n    for planet in planets:\n        planet_id = int(planet.get("id") or 0)\n        if planet_id <= 0:\n            continue\n        hangar = get_planet_ships(planet_id, conn=conn)\n        for ship_key, amount in dict(hangar or {}).items():\n            if int(amount or 0) <= 0:\n                continue\n            stats = combat_stats_for_ship(str(ship_key))\n            if stats is None or int(stats.attack or 0) <= 0:\n                continue\n            candidate = (int(stats.attack or 0), str(ship_key), planet_id)\n            if best is None or candidate < best:\n                best = candidate\n    if best is None:\n        return None\n    return {"planet_id": int(best[2]), "ships": {str(best[1]): 1}}\n\n\ndef _maybe_join_world_boss(\n    conn,\n    player_id: int,\n    planets: Sequence[Mapping[str, Any]],\n    *,\n    now: float,\n) -> Dict[str, Any]:\n    """One low-impact token strike per active boss so the universe feels populated.\n\n    Uses the canonical instant World Boss attack owner. Ships remain in the hangar,\n    only one weakest combat ship is selected, and autoplay stays out of the final 5%\n    so dormant accounts cannot become accidental finishers.\n    """\n    try:\n        from .world_boss import (\n            can_player_attack_boss,\n            execute_instant_attack,\n            list_active_events,\n        )\n\n        events = list_active_events(conn=conn, now=float(now), limit=3)\n        if not events:\n            return {"ok": True, "joined": False, "reason": "no_active_boss"}\n        token_force = _weakest_combat_ship_for_player(conn, int(player_id), planets)\n        if not token_force:\n            return {"ok": True, "joined": False, "reason": "no_combat_ships"}\n\n        for event in events:\n            max_hp = max(1, int(event.get("max_hp") or 1))\n            hp_ratio = float(event.get("current_hp") or 0) / float(max_hp)\n            if hp_ratio <= float(INACTIVE_WORLD_BOSS_SAFE_HP_RATIO):\n                continue\n            ok_atk, _reason, meta = can_player_attack_boss(\n                int(player_id),\n                int(event["id"]),\n                conn=conn,\n                now=float(now),\n                enforce_cooldown=False,\n                check_inflight=False,\n            )\n            # One lifetime token wave per event. Existing manual participation wins.\n            if int((meta or {}).get("waves") or 0) > 0:\n                continue\n            if not ok_atk:\n                continue\n            strike = execute_instant_attack(\n                int(player_id),\n                int(event["id"]),\n                token_force["ships"],\n                planet_id=int(token_force["planet_id"]),\n                conn=conn,\n                now=float(now),\n                auto_select=False,\n                hit_mult=1,\n            )\n            if strike.get("ok"):\n                return {\n                    "ok": True,\n                    "joined": True,\n                    "event_id": int(event["id"]),\n                    "damage": int(strike.get("damage") or 0),\n                    "ships": dict(token_force["ships"]),\n                    "planet_id": int(token_force["planet_id"]),\n                }\n        return {"ok": True, "joined": False, "reason": "no_eligible_boss"}\n    except Exception:\n        logger.exception("inactive autoplay world boss participation failed player=%s", player_id)\n        return {"ok": False, "joined": False, "reason": "world_boss_error"}\n\n\ndef _run_player_economy(\n    conn,\n    player_id: int,\n    *,\n    now: float,\n    is_wake: bool = False,\n    action_seq: int = 0,\n    next_action_at: Optional[float] = None,\n) -> Dict[str, Any]:\n    """Run one serialized progression decision for a sticky-roster account."""\n    from .models import get_homeworld, get_planets_by_player\n\n    home = get_homeworld(player_id, conn=conn)\n    if not home:\n        return {"ok": False, "error": "no_homeworld", "player_id": player_id}\n\n    home_id = int(home["id"])\n    planets = get_planets_by_player(player_id, conn=conn) or [home]\n    personality = personality_for_player(player_id)\n    seq = max(0, int(action_seq or 0))\n\n    # Personal cadence blocks only *new* progression. We still run the canonical\n    # due-finisher so already queued work completes while this commander is idle.\n    if not is_wake and next_action_at is not None and float(now) < float(next_action_at):\n        maintenance = plan_passive_planet_tick(\n            conn,\n            player_id=player_id,\n            planet=home,\n            now=now,\n            is_home=True,\n            allow_buildings=False,\n            allow_research=False,\n            allow_ships=False,\n            allow_defense=False,\n            personality=personality,\n            source="inactive_autoplay",\n            update_scores=True,\n            chain_limit=1,\n            idle_chance=0.0,\n        )\n        fin = maintenance.get("finished") or {}\n        boss = _maybe_join_world_boss(conn, player_id, planets, now=now)\n        return {\n            "ok": True,\n            "player_id": player_id,\n            "economy": [maintenance],\n            "enqueued": False,\n            "finished": bool(fin),\n            "finished_totals": {\n                "buildings": int(fin.get("buildings") or 0),\n                "research": int(fin.get("research") or 0),\n                "defense": int(fin.get("defense") or 0),\n                "shipyard": int(fin.get("shipyard") or 0),\n            },\n            "last_action": None,\n            "personal_cooldown": True,\n            "next_action_at": float(next_action_at),\n            "action_seq": seq,\n            "boss_participation": boss,\n            "resource_floor": {},\n        }\n\n    floor = _ensure_resource_floor(conn, home_id)\n    action_domain = _action_domain_for_player(player_id, personality, seq)\n    idle_chance = 0.0 if is_wake else AUTOPLAY_STANDING_IDLE_CHANCE\n    result = plan_passive_planet_tick(\n        conn,\n        player_id=player_id,\n        planet=home,\n        now=now,\n        is_home=True,\n        allow_buildings=action_domain == "building",\n        allow_research=action_domain == "research",\n        allow_ships=False,\n        allow_defense=action_domain == "defense",\n        personality=personality,\n        build_duration_cap=INACTIVE_BUILD_DURATION_CAP,\n        research_duration_cap=INACTIVE_RESEARCH_DURATION_CAP,\n        source="inactive_autoplay",\n        update_scores=True,\n        chain_limit=INACTIVE_CHAIN_LIMIT,\n        idle_chance=idle_chance,\n    )\n    results = [result]\n    enqueued = bool(\n        result.get("build")\n        or result.get("research")\n        or result.get("defense")\n        or result.get("builds")\n        or result.get("researches")\n    )\n    fin = result.get("finished") or {}\n    delay = _next_action_delay_sec(player_id, personality, seq)\n    boss = _maybe_join_world_boss(conn, player_id, planets, now=now)\n    return {\n        "ok": True,\n        "player_id": player_id,\n        "economy": results,\n        "enqueued": enqueued,\n        "finished": bool(fin),\n        "finished_totals": {\n            "buildings": int(fin.get("buildings") or 0),\n            "research": int(fin.get("research") or 0),\n            "defense": int(fin.get("defense") or 0),\n            "shipyard": int(fin.get("shipyard") or 0),\n        },\n        "last_action": _describe_last_action(results),\n        "resource_floor": floor,\n        "action_domain": action_domain,\n        "action_seq": seq + 1,\n        "next_action_delay_sec": int(delay),\n        "next_action_at": float(now) + float(delay),\n        "personal_cooldown": False,\n        "boss_participation": boss,\n    }\n\n'''
          # The raw string above intentionally uses escaped newlines for Python source;
          # normalize them before splicing into the file.\n          new_run = new_run.replace('\\n', '\n')
          text = text[:start] + new_run + text[end:]

          # Carry cadence state into/out of roster items.\n          apply_start = text.index('def _apply_economy_result_to_roster_item(')
          apply_end = text.index('\ndef _send_autoplay_report', apply_start)
          new_apply = '''def _apply_economy_result_to_roster_item(\n    item: Dict[str, Any], result: Mapping[str, Any]\n) -> None:\n    """Accumulate completed work and persist the commander's personal cadence."""\n    totals = result.get("finished_totals") or {}\n    item["builds_done"] = int(item.get("builds_done") or 0) + int(\n        totals.get("buildings") or 0\n    )\n    item["research_done"] = int(item.get("research_done") or 0) + int(\n        totals.get("research") or 0\n    )\n    item["defense_done"] = int(item.get("defense_done") or 0) + int(\n        totals.get("defense") or 0\n    )\n    if result.get("action_seq") is not None:\n        item["action_seq"] = max(0, int(result.get("action_seq") or 0))\n    if result.get("next_action_at") is not None:\n        item["next_action_at"] = float(result["next_action_at"])\n    action = result.get("last_action")\n    if action:\n        item["last_action"] = action\n\n'''
          text = text[:apply_start] + new_apply + text[apply_end:]

          replace_once(
              '''                        "defense_done": 0,\n                    }\n                    roster.append(new_item)\n''',
              '''                        "defense_done": 0,\n                        "action_seq": 0,\n                        "next_action_at": None,\n                    }\n                    roster.append(new_item)\n''',
              'new roster cadence fields',
          )

          replace_once(
              '''                        res = _run_player_economy(\n                            conn, player_id, now=ts, is_wake=True\n                        )\n''',
              '''                        res = _run_player_economy(\n                            conn,\n                            player_id,\n                            now=ts,\n                            is_wake=True,\n                            action_seq=int(item.get("action_seq") or 0),\n                            next_action_at=item.get("next_action_at"),\n                        )\n''',
              'wake cadence args',
          )

          replace_once(
              '''                    res = _run_player_economy(conn, player_id, now=ts)\n''',
              '''                    res = _run_player_economy(\n                        conn,\n                        player_id,\n                        now=ts,\n                        action_seq=int(roster_item.get("action_seq") or 0),\n                        next_action_at=roster_item.get("next_action_at"),\n                    )\n''',
              'standing cadence args',
          )

          p.write_text(text, encoding='utf-8')

          # Regression tests: serialized domain, stable pace, token boss participation.\n          tp = Path('tests/test_inactive_autoplay.py')
          tests = tp.read_text(encoding='utf-8')
          marker = 'def test_gc2621_serialized_domain_and_personal_pace'
          if marker not in tests:
              tests += r'''\n\ndef test_gc2621_serialized_domain_and_personal_pace(autoplay_db):\n    """GC-2621: one inactive decision enables exactly one progression domain."""\n    from game.inactive_autoplay import (\n        _action_domain_for_player,\n        _next_action_delay_sec,\n        _run_player_economy,\n    )\n\n    uid = _register_user()\n    conn = db()\n    try:\n        begin_write_transaction(conn)\n        _seed_dormant(conn, uid, days_inactive=5.0)\n        with patch("game.inactive_autoplay.plan_passive_planet_tick") as planner:\n            planner.return_value = {\n                "build": None,\n                "research": None,\n                "defense": None,\n                "ships": None,\n                "builds": [],\n                "researches": [],\n                "finished": {},\n            }\n            result = _run_player_economy(\n                conn, uid, now=time.time(), is_wake=True, action_seq=3\n            )\n        assert planner.call_count == 1\n        kwargs = planner.call_args.kwargs\n        enabled = [\n            bool(kwargs["allow_buildings"]),\n            bool(kwargs["allow_research"]),\n            bool(kwargs["allow_defense"]),\n        ]\n        assert sum(enabled) == 1\n        assert kwargs["allow_ships"] is False\n        assert result["action_domain"] == _action_domain_for_player(\n            uid, result.get("action_domain") and __import__("game.auto_empire", fromlist=["personality_for_player"]).personality_for_player(uid), 3\n        )\n        delay = _next_action_delay_sec(\n            uid,\n            __import__("game.auto_empire", fromlist=["personality_for_player"]).personality_for_player(uid),\n            3,\n        )\n        assert 5 * 60 <= delay <= 35 * 60\n        assert result["action_seq"] == 4\n        assert result["next_action_at"] > time.time()\n        commit(conn)\n    finally:\n        conn.close()\n\n\ndef test_gc2621_personal_pace_is_deterministic_and_varied():\n    from game.auto_empire import personality_for_player\n    from game.inactive_autoplay import _action_domain_for_player, _next_action_delay_sec\n\n    samples = []\n    for pid in range(1, 40):\n        personality = personality_for_player(pid)\n        first = _next_action_delay_sec(pid, personality, 2)\n        assert first == _next_action_delay_sec(pid, personality, 2)\n        assert _action_domain_for_player(pid, personality, 2) == _action_domain_for_player(\n            pid, personality, 2\n        )\n        samples.append((first, _action_domain_for_player(pid, personality, 2)))\n    assert len({delay for delay, _ in samples}) > 5\n    assert len({domain for _, domain in samples}) >= 2\n\n\ndef test_gc2621_inactive_token_world_boss_participation(autoplay_db):\n    """Dormant commanders with combat ships join once, without consuming ships."""\n    from game.fleet import add_planet_ships, get_planet_ships\n    from game.inactive_autoplay import _maybe_join_world_boss\n    from game.world_boss import list_contributions, spawn_world_boss\n\n    uid = _register_user()\n    conn = db()\n    try:\n        begin_write_transaction(conn)\n        player = _seed_dormant(conn, uid, days_inactive=5.0)\n        add_planet_ships(\n            int(player["planet_id"]),\n            uid,\n            {"falcon_interceptor": 3},\n            conn=conn,\n        )\n        before = get_planet_ships(int(player["planet_id"]), conn=conn)\n        spawned = spawn_world_boss(\n            "ancient_leviathan",\n            conn=conn,\n            galaxy=1,\n            system=71,\n            position=8,\n            announce=False,\n        )\n        assert spawned["ok"], spawned\n        event_id = int(spawned["event"]["id"])\n        planets = get_planets_by_player(uid, conn=conn)\n\n        joined = _maybe_join_world_boss(conn, uid, planets, now=time.time())\n        assert joined["ok"] is True\n        assert joined["joined"] is True\n        assert int(joined["damage"]) > 0\n        assert sum(int(v) for v in joined["ships"].values()) == 1\n        assert get_planet_ships(int(player["planet_id"]), conn=conn) == before\n\n        board = list_contributions(event_id, conn=conn, limit=20)\n        mine = next(row for row in board if int(row["player_id"]) == uid)\n        assert int(mine["waves"]) == 1\n        assert int(mine["damage"]) > 0\n\n        again = _maybe_join_world_boss(conn, uid, planets, now=time.time() + 301)\n        assert again["joined"] is False\n        board2 = list_contributions(event_id, conn=conn, limit=20)\n        mine2 = next(row for row in board2 if int(row["player_id"]) == uid)\n        assert int(mine2["waves"]) == 1\n        commit(conn)\n    finally:\n        conn.close()\n'''.replace('\\n', '\n')
          tp.write_text(tests, encoding='utf-8')

          dp = Path('docs/INACTIVE_AUTOPLAY.md')
          doc = dp.read_text(encoding='utf-8')
          doc = doc.replace(
              '| Economy | `plan_passive_planet_tick` mit Soft-Caps (15/20 min) + Chain **1** (kein same-tick Force-Complete); Standing-RR nur alle **`economy_interval`** (Default 300s), entkoppelt vom Fleet-Due-Pfad |',
              '| Economy | `plan_passive_planet_tick` mit Soft-Caps (15/20 min) + Chain **1**; GC-2621 erlaubt pro Commander-Entscheidung nur **eine** Progression-Domäne (Gebäude **oder** Forschung **oder** Defense) und gibt jedem Profil einen stabilen 5–35-Minuten-Aktionsrhythmus. Standing-RR bleibt global budgetiert. |',
          )
          doc = doc.replace(
              '| Ships | **nein** (Inactive) / ja (Pirate-AI, siehe unten) |',
              '| Ships | **nein** (Inactive) / ja (Pirate-AI, siehe unten) |\n| World Boss | GC-2621: Inaktive mit vorhandenen Kampfschiffen setzen pro aktivem Boss genau **einen** Token-Schlag mit dem schwächsten verfügbaren Kampfschiff. Keine Schiffsverluste (kanonischer Instant-Attack), kein Auto-Finisher unter 5% Boss-HP; Ziel ist sichtbare Teilnahme/Ranking, nicht Schaden. |',
          )
          doc = doc.replace(
              '| GC-2620 | Concurrent Roster-Cap 5–8 (Default 6, Clamp 4–12), sticky slow wake (Batch 1), Deploy-Trim bei Übergröße (Alias: GC-INACTIVE-ROSTER-002) | done |',
              '| GC-2620 | Concurrent Roster-Cap 5–8 (Default 6, Clamp 4–12), sticky slow wake (Batch 1), Deploy-Trim bei Übergröße (Alias: GC-INACTIVE-ROSTER-002) | done |\n| GC-2621 | Living Universe V3: serialisierte Progression, individuelle Pace, minimaler World-Boss-Tokenbeitrag für Inaktive mit Kampfschiffen | done |',
          )
          dp.write_text(doc, encoding='utf-8')
          PY

      - name: Syntax check
        run: python -m py_compile game/inactive_autoplay.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; else python -m pip install pytest; fi

      - name: Focused autoplay tests
        env:
          GC_SKIP_MIGRATION_CHECK: '1'
        run: python -m pytest tests/test_inactive_autoplay.py -q

      - name: Commit tested patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/gc-autoplay-v3-patch.yml
          git add game/inactive_autoplay.py tests/test_inactive_autoplay.py docs/INACTIVE_AUTOPLAY.md
          git commit -m "feat: make inactive autoplay feel alive"
          git push origin HEAD:feature/inactive-autoplay-living-universe-v3
