name: GC PE Clarity UI Apply V3

on:
  push:
    branches: [feature/planet-evolution-clarity]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: '0'
      SECRET_KEY: ci-pe-clarity-ui-not-for-production
      GC_SKIP_MIGRATION_CHECK: '1'
      GC_EMBEDDED_CRON: '0'
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/planet-evolution-clarity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Apply current-template UI patch
        run: python scripts/_tmp_apply_pe_clarity_ui_v3.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: UI locale and PE regression gate
        shell: bash
        run: |
          python -m py_compile game/planet_evolution/impact.py
          python scripts/audit_locale_keys.py
          python scripts/audit_visible_i18n.py --locales-only
          python -m pytest -q tests/test_gc_pe_clarity.py tests/test_i18n_hardening.py
          python -m pytest -q tests/test_planet_evolution_dashboard.py -k "not test_trait_effect_lines_from_definitions and not test_trait_effect_lines_include_blocks"
          git diff --check
      - name: Commit product diff and remove temporary executors
        shell: bash
        run: |
          rm -f \
            .github/workflows/gc-pe-clarity-ui-apply.yml \
            .github/workflows/gc-pe-clarity-ui-apply-v2.yml \
            .github/workflows/gc-pe-clarity-ui-apply-v3.yml \
            scripts/_tmp_apply_pe_clarity_ui_v3.py \
            scripts/_tmp_pe_clarity_ui_generated.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(pe): show gameplay impact before evolution actions"
          git push origin HEAD:feature/planet-evolution-clarity
