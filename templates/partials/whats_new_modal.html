<div class="gc-whats-new hidden"
     id="gc-whats-new"
     role="dialog"
     aria-modal="true"
     aria-labelledby="gc-whats-new-title"
     hidden>
  <div class="gc-whats-new-backdrop" data-whats-new-dismiss></div>
  <div class="gc-whats-new-panel gc-panel">
    <header class="gc-whats-new-head">
      <span class="gc-whats-new-icon" aria-hidden="true">🚀</span>
      <div>
        <p class="gc-whats-new-kicker">{{ T("whats_new_kicker", "Neu in") }}</p>
        <h2 class="gc-whats-new-title" id="gc-whats-new-title"></h2>
      </div>
      <button type="button" class="gc-btn gc-btn-ghost gc-whats-new-close" data-whats-new-dismiss aria-label="{{ T('motd_dismiss', 'Schließen') }}">✕</button>
    </header>
    <ul class="gc-whats-new-list" id="gc-whats-new-list"></ul>
    <footer class="gc-whats-new-foot">
      <a href="{{ url_for('news_view') }}" class="gc-btn gc-btn-outline gc-btn-sm" data-whats-new-more data-pjax-link>
        {{ T("whats_new_read_more", "Mehr lesen") }}
      </a>
      <button type="button" class="gc-btn gc-btn-primary gc-btn-sm" data-whats-new-dismiss>
        {{ T("whats_new_got_it", "Verstanden") }}
      </button>
    </footer>
  </div>
</div>
