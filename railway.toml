# Railway deploy config — https://docs.railway.com/reference/config-as-code
[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
# Migrations run automatically in scripts/docker-entrypoint.sh (main container + /data volume).
# Includes 020_player_messages.sql and all pending *.sql — no manual shell needed.
# Do NOT use preDeployCommand — that container cannot mount Railway volumes.
#
# Optional: Ranking worker as a separate Railway Cron Service (not this web service).
#   Start: python scripts/run_ranking_worker.py --source cron
#   Cron:  */10 * * * *  (UTC)
# Same GC_DB_PATH / volume env as web; one-shot exit per run.
