name: Apply GC PG Queue Skip Locked 001

on:
  push:
    branches: [fix/queue-worker-skip-locked]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/queue-worker-skip-locked
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply guarded runtime patch
        run: |
          python scripts/apply_gc_pg_queue_skip_locked_001.py
          python -m py_compile game/db.py game/queue_engine.py game/tick_runner.py
          git diff --check
      - name: Commit runtime patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No runtime changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/db.py game/queue_engine.py game/tick_runner.py
          git commit -m 'fix(queue): skip locked planet scopes in worker'
          git push origin HEAD:fix/queue-worker-skip-locked
