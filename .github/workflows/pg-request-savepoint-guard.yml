name: PG Request Savepoint Guard

on:
  pull_request:

concurrency:
  group: pg-request-savepoint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pg-request-savepoint-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-pg-savepoint-secret-key-not-for-production-use
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Compile transaction layer
        run: python -m py_compile game/db.py
      - name: Request-pinned PostgreSQL SAVEPOINT regressions
        run: python -m pytest -q --tb=line tests/test_gc_pg_request_savepoint_guard_002.py
