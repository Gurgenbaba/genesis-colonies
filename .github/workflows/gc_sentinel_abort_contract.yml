name: GC Sentinel PJAX Abort Contract

on:
  push:
    branches: [fix/sentinel-pjax-abort-noise]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements-prod.txt pytest
      - name: Contract tests
        run: |
          python -m py_compile scripts/browser_report.py tests/test_gc_sentinel_pjax_abort_noise.py
          python -m pytest -q tests/test_gc_sentinel_pjax_abort_noise.py
          git diff --check
