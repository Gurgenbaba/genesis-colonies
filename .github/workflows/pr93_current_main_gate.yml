name: PR93 Current Main Gate

on:
  push:
    branches:
      - fix/player-changelog-current-main
    paths:
      - .github/workflows/pr93_current_main_gate.yml

permissions:
  contents: write

jobs:
  port-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Port PR 93 product diff onto current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/version-changelog-surface

          git diff --binary 912121f9fdba3cd8825d6e18b52d323b8277922a 4278da41e853502d9244eac873f86a0b5ea5e773 -- \
            app.py \
            data/player_changelog_fallback.json \
            game/player_changelog.py \
            static/css/player_changelog.css \
            static/js/player_changelog.js \
            templates/base.html \
            templates/partials/player_changelog_dialog.html \
            templates/partials/special_panel.html \
            tests/test_community_hub.py \
            tests/test_player_changelog_surface.py \
            > /tmp/pr93-nonlocale.patch
          test -s /tmp/pr93-nonlocale.patch
          git apply --3way /tmp/pr93-nonlocale.patch

          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          base_ref = "912121f9fdba3cd8825d6e18b52d323b8277922a"
          source_ref = "4278da41e853502d9244eac873f86a0b5ea5e773"
          missing = object()

          def load_at(ref: str, path: str):
              raw = subprocess.check_output(["git", "show", f"{ref}:{path}"], text=True)
              return json.loads(raw)

          for locale in ("de", "en", "es", "fr", "pl", "pt", "ru", "tr"):
              path = f"locales/{locale}.json"
              before = load_at(base_ref, path)
              source = load_at(source_ref, path)
              current = json.loads(Path(path).read_text(encoding="utf-8"))

              for key in set(before) | set(source):
                  old_value = before.get(key, missing)
                  new_value = source.get(key, missing)
                  if old_value == new_value:
                      continue
                  if new_value is missing:
                      current.pop(key, None)
                  else:
                      current[key] = new_value

              Path(path).write_text(
                  json.dumps(current, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
          PY

          git diff --check

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-dev.txt

      - name: Focused changelog verification
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app.py game/player_changelog.py tests/test_player_changelog_surface.py tests/test_community_hub.py
          node --check static/js/player_changelog.js
          python -m pytest tests/test_player_changelog_surface.py tests/test_community_hub.py -q
          python - <<'PY'
          import json
          from pathlib import Path

          locales = [json.loads(Path(f"locales/{code}.json").read_text(encoding="utf-8")) for code in ("de","en","es","fr","pl","pt","ru","tr")]
          expected = set(locales[0])
          for data in locales[1:]:
              assert set(data) == expected
          print(f"locale parity ok: {len(expected)} keys x {len(locales)} locales")
          PY

      - name: Commit rebased changelog surface
        shell: bash
        run: |
          set -euo pipefail
          git add \
            app.py \
            data/player_changelog_fallback.json \
            game/player_changelog.py \
            locales/de.json locales/en.json locales/es.json locales/fr.json \
            locales/pl.json locales/pt.json locales/ru.json locales/tr.json \
            static/css/player_changelog.css \
            static/js/player_changelog.js \
            templates/base.html \
            templates/partials/player_changelog_dialog.html \
            templates/partials/special_panel.html \
            tests/test_community_hub.py \
            tests/test_player_changelog_surface.py
          git commit -m "fix: restore full git-backed player changelog on current main"
          git push origin HEAD:fix/player-changelog-current-main
