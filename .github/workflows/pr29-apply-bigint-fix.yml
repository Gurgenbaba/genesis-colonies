name: PR29 Apply BigInt Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/fullwidth-ranking-exact-scores'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fullwidth-ranking-exact-scores
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Patch remaining player ranking comparator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('static/main.js')
          source = path.read_text(encoding='utf-8')
          old = '''const diff = rankingScoreValue(b, tabId) - rankingScoreValue(a, tabId);\n      if (diff !== 0) return diff;\n      return (Number(a.player_id) || 0) - (Number(b.player_id) || 0);'''
          new = '''const scoreB = rankingScoreValue(b, tabId);\n      const scoreA = rankingScoreValue(a, tabId);\n      if (scoreB !== scoreA) return scoreB > scoreA ? -1 : 1;\n      return (Number(a.player_id) || 0) - (Number(b.player_id) || 0);'''
          if source.count(old) != 1:
              raise SystemExit(f'expected one legacy player comparator, found {source.count(old)}')
          source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY
          node --check static/main.js
          python -m pytest -q --tb=line tests/test_number_format.py
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/main.js
          git commit -m "fix: keep player ranking comparator BigInt-safe"
          git push origin HEAD:feature/fullwidth-ranking-exact-scores
