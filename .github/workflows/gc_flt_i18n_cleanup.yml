name: GC FLT I18N Cleanup

on:
  push:
    branches: [gc-flt-scope-001]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gc-flt-scope-001
      - name: Remove scanner-only template comment
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('templates/fleet.html')
          text = p.read_text(encoding='utf-8')
          block = '''      {# GC-FLT-SCOPE-001: both states stay mounted so a planet-gated live refresh can\n         heal zero-ships -> ships without requiring stale SSR markup to grow nodes. #}\n'''
          if text.count(block) != 1:
              raise SystemExit(f'expected one comment block, got {text.count(block)}')
          p.write_text(text.replace(block, '', 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/fleet.html
          git commit -m 'fix: keep Fleet template scanner-clean'
          git push origin HEAD:gc-flt-scope-001
