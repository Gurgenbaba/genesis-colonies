name: PG Transaction Ownership Guard

on:
  pull_request:

concurrency:
  group: pg-transaction-ownership-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pg-transaction-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-pg-savepoint-secret-key-not-for-production-use
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Compile transaction layer
        run: python -m py_compile game/db.py game/queue_engine.py game/fleet.py game/admin_api.py
      - name: PostgreSQL ownership and Fleet-domain regressions
        run: |
          python -m pytest -q --tb=line \
            tests/test_gc_pg_request_savepoint_guard_002.py \
            tests/test_gc_action_tx_domain_isolation_003.py \
            tests/test_gc_fleet_detached_owner_004.py \
            tests/test_gc_fleet_pg_abort_001.py \
            tests/test_admin_fleet.py
