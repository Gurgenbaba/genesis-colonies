name: Apply Mega Belt Share Lifecycle

on:
  push:
    branches:
      - fix/mega-belt-player-share-lifecycle

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mega-belt-player-share-lifecycle
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply product patch
        run: python scripts/apply_mega_belt_share_patch.py
      - name: Install test dependencies
        run: python -m pip install -q -r requirements-prod.txt pytest
      - name: Syntax and focused regression tests
        run: |
          python -m py_compile game/asteroids.py game/fleet.py
          pytest -q tests/test_asteroids.py tests/test_asteroid_value_preview.py
      - name: I18N parity and key audit
        run: |
          python scripts/check_locale_keys.py
          python -m pytest -q tests/test_i18n*.py
      - name: Commit product patch
        shell: bash
        run: |
          rm -f .github/workflows/apply-mega-belt-share.yml scripts/apply_mega_belt_share_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: cap Mega Belt harvest share per player"
          git push origin HEAD:fix/mega-belt-player-share-lifecycle
