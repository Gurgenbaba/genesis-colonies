name: Apply Galaxy Action Feedback

on:
  push:
    branches:
      - fix/galaxy-clear-action-feedback

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/galaxy-clear-action-feedback
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Galaxy feedback hardening
        run: python scripts/apply_galaxy_feedback_fix.py

      - name: JS syntax
        run: node --check static/js/galaxy-quick-action.js

      - name: Focused regression tests
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q \
            tests/test_galaxy_action_feedback.py \
            tests/test_gc980_galaxy_quick_action.py \
            tests/test_fleet_action_reasons.py \
            tests/test_galaxy.py

      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/js/galaxy-quick-action.js
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix: make galaxy action failures actionable"
          git push origin HEAD:fix/galaxy-clear-action-feedback
