name: GC Performance Pass 02 Audit

on:
  push:
    branches:
      - perf/current-hotspot-pass-02

permissions:
  contents: read

env:
  APP_ENV: development
  FLASK_ENV: development
  FLASK_DEBUG: '0'
  SECRET_KEY: ci-perf-pass-02-not-for-production
  GC_SKIP_MIGRATION_CHECK: '1'
  GC_EMBEDDED_CRON: '0'
  GC_DB_BACKEND: sqlite
  GC_REQUEST_PERF_DEBUG: '1'
  GC_REQUEST_PERF_SLOW_MS: '0'
  GC_REQUEST_PERF_SAMPLE: '1.0'
  GC_PERF_INTEL: '1'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Measure current game-state paths
        shell: bash
        run: |
          cat > tests/_tmp_perf_pass_02.py <<'PY'
          from __future__ import annotations

          import logging

          import pytest

          pytest_plugins = ["tests.test_game_state_live"]

          ROUTES = [
              ("diet", "/api/game-state"),
              ("overview", "/api/game-state?include_panel=1&panel_page=overview"),
              ("research", "/api/game-state?include_panel=1&panel_page=research"),
              ("fleet", "/api/game-state?include_panel=1&panel_page=fleet"),
          ]

          @pytest.mark.parametrize("label,route", ROUTES)
          def test_measure_route(game_client, caplog, label, route):
              client, _pid = game_client
              warm = client.get(route)
              assert warm.status_code == 200
              caplog.clear()
              with caplog.at_level(logging.INFO):
                  resp = client.get(route)
              assert resp.status_code == 200
              logs = [r.message for r in caplog.records if "[GC REQUEST PERF]" in r.message]
              assert logs
              print(f"\nPERF02 {label} {logs[-1]}")
          PY
          python -m pytest -q -s tests/_tmp_perf_pass_02.py
          rm -f tests/_tmp_perf_pass_02.py
