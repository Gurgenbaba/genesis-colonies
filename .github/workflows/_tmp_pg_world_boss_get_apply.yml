name: TEMP Apply PG World Boss GET Readonly

on:
  push:
    branches:
      - perf/pg-world-boss-readonly-payload

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/pg-world-boss-readonly-payload
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact GET caller patch
        run: python scripts/_apply_pg_world_boss_get_callers.py
      - name: Verify source boundary
        run: |
          python -m py_compile app.py game/world_boss.py tests/test_gc_pg_world_boss_readonly_payload.py
          python - <<'PY'
          from pathlib import Path
          s = Path('app.py').read_text()
          page = s.split('def world_boss_view():',1)[1].split('@app.route("/api/world-boss")',1)[0]
          api = s.split('def api_world_boss():',1)[1].split('@app.route("/api/world-boss/attack"',1)[0]
          assert 'flush_auto=True' not in page + api
          assert 'begin_write_transaction' not in page + api
          PY
      - name: Commit generated product diff
        run: |
          if git diff --quiet -- app.py; then
            echo "World Boss GET patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "perf(pg): make World Boss GET callers read-only"
          git push origin HEAD:perf/pg-world-boss-readonly-payload
