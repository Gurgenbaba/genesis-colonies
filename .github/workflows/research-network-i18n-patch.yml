name: Research Network Locale Patch

on:
  push:
    branches:
      - feature/research-network-ascension
    paths:
      - scripts/.research_network_i18n_trigger

permissions:
  contents: write

jobs:
  patch-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install audit dependencies
        run: pip install -r requirements-prod.txt
      - name: Apply locale parity patch
        run: python scripts/_patch_research_network_locales.py
      - name: Audit all locale keys
        run: |
          python scripts/audit_locale_keys.py
          python scripts/audit_visible_i18n.py --locales-only
      - name: Commit audited locales
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add locales/es.json locales/fr.json locales/pl.json locales/pt.json locales/ru.json locales/tr.json
          git diff --cached --check
          git commit -m "fix: complete research network locale parity"
          git push origin HEAD:feature/research-network-ascension
