name: Genesis Sentinel PostgreSQL

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel-pg-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sentinel-postgres:
    name: browser-sentinel-postgres
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: genesis
          POSTGRES_PASSWORD: genesis
          POSTGRES_DB: genesis_sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U genesis -d genesis_sentinel"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-sentinel-postgres-secret-key-not-for-production-use
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: postgres
      GC_NAV_PERF_DEBUG: "1"
      DATABASE_URL: postgresql://genesis:genesis@127.0.0.1:5432/genesis_sentinel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt -r requirements-dev.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: PostgreSQL Sentinel syntax gate
        run: |
          python -m py_compile scripts/browser_test_support.py scripts/browser_postgres_support.py scripts/browser_sentinel.py scripts/browser_sentinel_postgres.py scripts/browser_report.py
          git diff --check

      - name: Run PostgreSQL browser journey
        run: python scripts/browser_sentinel_postgres.py

      - name: Evaluate PostgreSQL Sentinel gate
        run: python scripts/browser_report.py artifacts/browser-postgres/report.json --fail-on high

      - name: Upload PostgreSQL Sentinel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-sentinel-postgres-${{ github.run_id }}
          path: |
            artifacts/browser-postgres/report.json
            artifacts/browser-postgres/report.html
            artifacts/browser-postgres/gate.json
            artifacts/browser-postgres/server.log
            artifacts/browser-postgres/screenshots/
            artifacts/browser-postgres/dom/
            artifacts/browser-postgres/findings/
            artifacts/browser-postgres/traces/
          if-no-files-found: warn
          retention-days: 14
