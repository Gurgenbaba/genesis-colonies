name: WB HUD Hotfix Builder

on:
  push:
    branches:
      - hotfix/world-boss-raid-hud-layout
    paths:
      - .github/workflows/wb-hud-hotfix-builder.yml

permissions:
  contents: write

jobs:
  patch-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/world-boss-raid-hud-layout

      - name: Move raid HUD out of encounter stage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("templates/world_boss.html")
          text = path.read_text(encoding="utf-8")

          old_start = '                  {% if raid %}\n                  <div class="gc-world-boss-raid-strip" data-wb-raid-state'
          formation_anchor = '                  <div class="gc-world-boss-formation"'
          insert_anchor = '                </div>\n\n                {% if is_active %}'

          if text.count(old_start) != 1:
              raise SystemExit(f"expected exactly one legacy raid HUD block, found {text.count(old_start)}")
          if text.count(insert_anchor) != 1:
              raise SystemExit(f"expected exactly one stage/action anchor, found {text.count(insert_anchor)}")

          start = text.index(old_start)
          formation = text.index(formation_anchor, start)
          text = text[:start] + text[formation:]

          raid_block = '''                {% if raid %}
                <section class="gc-world-boss-raid-strip" data-wb-raid-state
                         aria-label="{{ T('wb_raid_status', 'Raid-Status') }}"
                         style="position:relative;z-index:4;display:grid;gap:.7rem;margin:.7rem 0 .8rem;padding:.8rem .9rem;border:1px solid rgba(89,221,255,.34);background:linear-gradient(180deg,rgba(6,24,39,.96),rgba(3,14,27,.96));border-radius:.7rem;box-shadow:0 0 22px rgba(32,191,255,.08),inset 0 1px rgba(255,255,255,.025);">
                  <div style="display:flex;gap:.6rem;align-items:center;justify-content:space-between;flex-wrap:wrap;">
                    <strong class="gc-mono" style="font-size:.76rem;letter-spacing:.09em;color:#74e8ff;">{{ T("wb_raid_status", "RAID-STATUS") }}</strong>
                    <div style="display:flex;gap:.45rem;align-items:center;flex-wrap:wrap;">
                      {% if raid.containment and raid.containment.active %}
                      <span class="gc-world-boss-status-badge" data-wb-containment>
                        🛡 {{ T("wb_raid_containment", "Containment") }} ·
                        <span data-countdown-at="{{ raid.containment.ends_at|int }}" data-countdown-format="eta">—</span>
                      </span>
                      {% endif %}
                      {% if raid.last_stand and raid.last_stand.active %}
                      <span class="gc-world-boss-status-badge gc-world-boss-status-badge--active" data-wb-last-stand>
                        🚨 {{ T("wb_raid_last_stand", "Last Stand") }} +25%
                      </span>
                      {% endif %}
                    </div>
                  </div>

                  {% if raid.resonance %}
                  <div style="display:grid;gap:.35rem;">
                    <div style="display:flex;gap:.6rem;align-items:center;justify-content:space-between;min-width:0;">
                      {% if raid.resonance.active %}
                      <span class="gc-world-boss-status-badge gc-world-boss-status-badge--active" data-wb-resonance-active>
                        ⚡ {{ T("wb_raid_resonance", "Fleet Resonance") }} +50% ·
                        <span data-countdown-at="{{ raid.resonance.ends_at|int }}" data-countdown-format="eta">—</span>
                      </span>
                      {% else %}
                      <span class="hint" style="font-weight:700;color:#a9deea;">⚡ {{ T("wb_raid_resonance", "Fleet Resonance") }}</span>
                      <span class="gc-mono" data-wb-resonance-label style="white-space:nowrap;">{{ raid.resonance.points }} / {{ raid.resonance.threshold }}</span>
                      {% endif %}
                    </div>
                    <div class="gc-world-boss-hp" role="meter" aria-valuemin="0" aria-valuemax="100"
                         aria-valuenow="{{ raid.resonance.progress_pct|int }}" data-wb-resonance-meter
                         style="height:.72rem;min-height:.72rem;">
                      <div class="gc-world-boss-hp-fill" data-wb-resonance-fill
                           style="width:{{ raid.resonance.progress_pct }}%;"></div>
                    </div>
                  </div>
                  {% endif %}

                  {% if raid.target_lock %}
                  <div style="display:grid;gap:.35rem;">
                    <div style="display:flex;gap:.6rem;align-items:center;justify-content:space-between;">
                      <span class="hint" style="font-weight:700;color:#a9deea;">🎯 {{ T("wb_raid_target_lock", "Target Lock") }}</span>
                      <span class="gc-mono" style="white-space:nowrap;">{{ raid.target_lock.charge }}%</span>
                    </div>
                    <div class="gc-world-boss-hp" role="meter" aria-valuemin="0" aria-valuemax="100"
                         aria-valuenow="{{ raid.target_lock.charge|int }}" data-wb-target-lock-meter
                         style="height:.72rem;min-height:.72rem;">
                      <div class="gc-world-boss-hp-fill" data-wb-target-lock-fill
                           style="width:{{ raid.target_lock.charge }}%;"></div>
                    </div>
                  </div>
                  {% endif %}
                </section>
                {% endif %}'''

          text = text.replace(
              insert_anchor,
              '                </div>\n\n' + raid_block + '\n\n                {% if is_active %}',
              1,
          )

          if text.count('data-wb-raid-state') != 1:
              raise SystemExit("raid HUD must exist exactly once")
          raid_pos = text.index('data-wb-raid-state')
          formation_pos = text.index('data-wb-formation')
          action_pos = text.index('gc-world-boss-action-bar')
          if not (formation_pos < raid_pos < action_pos):
              raise SystemExit("raid HUD is not outside the encounter stage and before the action bar")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Remove one-shot builder from resulting branch
        run: rm .github/workflows/wb-hud-hotfix-builder.yml

      - name: Commit generated hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/world_boss.html .github/workflows/wb-hud-hotfix-builder.yml
          git diff --cached --check
          git commit -m "fix(world-boss): move raid HUD below encounter stage"
          git push origin HEAD:hotfix/world-boss-raid-hud-layout
