name: Imperial Expansion Mandates

on:
  pull_request:
    paths:
      - "game/planet_evolution/imperial_mandates.py"
      - "game/planet_evolution/expansion_protocol.py"
      - "game/logic.py"
      - "migrations/190_imperial_expansion_15.sql"
      - "tests/test_imperial_mandates.py"
      - ".github/workflows/imperial-expansion.yml"
  push:
    branches: [main, u2/staging-runtime]
    paths:
      - "game/planet_evolution/imperial_mandates.py"
      - "game/planet_evolution/expansion_protocol.py"
      - "game/logic.py"
      - "migrations/190_imperial_expansion_15.sql"
      - "tests/test_imperial_mandates.py"
      - ".github/workflows/imperial-expansion.yml"

jobs:
  mandates:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-imperial-expansion-not-production
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-prod.txt pytest
      - run: python -m pytest -q --tb=short tests/test_imperial_mandates.py tests/test_planet_cap_hard.py
