name: GC Living Universe Polish

on:
  push:
    branches:
      - feature/inactive-autoplay-living-universe-v3

permissions:
  contents: write

jobs:
  polish-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/inactive-autoplay-living-universe-v3
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Keep player-facing activity immersive
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("game/inactive_autoplay.py")
          text = p.read_text(encoding="utf-8")
          replacements = {
              '"Während du offline warst, hat die Kolonieverwaltung deine Kolonie automatisch weitergeführt:",':
                  '"Während deiner Abwesenheit hat die Kolonieverwaltung den laufenden Betrieb fortgesetzt:",',
              '"Automatisierter Betriebsbericht",':
                  '"Kolonie-Betriebsbericht",',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"missing player-facing wording anchor: {old}")
              text = text.replace(old, new, 1)
          p.write_text(text, encoding="utf-8")
          PY

      - name: Public wording guard
        shell: bash
        run: |
          ! grep -F 'Automatisierter Betriebsbericht' game/inactive_autoplay.py
          ! grep -F 'automatisch weitergeführt' game/inactive_autoplay.py
          grep -F 'Kolonie-Betriebsbericht' game/inactive_autoplay.py
          grep -F 'laufenden Betrieb fortgesetzt' game/inactive_autoplay.py

      - name: Syntax check
        run: python -m py_compile game/inactive_autoplay.py tests/test_inactive_autoplay_gc2621.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; else python -m pip install pytest; fi

      - name: Living universe focused tests
        env:
          GC_SKIP_MIGRATION_CHECK: '1'
        run: python -m pytest tests/test_inactive_autoplay_gc2621.py -q

      - name: Colony activity regression
        env:
          GC_SKIP_MIGRATION_CHECK: '1'
        run: python -m pytest tests/test_inactive_autoplay.py -q

      - name: Commit tested polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gc-living-universe-polish.yml .gc_living_universe_polish_trigger
          git add game/inactive_autoplay.py
          git commit -m "polish: keep colony activity immersive"
          git push origin HEAD:feature/inactive-autoplay-living-universe-v3
