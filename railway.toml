# Railway deploy config — https://docs.railway.com/reference/config-as-code
[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
# Migrations run in scripts/docker-entrypoint.sh (main container + volume).
# Do NOT use preDeployCommand — that container cannot mount Railway volumes.
