name: Ranking Hotfix Inspect

on:
  push:
    branches: [hotfix/ranking-order-exact-live]
  pull_request:

jobs:
  inspect:
    if: github.head_ref == 'hotfix/ranking-order-exact-live' || github.ref_name == 'hotfix/ranking-order-exact-live'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect ranking renderer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('static/main.js')
          lines = p.read_text(encoding='utf-8').splitlines()
          needles = ('gc-num-compact','num-compact','gc-ranking-score','rankingScoreValue','rankingCurrentScore')
          for i,line in enumerate(lines,1):
              if any(n in line for n in needles):
                  lo=max(1,i-4); hi=min(len(lines),i+8)
                  print(f'--- {lo}:{hi} around line {i} ---')
                  for j in range(lo,hi+1): print(f'{j}: {lines[j-1]}')
          PY
