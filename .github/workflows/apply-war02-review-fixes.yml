name: Apply WAR-02 review fixes

on:
  push:
    branches:
      - feature/alliance-war-meta

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-war02-review-secret-key-not-for-production-use
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alliance-war-meta
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Apply review fixes
        run: python scripts/apply_war02_review_fixes.py
      - name: Compile and diff checks
        run: |
          python -m py_compile game/alliance_war.py game/alliance.py game/admin_universe_reset.py game/messages.py
          node --check static/js/messages.js
          git diff --check
      - name: WAR-02 deploy gate
        run: |
          python -m pytest -q --tb=line \
            tests/test_alliance_war_meta.py \
            tests/test_alliance.py::test_diplomacy_war_and_duplicate_request \
            tests/test_alliance.py::test_diplomacy_rewar_same_second_gets_fresh_campaign \
            tests/test_alliance.py::test_gc_al_war_01_lifecycle_bundle \
            tests/test_admin_universe_reset.py::test_reset_domain_coverage_complete \
            tests/test_admin_universe_reset.py::test_alliance_war_meta_belongs_to_combat_reset_domain
      - name: Remove temporary helpers
        run: |
          rm -f scripts/apply_war02_review_fixes.py
          rm -f .github/workflows/apply-war02-review-fixes.yml
          rm -f .github/workflows/war02-gate.yml
      - name: Commit hardened WAR-02
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(alliance): harden WAR-02 for production"
          git push origin HEAD:feature/alliance-war-meta
