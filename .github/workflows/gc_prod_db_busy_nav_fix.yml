name: GC Prod DB Busy Nav Fix

on:
  push:
    branches:
      - fix/prod-transient-db-busy-nav

permissions:
  contents: write

jobs:
  apply_fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prod-transient-db-busy-nav
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply patch
        run: python scripts/apply_gc_pg_busy_nav_fix.py
      - name: Install test dependencies
        run: pip install -r requirements-prod.txt pytest
      - name: Regression tests
        run: |
          python -m py_compile game/auth.py tests/test_gc_pg_busy_nav_001.py
          python -m pytest -q tests/test_gc_pg_busy_nav_001.py tests/test_gc_pg_pool_timeout_auth.py
          git diff --check
      - name: Commit generated hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/auth.py tests/test_gc_pg_busy_nav_001.py
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix(auth): survive transient PG pool pressure on navigation"
          git push origin HEAD:fix/prod-transient-db-busy-nav
