name: TEMP Apply PG Schema Ready Connection Leaks

on:
  push:
    branches:
      - hotfix/pg-schema-ready-connection-leaks

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/pg-schema-ready-connection-leaks
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scoped test dependencies
        run: python -m pip install -r requirements-prod.txt pytest
      - name: Apply exact leak patch
        run: python scripts/_apply_pg_schema_ready_connection_leaks.py
      - name: Verify source boundary
        run: |
          python -m py_compile app.py tests/test_gc_pg_schema_ready_connection_leaks.py
          python -m pytest -q tests/test_gc_pg_schema_ready_connection_leaks.py
      - name: Commit generated product diff
        run: |
          if git diff --quiet -- app.py; then
            echo "Schema-ready leak patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "fix(pg): close schema readiness probe connections"
          git push origin HEAD:hotfix/pg-schema-ready-connection-leaks
