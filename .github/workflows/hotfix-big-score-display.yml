name: Hotfix Big Score Display

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'hotfix/big-score-display'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/big-score-display
      - name: Patch BigInt compact score suffixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("static/main.js")
          src = path.read_text(encoding="utf-8")

          old_threshold = '''  if (abs >= 1_000_000_000_000_000n) {
            return formatHugeBigIntScientific(value);
          }
          '''
          new_threshold = '''  if (abs >= 10n ** 33n) {
            return formatHugeBigIntScientific(value);
          }
          '''
          if src.count(old_threshold) != 1:
              raise SystemExit(f"expected exactly one legacy scientific threshold, got {src.count(old_threshold)}")
          src = src.replace(old_threshold, new_threshold, 1)

          old_suffix_head = '''  const suffixes = [
            [1_000_000_000_000n, "T"],
          '''
          new_suffix_head = '''  const suffixes = [
            [10n ** 30n, "Q"],
            [10n ** 27n, "R"],
            [10n ** 24n, "Y"],
            [10n ** 21n, "Z"],
            [10n ** 18n, "E"],
            [10n ** 15n, "P"],
            [1_000_000_000_000n, "T"],
          '''
          if src.count(old_suffix_head) != 1:
              raise SystemExit(f"expected exactly one suffix table head, got {src.count(old_suffix_head)}")
          src = src.replace(old_suffix_head, new_suffix_head, 1)
          path.write_text(src, encoding="utf-8")
          PY

      - name: Verify syntax and display contract
        shell: bash
        run: |
          node --check static/main.js
          python - <<'PY'
          from pathlib import Path
          src = Path("static/main.js").read_text(encoding="utf-8")
          assert 'if (abs >= 10n ** 33n)' in src
          assert '[10n ** 15n, "P"]' in src
          assert 'if (abs >= 1_000_000_000_000_000n)' not in src
          PY

      - name: Commit hotfix
        shell: bash
        run: |
          if git diff --quiet -- static/main.js; then
            echo "No patch needed; already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/main.js
          git commit -m "fix(ui): keep huge scores human-readable"
          git push origin HEAD:hotfix/big-score-display
