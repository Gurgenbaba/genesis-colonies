name: SystemOS Deployment Start

on:
  push:
    branches:
      - main
      - u2/staging-runtime
    paths:
      - "game/**"
      - "app.py"
      - "templates/**"
      - "static/**"
      - "locales/**"
      - "generated/**"
      - "data/**"
      - "migrations/**"
      - "migrate.py"
      - "scripts/docker-entrypoint.sh"
      - "scripts/install.py"
      - "scripts/run_uni1_prelaunch_reset.py"
      - "scripts/run_maintenance_worker.py"
      - "scripts/run_game_worker.py"
      - "requirements.txt"
      - "requirements-prod.txt"
      - "Dockerfile"
      - "railway.toml"
      - ".dockerignore"
      - "VERSION"
      - "CHANGELOG.md"

permissions:
  contents: read
  id-token: write

jobs:
  signal-systemos:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send signed deployment start
        shell: bash
        env:
          SYSTEMOS_URL: https://mail-hub-production-f6d2.up.railway.app
          SYSTEMOS_AUDIENCE: gurgenbaba-systemos
          DEPLOYMENT_OCCURRED_AT: ${{ github.event.head_commit.timestamp }}
        run: |
          set -euo pipefail
          oidc_json="$(
            curl --fail --silent --show-error               -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"               "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${SYSTEMOS_AUDIENCE}"
          )"
          oidc_token="$(
            printf '%s' "${oidc_json}" |
              python -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          )"
          payload="$(
            python - <<'PY'
import json, os
print(json.dumps({"occurred_at": os.environ["DEPLOYMENT_OCCURRED_AT"]}))
PY
          )"
          curl --fail-with-body --silent --show-error             -X POST             -H "Authorization: Bearer ${oidc_token}"             -H "Accept: application/json"             -H "Content-Type: application/json"             --data "${payload}"             "${SYSTEMOS_URL}/api/v1/providers/github/deployment-started"
