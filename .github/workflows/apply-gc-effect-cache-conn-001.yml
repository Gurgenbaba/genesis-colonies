name: Apply GC Effect Cache Conn 001

on:
  push:
    branches: [fix/mine-ascension-nexus-gates]
    paths:
      - "scripts/apply_gc_effect_cache_conn_001.py"
      - ".github/workflows/apply-gc-effect-cache-conn-001.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mine-ascension-nexus-gates
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply guarded runtime patch
        run: |
          python scripts/apply_gc_effect_cache_conn_001.py
          python -m py_compile game/effects/effect_resolver.py
          git diff --check
      - name: Commit runtime patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/effects/effect_resolver.py
          git commit -m "fix(effects): scope resolver cache to DB checkout"
          git push origin HEAD:fix/mine-ascension-nexus-gates
