# One-shot branch-local apply workflow; removed after the generated runtime diff lands.
name: Apply Shipyard Shared Catalog

on:
  push:
    branches: [perf/shipyard-shared-catalog-context]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/shipyard-shared-catalog-context
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Normalize one-line signature markers
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_gc_perf_shipyard_catalog_001.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('"def list_buildable_ships(\\n",', '"def list_buildable_ships(",')
          s = s.replace('"def list_locked_ships(\\n",', '"def list_locked_ships(",')
          s = s.replace('"def build_shipyard_api_payload(\\n",', '"def build_shipyard_api_payload(",')
          s = s.replace('"def build_shipyard_page_context(\\n",', '"def build_shipyard_page_context(",')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply focused patch
        run: python scripts/apply_gc_perf_shipyard_catalog_001.py
      - name: Remove retained legacy buildable definition
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('game/shipyard.py')
          s = p.read_text(encoding='utf-8')
          needle = 'def list_buildable_ships('
          positions = []
          start = 0
          while True:
              i = s.find(needle, start)
              if i < 0:
                  break
              positions.append(i)
              start = i + len(needle)
          if len(positions) == 2:
              legacy_start = positions[1]
              legacy_end = s.find('def cancel_shipyard_job(', legacy_start)
              if legacy_end < 0:
                  raise SystemExit('legacy buildable cleanup end marker missing')
              s = s[:legacy_start] + s[legacy_end:]
              p.write_text(s, encoding='utf-8')
          elif len(positions) != 1:
              raise SystemExit(f'expected one or two list_buildable_ships definitions, found {len(positions)}')
          PY
      - name: Verify target diff
        run: |
          python -m py_compile game/shipyard.py
          git diff --check
          test "$(grep -c '^def list_buildable_ships' game/shipyard.py)" -eq 1
          test "$(grep -c '^def list_locked_ships' game/shipyard.py)" -eq 1
          test "$(grep -c '^def build_shipyard_api_payload' game/shipyard.py)" -eq 1
          git diff -- game/shipyard.py
          grep -n "GC-PERF-SHIPYARD-CATALOG-001" game/shipyard.py
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- game/shipyard.py; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore scripts/apply_gc_perf_shipyard_catalog_001.py
          git add game/shipyard.py
          git commit -m "perf(shipyard): remove duplicate catalog path"
          git push origin HEAD:perf/shipyard-shared-catalog-context
