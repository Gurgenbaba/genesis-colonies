name: Apply asteroid fuel layout fix

on:
  push:
    branches:
      - fix/asteroid-fuel-preview-layout
    paths:
      - scripts/_apply_asteroid_fuel_layout_fix.py
      - .github/workflows/apply-asteroid-fuel-layout-fix.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/asteroid-fuel-preview-layout
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest

      - name: Apply layout fix
        run: python scripts/_apply_asteroid_fuel_layout_fix.py

      - name: Remove one-shot tooling
        run: |
          git rm scripts/_apply_asteroid_fuel_layout_fix.py
          git rm .github/workflows/apply-asteroid-fuel-layout-fix.yml

      - name: Syntax and focused tests
        env:
          APP_ENV: development
          GC_SKIP_MIGRATION_CHECK: "1"
          SECRET_KEY: ci-asteroid-fuel-layout-secret-key
        run: |
          node --check static/js/galaxy-quick-action.js
          python -m pytest -q --tb=line tests/test_asteroid_value_preview.py tests/test_asteroids.py

      - name: I18N changed-line audit
        run: python scripts/audit_visible_i18n.py --raw-only --diff-base origin/main --max-findings 100

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "fix: keep asteroid fuel preview layout stable"
            git push origin HEAD:fix/asteroid-fuel-preview-layout
          fi
