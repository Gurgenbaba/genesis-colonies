name: Reserve Next Build (GC-RESERVE-001)

# The reservation feature is flag-gated and OFF by default. These jobs prove it on BOTH backends:
#   * sqlite     - the contract suite + flag isolation (default developer backend)
#   * postgres   - the SAME suite on a real PostgreSQL 16, plus PG-only concurrency tests
#                  (FOR UPDATE SKIP LOCKED, partial unique indexes, racing workers/clicks)

on:
  pull_request:
    paths:
      - "game/build_reservations.py"
      - "game/buildings.py"
      - "game/tick_runner.py"
      - "game/auto_empire.py"
      - "game/config.py"
      - "game/db.py"
      - "game/db_pg.py"
      - "migrations/189_build_reservations.sql"
      - "tests/test_gc_reserve_*.py"
      - "tests/pg_fixtures.py"
      - ".github/workflows/reserve-next-build.yml"
  workflow_dispatch:

concurrency:
  group: reserve-next-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reserve-sqlite:
    name: reserve-sqlite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-reserve-sqlite-secret-key-not-for-production
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Compile reservation owners
        run: python -m py_compile game/build_reservations.py game/buildings.py game/tick_runner.py game/auto_empire.py game/config.py
      - name: Reservation contract + flag isolation (SQLite)
        run: python -m pytest -q --tb=short tests/test_gc_reserve_*.py

  reserve-postgres:
    name: reserve-postgres
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: genesis
          POSTGRES_PASSWORD: genesis
          POSTGRES_DB: genesis_reserve
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U genesis -d genesis_reserve"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-reserve-postgres-secret-key-not-for-production
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: postgres
      DATABASE_URL: postgresql://genesis:genesis@127.0.0.1:5432/genesis_reserve
      GC_TEST_POSTGRES_URL: postgresql://genesis:genesis@127.0.0.1:5432/genesis_reserve
      GC_RESERVE_TEST_BACKEND: postgres
      GC_PG_CONNECT_TIMEOUT: "10"
      GC_PG_POOL_TIMEOUT: "20"
      GC_PG_STATEMENT_TIMEOUT: "45s"
      GC_PG_LOCK_TIMEOUT: "15s"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Apply full PostgreSQL schema (includes migration 189)
        run: python migrate.py
      - name: Second migrate run applies nothing (idempotent)
        run: |
          python migrate.py | tee /tmp/migrate_second.txt
          ! grep -q "wende Migration an" /tmp/migrate_second.txt
      - name: Reservation contract + PostgreSQL concurrency (real SKIP LOCKED, partial unique indexes)
        run: python -m pytest -q -s --tb=short tests/test_gc_reserve_001_build_reservations.py
