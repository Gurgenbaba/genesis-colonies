name: TEMP Presence Audit 164
on:
  push:
    branches: [perf/pg-presence-reader-cutover-164]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remaining gameplay last_seen references
        run: |
          echo '=== WRITES ==='
          rg -n "UPDATE players SET last_seen|SET last_seen =|touch_player_online|touch_presence_bulk" game || true
          echo '=== READS ==='
          rg -n "last_seen" game --glob '*.py' || true
