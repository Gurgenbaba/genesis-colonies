name: Research Lab Ascension UI Fix

on:
  push:
    branches:
      - fix/research-lab-ascension-building-flow
    paths:
      - .github/workflows/research-lab-ascension-ui-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: research-lab-ascension-ui-ci-only
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/research-lab-ascension-building-flow
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements-prod.txt pytest
      - name: Apply i18n hardening
        run: |
          python scripts/_fix_research_lab_ascension_i18n.py
          python scripts/_mark_research_lab_i18n_structural_lines_v2.py
      - name: Static and i18n gates
        run: |
          node --check static/js/pages/research_lab_ascension.js
          python scripts/audit_locale_keys.py
          python scripts/audit_visible_i18n.py --locales-only
          python scripts/audit_visible_i18n.py --raw-only --diff-base origin/main --max-findings 200
          git diff --check
      - name: Focused research and panel regressions
        run: |
          python -m pytest -q --tb=line \
            tests/test_research_lab_ascension.py \
            tests/test_gc_perf_buildings_002.py \
            tests/test_i18n_hardening.py
      - name: Commit verified hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/buildings.html static/js/pages/research_lab_ascension.js
          git diff --cached --check
          git commit -m 'fix: localize research lab ascension dialog'
          git push origin HEAD:fix/research-lab-ascension-building-flow
