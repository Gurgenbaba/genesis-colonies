name: UNI1 Release Candidate Gate

on:
  pull_request:
    paths:
      - "tests/test_uni1_rc_parallel_auth_pg.py"
      - ".github/workflows/uni1-rc-gate.yml"

permissions:
  contents: read

concurrency:
  group: uni1-rc-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-parallel-auth:
    name: uni1-pg-parallel-auth
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: genesis
          POSTGRES_PASSWORD: genesis
          POSTGRES_DB: genesis_rc
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U genesis -d genesis_rc"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-uni1-rc-gate-secret-key-not-for-production
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: postgres
      DATABASE_URL: postgresql://genesis:genesis@127.0.0.1:5432/genesis_rc
      GC_TEST_POSTGRES_URL: postgresql://genesis:genesis@127.0.0.1:5432/genesis_rc
      GC_PG_CONNECT_TIMEOUT: "10"
      GC_PG_POOL_TIMEOUT: "3"
      GC_PG_STATEMENT_TIMEOUT: "45s"
      GC_PG_LOCK_TIMEOUT: "10s"
      GC_PG_POOL_MAX: "10"
      GC_REQUEST_PERF_SAMPLE: "1.0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest

      - name: Compile RC sentinel
        run: |
          python -m py_compile tests/test_uni1_rc_parallel_auth_pg.py
          git diff --check

      - name: Apply exact PostgreSQL schema
        run: python migrate.py

      - name: Run five-account authenticated PostgreSQL gate
        run: |
          python -m pytest -q -s --tb=line             tests/test_uni1_rc_parallel_auth_pg.py             tests/test_gc_pg_142_presence_pool_starvation.py             tests/test_gc_pg_166_presence_secondary.py             tests/test_gc_pg_167_autoplay_admin_presence.py             tests/test_gc_pg_168_vote_presence.py             tests/test_gc_pg_169_pirate_target_presence.py             tests/test_gc_pg_170_admin_legacy_presence.py             tests/test_gc_pg_171_presence_history_backfill.py

      - name: Run PostgreSQL route and ownership sentinels
        run: |
          python -m pytest -q -s --tb=line             tests/test_gc_perf_pg_navigation_030.py             tests/test_gc_pg_175_planet_context_hot_row.py             tests/test_gc_pg_shipyard_single_request_conn.py             tests/test_gc_pg_trader_hub_single_conn.py             tests/test_gc_pg_expedition_ledger_race_006.py
