name: GC Nanofactory L50 Persistence Apply

on:
  push:
    branches:
      - fix/nanofactory-l50-persistence

concurrency:
  group: gc-nano-l50-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: '0'
      SECRET_KEY: ci-nano-l50-secret-key-not-for-production-use
      GC_SKIP_MIGRATION_CHECK: '1'
      GC_EMBEDDED_CRON: '0'
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nanofactory-l50-persistence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Apply L50 persistence patch
        run: python scripts/apply_gc_nano_l50_persistence.py
      - name: Run balance regressions
        run: |
          python -m pytest -q tests/test_gc_prod_nanofactory_l50_persistence.py tests/test_gc863a_building_balance_hardening.py tests/test_gc863_building_balance_rework.py
          python -m py_compile game/economy_balance.py
          git diff --check
      - name: Commit validated source patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/apply_gc_nano_l50_persistence.py .github/workflows/gc-nano-l50-persistence-apply.yml
          git add game/economy_balance.py tests/test_gc863a_building_balance_hardening.py tests/test_gc_prod_nanofactory_l50_persistence.py
          git commit -m 'fix(balance): keep nanofactory L50 queue cost DB-safe'
          git push origin HEAD:fix/nanofactory-l50-persistence
