name: GC PE Clarity UI Apply

on:
  push:
    branches: [feature/planet-evolution-clarity]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: '0'
      SECRET_KEY: ci-pe-clarity-ui-not-for-production
      GC_SKIP_MIGRATION_CHECK: '1'
      GC_EMBEDDED_CRON: '0'
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/planet-evolution-clarity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Apply impact UI, hero cleanup and locale parity
        shell: bash
        run: |
          cat > /tmp/apply_pe_clarity_ui.py <<'PY'
          from pathlib import Path
          import json

          def replace_one(path, old, new, label):
              p=Path(path); src=p.read_text(encoding='utf-8'); n=src.count(old)
              if n != 1: raise SystemExit(f'{label}: expected 1 anchor, got {n}')
              p.write_text(src.replace(old,new,1),encoding='utf-8')

          # Failure target labels stay inside the PE locale namespace.
          replace_one(
              'game/planet_evolution/impact.py',
              '"target_label_key": f"failure_{failure_key}",',
              '"target_label_key": f"pe_failure_{failure_key}",',
              'failure locale namespace',
          )

          template=Path('templates/planet_evolution.html')
          src=template.read_text(encoding='utf-8')
          anchor='{% macro pe_tech_info_source(tech) %}\n'
          macro='''{% macro pe_impact_contract(impact, compact=false) %}\n  {% set rows = impact.rows if impact and impact.rows is defined else [] %}\n  {% set scopes = impact.scopes if impact and impact.scopes is defined else [] %}\n  <div class="pe-impact-contract{% if compact %} pe-impact-contract--compact{% endif %}">\n    {% if (impact.current is defined and impact.current is not none) or impact.current_label_key %}\n    <div class="pe-impact-state-grid">\n      <div class="pe-impact-state">\n        <span class="pe-impact-kicker">{{ T('pe_impact_current', 'Aktuell') }}</span>\n        <strong>{% if impact.current is defined and impact.current is not none %}{{ T('label_level_short', 'L') }}{{ impact.current }}{% elif impact.current_label_key %}{{ T(impact.current_label_key, pe_humanize_key(impact.current_label_key)) }}{% else %}{{ T('pe_impact_none', 'Keine') }}{% endif %}</strong>\n      </div>\n      <span class="pe-impact-arrow" aria-hidden="true">→</span>\n      <div class="pe-impact-state">\n        <span class="pe-impact-kicker">{{ T('pe_impact_after', 'Danach') }}</span>\n        <strong>{% if impact.after is defined and impact.after is not none %}{{ T('label_level_short', 'L') }}{{ impact.after }}{% elif impact.after_label_key %}{{ T(impact.after_label_key, pe_humanize_key(impact.after_label_key)) }}{% else %}{{ T('pe_impact_none', 'Keine') }}{% endif %}</strong>\n      </div>\n    </div>\n    {% endif %}\n    <div class="pe-impact-change">\n      <span class="pe-impact-kicker">{{ T('pe_impact_change', 'Änderung') }}</span>\n      {% if rows %}\n      <ul class="pe-impact-list">\n        {% for row in rows %}\n        <li class="pe-impact-row">\n          <span class="pe-impact-row-name">{{ T(row.label_key, pe_humanize_key(row.target or row.label_key)) }}</span>\n          {% if row.kind == 'culture_change' %}\n            <strong class="gc-mono">{{ row.current }} → {{ row.after }} <span class="pe-impact-delta">({{ row.value }})</span></strong>\n          {% elif row.value %}\n            <strong class="gc-mono">{{ row.value }}{% if row.kind == 'culture_drift' %} {{ T('pe_impact_per_day', 'pro Tag') }}{% endif %}</strong>\n          {% else %}\n            <strong>{{ T('pe_impact_enabled', 'Aktiv') }}</strong>\n          {% endif %}\n          {% if row.target %}\n            {% set target_text = T(row.target_label_key, '') if row.target_label_key else '' %}\n            <span class="pe-impact-target">{{ target_text if target_text and target_text != row.target_label_key else pe_humanize_key(row.target|replace(':', '_')) }}</span>\n          {% endif %}\n        </li>\n        {% endfor %}\n      </ul>\n      {% else %}\n      <p class="pe-impact-empty">{{ T('pe_impact_no_runtime_change', 'Diese Aktion verändert aktuell keinen zusätzlichen Laufzeit-Modifikator.') }}</p>\n      {% endif %}\n    </div>\n    {% if scopes %}\n    <div class="pe-impact-scopes">\n      <span class="pe-impact-kicker">{{ T('pe_impact_applies_to', 'Wirkt auf') }}</span>\n      <span class="pe-impact-scope-list">{% for scope in scopes %}<span class="pe-impact-scope">{{ T(scope, pe_humanize_key(scope)) }}</span>{% endfor %}</span>\n    </div>\n    {% endif %}\n  </div>\n{% endmacro %}\n\n'''
          if src.count(anchor)!=1: raise SystemExit(f'impact macro anchor={src.count(anchor)}')
          src=src.replace(anchor,macro+anchor,1)

          # Research: visible compact impact plus full contract in the existing info surface.
          old='''      {% if tech.reward_xp is defined and tech.reward_xp %}\n      <span class="pe-tech-reward-chip gc-mono">{{ T('pe_tech_reward_chip', '⭐ +%(xp)s XP', xp=(tech.reward_xp|int)) }}</span>\n      {% endif %}\n'''
          new=old+'''      <div class="pe-tech-impact-inline">\n        <span class="pe-impact-kicker">{{ T('pe_impact_change', 'Änderung') }}</span>\n        {% if tech.impact.rows %}\n          {% set first_fx = tech.impact.rows[0] %}\n          <strong>{{ T(first_fx.label_key, pe_humanize_key(first_fx.target or first_fx.label_key)) }}{% if first_fx.value %} <span class="gc-mono">{{ first_fx.value }}</span>{% endif %}</strong>\n          {% if tech.impact.scopes %}<span class="pe-tech-impact-scope">· {{ T('pe_impact_applies_to', 'Wirkt auf') }}: {{ T(tech.impact.scopes[0], pe_humanize_key(tech.impact.scopes[0])) }}</span>{% endif %}\n        {% else %}\n          <span>{{ T('pe_impact_no_runtime_change', 'Diese Aktion verändert aktuell keinen zusätzlichen Laufzeit-Modifikator.') }}</span>\n        {% endif %}\n      </div>\n'''
          if src.count(old)!=1: raise SystemExit(f'research inline anchor={src.count(old)}')
          src=src.replace(old,new,1)
          old='''    <p class="pe-info-popover-title">{{ T(tech.label_key, pe_humanize_key(tech.tech_key)) }}</p>\n    <dl class="pe-info-popover-list">\n'''
          new='''    <p class="pe-info-popover-title">{{ T(tech.label_key, pe_humanize_key(tech.tech_key)) }}</p>\n    {{ pe_impact_contract(tech.impact) }}\n    <dl class="pe-info-popover-list">\n'''
          if src.count(old)!=1: raise SystemExit(f'research full impact anchor={src.count(old)}')
          src=src.replace(old,new,1)

          # Hero: remove duplicated current-research reward and expedition-counter detail.
          old='''          {% if prog.current_research_reward_xp %}\n          <p class="pe-hero-xp-reward hint gc-mono">{{ T('pe_hero_current_research_xp', 'Aktuelle Forschung: +%(xp)s XP', xp=(prog.current_research_reward_xp|int)) }}</p>\n          {% endif %}\n'''
          if src.count(old)!=1: raise SystemExit(f'hero research xp anchor={src.count(old)}')
          src=src.replace(old,'',1)
          old='''        {% if axp.visible %}\n        <div class="pe-activity-xp pe-activity-xp--inline pe-activity-xp--theater">\n          <span class="pe-activity-xp-stat">{{ T('pe_activity_xp_today', 'Heute verdient: %(xp)s XP', xp=(axp.today_earned or 0)|int) }}</span>\n          <span class="pe-activity-xp-stat gc-mono">{{ T('pe_activity_xp_expedition_progress', 'Expeditionen: %(count)s/%(max)s bis Bonus', count=(axp.expedition_progress or 0)|int, max=(axp.expedition_bonus_every or 10)|int) }}</span>\n        </div>\n        {% endif %}\n'''
          new='''        {% if axp.visible and (axp.today_earned or 0)|int > 0 %}\n        <div class="pe-activity-xp pe-activity-xp--inline pe-activity-xp--theater">\n          <span class="pe-activity-xp-stat">{{ T('pe_activity_xp_today', 'Heute verdient: %(xp)s XP', xp=(axp.today_earned or 0)|int) }}</span>\n        </div>\n        {% endif %}\n'''
          if src.count(old)!=1: raise SystemExit(f'hero activity anchor={src.count(old)}')
          src=src.replace(old,new,1)

          # Crisis clarity lives above decisions in the goal panel.
          old='''      <div class="pe-goal-body">\n      {% if ps.active_event %}\n'''
          crisis='''      <div class="pe-goal-body">\n      {% set crisis = dash.crisis_ux if dash.crisis_ux is defined else {} %}\n      {% if crisis.active %}\n      <section class="pe-crisis-clarity" aria-label="{{ T('pe_crisis_clarity_title', 'Aktive Krise') }}">\n        <div class="pe-crisis-clarity-head">\n          <strong>{{ T('pe_crisis_clarity_title', 'Aktive Krise') }}</strong>\n          <span>{{ T('pe_crisis_clarity_body', 'Diese Zustände verändern den Planeten, bis ihre Erholung abgeschlossen ist.') }}</span>\n        </div>\n        <ul class="pe-crisis-list">\n          {% for failure in crisis.failures %}\n          <li>\n            <strong>{{ T('pe_failure_' ~ failure.failure_key, pe_humanize_key(failure.failure_key)) }}</strong>\n            {% if failure.remaining_seconds is not none %}<span>{{ T('pe_impact_recovery', 'Erholung') }}: {{ render_prog_duration(failure.remaining_seconds) }}</span>{% endif %}\n          </li>\n          {% endfor %}\n        </ul>\n        {{ pe_impact_contract({'rows': crisis.rows, 'scopes': crisis.scopes}, true) }}\n        <p class="pe-crisis-recovery-hint">{{ T('pe_crisis_recovery_hint', 'Nach Ablauf der Erholung wird der Krisenzustand automatisch neu bewertet.') }}</p>\n      </section>\n      {% endif %}\n      {% if ps.active_event %}\n'''
          if src.count(old)!=1: raise SystemExit(f'crisis UI anchor={src.count(old)}')
          src=src.replace(old,crisis,1)

          # Event choices: effect is visible before the decision button is usable.
          old='''          <div class="pe-goal-buttons">\n            {% for c in ps.active_event.choices or [] %}\n            <button type="button" class="gc-btn gc-btn-primary pe-event-choice" data-choice-key="{{ c.key }}">{{ T('pe_event_choice_' ~ c.key, c.key) }}</button>\n            {% endfor %}\n          </div>\n'''
          new='''          <div class="pe-goal-buttons pe-event-choice-grid">\n            {% for c in ps.active_event.choices or [] %}\n            <article class="pe-event-choice-card">\n              <h4>{{ T('pe_event_choice_' ~ c.key, pe_humanize_key(c.key)) }}</h4>\n              {{ pe_impact_contract(c.impact, true) }}\n              <button type="button" class="gc-btn gc-btn-primary pe-event-choice" data-choice-key="{{ c.key }}">{{ T('pe_event_choice_commit', 'Entscheidung ausführen') }}</button>\n            </article>\n            {% endfor %}\n          </div>\n'''
          if src.count(old)!=1: raise SystemExit(f'event choice anchor={src.count(old)}')
          src=src.replace(old,new,1)

          # Policy options: replace naked action buttons with impact cards.
          old='''              {% for opt in slot.options if opt.eligible %}\n              <button type="button" class="gc-btn gc-btn-secondary gc-btn-sm pe-policy-option" data-policy-key="{{ opt.policy_key }}">{{ T(opt.label_key, opt.policy_key) }}</button>\n              {% endfor %}\n'''
          new='''              {% for opt in slot.options if opt.eligible %}\n              <article class="pe-policy-option-card">\n                <h4>{{ T(opt.label_key, pe_humanize_key(opt.policy_key)) }}</h4>\n                {{ pe_impact_contract(opt.impact, true) }}\n                <button type="button" class="gc-btn gc-btn-secondary gc-btn-sm pe-policy-option" data-policy-key="{{ opt.policy_key }}">{{ T('pe_policy_activate', 'Policy aktivieren') }}</button>\n              </article>\n              {% endfor %}\n'''
          if src.count(old)!=1: raise SystemExit(f'policy option anchor={src.count(old)}')
          src=src.replace(old,new,1)

          # Ascension cards: show permanent live effect before any ascension action.
          old='''              <article class="gc-ascension-card{% if card.completed %} completed{% elif card.active %} active{% endif %}">\n                <h4>{{ T(card.label_key, card.ascension_key) }}</h4>\n              </article>\n'''
          new='''              <article class="gc-ascension-card{% if card.completed %} completed{% elif card.active %} active{% endif %}">\n                <h4>{{ T(card.label_key, pe_humanize_key(card.ascension_key)) }}</h4>\n                {{ pe_impact_contract(card.impact, true) }}\n              </article>\n'''
          if src.count(old)!=1: raise SystemExit(f'ascension anchor={src.count(old)}')
          src=src.replace(old,new,1)
          template.write_text(src,encoding='utf-8')

          # Scoped square UI; no global geometry changes.
          style=Path('static/style.css')
          css='''\n\n/* GC-PE-UX-01 — canonical impact clarity contract */\n.pe-impact-contract{display:grid;gap:.55rem;padding:.65rem;border:1px solid rgba(135,185,220,.24);background:rgba(8,18,28,.42);border-radius:0}\n.pe-impact-contract--compact{padding:.55rem;gap:.4rem}\n.pe-impact-state-grid{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:.45rem;align-items:center}\n.pe-impact-state{display:grid;gap:.15rem;min-width:0}\n.pe-impact-state:last-child{text-align:right}\n.pe-impact-arrow{opacity:.62;font-weight:800}\n.pe-impact-kicker{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;opacity:.72;font-weight:800}\n.pe-impact-list,.pe-crisis-list{list-style:none;margin:.25rem 0 0;padding:0;display:grid;gap:.3rem}\n.pe-impact-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.25rem .55rem;align-items:baseline}\n.pe-impact-target{grid-column:1/-1;font-size:.72rem;opacity:.66}\n.pe-impact-delta{opacity:.72}\n.pe-impact-empty{margin:.2rem 0 0;font-size:.78rem;opacity:.78}\n.pe-impact-scopes{display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}\n.pe-impact-scope-list{display:flex;gap:.3rem;flex-wrap:wrap}\n.pe-impact-scope{padding:.14rem .38rem;border:1px solid rgba(135,185,220,.22);font-size:.7rem;font-weight:700;border-radius:0}\n.pe-tech-impact-inline{display:flex;gap:.35rem;align-items:baseline;flex-wrap:wrap;margin-top:.35rem;font-size:.74rem}\n.pe-tech-impact-scope{opacity:.7}\n.pe-policy-option-card,.pe-event-choice-card{display:grid;gap:.55rem;padding:.7rem;border:1px solid rgba(135,185,220,.2);background:rgba(6,16,26,.36);border-radius:0}\n.pe-policy-option-card h4,.pe-event-choice-card h4{margin:0}\n.pe-event-choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.65rem}\n.pe-crisis-clarity{display:grid;gap:.65rem;padding:.8rem;border:1px solid rgba(230,128,90,.42);background:rgba(55,18,14,.28);border-radius:0}\n.pe-crisis-clarity-head{display:grid;gap:.15rem}\n.pe-crisis-list li{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap}\n.pe-crisis-recovery-hint{margin:0;font-size:.78rem;opacity:.78}\n@media(max-width:700px){.pe-impact-state-grid{grid-template-columns:1fr}.pe-impact-arrow{transform:rotate(90deg);justify-self:center}.pe-impact-state:last-child{text-align:left}.pe-impact-row{grid-template-columns:1fr}.pe-event-choice-grid{grid-template-columns:1fr}}\n'''
          text=style.read_text(encoding='utf-8')
          if '/* GC-PE-UX-01 — canonical impact clarity contract */' in text: raise SystemExit('style marker already present')
          style.write_text(text+css,encoding='utf-8')

          # All 8 locales receive the same key set. Values are concise UI labels.
          translations={
          'de':{
          'pe_impact_current':'Aktuell','pe_impact_after':'Danach','pe_impact_change':'Änderung','pe_impact_applies_to':'Wirkt auf','pe_impact_none':'Keine','pe_impact_enabled':'Aktiv','pe_impact_no_runtime_change':'Diese Aktion verändert aktuell keinen zusätzlichen Laufzeit-Modifikator.','pe_impact_per_day':'pro Tag','pe_impact_recovery':'Erholung','pe_crisis_clarity_title':'Aktive Krise','pe_crisis_clarity_body':'Diese Zustände verändern den Planeten, bis ihre Erholung abgeschlossen ist.','pe_crisis_recovery_hint':'Nach Ablauf der Erholung wird der Krisenzustand automatisch neu bewertet.','pe_event_choice_commit':'Entscheidung ausführen','pe_policy_activate':'Policy aktivieren',
          'pe_impact_scope_planet':'Planet','pe_impact_scope_research':'Planet-Forschung','pe_impact_scope_chains':'Produktionsketten','pe_impact_scope_conversion':'Umwandlung','pe_impact_scope_trade':'Handel & Export','pe_impact_scope_discoveries':'Entdeckungen','pe_impact_scope_experimental':'Experimental-Systeme','pe_impact_scope_policies':'Policies','pe_impact_scope_events':'Ereignisse','pe_impact_scope_culture':'Kultur','pe_impact_scope_queues':'Warteschlangen','pe_impact_scope_resources':'Spezialressourcen','pe_impact_scope_risk':'Risiko & Krisen',
          'pe_impact_effect_unlock':'Freischaltung','pe_impact_effect_export_unlock':'Export-Freischaltung','pe_impact_effect_queue_limit':'Warteschlangenlimit','pe_impact_effect_event_pool':'Ereignispool','pe_impact_effect_policy_unlock':'Policy-Freischaltung','pe_impact_effect_research_speed':'Forschungsgeschwindigkeit','pe_impact_effect_chain_output':'Kettenproduktion','pe_impact_effect_auto_conversion':'Auto-Umwandlung','pe_impact_effect_trade_routes':'Handelsrouten','pe_impact_effect_discovery_chance':'Entdeckungschance','pe_impact_effect_experimental_slots':'Experimental-Slots','pe_impact_effect_export_slots':'Export-Slots','pe_impact_effect_stability':'Stabilität','pe_impact_effect_auto_research':'Auto-Forschung','pe_impact_effect_experimental_access':'Experimentalzugang','pe_impact_effect_policy_tier':'Policy-Tier','pe_impact_effect_runtime_flag':'Laufzeit-Modifikator','pe_impact_effect_risk_modifier':'Risiko-Modifikator','pe_impact_effect_resource_gain':'Ressourcengewinn','pe_impact_effect_failure':'Folgezustand',
          'pe_culture_stability':'Stabilität','pe_culture_loyalty':'Loyalität','pe_culture_prosperity':'Wohlstand','pe_culture_militarization':'Militarisierung','pe_culture_science_focus':'Wissenschaftsfokus','pe_culture_crime':'Kriminalität','pe_culture_industrial_pressure':'Industriebelastung',
          },
          'en':{
          'pe_impact_current':'Current','pe_impact_after':'After','pe_impact_change':'Change','pe_impact_applies_to':'Affects','pe_impact_none':'None','pe_impact_enabled':'Active','pe_impact_no_runtime_change':'This action currently adds no additional runtime modifier.','pe_impact_per_day':'per day','pe_impact_recovery':'Recovery','pe_crisis_clarity_title':'Active crisis','pe_crisis_clarity_body':'These states affect the planet until recovery completes.','pe_crisis_recovery_hint':'When recovery expires, the crisis state is evaluated automatically.','pe_event_choice_commit':'Execute decision','pe_policy_activate':'Activate policy',
          'pe_impact_scope_planet':'Planet','pe_impact_scope_research':'Planet research','pe_impact_scope_chains':'Production chains','pe_impact_scope_conversion':'Conversion','pe_impact_scope_trade':'Trade & export','pe_impact_scope_discoveries':'Discoveries','pe_impact_scope_experimental':'Experimental systems','pe_impact_scope_policies':'Policies','pe_impact_scope_events':'Events','pe_impact_scope_culture':'Culture','pe_impact_scope_queues':'Queues','pe_impact_scope_resources':'Special resources','pe_impact_scope_risk':'Risk & crises',
          'pe_impact_effect_unlock':'Unlock','pe_impact_effect_export_unlock':'Export unlock','pe_impact_effect_queue_limit':'Queue limit','pe_impact_effect_event_pool':'Event pool','pe_impact_effect_policy_unlock':'Policy unlock','pe_impact_effect_research_speed':'Research speed','pe_impact_effect_chain_output':'Chain output','pe_impact_effect_auto_conversion':'Auto conversion','pe_impact_effect_trade_routes':'Trade routes','pe_impact_effect_discovery_chance':'Discovery chance','pe_impact_effect_experimental_slots':'Experimental slots','pe_impact_effect_export_slots':'Export slots','pe_impact_effect_stability':'Stability','pe_impact_effect_auto_research':'Auto research','pe_impact_effect_experimental_access':'Experimental access','pe_impact_effect_policy_tier':'Policy tier','pe_impact_effect_runtime_flag':'Runtime modifier','pe_impact_effect_risk_modifier':'Risk modifier','pe_impact_effect_resource_gain':'Resource gain','pe_impact_effect_failure':'Consequence',
          'pe_culture_stability':'Stability','pe_culture_loyalty':'Loyalty','pe_culture_prosperity':'Prosperity','pe_culture_militarization':'Militarization','pe_culture_science_focus':'Science focus','pe_culture_crime':'Crime','pe_culture_industrial_pressure':'Industrial pressure',
          },
          'fr':{
          'pe_impact_current':'Actuel','pe_impact_after':'Après','pe_impact_change':'Changement','pe_impact_applies_to':'Affecte','pe_impact_none':'Aucun','pe_impact_enabled':'Actif','pe_impact_no_runtime_change':'Cette action n’ajoute actuellement aucun modificateur d’exécution supplémentaire.','pe_impact_per_day':'par jour','pe_impact_recovery':'Récupération','pe_crisis_clarity_title':'Crise active','pe_crisis_clarity_body':'Ces états affectent la planète jusqu’à la fin de la récupération.','pe_crisis_recovery_hint':'À la fin de la récupération, l’état de crise est réévalué automatiquement.','pe_event_choice_commit':'Exécuter la décision','pe_policy_activate':'Activer la politique',
          'pe_impact_scope_planet':'Planète','pe_impact_scope_research':'Recherche planétaire','pe_impact_scope_chains':'Chaînes de production','pe_impact_scope_conversion':'Conversion','pe_impact_scope_trade':'Commerce et export','pe_impact_scope_discoveries':'Découvertes','pe_impact_scope_experimental':'Systèmes expérimentaux','pe_impact_scope_policies':'Politiques','pe_impact_scope_events':'Événements','pe_impact_scope_culture':'Culture','pe_impact_scope_queues':'Files','pe_impact_scope_resources':'Ressources spéciales','pe_impact_scope_risk':'Risques et crises',
          'pe_impact_effect_unlock':'Déblocage','pe_impact_effect_export_unlock':'Déblocage export','pe_impact_effect_queue_limit':'Limite de file','pe_impact_effect_event_pool':'Groupe d’événements','pe_impact_effect_policy_unlock':'Déblocage politique','pe_impact_effect_research_speed':'Vitesse de recherche','pe_impact_effect_chain_output':'Production des chaînes','pe_impact_effect_auto_conversion':'Conversion automatique','pe_impact_effect_trade_routes':'Routes commerciales','pe_impact_effect_discovery_chance':'Chance de découverte','pe_impact_effect_experimental_slots':'Emplacements expérimentaux','pe_impact_effect_export_slots':'Emplacements d’export','pe_impact_effect_stability':'Stabilité','pe_impact_effect_auto_research':'Recherche automatique','pe_impact_effect_experimental_access':'Accès expérimental','pe_impact_effect_policy_tier':'Niveau de politique','pe_impact_effect_runtime_flag':'Modificateur actif','pe_impact_effect_risk_modifier':'Modificateur de risque','pe_impact_effect_resource_gain':'Gain de ressource','pe_impact_effect_failure':'Conséquence',
          'pe_culture_stability':'Stabilité','pe_culture_loyalty':'Loyauté','pe_culture_prosperity':'Prospérité','pe_culture_militarization':'Militarisation','pe_culture_science_focus':'Orientation scientifique','pe_culture_crime':'Criminalité','pe_culture_industrial_pressure':'Pression industrielle',
          },
