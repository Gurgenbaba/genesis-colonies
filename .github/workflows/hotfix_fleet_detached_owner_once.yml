name: Hotfix Fleet Detached Ownership (one-shot)

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'hotfix/fleet-tx-mutation-isolation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply detached Fleet owner refactor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Fresh, explicitly unpinned DB checkout for domain-owned work.
          p = Path('game/db.py')
          text = p.read_text(encoding='utf-8')
          anchor = '''    return conn\n\n\ndef in_transaction(conn: DbConn) -> bool:\n'''
          replacement = '''    return conn\n\n\ndef db_detached() -> DbConn:\n    \"\"\"Open a fresh backend connection without Flask request pinning.\n\n    GC-FLEET-PG-ABORT-004: domain owners such as Fleet short-TX processing\n    sometimes need a truly independent PostgreSQL checkout even while invoked\n    from an HTTP request. ``db()`` intentionally reuses the request-pinned\n    checkout; this helper deliberately bypasses that reuse. Callers own and\n    must close the returned connection.\n    \"\"\"\n    backend = get_db_backend()\n    if backend != \"postgres\":\n        # SQLite has no Flask request checkout pinning; db() is already fresh.\n        return db()\n\n    conn_t0 = time.perf_counter()\n    try:\n        from game.db_pg import connect_postgres\n\n        conn = connect_postgres()\n    except NotImplementedError:\n        raise\n    except Exception as exc:\n        if is_db_pool_timeout(exc):\n            raise DbPoolTimeout(str(exc)) from exc\n        raise NotImplementedError(f\"{_POSTGRES_NOT_CONFIGURED} ({exc})\") from exc\n\n    try:\n        from game.live_state import (\n            attach_request_perf_sql_trace,\n            is_request_perf_active,\n            record_request_perf_db_connection_open,\n            record_request_perf_phase,\n        )\n\n        record_request_perf_db_connection_open()\n        if is_request_perf_active():\n            record_request_perf_phase(\n                \"db_detached_connection_ms\",\n                (time.perf_counter() - conn_t0) * 1000.0,\n            )\n        attach_request_perf_sql_trace(conn)\n    except Exception:\n        pass\n    return conn\n\n\ndef in_transaction(conn: DbConn) -> bool:\n'''
          if anchor not in text:
              raise SystemExit('db.py detached anchor not found')
          text = text.replace(anchor, replacement, 1)
          p.write_text(text, encoding='utf-8')

          # 2) Admin force-advance becomes selected-movement, Fleet-owned short TX.
          p = Path('game/fleet.py')
          text = p.read_text(encoding='utf-8')
          old_admin = '''def admin_advance_fleet_movement(\n    movement_id: int,\n    *,\n    conn,\n    now: float | None = None,\n    complete: bool = False,\n) -> Dict[str, Any]:\n    \"\"\"Force-advance one fleet movement via due timestamps + process_fleet_tick (GC-621G).\"\"\"\n    if not fleet_schema_ready(conn):\n        return {\"ok\": False, \"error\": \"fleet_unavailable\"}\n\n    mid = int(movement_id)\n    ts = float(now if now is not None else _now())\n    max_steps = 8 if complete else 1\n    steps = 0\n    tick_snapshots: List[Dict[str, Any]] = []\n    status_before = \"\"\n\n    cur = conn.cursor()\n    cur.execute(\"SELECT status FROM fleet_movements WHERE id = ? LIMIT 1;\", (mid,))\n    first = cur.fetchone()\n    if not first:\n        return {\"ok\": False, \"error\": \"not_found\", \"movement_id\": mid}\n    status_before = str(first[\"status\"] or \"\")\n\n    for _ in range(max_steps):\n        cur.execute(\"SELECT * FROM fleet_movements WHERE id = ? LIMIT 1;\", (mid,))\n        row = cur.fetchone()\n        if not row:\n            break\n        status = str(row[\"status\"] or \"\")\n        if status in (\"completed\", \"failed\"):\n            break\n\n        player_id = int(row[\"player_id\"])\n        if status == \"outbound\":\n            cur.execute(\n                \"UPDATE fleet_movements SET arrival_at = ? WHERE id = ? AND status = 'outbound';\",\n                (ts - 1, mid),\n            )\n        elif status == \"holding\":\n            cur.execute(\n                \"UPDATE fleet_movements SET holding_until = ? WHERE id = ? AND status = 'holding';\",\n                (ts - 1, mid),\n            )\n        elif status == \"returning\":\n            cur.execute(\n                \"UPDATE fleet_movements SET return_at = ? WHERE id = ? AND status = 'returning';\",\n                (ts - 1, mid),\n            )\n        else:\n            return {\n                \"ok\": False,\n                \"error\": \"unsupported_status\",\n                \"status\": status,\n                \"movement_id\": mid,\n            }\n\n        tick_result = process_fleet_tick(player_id=player_id, now=ts, conn=conn)\n        tick_snapshots.append(dict(tick_result))\n        steps += 1\n\n        if not complete:\n            break\n\n    cur.execute(\"SELECT status FROM fleet_movements WHERE id = ? LIMIT 1;\", (mid,))\n    final_row = cur.fetchone()\n    status_after = str(final_row[\"status\"] if final_row else \"\")\n\n    return {\n        \"ok\": True,\n        \"movement_id\": mid,\n        \"status_before\": status_before,\n        \"status_after\": status_after,\n        \"steps\": steps,\n        \"complete\": bool(complete),\n        \"tick\": tick_snapshots[-1] if tick_snapshots else {},\n    }\n'''
          new_admin = '''def admin_advance_fleet_movement(\n    movement_id: int,\n    *,\n    conn,\n    now: float | None = None,\n    complete: bool = False,\n) -> Dict[str, Any]:\n    \"\"\"Force-advance exactly one Fleet through Fleet-owned short transactions.\n\n    Production callers should use ``admin_advance_fleet_movement_owned`` so the\n    connection is detached from Flask request pinning. ``conn`` remains injectable\n    for tests and maintenance tooling.\n    \"\"\"\n    if not fleet_schema_ready(conn):\n        return {\"ok\": False, \"error\": \"fleet_unavailable\"}\n\n    mid = int(movement_id)\n    ts = float(now if now is not None else _now())\n    max_steps = 8 if complete else 1\n    steps = 0\n    tick_snapshots: List[Dict[str, Any]] = []\n\n    cur = conn.cursor()\n    cur.execute(\"SELECT status FROM fleet_movements WHERE id = ? LIMIT 1;\", (mid,))\n    first = cur.fetchone()\n    if not first:\n        return {\"ok\": False, \"error\": \"not_found\", \"movement_id\": mid}\n    status_before = str(first[\"status\"] or \"\")\n\n    for _ in range(max_steps):\n        cur.execute(\n            \"SELECT status, player_id, mission_type FROM fleet_movements WHERE id = ? LIMIT 1;\",\n            (mid,),\n        )\n        row = cur.fetchone()\n        if not row:\n            break\n        status = str(row[\"status\"] or \"\")\n        if status in (\"completed\", \"failed\"):\n            break\n\n        player_id = int(row[\"player_id\"])\n        mission = str(row[\"mission_type\"] or \"\")\n        counter_key = \"\"\n        fail_fn = None\n        fail_missions = None\n        if status == \"outbound\":\n            handler = _handle_arrival\n            counter_key = \"processed_arrivals\"\n            fail_fn = _fail_outbound_movement\n            fail_missions = {\"attack\", \"expedition\"}\n        elif status == \"holding\":\n            handler = _handle_holding_end\n            counter_key = \"processed_holding\"\n        elif status == \"returning\":\n            handler = _handle_return\n            counter_key = \"processed_returns\"\n            fail_fn = _fail_returning_movement\n        else:\n            return {\n                \"ok\": False,\n                \"error\": \"unsupported_status\",\n                \"status\": status,\n                \"movement_id\": mid,\n            }\n\n        handled, err = _run_one_movement_short_tx(\n            conn,\n            movement_id=mid,\n            expect_status=status,\n            handler=handler,\n            now=ts,\n            fail_fn=fail_fn,\n            fail_missions=fail_missions,\n            context_player_id=player_id,\n            context_mission=mission,\n        )\n        tick_result = {\n            \"processed_arrivals\": 0,\n            \"processed_holding\": 0,\n            \"processed_returns\": 0,\n            \"errors\": [err] if err else [],\n        }\n        if handled and counter_key:\n            tick_result[counter_key] = 1\n        tick_snapshots.append(tick_result)\n        steps += 1\n\n        if err:\n            return {\n                \"ok\": False,\n                \"error\": \"advance_failed\",\n                \"detail\": err,\n                \"movement_id\": mid,\n                \"status_before\": status_before,\n                \"steps\": steps,\n                \"tick\": tick_result,\n            }\n        if not handled or not complete:\n            break\n\n    cur.execute(\"SELECT status FROM fleet_movements WHERE id = ? LIMIT 1;\", (mid,))\n    final_row = cur.fetchone()\n    status_after = str(final_row[\"status\"] if final_row else \"\")\n\n    return {\n        \"ok\": True,\n        \"movement_id\": mid,\n        \"status_before\": status_before,\n        \"status_after\": status_after,\n        \"steps\": steps,\n        \"complete\": bool(complete),\n        \"tick\": tick_snapshots[-1] if tick_snapshots else {},\n    }\n\n\ndef admin_advance_fleet_movement_owned(\n    movement_id: int,\n    *,\n    now: float | None = None,\n    complete: bool = False,\n) -> Dict[str, Any]:\n    \"\"\"Production/admin boundary: selected Fleet on a detached DB checkout.\"\"\"\n    from .db import db_detached\n\n    conn = db_detached()\n    try:\n        return admin_advance_fleet_movement(\n            int(movement_id),\n            conn=conn,\n            now=now,\n            complete=bool(complete),\n        )\n    finally:\n        conn.close()\n'''
          if old_admin not in text:
              raise SystemExit('fleet admin advance anchor not found')
          text = text.replace(old_admin, new_admin, 1)

          old_safety = '''def process_player_due_fleets_now(\n    player_id: int,\n    *,\n    now: Optional[float] = None,\n    max_movements: Optional[int] = None,\n    max_ms: Optional[float] = None,\n) -> Dict[str, Any]:\n    \"\"\"Bounded short-TX safety-net for an online player with genuinely due fleets.\n\n    This is not a second polling engine. Callers first use player_fleet_is_dirty\n    (indexed deadline probe) and invoke this only after a real deadline has passed.\n    A dedicated connection keeps a mass return wave out of the caller request TX.\n    \"\"\"\n    import os\n\n    is_postgres = get_db_backend() == \"postgres\"\n    default_max_movements = 256 if is_postgres else 64\n    default_max_ms = 900.0 if is_postgres else 400.0\n\n    if max_movements is None:\n        try:\n            max_movements = int(\n                os.environ.get(\n                    \"GC_POLL_FLEET_MAX_MOVEMENTS\",\n                    str(default_max_movements),\n                )\n                or default_max_movements\n            )\n        except (TypeError, ValueError):\n            max_movements = default_max_movements\n    if max_ms is None:\n        try:\n            max_ms = float(\n                os.environ.get(\"GC_POLL_FLEET_MAX_MS\", str(default_max_ms))\n                or default_max_ms\n            )\n        except (TypeError, ValueError):\n            max_ms = default_max_ms\n\n    return process_fleet_tick(\n        player_id=int(player_id),\n        now=now,\n        conn=None,\n        manage_transaction=True,\n        max_movements=max(1, int(max_movements)),\n        max_ms=max(50.0, float(max_ms)),\n        prioritize_returns=True,\n    )\n'''
          new_safety = '''def process_player_due_fleets_now(\n    player_id: int,\n    *,\n    now: Optional[float] = None,\n    max_movements: Optional[int] = None,\n    max_ms: Optional[float] = None,\n) -> Dict[str, Any]:\n    \"\"\"Bounded short-TX safety-net on a truly detached Fleet connection.\n\n    ``db()`` is request-pinned on PostgreSQL, so ``conn=None`` is not sufficient\n    to guarantee isolation when this safety-net runs from an HTTP request.\n    \"\"\"\n    import os\n    from .db import db_detached\n\n    is_postgres = get_db_backend() == \"postgres\"\n    default_max_movements = 256 if is_postgres else 64\n    default_max_ms = 900.0 if is_postgres else 400.0\n\n    if max_movements is None:\n        try:\n            max_movements = int(\n                os.environ.get(\n                    \"GC_POLL_FLEET_MAX_MOVEMENTS\",\n                    str(default_max_movements),\n                )\n                or default_max_movements\n            )\n        except (TypeError, ValueError):\n            max_movements = default_max_movements\n    if max_ms is None:\n        try:\n            max_ms = float(\n                os.environ.get(\"GC_POLL_FLEET_MAX_MS\", str(default_max_ms))\n                or default_max_ms\n            )\n        except (TypeError, ValueError):\n            max_ms = default_max_ms\n\n    conn = db_detached()\n    try:\n        return process_fleet_tick(\n            player_id=int(player_id),\n            now=now,\n            conn=conn,\n            manage_transaction=True,\n            max_movements=max(1, int(max_movements)),\n            max_ms=max(50.0, float(max_ms)),\n            prioritize_returns=True,\n        )\n    finally:\n        conn.close()\n'''
          if old_safety not in text:
              raise SystemExit('fleet safety-net anchor not found')
          text = text.replace(old_safety, new_safety, 1)
          p.write_text(text, encoding='utf-8')

          # 3) Admin API delegates to Fleet-owned boundary; no outer request TX.
          p = Path('game/admin_api.py')
          text = p.read_text(encoding='utf-8')
          old_api = '''def advance_admin_fleet(admin_id: int, movement_id: int, body: Dict[str, Any]) -> Dict[str, Any]:\n    from game.fleet import admin_advance_fleet_movement, fleet_schema_ready\n\n    complete = bool(body.get(\"complete\"))\n    conn = db()\n    try:\n        if not fleet_schema_ready(conn):\n            return _err(\"fleet_unavailable\", \"Fleet schema not ready.\")\n        begin_write_transaction(conn)\n        result = admin_advance_fleet_movement(\n            int(movement_id),\n            conn=conn,\n            complete=complete,\n        )\n        if not result.get(\"ok\"):\n            rollback(conn)\n            code = str(result.get(\"error\") or \"advance_failed\")\n            return _err(code, code)\n        commit(conn)\n    except Exception:\n        rollback(conn)\n        raise\n    finally:\n        conn.close()\n\n    audit(\n        admin_id,\n        \"fleet_advance\",\n        target_type=\"fleet_movement\",\n        target_id=int(movement_id),\n        payload={\n            \"complete\": complete,\n            \"status_before\": result.get(\"status_before\"),\n            \"status_after\": result.get(\"status_after\"),\n            \"steps\": result.get(\"steps\"),\n        },\n    )\n    return _ok(**result)\n'''
          new_api = '''def advance_admin_fleet(admin_id: int, movement_id: int, body: Dict[str, Any]) -> Dict[str, Any]:\n    from game.fleet import admin_advance_fleet_movement_owned\n\n    complete = bool(body.get(\"complete\"))\n    result = admin_advance_fleet_movement_owned(\n        int(movement_id),\n        complete=complete,\n    )\n    if not result.get(\"ok\"):\n        code = str(result.get(\"error\") or \"advance_failed\")\n        return _err(code, str(result.get(\"detail\") or code))\n\n    audit(\n        admin_id,\n        \"fleet_advance\",\n        target_type=\"fleet_movement\",\n        target_id=int(movement_id),\n        payload={\n            \"complete\": complete,\n            \"status_before\": result.get(\"status_before\"),\n            \"status_after\": result.get(\"status_after\"),\n            \"steps\": result.get(\"steps\"),\n        },\n    )\n    return _ok(**result)\n'''
          if old_api not in text:
              raise SystemExit('admin_api fleet advance anchor not found')
          text = text.replace(old_api, new_api, 1)
          p.write_text(text, encoding='utf-8')

          # 4) Regression contract for the refactor boundary.
          Path('tests/test_gc_fleet_detached_owner_004.py').write_text('''from __future__ import annotations\n\nimport inspect\n\nfrom flask import Flask, g\n\nfrom game import db as dbmod\nfrom game import fleet\nfrom game import admin_api\n\n\nclass _Conn:\n    pass\n\n\ndef test_db_detached_bypasses_request_pinned_postgres_checkout(monkeypatch):\n    import game.db_pg as db_pg\n\n    app = Flask(__name__)\n    pinned = _Conn()\n    fresh = _Conn()\n    monkeypatch.setattr(dbmod, "get_db_backend", lambda: "postgres")\n    monkeypatch.setattr(db_pg, "connect_postgres", lambda: fresh)\n\n    with app.test_request_context("/"):\n        g.gc_pg_request_connection = pinned\n        out = dbmod.db_detached()\n        assert out is fresh\n        assert g.gc_pg_request_connection is pinned\n\n\ndef test_online_fleet_safety_net_uses_detached_owner():\n    source = inspect.getsource(fleet.process_player_due_fleets_now)\n    assert "db_detached" in source\n    assert "conn=conn" in source\n    assert "manage_transaction=True" in source\n    assert "conn=None" not in source\n\n\ndef test_admin_force_advance_is_selected_short_tx_not_generic_tick():\n    source = inspect.getsource(fleet.admin_advance_fleet_movement)\n    assert "_run_one_movement_short_tx(" in source\n    assert "process_fleet_tick(" not in source\n    assert "UPDATE fleet_movements SET arrival_at" not in source\n\n\ndef test_admin_api_does_not_wrap_fleet_owner_in_request_transaction():\n    source = inspect.getsource(admin_api.advance_admin_fleet)\n    assert "admin_advance_fleet_movement_owned" in source\n    assert "begin_write_transaction" not in source\n    assert "commit(" not in source\n    assert "rollback(" not in source\n''', encoding='utf-8')

          # 5) Persist this regression in the existing ownership workflow.
          p = Path('.github/workflows/pg-request-savepoint-guard.yml')
          text = p.read_text(encoding='utf-8')
          old = '''            tests/test_gc_action_tx_domain_isolation_003.py \\\n            tests/test_gc_fleet_pg_abort_001.py\n'''
          new = '''            tests/test_gc_action_tx_domain_isolation_003.py \\\n            tests/test_gc_fleet_detached_owner_004.py \\\n            tests/test_gc_fleet_pg_abort_001.py \\\n            tests/test_admin_fleet.py\n'''
          if old not in text:
              raise SystemExit('ownership workflow test anchor not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          version = Path('VERSION')
          if version.read_text(encoding='utf-8').strip() == '0.5.9.175':
              version.write_text('0.5.9.176\n', encoding='utf-8')

          Path('docs/GC-FLEET-PG-ABORT-004.md').write_text('''# GC-FLEET-PG-ABORT-004 — Detached Fleet transaction owner\n\nFollow-up to request-level PostgreSQL connection pinning. A call to `db()` from inside an HTTP request intentionally returns the request-pinned checkout, so `conn=None` alone does not mean \"dedicated connection\".\n\n`db_detached()` now provides an explicit fresh checkout for domain-owned work. Online Fleet due-work and Admin Fleet force-advance use that boundary. Admin force-advance no longer runs a generic player Fleet tick or an outer Admin request transaction: it advances exactly the selected movement phase through the existing per-movement short-TX owner.\n\nThis keeps the refactor invariant explicit: HTTP request transactions own HTTP mutations; Fleet movement state transitions own Fleet transactions.\n''', encoding='utf-8')
          PY

      - name: Targeted regressions
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
          python -m pytest -q --tb=line \
            tests/test_gc_fleet_detached_owner_004.py \
            tests/test_gc_pg_request_savepoint_guard_002.py \
            tests/test_gc_action_tx_domain_isolation_003.py \
            tests/test_gc_fleet_pg_abort_001.py \
            tests/test_admin_fleet.py

      - name: Commit refactor and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/hotfix_fleet_detached_owner_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/db.py game/fleet.py game/admin_api.py tests/test_gc_fleet_detached_owner_004.py .github/workflows/pg-request-savepoint-guard.yml docs/GC-FLEET-PG-ABORT-004.md VERSION
          git commit -m "fix: give Fleet transitions a detached transaction owner"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
