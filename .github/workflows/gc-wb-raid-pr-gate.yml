name: GC World Boss Raid PR Gate

on:
  pull_request:
    branches:
      - ci/world-boss-raid-gate
    types: [ready_for_review, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-wb-raid-secret-key-not-for-production-use
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest

      - name: Apply deterministic raid codemod
        run: python scripts/apply_gc_wb_raid_002.py

      - name: Verify codemod contract and idempotence
        run: python scripts/apply_gc_wb_raid_002.py --verify

      - name: Compile raid code
        run: |
          python -m py_compile game/world_boss.py
          python -m py_compile scripts/apply_gc_wb_raid_002.py
          python -m py_compile scripts/_apply_gc_wb_raid_002_impl.py
          python -m py_compile tests/test_world_boss_raid.py
          python -m py_compile tests/test_world_boss.py

      - name: Run World Boss regression gate
        run: |
          python -m pytest -q --tb=line \
            tests/test_world_boss_raid.py \
            tests/test_world_boss.py \
            tests/test_world_boss_companions.py \
            tests/test_static_live_updates.py

      - name: Commit generated implementation when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/world_boss.py templates/world_boss.html tests/test_world_boss_raid.py tests/test_world_boss.py
          if git diff --cached --quiet; then
            echo "Generated implementation already committed."
          else
            git commit -m "GC-WB-RAID-002 implement community raid loop"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
