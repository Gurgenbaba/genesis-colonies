name: I18N Phase 3 Support Apply

on:
  push:
    branches:
      - fix/i18n-phase3-support-worldboss
    paths:
      - scripts/_gc_i18n_phase3_support_cleanup.py
      - .github/workflows/i18n-phase3-support-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Support I18N and World Boss help patch
        run: python scripts/_gc_i18n_phase3_support_cleanup.py
      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/support.py templates/partials/special_panel.html static/main.js templates/world_boss.html static/css/world_boss_help_modal.css static/js/pages/world_boss_help.js locales tests/test_i18n_hardening.py
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "fix(i18n): localize support tickets and lift world boss help"
          git push
