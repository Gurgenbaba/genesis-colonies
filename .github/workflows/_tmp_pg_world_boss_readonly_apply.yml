name: TEMP Apply PG World Boss Readonly Payload

on:
  push:
    branches:
      - perf/pg-world-boss-readonly-payload

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/pg-world-boss-readonly-payload
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact source patch
        run: python scripts/_apply_pg_world_boss_readonly_payload.py
      - name: Verify syntax and boundary test collection
        run: |
          python -m py_compile game/world_boss.py tests/test_gc_pg_world_boss_readonly_payload.py
          grep -n "flush_auto: bool = False" game/world_boss.py
      - name: Commit generated product diff
        run: |
          if git diff --quiet -- game/world_boss.py; then
            echo "World Boss patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/world_boss.py
          git commit -m "perf(pg): keep world-boss read payload mutation-free"
          git push origin HEAD:perf/pg-world-boss-readonly-payload
