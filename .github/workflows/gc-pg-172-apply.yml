name: GC PG 172 No Legacy Presence Apply

on:
  push:
    branches:
      - perf/pg-172-no-legacy-presence

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GC_SKIP_MIGRATION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/pg-172-no-legacy-presence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Apply canonical presence cutover
        run: python scripts/apply_gc_pg_172_no_legacy_presence.py
      - name: Run presence regression suite
        run: |
          python -m pytest -q \
            tests/test_gc_pg_142_presence_pool_starvation.py \
            tests/test_gc_pg_presence_effective_readers.py \
            tests/test_gc_pg_165_presence_critical_readers.py \
            tests/test_gc_pg_166_presence_secondary.py \
            tests/test_gc_pg_172_no_legacy_presence_write.py \
            tests/test_online_player_count.py \
            tests/test_gc_prod_sqlite_stall_001a2.py
          python -m py_compile game/presence_store.py game/presence.py game/models.py game/alliance.py
          git diff --check
      - name: Commit validated production patch
        run: |
          rm scripts/apply_gc_pg_172_no_legacy_presence.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            game/presence_store.py game/presence.py game/models.py game/alliance.py \
            tests/test_gc_pg_142_presence_pool_starvation.py \
            tests/test_gc_pg_presence_effective_readers.py \
            tests/test_gc_pg_165_presence_critical_readers.py \
            tests/test_gc_pg_166_presence_secondary.py \
            tests/test_gc_pg_172_no_legacy_presence_write.py \
            scripts/apply_gc_pg_172_no_legacy_presence.py
          git commit -m 'perf(pg): remove players last_seen compatibility mirror'
          git push origin HEAD:perf/pg-172-no-legacy-presence
