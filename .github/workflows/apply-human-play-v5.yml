name: Apply Human Play V5

on:
  push:
    branches:
      - feature/human-play-loop-v5

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-play-loop-v5
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Human Play V5 codemod
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def one(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f"missing literal in {path}: {old[:120]!r}")
              write(path, text.replace(old, new, 1))

          def sub(path, pattern, replacement):
              text = read(path)
              out, count = re.subn(pattern, lambda _m: replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, got {count}: {pattern}")
              write(path, out)

          ia = "game/inactive_autoplay.py"
          ae = "game/auto_empire.py"
          tests = "tests/test_inactive_autoplay.py"
          v4tests = "tests/test_living_universe_gc2622.py"

          one(
              ia,
              "GC-INACTIVE-SHIFT-001 — Day Shift: a small shift crew (2–3) stays visibly\nonline; after a fixed tenure they rotate back to the dormant queue. Never\nfleets or expeditions.",
              "GC-INACTIVE-SHIFT-001 — Day Shift: a small shift crew (2–3) stays visibly\nonline; after a fixed tenure they rotate back to the dormant queue. Human Play\nV5 adds sparse canonical shipyard and expedition decisions without another loop.",
          )

          one(
              ia,
              'INACTIVE_ACTION_DOMAINS = ("building", "research", "defense")',
              'INACTIVE_ACTION_DOMAINS = ("building", "research", "ships", "defense", "expedition")',
          )

          sub(
              ia,
              r"INACTIVE_ACTION_WEIGHTS = \{.*?\n\}\nINACTIVE_ACTION_PACE_RANGES_SEC =",
              textwrap.dedent('''\
              INACTIVE_ACTION_WEIGHTS = {
                  "economy": {"building": 55, "research": 20, "ships": 10, "defense": 8, "expedition": 7},
                  "aggressive": {"building": 30, "research": 15, "ships": 30, "defense": 15, "expedition": 10},
                  "turtle": {"building": 35, "research": 10, "ships": 12, "defense": 35, "expedition": 8},
                  "spy": {"building": 25, "research": 35, "ships": 12, "defense": 8, "expedition": 20},
                  "swarm": {"building": 30, "research": 15, "ships": 35, "defense": 10, "expedition": 10},
                  "elite": {"building": 28, "research": 25, "ships": 27, "defense": 10, "expedition": 10},
              }
              INACTIVE_ACTION_PACE_RANGES_SEC ='''),
          )

          sub(
              ia,
              r"INACTIVE_PHASE_DOMAIN_MULT = \{.*?\n\}\nINACTIVE_WORLD_BOSS_SAFE_HP_RATIO =",
              textwrap.dedent('''\
              INACTIVE_PHASE_DOMAIN_MULT = {
                  "growth": {"building": 1.75, "research": 0.70, "ships": 0.85, "defense": 0.55, "expedition": 0.75},
                  "research": {"building": 0.70, "research": 1.85, "ships": 0.75, "defense": 0.55, "expedition": 0.90},
                  "fortification": {"building": 0.70, "research": 0.65, "ships": 1.15, "defense": 1.90, "expedition": 0.65},
                  "balanced": {"building": 1.00, "research": 1.00, "ships": 1.00, "defense": 1.00, "expedition": 1.00},
              }
              INACTIVE_WORLD_BOSS_SAFE_HP_RATIO ='''),
          )

          sub(
              ia,
              r"# Soft floor so empty dormant empires can enqueue \(far below pirate seed\)\.\nINACTIVE_RESOURCE_FLOOR = \{.*?\n\}",
              textwrap.dedent('''\
              # Compatibility constant only. Human Play V5 never injects resources into
              # dormant human accounts; canonical production/loot must finance their actions.
              INACTIVE_RESOURCE_FLOOR = {
                  "metal": 0,
                  "crystal": 0,
                  "fuel_cells": 0,
              }
              INACTIVE_EXPEDITION_SHIP_PREFERENCE = ("solar_skiff", "eclipse_runner")'''),
          )

          sub(
              ia,
              r"def _next_action_delay_sec\(.*?\n\n\ndef is_inactive_autoplay_enabled",
              textwrap.dedent('''\
              def _next_action_delay_sec(player_id: int, personality: str, action_seq: int) -> int:
                  """Human-shaped cadence: short bursts interrupted by real breaks."""
                  low, high = INACTIVE_ACTION_PACE_RANGES_SEC.get(
                      str(personality), INACTIVE_ACTION_PACE_RANGES_SEC["economy"]
                  )
                  low_i, high_i = max(60, int(low)), max(int(low), int(high))
                  seq = max(0, int(action_seq))
                  cycle = seq // 8
                  burst_len = 3 + _stable_roll(player_id, "session-span", cycle, 5)
                  if seq > 0 and seq % burst_len == 0:
                      return 45 * 60 + _stable_roll(
                          player_id, "session-break", seq, 3 * 3600 + 1
                      )

                  quick_chance = {
                      "aggressive": 55,
                      "swarm": 50,
                      "elite": 45,
                      "spy": 40,
                      "economy": 35,
                      "turtle": 25,
                  }.get(str(personality), 35)
                  if _stable_roll(player_id, "quick-return", seq, 100) < quick_chance:
                      return 3 * 60 + _stable_roll(
                          player_id, "quick-gap", seq, 8 * 60 + 1
                      )
                  return low_i + _stable_roll(
                      player_id, "pace", seq, high_i - low_i + 1
                  )


              def is_inactive_autoplay_enabled'''),
          )

          sub(
              ia,
              r"def _ensure_resource_floor\(.*?\n\n\ndef _describe_last_action",
              textwrap.dedent('''\
              def _ensure_resource_floor(conn, planet_id: int) -> Dict[str, int]:
                  """Observe stockpile only; dormant human accounts receive no resources."""
                  row = conn.execute(
                      """
                      SELECT COALESCE(metal, 0) AS metal,
                             COALESCE(crystal, 0) AS crystal,
                             COALESCE(fuel_cells, 0) AS fuel_cells
                      FROM planets WHERE id = ? LIMIT 1;
                      """,
                      (int(planet_id),),
                  ).fetchone()
                  if not row:
                      return {}
                  return {
                      "metal": int(float(row["metal"] or 0)),
                      "crystal": int(float(row["crystal"] or 0)),
                      "fuel_cells": int(float(row["fuel_cells"] or 0)),
                      "raised": 0,
                      "farm_mult": 1.0,
                  }


              def _describe_last_action'''),
          )

          helpers = textwrap.dedent('''\

          def _pick_progression_planet(
              player_id: int,
              planets: Sequence[Mapping[str, Any]],
              *,
              action_seq: int,
              home_id: int,
          ) -> Optional[Dict[str, Any]]:
              """Spread local actions across owned worlds without extra DB reads."""
              del home_id
              candidates = [dict(p) for p in planets if int(p.get("id") or 0) > 0]
              if not candidates:
                  return None
              candidates.sort(key=lambda p: int(p.get("id") or 0))
              if len(candidates) == 1:
                  return candidates[0]
              idx = _stable_roll(player_id, "planet-choice", action_seq, len(candidates))
              return candidates[idx]


          def _pick_expedition_force(
              conn,
              player_id: int,
              *,
              action_seq: int,
          ) -> Optional[Dict[str, Any]]:
              """Pick one real expedition-capable ship from an owned planet."""
              from .fleet import get_planet_ships
              from .models import get_planets_by_player

              planets = [
                  dict(p)
                  for p in (get_planets_by_player(int(player_id), conn=conn) or [])
              ]
              if not planets:
                  return None
              planets.sort(key=lambda p: int(p.get("id") or 0))
              start = _stable_roll(
                  player_id, "expedition-origin", action_seq, len(planets)
              )
              ordered = planets[start:] + planets[:start]
              ship_order = list(INACTIVE_EXPEDITION_SHIP_PREFERENCE)
              if _stable_roll(player_id, "expedition-hull", action_seq, 2):
                  ship_order.reverse()
              for planet in ordered:
                  planet_id = int(planet.get("id") or 0)
                  hangar = get_planet_ships(planet_id, conn=conn)
                  for ship_key in ship_order:
                      if int(hangar.get(ship_key) or 0) >= 1:
                          return {
                              "planet_id": planet_id,
                              "galaxy": int(planet.get("galaxy") or 1),
                              "system": int(planet.get("system") or 1),
                              "ships": {ship_key: 1},
                          }
              return None


          def _maybe_send_expedition(
              conn,
              player_id: int,
              *,
              now: float,
              action_seq: int,
          ) -> Dict[str, Any]:
              """Send one canonical expedition when a real hull/slot/fuel permits."""
              del now
              force = _pick_expedition_force(
                  conn, int(player_id), action_seq=int(action_seq)
              )
              if not force:
                  return {"ok": True, "sent": False, "reason": "no_expedition_ship"}

              from .fleet import send_fleet
              from .fleet_defs import EXPEDITION_POSITION

              hours = 1 + _stable_roll(player_id, "expedition-hours", action_seq, 4)
              ok, reason, meta = send_fleet(
                  player_id=int(player_id),
                  origin_planet_id=int(force["planet_id"]),
                  mission_type="expedition",
                  target_galaxy=int(force["galaxy"]),
                  target_system=int(force["system"]),
                  target_position=int(EXPEDITION_POSITION),
                  ships=dict(force["ships"]),
                  resources={},
                  speed_percent=100,
                  expedition_hours=int(hours),
                  conn=conn,
              )
              if not ok:
                  return {
                      "ok": True,
                      "sent": False,
                      "reason": str(reason or "blocked"),
                  }
              return {
                  "ok": True,
                  "sent": True,
                  "fleet_id": int((meta or {}).get("fleet", {}).get("id") or 0),
                  "planet_id": int(force["planet_id"]),
                  "ships": dict(force["ships"]),
                  "expedition_hours": int(hours),
              }
          ''')
          one(ia, "\n\ndef _run_player_economy(", helpers + "\n\ndef _run_player_economy(")

          sub(
              ia,
              r"def _run_player_economy\(.*?\n\n\ndef get_roster_snapshot",
              textwrap.dedent('''\
              def _run_player_economy(
                  conn,
                  player_id: int,
                  *,
                  now: float,
                  is_wake: bool = False,
                  action_seq: int = 0,
                  next_action_at: Optional[float] = None,
              ) -> Dict[str, Any]:
                  """Execute one human-shaped decision through canonical systems."""
                  from .models import get_homeworld, get_planets_by_player

                  home = get_homeworld(player_id, conn=conn)
                  if not home:
                      return {
                          "ok": False,
                          "error": "no_homeworld",
                          "player_id": player_id,
                      }

                  home = dict(home)
                  home_id = int(home["id"])
                  stockpile = _ensure_resource_floor(conn, home_id)
                  planets = [
                      dict(p)
                      for p in (get_planets_by_player(player_id, conn=conn) or [home])
                  ]
                  personality = personality_for_player(player_id)
                  seq = max(0, int(action_seq or 0))
                  strategic_phase = _strategic_phase_for_player(player_id, seq)
                  ambition_scale = _ambition_scale(player_id, personality)
                  personal_cooldown = bool(
                      not is_wake
                      and next_action_at is not None
                      and float(now) < float(next_action_at)
                  )
                  action_domain = (
                      "building"
                      if is_wake
                      else None
                      if personal_cooldown
                      else _action_domain_for_player(player_id, personality, seq)
                  )
                  idle_chance = (
                      1.0
                      if personal_cooldown
                      else 0.0
                      if is_wake
                      else AUTOPLAY_STANDING_IDLE_CHANCE
                  )

                  results: List[Dict[str, Any]] = []
                  if action_domain == "research" or is_wake:
                      target_planet = home
                  elif action_domain in {"building", "ships", "defense"}:
                      target_planet = _pick_progression_planet(
                          player_id,
                          planets,
                          action_seq=seq,
                          home_id=home_id,
                      )
                  else:
                      target_planet = None

                  if target_planet is not None:
                      is_home = int(target_planet["id"]) == home_id or bool(
                          target_planet.get("is_homeworld")
                      )
                      try:
                          results.append(
                              plan_passive_planet_tick(
                                  conn,
                                  player_id=player_id,
                                  planet=target_planet,
                                  now=now,
                                  is_home=is_home,
                                  allow_buildings=action_domain == "building",
                                  allow_research=action_domain == "research",
                                  allow_ships=action_domain == "ships",
                                  allow_defense=action_domain == "defense",
                                  personality=personality,
                                  build_duration_cap=INACTIVE_BUILD_DURATION_CAP,
                                  research_duration_cap=INACTIVE_RESEARCH_DURATION_CAP,
                                  target_scale=ambition_scale,
                                  source="inactive_autoplay",
                                  update_scores=True,
                                  chain_limit=INACTIVE_CHAIN_LIMIT,
                                  idle_chance=idle_chance,
                                  auto_boost_timekeeper=False,
                              )
                          )
                      except Exception:
                          logger.exception(
                              "inactive autoplay economy failed player=%s planet=%s",
                              player_id,
                              target_planet.get("id"),
                          )

                  expedition = {
                      "ok": True,
                      "sent": False,
                      "reason": "not_selected",
                  }
                  if action_domain == "expedition" and not personal_cooldown:
                      expedition = _maybe_send_expedition(
                          conn,
                          player_id,
                          now=now,
                          action_seq=seq,
                      )

                  enqueued = any(
                      r.get("build")
                      or r.get("research")
                      or r.get("ships")
                      or r.get("defense")
                      or r.get("builds")
                      or r.get("researches")
                      for r in results
                  ) or bool(expedition.get("sent"))
                  finished_any = any((r.get("finished") or {}) for r in results)
                  finished_totals = {
                      "buildings": 0,
                      "research": 0,
                      "defense": 0,
                      "shipyard": 0,
                  }
                  for result in results:
                      finished = result.get("finished") or {}
                      for key in finished_totals:
                          try:
                              finished_totals[key] += int(finished.get(key) or 0)
                          except (TypeError, ValueError):
                              continue

                  boss_participation = _maybe_join_world_boss(
                      conn, player_id, now=now
                  )
                  next_seq = seq if personal_cooldown else seq + 1
                  next_at = (
                      float(next_action_at)
                      if personal_cooldown and next_action_at is not None
                      else None
                  )
                  next_delay = None
                  if not personal_cooldown:
                      next_delay = _next_action_delay_sec(
                          player_id, personality, seq
                      )
                      next_at = float(now) + float(next_delay)

                  last_action = _describe_last_action(results)
                  if not last_action and expedition.get("sent"):
                      last_action = "expedition"
                  return {
                      "ok": True,
                      "player_id": player_id,
                      "economy": results,
                      "enqueued": enqueued,
                      "finished": finished_any,
                      "finished_totals": finished_totals,
                      "last_action": last_action,
                      "resource_floor": stockpile,
                      "action_domain": action_domain,
                      "action_seq": next_seq,
                      "next_action_delay_sec": next_delay,
                      "next_action_at": next_at,
                      "personal_cooldown": personal_cooldown,
                      "strategic_phase": strategic_phase,
                      "ambition_scale": ambition_scale,
                      "expedition": expedition,
                      "boss_participation": boss_participation,
                  }


              def get_roster_snapshot'''),
          )

          one(
              ae,
              "    idle_chance: float = 0.0,\n) -> Dict[str, Any]:",
              "    idle_chance: float = 0.0,\n    auto_boost_timekeeper: bool = True,\n) -> Dict[str, Any]:",
          )

          sub(
              ae,
              r'''        if ship_res\.get\("ok"\):\n            out\["ships"\] = ship_res\n            _auto_boost_timekeeper\(\n                conn, player_id=int\(player_id\), planet_id=planet_id, domain="shipyard"\n            \)''',
              textwrap.dedent('''\
                      if ship_res.get("ok"):
                          out["ships"] = ship_res
                          if auto_boost_timekeeper:
                              _auto_boost_timekeeper(
                                  conn,
                                  player_id=int(player_id),
                                  planet_id=planet_id,
                                  domain="shipyard",
                              )'''),
          )

          sub(
              ae,
              r'''        if def_res\.get\("ok"\):\n            out\["defense"\] = def_res\n            _auto_boost_timekeeper\(\n                conn, player_id=int\(player_id\), planet_id=planet_id, domain="defense"\n            \)''',
              textwrap.dedent('''\
                      if def_res.get("ok"):
                          out["defense"] = def_res
                          if auto_boost_timekeeper:
                              _auto_boost_timekeeper(
                                  conn,
                                  player_id=int(player_id),
                                  planet_id=planet_id,
                                  domain="defense",
                              )'''),
          )

          one(
              ae,
              '    if out["ships"] or out["defense"]:',
              '    if auto_boost_timekeeper and (out["ships"] or out["defense"]):',
          )

          sub(
              tests,
              r"def test_inactive_resource_floor_raises_empty_stockpile\(autoplay_db\):.*?\n\n\ndef test_max_concurrent_sessions_default_and_clamp",
              textwrap.dedent('''\
              def test_inactive_resource_floor_does_not_grant_resources(autoplay_db):
                  """Human Play V5: dormant humans must finance actions normally."""
                  from game.inactive_autoplay import _ensure_resource_floor

                  uid = _register_user()
                  conn = db()
                  try:
                      begin_write_transaction(conn)
                      player = _seed_dormant(conn, uid, days_inactive=5.0)
                      conn.execute(
                          "UPDATE planets SET metal = 0, crystal = 0, fuel_cells = 0 WHERE id = ?;",
                          (int(player["planet_id"]),),
                      )
                      stock = _ensure_resource_floor(
                          conn, int(player["planet_id"])
                      )
                      assert stock.get("raised") == 0
                      row = conn.execute(
                          "SELECT metal, crystal, fuel_cells FROM planets WHERE id = ?;",
                          (int(player["planet_id"]),),
                      ).fetchone()
                      assert float(row["metal"]) == 0
                      assert float(row["crystal"]) == 0
                      assert float(row["fuel_cells"]) == 0
                      commit(conn)
                  finally:
                      conn.close()


              def test_max_concurrent_sessions_default_and_clamp'''),
          )

          one(
              v4tests,
              '''    ), patch("game.inactive_autoplay._ensure_resource_floor", return_value={}), patch(\n        "game.inactive_autoplay.plan_passive_planet_tick"\n    ) as planner, patch(''',
              '''    ), patch("game.inactive_autoplay._ensure_resource_floor", return_value={}), patch(\n        "game.inactive_autoplay._action_domain_for_player", return_value="building"\n    ), patch(\n        "game.inactive_autoplay.plan_passive_planet_tick"\n    ) as planner, patch(''',
          )

          Path("tests/test_human_play_loop_v5.py").write_text(
              textwrap.dedent('''\
              from __future__ import annotations

              from unittest.mock import patch


              def test_v5_action_pool_includes_real_fleet_progression():
                  from game.inactive_autoplay import INACTIVE_ACTION_DOMAINS

                  assert "ships" in INACTIVE_ACTION_DOMAINS
                  assert "expedition" in INACTIVE_ACTION_DOMAINS


              def test_v5_cadence_contains_bursts_and_long_breaks():
                  from game.inactive_autoplay import _next_action_delay_sec

                  gaps = [
                      _next_action_delay_sec(pid, "aggressive", seq)
                      for pid in range(1, 12)
                      for seq in range(1, 40)
                  ]
                  assert min(gaps) <= 11 * 60
                  assert max(gaps) >= 45 * 60


              def test_v5_planet_choice_spreads_local_actions():
                  from game.inactive_autoplay import _pick_progression_planet

                  planets = [{"id": 1}, {"id": 2}, {"id": 3}]
                  picked = {
                      _pick_progression_planet(
                          17, planets, action_seq=seq, home_id=1
                      )["id"]
                      for seq in range(20)
                  }
                  assert len(picked) >= 2


              def test_v5_expedition_uses_canonical_fleet_send():
                  from game.inactive_autoplay import _maybe_send_expedition

                  force = {
                      "planet_id": 77,
                      "galaxy": 2,
                      "system": 19,
                      "ships": {"solar_skiff": 1},
                  }
                  meta = {"fleet": {"id": 555}}
                  with patch(
                      "game.inactive_autoplay._pick_expedition_force",
                      return_value=force,
                  ), patch(
                      "game.fleet.send_fleet",
                      return_value=(True, "ok", meta),
                  ) as send:
                      out = _maybe_send_expedition(
                          object(), 9, now=12345.0, action_seq=6
                      )

                  assert out["sent"] is True
                  assert out["fleet_id"] == 555
                  kwargs = send.call_args.kwargs
                  assert kwargs["mission_type"] == "expedition"
                  assert kwargs["ships"] == {"solar_skiff": 1}
                  assert 1 <= kwargs["expedition_hours"] <= 4


              def test_v5_inactive_shipyard_never_receives_free_timekeeper():
                  from game.auto_empire import plan_passive_planet_tick

                  ship_result = {
                      "ok": True,
                      "ship_key": "solar_skiff",
                      "amount": 1,
                      "meta": {},
                  }
                  with patch(
                      "game.auto_empire._finish_due", return_value={}
                  ), patch(
                      "game.auto_empire.try_build_ships",
                      return_value=ship_result,
                  ), patch("game.auto_empire._auto_boost_timekeeper") as boost:
                      out = plan_passive_planet_tick(
                          object(),
                          player_id=4,
                          planet={"id": 8},
                          now=1000.0,
                          allow_buildings=False,
                          allow_research=False,
                          allow_ships=True,
                          allow_defense=False,
                          auto_boost_timekeeper=False,
                      )
                  assert out["ships"] == ship_result
                  boost.assert_not_called()
              '''),
              encoding="utf-8",
          )

          Path(".github/workflows/apply-human-play-v5.yml").unlink()
          PY

      - name: Compile changed Python
        run: |
          python -m py_compile \
            game/inactive_autoplay.py \
            game/auto_empire.py \
            tests/test_inactive_autoplay.py \
            tests/test_living_universe_gc2622.py \
            tests/test_human_play_loop_v5.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Focused Human Play V5 tests
        run: |
          pytest -q \
            tests/test_human_play_loop_v5.py \
            tests/test_living_universe_gc2622.py \
            tests/test_inactive_autoplay.py

      - name: Commit deployable patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            game/inactive_autoplay.py \
            game/auto_empire.py \
            tests/test_inactive_autoplay.py \
            tests/test_living_universe_gc2622.py \
            tests/test_human_play_loop_v5.py \
            .github/workflows/apply-human-play-v5.yml
          git commit -m "feat: humanize dormant commander play loop"
          git push origin HEAD:feature/human-play-loop-v5
