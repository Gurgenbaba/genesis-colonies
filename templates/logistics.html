{% extends "base.html" %}
{% from "partials/progression_cards.html" import render_resource_icon with context %}

{% block extra_head %}
<style>
.logistics-page--compact .logistics-headline { margin-bottom: 8px; }
.logistics-page--compact .section-title { font-size: 1.05rem; margin-bottom: 2px; }
.logistics-page--compact .section-hint { font-size: 0.78rem; }
.logistics-page--compact .logistics-shell { padding: 0; overflow: hidden; }
.logistics-page--compact .logistics-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-bottom: 1px solid rgba(120, 190, 255, 0.12);
}
.logistics-page--compact .logistics-hub-label {
  margin: 0;
  font-size: 0.72rem;
  flex: 0 0 auto;
}
.logistics-page--compact .logistics-hub-select {
  flex: 1 1 180px;
  max-width: min(100%, 320px);
  min-width: 0;
}
.logistics-page--compact .logistics-fleet-link { margin-left: auto; }
.logistics-page--compact .logistics-preview-hud {
  margin: 0;
  padding: 6px 10px;
  border: 0;
  border-radius: 0;
  border-bottom: 1px solid rgba(120, 190, 255, 0.12);
}
.logistics-page--compact .fleet-preview-hud-head { margin-bottom: 4px; }
.logistics-page--compact .fleet-preview-grid {
  gap: 6px;
  grid-template-columns: repeat(4, minmax(0, 1fr));
}
.logistics-page--compact .fleet-preview-stat-label { font-size: 0.68rem; }
.logistics-page--compact .fleet-preview-stat-value { font-size: 0.82rem; }
.logistics-page--compact .logistics-tabs {
  margin: 0;
  padding: 6px 10px 0;
  gap: 4px;
  border-bottom: 1px solid rgba(120, 190, 255, 0.1);
}
.logistics-page--compact .logistics-panel { padding: 8px 10px 10px; }
.logistics-page--compact .logistics-layout { gap: 8px; }
.logistics-page--compact .gc-fieldset {
  padding: 6px 8px;
  margin: 0;
}
.logistics-page--compact .gc-fieldset-legend {
  font-size: 0.72rem;
  padding: 0 4px;
}
.logistics-page--compact .logistics-hint {
  font-size: 0.75rem;
  margin: 2px 0 6px;
}
.logistics-page--compact .logistics-sources-list { gap: 4px; }
.logistics-page--compact .logistics-source-label {
  padding: 4px 8px;
  gap: 8px;
  border-radius: 2px;
  align-items: center;
}
.logistics-page--compact .logistics-source-card-body {
  flex-direction: row;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 10px;
}
.logistics-page--compact .logistics-source-name { font-size: 0.84rem; }
.logistics-page--compact .logistics-source-coords { font-size: 0.75rem; }
.logistics-page--compact .logistics-source-resources {
  font-size: 0.75rem;
  gap: 8px;
}
.logistics-page--compact .logistics-source-active-tag {
  font-size: 0.58rem;
  padding: 1px 4px;
}
.logistics-page--compact .logistics-source-check {
  width: 14px;
  height: 14px;
  margin: 0;
  border-radius: 2px;
}
.logistics-page--compact .logistics-source-card.is-selected .logistics-source-check::after {
  width: 6px;
  height: 6px;
  margin: 3px auto 0;
  border-radius: 1px;
}
.logistics-page--compact .fleet-ships-grid { gap: 6px; }
.logistics-page--compact .fleet-ship-row {
  padding: 6px 8px;
  gap: 8px;
}
.logistics-page--compact .fleet-ship-row-main {
  flex: 1 1 auto;
  gap: 6px;
  min-width: 0;
}
.logistics-page--compact .fleet-ship-name { font-size: 0.84rem; }
.logistics-page--compact .fleet-ship-role-pill {
  font-size: 0.58rem;
  padding: 1px 4px;
}
.logistics-page--compact .fleet-ship-stock {
  font-size: 0.75rem;
  margin-left: auto;
}
.logistics-page--compact .fleet-ship-row-controls {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 0 0 auto;
}
.logistics-page--compact .fleet-ship-max,
.logistics-page--compact .fleet-resource-row .gc-btn {
  min-height: 28px;
  padding: 4px 10px;
  font-size: 0.72rem;
  letter-spacing: 0.04em;
  border-radius: var(--gc-radius-sm);
}
.logistics-page--compact .fleet-resource-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.logistics-page--compact .fleet-resource-label {
  flex: 1 1 120px;
  min-width: 0;
  font-size: 0.78rem;
}
.logistics-page--compact .logistics-actions { margin-top: 8px; }
.logistics-page--compact [data-logistics-submit] {
  min-height: 28px;
  padding: 4px 12px;
  font-size: 0.82rem;
  border-radius: 2px;
}
.logistics-page--compact .logistics-preview-targets-list { font-size: 0.78rem; }
.logistics-page--compact .logistics-colony-card.is-slots-skipped .logistics-source-label {
  opacity: 0.55;
  border-style: dashed;
}
.logistics-page--compact .logistics-colony-card.is-slots-skipped .logistics-source-name::after {
  content: " · Slot-Limit";
  font-size: 0.68rem;
  color: var(--gc-text-dim);
  font-weight: 400;
}
@media (max-width: 640px) {
  .logistics-page--compact .fleet-preview-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .logistics-page--compact .logistics-fleet-link {
    margin-left: 0;
    width: 100%;
  }
}
</style>
{% endblock %}

{% block content %}
{% include "fleet_logistics.html" %}
{% endblock %}
