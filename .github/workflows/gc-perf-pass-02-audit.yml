name: GC Performance Pass 02 Audit

on:
  push:
    branches:
      - perf/current-hotspot-pass-02

permissions:
  contents: read

env:
  APP_ENV: development
  FLASK_ENV: development
  FLASK_DEBUG: '0'
  SECRET_KEY: ci-perf-pass-02-not-for-production
  GC_SKIP_MIGRATION_CHECK: '1'
  GC_EMBEDDED_CRON: '0'
  GC_DB_BACKEND: sqlite
  GC_REQUEST_PERF_DEBUG: '1'
  GC_REQUEST_PERF_SLOW_MS: '0'
  GC_REQUEST_PERF_SAMPLE: '1.0'
  GC_PERF_INTEL: '1'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Trace DB connection callers
        shell: bash
        run: |
          cat > tests/_tmp_perf_pass_02_callers.py <<'PY'
          from __future__ import annotations

          import collections
          import traceback
          from unittest.mock import patch

          import pytest

          pytest_plugins = ["tests.test_game_state_live"]

          ROUTES = [
              ("diet", "/api/game-state"),
              ("overview", "/api/game-state?include_panel=1&panel_page=overview"),
          ]

          def _signature():
              stack = traceback.extract_stack(limit=36)[:-2]
              project = []
              for frame in stack:
                  name = frame.filename.replace("\\", "/")
                  if "/genesis-colonies/" not in name:
                      continue
                  rel = name.split("/genesis-colonies/", 1)[1]
                  if rel.startswith("tests/") or rel.startswith(".venv/"):
                      continue
                  project.append(f"{rel}:{frame.lineno}:{frame.name}")
              return " <- ".join(project[-8:]) or "unknown"

          @pytest.mark.parametrize("label,route", ROUTES)
          def test_connection_callers(game_client, label, route):
              import game.db as dbmod

              client, _pid = game_client
              warm = client.get(route)
              assert warm.status_code == 200
              real_connect = dbmod.sqlite3.connect
              counts = collections.Counter()

              def traced_connect(*args, **kwargs):
                  counts[_signature()] += 1
                  return real_connect(*args, **kwargs)

              with patch.object(dbmod.sqlite3, "connect", side_effect=traced_connect):
                  resp = client.get(route)
              assert resp.status_code == 200
              print(f"\n=== PERF02 {label.upper()} DB OPEN CALLERS ===")
              print("TOTAL_TRACED_OPENS", sum(counts.values()))
              for sig, n in counts.most_common(60):
                  print(f"OPEN x{n}: {sig}")
          PY
          python -m pytest -q -s tests/_tmp_perf_pass_02_callers.py
          rm -f tests/_tmp_perf_pass_02_callers.py
