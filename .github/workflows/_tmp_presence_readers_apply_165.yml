name: TEMP Presence Readers Apply 165
on:
  push:
    branches: [perf/pg-presence-critical-readers-165]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/pg-presence-critical-readers-165
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply critical reader cutover
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p=Path(path); text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, found {count}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          # Central scalar expression: lets existing SELECTs consume canonical PG
          # presence without adding bespoke JOIN plumbing to every domain query.
          p=Path('game/presence_store.py'); text=p.read_text(encoding='utf-8')
          anchor='''def get_presence_last_seen(\n    conn, player_id: int, *, backend: str | None = None\n) -> int:  # noqa: ANN001\n'''
          helper='''def effective_last_seen_scalar_sql(\n    *,\n    player_alias: str = "p",\n    backend: str | None = None,\n) -> str:\n    """Correlated effective-presence expression for existing player queries.\n\n    PostgreSQL reads canonical ``player_presence`` first while retaining the\n    legacy column as a rolling-deploy fallback. SQLite stays unchanged.\n    """\n    if uses_dedicated_presence(backend=backend):\n        return (\n            "GREATEST("\n            f"COALESCE((SELECT pp_gc_presence.last_seen FROM {PRESENCE_TABLE} pp_gc_presence "\n            f"WHERE pp_gc_presence.player_id = {player_alias}.id), 0), "\n            f"COALESCE({player_alias}.last_seen, 0))"\n        )\n    return f"COALESCE({player_alias}.last_seen, 0)"\n\n\n'''
          if text.count(anchor)!=1:
              raise SystemExit('presence scalar anchor missing')
          p.write_text(text.replace(anchor,helper+anchor,1),encoding='utf-8')

          # HUD / landing / aggregate activity.
          replace_once('game/models.py', '''    cur = conn.cursor()\n    cur.execute("SELECT COUNT(*) AS c FROM players WHERE last_seen >= ?", (cutoff,))\n    count = int(cur.fetchone()["c"])\n''', '''    from .presence_store import effective_last_seen_scalar_sql\n\n    last_seen_expr = effective_last_seen_scalar_sql(player_alias="p")\n    cur = conn.cursor()\n    cur.execute(\n        f"SELECT COUNT(*) AS c FROM players p WHERE {last_seen_expr} >= ?",\n        (cutoff,),\n    )\n    count = int(cur.fetchone()["c"])\n''', 'models online count')

          replace_once('game/models.py', '''    cur = conn.cursor()\n    cur.execute(\n        """\n        SELECT u.id, u.username, u.is_admin AS user_is_admin,\n               p.name AS player_name, p.is_admin AS player_is_admin,\n               p.last_seen\n        FROM players p\n        JOIN users u ON u.id = p.id\n        WHERE p.last_seen >= ?\n        ORDER BY p.last_seen DESC\n        LIMIT ?;\n        """,\n        (cutoff, lim),\n    )\n''', '''    from .presence_store import effective_last_seen_scalar_sql\n\n    last_seen_expr = effective_last_seen_scalar_sql(player_alias="p")\n    cur = conn.cursor()\n    cur.execute(\n        f"""\n        SELECT u.id, u.username, u.is_admin AS user_is_admin,\n               p.name AS player_name, p.is_admin AS player_is_admin,\n               {last_seen_expr} AS last_seen\n        FROM players p\n        JOIN users u ON u.id = p.id\n        WHERE {last_seen_expr} >= ?\n        ORDER BY last_seen DESC\n        LIMIT ?;\n        """,\n        (cutoff, lim),\n    )\n''', 'models online list')

          replace_once('game/models.py', '''    cur.execute("SELECT COUNT(*) AS c FROM players WHERE last_seen >= ?", (day_ago,))\n    active_24h = int(cur.fetchone()["c"])\n\n    cur.execute("SELECT COUNT(*) AS c FROM players WHERE last_seen >= ?", (week_ago,))\n    active_7d = int(cur.fetchone()["c"])\n''', '''    from .presence_store import effective_last_seen_scalar_sql\n\n    last_seen_expr = effective_last_seen_scalar_sql(player_alias="p")\n    cur.execute(\n        f"SELECT COUNT(*) AS c FROM players p WHERE {last_seen_expr} >= ?",\n        (day_ago,),\n    )\n    active_24h = int(cur.fetchone()["c"])\n\n    cur.execute(\n        f"SELECT COUNT(*) AS c FROM players p WHERE {last_seen_expr} >= ?",\n        (week_ago,),\n    )\n    active_7d = int(cur.fetchone()["c"])\n''', 'models player stats')

          # Ranking/PvP inactivity uses canonical effective presence.
          replace_once('game/ranking.py', '''def _last_seen_select(conn) -> str:\n    if column_exists(conn, "players", "last_seen"):\n        return "COALESCE(p.last_seen, 0) AS last_seen"\n    return "0 AS last_seen"\n''', '''def _last_seen_select(conn) -> str:\n    if column_exists(conn, "players", "last_seen"):\n        from .presence_store import effective_last_seen_scalar_sql\n\n        return f"{effective_last_seen_scalar_sql(player_alias='p')} AS last_seen"\n    return "0 AS last_seen"\n''', 'ranking select')

          replace_once('game/ranking.py', '''def is_player_id_inactive(player_id: int, *, conn, now: Optional[int] = None) -> bool:\n    """Server-side inactive check for a player id (uses ``players.last_seen``)."""\n    row = conn.execute(\n        "SELECT last_seen FROM players WHERE id = ? LIMIT 1;",\n        (int(player_id),),\n    ).fetchone()\n    if not row:\n        return True\n    return is_player_inactive(dict(row), now=now)\n''', '''def is_player_id_inactive(player_id: int, *, conn, now: Optional[int] = None) -> bool:\n    """Server-side inactive check using backend-appropriate canonical presence."""\n    from .presence_store import get_effective_last_seen\n\n    last_seen = get_effective_last_seen(conn, int(player_id))\n    return ranking_inactive_from_last_seen(last_seen, now=now)\n''', 'ranking single inactive')

          replace_once('game/ranking.py', '''def player_last_seen_by_ids(\n    player_ids: Sequence[int],\n    *,\n    conn,\n) -> Dict[int, int]:\n    """Batch read ``players.last_seen`` (missing ids → 0)."""\n    ids = sorted({int(p) for p in player_ids if int(p) > 0})\n    if not ids:\n        return {}\n    placeholders = ",".join("?" for _ in ids)\n    cur = conn.cursor()\n    cur.execute(\n        f"SELECT id, last_seen FROM players WHERE id IN ({placeholders});",\n        tuple(ids),\n    )\n    out = {pid: 0 for pid in ids}\n    for row in cur.fetchall():\n        out[int(row["id"])] = int(row["last_seen"] or 0)\n    return out\n''', '''def player_last_seen_by_ids(\n    player_ids: Sequence[int],\n    *,\n    conn,\n) -> Dict[int, int]:\n    """Batch read backend-appropriate effective presence (missing ids → 0)."""\n    from .presence_store import get_effective_last_seen_by_ids\n\n    return get_effective_last_seen_by_ids(conn, player_ids)\n''', 'ranking bulk inactive')

          # Galaxy activity badges + inactive protection payload.
          replace_once('game/galaxy.py', '''    if column_exists(conn, "players", "last_seen"):\n        parts.append(f"COALESCE({alias}.last_seen, 0) AS last_seen")\n    else:\n        parts.append("0 AS last_seen")\n''', '''    if column_exists(conn, "players", "last_seen"):\n        from .presence_store import effective_last_seen_scalar_sql\n\n        parts.append(\n            f"{effective_last_seen_scalar_sql(player_alias=alias)} AS last_seen"\n        )\n    else:\n        parts.append("0 AS last_seen")\n''', 'galaxy activity')

          # Dormant-autoplay writer + candidate reads leave the hot players row.
          replace_once('game/inactive_autoplay.py', '''from .ranking import RANKING_INACTIVE_AFTER_SEC\nfrom .runtime_state import get_runtime_value, set_runtime_value\n''', '''from .ranking import RANKING_INACTIVE_AFTER_SEC\nfrom .presence_store import effective_last_seen_scalar_sql, touch_presence_bulk\nfrom .runtime_state import get_runtime_value, set_runtime_value\n''', 'inactive imports')

          replace_once('game/inactive_autoplay.py', '''def _touch_presence_bulk(conn, player_ids: Sequence[int], *, now: float) -> None:\n    """Batched `last_seen` refresh for shift-roster members in one query.\n\n    GC-INACTIVE-SHIFT-001: the shift roster *is* the visible online set\n    (2–3 accounts), so callers pass the full current roster.\n    """\n    ids = sorted({int(pid) for pid in player_ids if int(pid) > 0})\n    if not ids:\n        return\n    placeholders = ",".join("?" * len(ids))\n    try:\n        conn.execute(\n            f"UPDATE players SET last_seen = ? WHERE id IN ({placeholders});",\n            [float(now), *ids],\n        )\n    except Exception:\n        logger.exception("inactive autoplay bulk presence touch failed")\n''', '''def _touch_presence_bulk(conn, player_ids: Sequence[int], *, now: float) -> None:\n    """Batched shift-roster presence through the canonical backend store."""\n    ids = sorted({int(pid) for pid in player_ids if int(pid) > 0})\n    if not ids:\n        return\n    try:\n        touch_presence_bulk(conn, ids, now=int(now))\n    except Exception:\n        logger.exception("inactive autoplay bulk presence touch failed")\n''', 'inactive writer')

          old='''    vac_select = (\n        "COALESCE(vacation_mode_active, 0)"\n        if column_exists(conn, "players", "vacation_mode_active")\n        else "0"\n    )\n    cur = conn.execute(\n        f"""\n        SELECT id AS player_id,\n               last_seen,\n               {vac_select} AS vacation_mode_active\n        FROM players\n        WHERE (last_seen IS NULL OR last_seen < ?)\n        ORDER BY CASE WHEN last_seen IS NULL THEN 1 ELSE 0 END,\n                 last_seen ASC,\n                 id ASC\n        LIMIT ?;\n        """,\n        (float(cutoff), int(max(1, limit))),\n    )\n'''
          new='''    vac_select = (\n        "COALESCE(p.vacation_mode_active, 0)"\n        if column_exists(conn, "players", "vacation_mode_active")\n        else "0"\n    )\n    last_seen_expr = effective_last_seen_scalar_sql(player_alias="p")\n    cur = conn.execute(\n        f"""\n        SELECT p.id AS player_id,\n               {last_seen_expr} AS last_seen,\n               {vac_select} AS vacation_mode_active\n        FROM players p\n        WHERE {last_seen_expr} < ?\n        ORDER BY last_seen ASC, p.id ASC\n        LIMIT ?;\n        """,\n        (float(cutoff), int(max(1, limit))),\n    )\n'''
          replace_once('game/inactive_autoplay.py', old, new, 'inactive candidates')

          Path('tests/test_gc_pg_165_presence_critical_readers.py').write_text('''from pathlib import Path\n\nfrom game.presence_store import effective_last_seen_scalar_sql\n\nROOT = Path(__file__).resolve().parents[1]\n\n\ndef _read(path):\n    return (ROOT / path).read_text(encoding="utf-8")\n\n\ndef test_pg_scalar_presence_reads_dedicated_table_with_legacy_fallback(monkeypatch):\n    monkeypatch.setattr("game.presence_store.get_db_backend", lambda: "postgres")\n    expr = effective_last_seen_scalar_sql(player_alias="p")\n    assert "player_presence" in expr\n    assert "pp_gc_presence.player_id = p.id" in expr\n    assert "p.last_seen" in expr\n\n\ndef test_sqlite_scalar_presence_keeps_legacy_column(monkeypatch):\n    monkeypatch.setattr("game.presence_store.get_db_backend", lambda: "sqlite")\n    assert effective_last_seen_scalar_sql(player_alias="p") == "COALESCE(p.last_seen, 0)"\n\n\ndef test_critical_activity_readers_use_presence_store():\n    models = _read("game/models.py")\n    ranking = _read("game/ranking.py")\n    galaxy = _read("game/galaxy.py")\n    autoplay = _read("game/inactive_autoplay.py")\n    assert "effective_last_seen_scalar_sql" in models\n    assert "get_effective_last_seen_by_ids" in ranking\n    assert "effective_last_seen_scalar_sql" in galaxy\n    assert "touch_presence_bulk(conn, ids" in autoplay\n    assert "UPDATE players SET last_seen = ? WHERE id IN" not in autoplay\n''',encoding='utf-8')
          PY
      - name: Verify focused regression suites
        run: |
          python -m pip install -r requirements-prod.txt pytest
          python -m py_compile game/presence_store.py game/models.py game/ranking.py game/galaxy.py game/inactive_autoplay.py
          python -m pytest -q tests/test_gc_pg_165_presence_critical_readers.py tests/test_online_player_count.py tests/test_ranking.py tests/test_galaxy.py tests/test_gc_pg_142_presence_pool_starvation.py
      - name: Commit product diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/presence_store.py game/models.py game/ranking.py game/galaxy.py game/inactive_autoplay.py tests/test_gc_pg_165_presence_critical_readers.py
          git commit -m "perf(pg): cut critical activity readers to player_presence" || exit 0
          git push origin HEAD:perf/pg-presence-critical-readers-165
