name: Inspect fleet action reason contracts
on:
  push:
    branches: [feature/fleet-action-reasons]
permissions:
  contents: write
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract fleet reason contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          out=[]
          for path in ['game/fleet.py','game/fleet_api.py','app.py','static/main.js','templates/fleet.html','static/js/galaxy-quick-action.js']:
              p=Path(path)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              out.append(f'===== {path} =====')
              if path == 'game/fleet.py':
                  patterns=[
                      r'return\s+False\s*,\s*["\']([^"\']+)["\']',
                      r'raise\s+ValueError\(["\']([^"\']+)["\']\)',
                      r'reason\s*=\s*["\']([^"\']+)["\']',
                  ]
                  vals=set()
                  for pat in patterns:
                      vals.update(re.findall(pat,s))
                  out.append('REASON_STRINGS\n'+'\n'.join(sorted(vals)))
              needles=['def send_fleet','evaluate_fleet_mission_target','/api/fleet/send','fleet-send-form','fleet_err(','mission_block_reason','showNotify','message_key']
              seen=[]
              for needle in needles:
                  start=0
                  while True:
                      i=s.find(needle,start)
                      if i<0: break
                      if all(abs(i-j)>4500 for j in seen):
                          seen.append(i)
                          out.append(f'\n--- {needle} @ {i} ---\n{s[max(0,i-4500):min(len(s),i+9000)]}')
                      start=i+len(needle)
          Path('.tmp').mkdir(exist_ok=True)
          Path('.tmp/fleet-action-reasons.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp/fleet-action-reasons.txt
          git commit -m 'chore: capture fleet action reason contracts'
          git push