name: Apply fleet action reasons
on:
  push:
    branches: [feature/fleet-action-reasons]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements-prod.txt pytest
      - name: Apply GC-FLT-UX-01
        run: |
          curl -fsSL https://api.github.com/repos/Gurgenbaba/genesis-colonies/git/blobs/241ace1a2e31ed86ae845fa42b3f592acec24015 \
            | jq -r '.content' | tr -d '\n' | base64 -d > /tmp/apply_fleet_action_reasons.py
          python /tmp/apply_fleet_action_reasons.py
      - name: Syntax and diff gate
        run: |
          python -m py_compile app.py
          node --check static/main.js
          git diff --check
      - name: Focused Fleet regression
        run: |
          files=(
            tests/test_fleet_action_reasons.py
            tests/test_fleet.py
            tests/test_fleet_mission_locks.py
            tests/test_noob_protection.py
            tests/test_gc_perf_fleet_send_001.py
            tests/test_gc934_fleet_manual_mission.py
            tests/test_gc590a_fleet_world_target.py
          )
          args=()
          for f in "${files[@]}"; do
            if [ -f "$f" ]; then args+=("$f"); fi
          done
          python -m pytest -q --tb=line "${args[@]}"
      - name: Remove temporary inspection/apply helpers
        run: |
          rm -rf .tmp
          rm -f .github/workflows/apply-fleet-action-reasons.yml
      - name: Commit feature
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(fleet): explain blocked launch actions clearly'
          git push