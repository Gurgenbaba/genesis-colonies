name: GC PG 175 Planet Context Apply

on:
  push:
    branches:
      - fix/pg-175-planet-context-hot-row

concurrency:
  group: gc-pg-175-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: '0'
      SECRET_KEY: ci-pg-175-secret-key-not-for-production-use
      GC_SKIP_MIGRATION_CHECK: '1'
      GC_EMBEDDED_CRON: '0'
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pg-175-planet-context-hot-row
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Apply cutover patch
        run: python scripts/apply_gc_pg_175_planet_context.py
      - name: Run regressions
        run: |
          python -m pytest -q tests/test_gc_pg_175_planet_context_hot_row.py tests/test_gc_pg_highspeed_001a_lock.py tests/test_planet_registry.py tests/test_gc845_planet_switch_payload.py
          python -m py_compile game/planet_evolution/repository.py
          git diff --check
      - name: Commit validated patch
        run: |
          rm scripts/apply_gc_pg_175_planet_context.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/planet_evolution/repository.py tests/test_gc_pg_175_planet_context_hot_row.py migrations/160_player_context.sql scripts/apply_gc_pg_175_planet_context.py
          git commit -m 'fix(pg): isolate active planet context from hot player row'
          git push origin HEAD:fix/pg-175-planet-context-hot-row
