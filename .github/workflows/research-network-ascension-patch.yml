name: Research Network Ascension Patch

on:
  push:
    branches:
      - feature/research-network-ascension
    paths:
      - scripts/.research_ascension_patch_trigger

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-research-ascension-secret-key-not-for-production
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Apply deterministic integration patch
        run: python scripts/_apply_research_network_ascension.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Compile changed Python
        run: |
          python -m py_compile app.py game/research.py game/research_lab_ascension.py game/buildings.py game/effects/effect_resolver.py
          node --check static/js/pages/research_network.js
          git diff --check
      - name: Focused regression
        run: |
          python -m pytest -q --tb=line \
            tests/test_research_lab_ascension.py \
            tests/test_research_requirements.py \
            tests/test_gc825_research_time_rebalance.py \
            tests/test_gc830_max_queue_buttons.py \
            tests/test_queue_static_contract.py \
            tests/test_race_conditions.py -k 'research or research_lab_ascension'
      - name: Commit verified integration
        run: |
          if git diff --quiet; then
            echo "No integration changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/research.py game/research_lab_ascension.py game/buildings.py game/effects/effect_resolver.py app.py templates/research.html templates/buildings.html locales/de.json locales/en.json
          git commit -m "feat: integrate research network ascension"
          git push origin HEAD:feature/research-network-ascension
