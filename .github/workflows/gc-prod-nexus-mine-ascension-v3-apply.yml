name: GC Production Nexus Mine Ascension V3 Apply

on:
  push:
    branches:
      - fix/prod-nexus-mine-ascension-contract-v3

concurrency:
  group: gc-prod-nexus-mine-ascension-v3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: '0'
      SECRET_KEY: ci-nexus-mine-ascension-v3-secret-not-production
      GC_SKIP_MIGRATION_CHECK: '1'
      GC_EMBEDDED_CRON: '0'
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prod-nexus-mine-ascension-contract-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Apply canonical progression contract
        run: |
          python scripts/apply_gc_prod_nexus_mine_ascension_v3.py
          python scripts/apply_gc_prod_nexus_mine_ascension_v3_tests.py
      - name: Run focused regressions
        run: |
          python -m pytest -q \
            tests/test_gc_prod_nexus_mine_ascension_contract.py \
            tests/test_nexus_building_caps.py \
            tests/test_mine_evolution.py \
            tests/test_effects.py \
            tests/test_ascension_queue_cap_contract.py
          python -m py_compile game/effects/effect_resolver.py game/buildings.py
          git diff --check
      - name: Commit validated source patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            scripts/apply_gc_prod_nexus_mine_ascension_v3.py \
            scripts/apply_gc_prod_nexus_mine_ascension_v3_tests.py \
            .github/workflows/gc-prod-nexus-mine-ascension-v3-apply.yml
          git add \
            game/effects/effect_resolver.py \
            game/buildings.py \
            static/main.js \
            docs/MINE_EVOLUTION.md \
            docs/BUILDINGS_SYSTEM.md \
            docs/EFFECTS.md \
            docs/STELLAR_FORGE.md \
            tests/test_gc_prod_nexus_mine_ascension_contract.py \
            tests/test_nexus_building_caps.py \
            tests/test_mine_evolution.py \
            tests/test_effects.py
          git commit -m 'fix(buildings): restore nexus to 200 before ascension'
          git push origin HEAD:fix/prod-nexus-mine-ascension-contract-v3
