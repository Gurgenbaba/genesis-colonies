name: Apply Fleet Shared Request Context

on:
  push:
    branches: [perf/fleet-shared-request-context]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/fleet-shared-request-context
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply focused patch
        run: python scripts/apply_gc_perf_fleet_shared_request_004.py
      - name: Verify target diff
        run: |
          python -m py_compile app.py game/fleet.py
          git diff --check
          git diff -- app.py game/fleet.py
          grep -n "GC-PERF-FLEET-SHARED-004" app.py game/fleet.py
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- app.py game/fleet.py; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py game/fleet.py
          git commit -m "perf(fleet): reuse shared request context"
          git push origin HEAD:perf/fleet-shared-request-context
