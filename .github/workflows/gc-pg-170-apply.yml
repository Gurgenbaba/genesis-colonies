name: GC PG 170 Admin Legacy Presence Apply

on:
  push:
    branches:
      - perf/pg-170-admin-legacy-presence

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/pg-170-admin-legacy-presence
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Apply scoped cleanup
        run: |
          python scripts/apply_gc_pg_170_admin_legacy_presence.py
          python scripts/apply_gc_pg_170_test_fix.py

      - name: Run targeted regression tests
        env:
          GC_SKIP_MIGRATION_CHECK: '1'
        run: |
          python -m pytest \
            tests/test_gc_pg_170_admin_legacy_presence.py \
            tests/test_admin_control_center.py::test_player_search_works \
            tests/test_admin_control_center.py::test_search_no_sql_injection \
            tests/test_inactive_storage_boost.py \
            tests/test_pirate_ecosystem.py \
            tests/test_options.py -q

      - name: Commit production patch
        run: |
          rm scripts/apply_gc_pg_170_admin_legacy_presence.py
          rm scripts/apply_gc_pg_170_test_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/admin_api.py game/pirates/accounts.py game/options.py tests/test_gc_pg_170_admin_legacy_presence.py scripts/apply_gc_pg_170_admin_legacy_presence.py scripts/apply_gc_pg_170_test_fix.py
          git commit -m 'perf(pg): finish admin legacy presence readers'
          git push origin HEAD:perf/pg-170-admin-legacy-presence
