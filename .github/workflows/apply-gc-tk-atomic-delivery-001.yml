name: Apply GC TK Atomic Delivery 001

on:
  push:
    branches: [fix/timekeeper-queue-atomic-delivery]
    paths:
      - "scripts/apply_gc_tk_atomic_delivery_001.py"
      - ".github/workflows/apply-gc-tk-atomic-delivery-001.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/timekeeper-queue-atomic-delivery
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply guarded runtime patch
        run: |
          python scripts/apply_gc_tk_atomic_delivery_001.py
          python -m py_compile game/timekeeper.py game/inventory_use.py
          git diff --check
      - name: Commit runtime patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/timekeeper.py game/inventory_use.py
          git commit -m "fix(timekeeper): make boosted queue delivery atomic"
          git push origin HEAD:fix/timekeeper-queue-atomic-delivery
