name: Temporary Storage V2 Builder

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  build-storage-v2:
    if: github.head_ref == 'hotfix/storage-v2-production-buffer'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply Storage V2 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # ------------------------------------------------------------------
          # economy_balance.py — keep the legacy depot curve, but make the
          # mature-game buffer horizon unbounded and expose an exact helper for
          # the live-production floor.
          # ------------------------------------------------------------------
          replace_once(
              'game/economy_balance.py',
              '''# GC-MANDO-STORAGE-001 — preserve the 24h early-game anchor, but give mature\n# depots enough buffer for L450+ mines. L50 stays at 24h; the horizon ramps\n# linearly to 72h by L150 and remains 72h beyond that.\nSTORAGE_ENDGAME_START_LEVEL = 50\nSTORAGE_ENDGAME_FULL_LEVEL = 150\nSTORAGE_ENDGAME_MAX_HOURS = 72\n''',
              '''# GC-STORAGE-V2 — preserve the 24h early-game anchor, then grow the\n# guaranteed production buffer forever.  The historic L150/72h point stays an\n# anchor for compatibility; it is no longer a maximum.  0.48h/level == 12/25.\nSTORAGE_ENDGAME_START_LEVEL = 50\nSTORAGE_ENDGAME_FULL_LEVEL = 150  # historic 72h anchor, not a cap\nSTORAGE_ENDGAME_ANCHOR_HOURS = 72\nSTORAGE_ENDGAME_MAX_HOURS = STORAGE_ENDGAME_ANCHOR_HOURS  # compatibility alias\nSTORAGE_ENDGAME_HOURS_PER_LEVEL_NUMERATOR = 12\nSTORAGE_ENDGAME_HOURS_PER_LEVEL_DENOMINATOR = 25\n'''
          )

          replace_once(
              'game/economy_balance.py',
              '''def storage_reference_hours_at_depot_level(storage_level: int) -> int:\n    \"\"\"Buffer horizon for one depot level; early game remains on the GC-872 24h anchor.\"\"\"\n    lvl = max(0, int(storage_level))\n    if lvl <= STORAGE_ENDGAME_START_LEVEL:\n        return STORAGE_REFERENCE_HOURS\n    if lvl >= STORAGE_ENDGAME_FULL_LEVEL:\n        return STORAGE_ENDGAME_MAX_HOURS\n    span = STORAGE_ENDGAME_FULL_LEVEL - STORAGE_ENDGAME_START_LEVEL\n    progress = lvl - STORAGE_ENDGAME_START_LEVEL\n    extra = (\n        (STORAGE_ENDGAME_MAX_HOURS - STORAGE_REFERENCE_HOURS) * progress\n    ) // span\n    return STORAGE_REFERENCE_HOURS + int(extra)\n\n\ndef storage_capacity_at_depot_level(storage_level: int) -> int:\n    \"\"\"GC-872 + GC-MANDO-STORAGE-001 — 3× reference mine with an endgame buffer horizon.\"\"\"\n    lvl = max(0, int(storage_level))\n    if lvl <= 0:\n        return STORAGE_BASE_CAPACITY\n    reference_mine_level = lvl * int(STORAGE_REFERENCE_MINE_LEVEL_FACTOR)\n    reference_hours = storage_reference_hours_at_depot_level(lvl)\n    reference_buffer_cap = mine_output_decimal(\n        STORAGE_REFERENCE_RESOURCE,\n        reference_mine_level,\n    ) * reference_hours\n    return max(STORAGE_BASE_CAPACITY, STORAGE_BASE_CAPACITY + int(reference_buffer_cap))\n''',
              '''def storage_reference_hours_at_depot_level(storage_level: int) -> int:\n    \"\"\"Guaranteed production-buffer hours; unchanged through L50, unbounded afterwards.\"\"\"\n    lvl = max(0, int(storage_level))\n    if lvl <= STORAGE_ENDGAME_START_LEVEL:\n        return STORAGE_REFERENCE_HOURS\n    progress = lvl - STORAGE_ENDGAME_START_LEVEL\n    extra = (\n        STORAGE_ENDGAME_HOURS_PER_LEVEL_NUMERATOR * progress\n    ) // STORAGE_ENDGAME_HOURS_PER_LEVEL_DENOMINATOR\n    return STORAGE_REFERENCE_HOURS + int(extra)\n\n\ndef storage_production_buffer_capacity(production_per_hour: Any, storage_level: int) -> int:\n    \"\"\"Exact Storage V2 floor from canonical full-power production and depot horizon.\"\"\"\n    lvl = max(0, int(storage_level))\n    if lvl < STORAGE_ENDGAME_START_LEVEL:\n        return 0\n    production = max(Decimal(0), decimal_value(production_per_hour, \"0\"))\n    if production <= 0:\n        return 0\n    hours = storage_reference_hours_at_depot_level(lvl)\n    with localcontext() as ctx:\n        ctx.prec = max(96, _decimal_digits(production) + 64)\n        return max(0, int((production * Decimal(hours)).to_integral_value(rounding=ROUND_FLOOR)))\n\n\ndef storage_capacity_at_depot_level(storage_level: int) -> int:\n    \"\"\"Legacy/reference depot floor; Storage V2 live production is layered by EffectResolver.\"\"\"\n    lvl = max(0, int(storage_level))\n    if lvl <= 0:\n        return STORAGE_BASE_CAPACITY\n    reference_mine_level = lvl * int(STORAGE_REFERENCE_MINE_LEVEL_FACTOR)\n    reference_hours = storage_reference_hours_at_depot_level(lvl)\n    reference_buffer_cap = mine_output_decimal(\n        STORAGE_REFERENCE_RESOURCE,\n        reference_mine_level,\n    ) * reference_hours\n    return max(STORAGE_BASE_CAPACITY, STORAGE_BASE_CAPACITY + int(reference_buffer_cap))\n'''
          )

          # ------------------------------------------------------------------
          # EffectResolver — resource-specific live production floor.  Use the
          # canonical production context at full energy so a temporary power
          # shortage can never shrink capacity.  Legacy/reference capacity is
          # always retained as a floor.
          # ------------------------------------------------------------------
          replace_once(
              'game/effects/effect_resolver.py',
              '''    def _storage_base_cap(self, resource: str, storage_level: int) -> int:\n        \"\"\"GC-872 Ferdi reference depot cap; resource-independent.\"\"\"\n        from ..economy_balance import storage_capacity_at_depot_level\n\n        _ = resource\n        return storage_capacity_at_depot_level(max(0, int(storage_level)))\n''',
              '''    def _storage_base_cap(self, resource: str, storage_level: int) -> int:\n        \"\"\"Storage V2: legacy floor vs canonical full-power production buffer.\"\"\"\n        from ..economy_balance import (\n            STORAGE_ENDGAME_START_LEVEL,\n            storage_capacity_at_depot_level,\n            storage_production_buffer_capacity,\n        )\n\n        lvl = max(0, int(storage_level))\n        legacy_cap = storage_capacity_at_depot_level(lvl)\n        if lvl < STORAGE_ENDGAME_START_LEVEL:\n            return legacy_cap\n\n        key = str(resource or \"\")\n        cache = getattr(self, \"_storage_v2_floor_cache\", None)\n        if cache is None:\n            cache = {}\n            self._storage_v2_floor_cache = cache\n        cache_key = (key, lvl)\n        if cache_key in cache:\n            return max(legacy_cap, int(cache[cache_key]))\n\n        try:\n            from ..production_formula import (\n                calculate_resource_output_decimal,\n                production_context_from_resolver,\n            )\n\n            context = production_context_from_resolver(self, key, energy_ratio=1.0)\n            production_per_hour = calculate_resource_output_decimal(key, context)\n            live_floor = storage_production_buffer_capacity(production_per_hour, lvl)\n        except Exception:\n            if EFFECT_DEBUG:\n                logger.exception(\"Storage V2 production floor failed resource=%s level=%s\", key, lvl)\n            else:\n                logger.warning(\"Storage V2 production floor fallback resource=%s level=%s\", key, lvl)\n            live_floor = 0\n\n        cache[cache_key] = int(live_floor)\n        return max(legacy_cap, int(live_floor))\n'''
          )

          # Request-local event multiplier cache: Storage V2 asks canonical
          # production for three resources, so do not add repeated LiveOps reads.
          replace_once(
              'game/production_formula.py',
              '''    event_mod = 1.0\n    try:\n        from .server_events import active_production_mult\n\n        event_mod = float(active_production_mult(conn=getattr(resolver, \"_conn\", None)) or 1.0)\n    except Exception:\n        event_mod = 1.0\n''',
              '''    event_mod = getattr(resolver, \"_production_event_mult_cache\", None)\n    if event_mod is None:\n        event_mod = 1.0\n        try:\n            from .server_events import active_production_mult\n\n            event_mod = float(active_production_mult(conn=getattr(resolver, \"_conn\", None)) or 1.0)\n        except Exception:\n            event_mod = 1.0\n        try:\n            resolver._production_event_mult_cache = float(event_mod)  # type: ignore[attr-defined]\n        except Exception:\n            pass\n'''
          )

          # ------------------------------------------------------------------
          # Resource accrual must cap against the exact same contextual resolver
          # as the rate calculation.  Otherwise HUD capacity and actual accrual
          # diverge under events/evolution/directives.
          # ------------------------------------------------------------------
          replace_once(
              'game/resources.py',
              '''    return _resolver(buildings, research, mods).get_storage_capacity()\n''',
              '''    if user_id is not None:\n        resolver = get_effect_resolver(\n            int(user_id),\n            buildings=buildings,\n            research=research,\n            conn=conn,\n        )\n        if mods is not None:\n            resolver._mods = dict(mods)\n        return resolver.get_storage_capacity()\n\n    return _resolver(buildings, research, mods).get_storage_capacity()\n'''
          )

          replace_once(
              'game/resources.py',
              '''def apply_production_delta(\n    planet: dict,\n    buildings: Dict[str, int],\n    delta_metal: int = 0,\n    delta_crystal: int = 0,\n    research: Optional[Dict[str, int]] = None,\n    mods: Optional[Dict[str, float]] = None,\n) -> None:\n''',
              '''def apply_production_delta(\n    planet: dict,\n    buildings: Dict[str, int],\n    delta_metal: int = 0,\n    delta_crystal: int = 0,\n    research: Optional[Dict[str, int]] = None,\n    mods: Optional[Dict[str, float]] = None,\n    resolver: Optional[EffectResolver] = None,\n) -> None:\n'''
          )
          replace_once(
              'game/resources.py',
              '''    caps = get_storage_capacity(buildings, research=research, mods=mods)\n    metal_cap = max(0, int(caps.get(\"metal\", 0) or 0))\n''',
              '''    caps = (\n        resolver.get_storage_capacity()\n        if resolver is not None\n        else get_storage_capacity(buildings, research=research, mods=mods)\n    )\n    metal_cap = max(0, int(caps.get(\"metal\", 0) or 0))\n'''
          )
          replace_once(
              'game/resources.py',
              '''def apply_fuel_production_delta(\n    planet: dict,\n    buildings: Dict[str, int],\n    delta_fuel_cells: int = 0,\n    research: Optional[Dict[str, int]] = None,\n    mods: Optional[Dict[str, float]] = None,\n) -> None:\n''',
              '''def apply_fuel_production_delta(\n    planet: dict,\n    buildings: Dict[str, int],\n    delta_fuel_cells: int = 0,\n    research: Optional[Dict[str, int]] = None,\n    mods: Optional[Dict[str, float]] = None,\n    resolver: Optional[EffectResolver] = None,\n) -> None:\n'''
          )
          replace_once(
              'game/resources.py',
              '''    caps = get_storage_capacity(buildings, research=research, mods=mods)\n    fuel_cap = int(caps.get(\"fuel_cells\") or 0)\n''',
              '''    caps = (\n        resolver.get_storage_capacity()\n        if resolver is not None\n        else get_storage_capacity(buildings, research=research, mods=mods)\n    )\n    fuel_cap = int(caps.get(\"fuel_cells\") or 0)\n'''
          )
          replace_once(
              'game/resources.py',
              '''        research=research,\n        mods=mods,\n    )\n    apply_fuel_production_delta(\n''',
              '''        research=research,\n        mods=mods,\n        resolver=resolver,\n    )\n    apply_fuel_production_delta(\n'''
          )
          replace_once(
              'game/resources.py',
              '''        delta_fuel_cells=delta_fuel_cells,\n        research=research,\n        mods=mods,\n    )\n''',
              '''        delta_fuel_cells=delta_fuel_cells,\n        research=research,\n        mods=mods,\n        resolver=resolver,\n    )\n'''
          )

          # ------------------------------------------------------------------
          # Regression coverage.
          # ------------------------------------------------------------------
          replace_once(
              'tests/test_gc_mando_storage_001.py',
              '''def test_endgame_storage_horizon_ramps_to_three_days():\n    assert STORAGE_ENDGAME_START_LEVEL == 50\n    assert storage_reference_hours_at_depot_level(100) == 48\n    assert STORAGE_ENDGAME_FULL_LEVEL == 150\n    assert storage_reference_hours_at_depot_level(150) == STORAGE_ENDGAME_MAX_HOURS == 72\n    assert storage_reference_hours_at_depot_level(999) == 72\n''',
              '''def test_endgame_storage_horizon_keeps_growing_after_three_day_anchor():\n    assert STORAGE_ENDGAME_START_LEVEL == 50\n    assert storage_reference_hours_at_depot_level(100) == 48\n    assert STORAGE_ENDGAME_FULL_LEVEL == 150\n    assert storage_reference_hours_at_depot_level(150) == STORAGE_ENDGAME_MAX_HOURS == 72\n    assert storage_reference_hours_at_depot_level(200) == 96\n    assert storage_reference_hours_at_depot_level(300) == 144\n    assert storage_reference_hours_at_depot_level(450) == 216\n    assert storage_reference_hours_at_depot_level(999) > 216\n'''
          )

          Path('tests/test_storage_v2.py').write_text('''from decimal import Decimal\n\nimport game.server_events as server_events\nfrom game.economy_balance import (\n    STORAGE_ENDGAME_START_LEVEL,\n    storage_reference_hours_at_depot_level,\n)\nfrom game.effects.effect_resolver import EffectResolver\nfrom game.resources import apply_fuel_production_delta, apply_production_delta\n\n\ndef _endgame_resolver(*, research=None, terraformer=0, storage_level=150, mine_level=450, position=9):\n    return EffectResolver(\n        {\n            "metal_mine": mine_level,\n            "crystal_mine": mine_level,\n            "fuel_cell_plant": mine_level,\n            "metal_storage": storage_level,\n            "crystal_storage": storage_level,\n            "fuel_storage": storage_level,\n            "terraformer": terraformer,\n        },\n        research or {},\n        settings={"production_speed": 1.0},\n        planet_position=position,\n    )\n\n\ndef test_storage_v2_keeps_early_game_reference_behavior():\n    resolver = _endgame_resolver(storage_level=STORAGE_ENDGAME_START_LEVEL - 1, mine_level=450)\n    caps = resolver.get_storage_capacity()\n    assert caps["metal"] == resolver._storage_base_cap("metal", STORAGE_ENDGAME_START_LEVEL - 1)\n\n\ndef test_storage_v2_buffers_canonical_resource_specific_full_power_production():\n    resolver = _endgame_resolver(research={"crystal_tech": 120, "drone_tech": 80})\n    caps = resolver.get_storage_capacity()\n    hours = storage_reference_hours_at_depot_level(150)\n    metal_ph, crystal_ph = resolver.production_per_hour_exact(1.0)\n    fuel_ph = resolver.fuel_cells_production_per_hour_exact(1.0)\n\n    assert caps["metal"] >= int(metal_ph * Decimal(hours))\n    assert caps["crystal"] >= int(crystal_ph * Decimal(hours))\n    assert caps["fuel_cells"] >= int(fuel_ph * Decimal(hours))\n\n\ndef test_storage_v2_counts_active_production_event(monkeypatch):\n    monkeypatch.setattr(server_events, "active_production_mult", lambda conn=None: 2.0)\n    resolver = _endgame_resolver(position=4)\n    hours = storage_reference_hours_at_depot_level(150)\n    metal_ph, _ = resolver.production_per_hour_exact(1.0)\n    cap = resolver.get_storage_capacity()["metal"]\n\n    assert cap >= int(metal_ph * Decimal(hours))\n\n\ndef test_storage_v2_does_not_shrink_when_energy_is_short():\n    resolver = _endgame_resolver(position=4)\n    hours = storage_reference_hours_at_depot_level(150)\n    full_ph, _ = resolver.production_per_hour_exact(1.0)\n    low_ph, _ = resolver.production_per_hour_exact(0.01)\n    cap = resolver.get_storage_capacity()["metal"]\n\n    assert full_ph > low_ph\n    assert cap >= int(full_ph * Decimal(hours))\n\n\ndef test_storage_v2_applies_storage_research_and_terraformer_after_floor():\n    base = _endgame_resolver(position=4).get_storage_capacity()["metal"]\n    boosted = _endgame_resolver(\n        research={"storage_tech": 2},\n        terraformer=10,\n        position=4,\n    ).get_storage_capacity()["metal"]\n\n    # storage_tech 2 => 2.0x; terraformer 10 => 1.5x.\n    assert boosted == base * 3\n\n\ndef test_storage_v2_handles_mando_scale_without_float_capacity_math():\n    resolver = _endgame_resolver(storage_level=450, mine_level=2000, position=4)\n    hours = storage_reference_hours_at_depot_level(450)\n    metal_ph, _ = resolver.production_per_hour_exact(1.0)\n    cap = resolver.get_storage_capacity()["metal"]\n\n    assert hours == 216\n    assert cap >= int(metal_ph * Decimal(hours))\n    assert cap > 2**63\n\n\ndef test_production_delta_can_use_authoritative_contextual_resolver():\n    class Resolver:\n        @staticmethod\n        def get_storage_capacity():\n            return {"metal": 1000, "crystal": 2000, "fuel_cells": 3000}\n\n    resolver = Resolver()\n    planet = {"metal": 900, "crystal": 1900, "fuel_cells": 2900}\n    apply_production_delta(\n        planet, {}, delta_metal=500, delta_crystal=500, resolver=resolver\n    )\n    apply_fuel_production_delta(\n        planet, {}, delta_fuel_cells=500, resolver=resolver\n    )\n    assert planet == {"metal": 1000, "crystal": 2000, "fuel_cells": 3000}\n''', encoding='utf-8')

          # ------------------------------------------------------------------
          # Docs: make the runtime rule explicit and remove stale +15% wording.
          # ------------------------------------------------------------------
          replace_once(
              'docs/ECONOMY_SYSTEM.md',
              '''- Mit `metal_storage` / `crystal_storage` / `fuel_storage`: **Ferdi-Referenzkurve** (`storage_capacity_at_depot_level`: Basis + 24h Ferronit-Minenproduktion bei `Lagerlevel × 3`)\n- Multiplier: `storage_tech` (+50 %/Lvl, additiv), `terraformer` (+5 % Kapazität/Lvl), `storage_factor`\n- Produktion kann Storage nicht überschreiten; bestehendes Overflow wird nicht getrimmt\n''',
              '''- Mit `metal_storage` / `crystal_storage` / `fuel_storage`: die bisherige **Ferdi-Referenzkurve** bleibt als Mindestwert erhalten. Ab Lager L50 greift zusätzlich **Storage V2**: `max(Referenzkurve, kanonische Vollenergie-Produktion der Ressource × Pufferstunden)`.\n- Pufferhorizont: bis L50 **24h**, danach unbegrenzt **+0,48h pro Lagerlevel** (L100=48h, L150=72h, L200=96h, L300=144h, L450=216h). Kein Endgame-Cap.\n- Die Produktionsbasis ist ressourcenspezifisch und übernimmt den kanonischen Produktionspfad inkl. Slot/Temperatur, Forschung, Mine-Ascension/Evolution, Directives/Diplomatie, Klassen/Booster, `production_speed` und aktive Produktions-Events; Energie-Drosselung wird für die Kapazitätsgarantie bewusst als 100% behandelt.\n- Multiplier danach: `storage_tech` (+50 %/Lvl, additiv), `terraformer` (+5 % Kapazität/Lvl), `storage_factor`.\n- Produktion kann Storage nicht überschreiten; bestehendes Overflow wird nicht getrimmt. Produktions-Tick und HUD verwenden denselben contextual `EffectResolver`.\n'''
          )
          replace_once(
              'docs/BUILDINGS_SYSTEM.md',
              '''Storage capacity für Economy — Ferronit/Crytite/Brennzellen teilen `STORAGE_BASE_CAPACITY` ohne Depot; Storage-Gebäude skalieren über die Ferdi-Referenzkurve (Basis + 24h Ferronit-Minenproduktion bei `Lagerlevel × 3`), Upgrade-Kosten ×5 (`STORAGE_BUILDING_COST_MULTIPLIER`); `storage_tech` multipliziert additiv mit +15 %/Level''',
              '''Storage capacity für Economy — Ferronit/Crytite/Brennzellen teilen `STORAGE_BASE_CAPACITY` ohne Depot; Storage-Gebäude behalten die Ferdi-Referenzkurve als Floor und erhalten ab L50 den ressourcenspezifischen Storage-V2-Produktionspuffer (24h bei L50, danach +0,48h/Level ohne Cap), Upgrade-Kosten ×5 (`STORAGE_BUILDING_COST_MULTIPLIER`); `storage_tech` multipliziert additiv mit +50 %/Level'''
          )
          PY
      - name: Focused Storage V2 tests
        run: >-
          python -m pytest -q
          tests/test_storage_v2.py
          tests/test_gc_mando_storage_001.py
          tests/test_storage_tech_hotfix_50.py
          tests/test_gc821_economy_rebalance.py
          tests/test_gc863_building_balance_rework.py
          tests/test_effects.py
          tests/test_fuel_storage.py
          tests/test_fuel_cells_resource_bar.py
      - name: Commit tested Storage V2 patch
        shell: bash
        run: |
          git config user.name "Gurgen Baba"
          git config user.email "gurgenbaba.msi@outlook.de"
          git add game/economy_balance.py game/effects/effect_resolver.py game/production_formula.py game/resources.py tests/test_gc_mando_storage_001.py tests/test_storage_v2.py docs/ECONOMY_SYSTEM.md docs/BUILDINGS_SYSTEM.md
          if git diff --cached --quiet; then
            echo "No Storage V2 changes to commit."
            exit 0
          fi
          git commit -m "fix: scale endgame storage with canonical production"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
