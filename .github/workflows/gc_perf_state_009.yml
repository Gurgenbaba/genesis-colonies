name: GC PERF STATE 009

on:
  push:
    branches:
      - fix/gc-perf-state-009
    paths:
      - scripts/gc_perf_state_009.py
      - .github/workflows/gc_perf_state_009.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: gc-perf-state-009-gate
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Apply STATE-009
        run: python scripts/gc_perf_state_009.py
      - name: Verify STATE-009
        run: |
          python -m py_compile game/alliance.py tests/test_gc_perf_state_009.py
          python -m pytest -q --tb=line tests/test_gc_perf_state_008.py tests/test_gc_perf_state_009.py
          git diff --check
      - name: Commit runtime changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/alliance.py tests/test_gc_perf_state_009.py
          git commit -m "perf: slim Alliance nav attention reads"
          git push origin HEAD:fix/gc-perf-state-009
