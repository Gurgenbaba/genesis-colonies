name: UNI1 Player Journey Gate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: uni1-player-journey-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  player-journey:
    name: uni1-player-journey
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-uni1-player-journey-secret-not-for-production
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
      SHOP_TEST_PROVIDER: "1"
      SHOP_ENABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest

      - name: Compile launch surfaces
        run: |
          python -m py_compile app.py game/fleet.py game/messages.py game/payment_providers.py game/shop.py
          node --check static/main.js
          git diff --check

      - name: Buildings research shipyard fleet and exchange
        run: |
          python -m pytest -q --tb=line \
            tests/test_security_tamper.py \
            tests/test_gc512d_shipyard_state_contract.py \
            tests/test_progression_time_floor.py

      - name: Galaxy spy attack expedition and messages
        run: |
          python -m pytest -q --tb=line \
            tests/test_gc977a_galaxy_quick_spy.py \
            tests/test_gc977b_galaxy_quick_attack.py \
            tests/test_fleet_mission_locks.py \
            tests/test_expedition_events.py \
            --deselect=tests/test_expedition_events.py::test_cargo_cap_includes_haulers_not_combat_escorts \
            tests/test_uni1_rc_expedition_cargo_contract.py \
            tests/test_world_expedition.py \
            tests/test_messages.py

      - name: Trader inventory Timekeeper and shop
        run: |
          python -m pytest -q --tb=line \
            tests/test_trader_hub.py \
            tests/test_exchange.py \
            tests/test_inventory_use.py \
            tests/test_inventory_containers.py \
            tests/test_timekeeper.py \
            tests/test_shop_payments.py

      - name: Mobile launch navigation
        run: |
          python -m pytest -q --tb=line \
            tests/test_gc_p0_mobile_nav_drawer.py \
            tests/test_progression_pages.py
