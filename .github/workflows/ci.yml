# Smoke CI for Railway "Wait for CI" — keep this job fast and green on push to main.
# Full suite remains local / optional; this gate blocks broken deploy config + cron owners.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-smoke-secret-key-not-for-production-use
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest

      - name: Smoke tests (deploy + cron)
        run: |
          python -m pytest -q --tb=line \
            tests/test_deployment.py \
            tests/test_internal_cron.py \
            tests/test_embedded_cron.py \
            tests/test_fleet_worker.py

  i18n:
    name: i18n-hardening
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-i18n-secret-key-not-for-production-use
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest

      - name: Locale key and translation audit (all 8 languages)
        run: |
          python scripts/audit_locale_keys.py
          python scripts/audit_visible_i18n.py --locales-only

      - name: I18N regression tests
        run: |
          python -m pytest -q --tb=line \
            tests/test_gc900_multilanguage.py \
            tests/test_i18n_hardening.py

      - name: Full visible raw-string inventory (advisory)
        run: |
          python scripts/audit_visible_i18n.py --raw-only --report-only --max-findings 120

      - name: Block newly introduced player-facing raw strings
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          python scripts/audit_visible_i18n.py --raw-only --diff-base "$BASE" --max-findings 200

  apply-research-i18n:
    name: apply-research-i18n
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/i18n-phase3-research-config' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/i18n-phase3-research-config
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply deterministic Research I18N cleanup
        run: |
          python scripts/_gc_i18n_phase3_research_cleanup.py
          python -m py_compile game/research.py
          git diff --check
      - name: Commit generated Research cleanup
        run: |
          if git diff --quiet -- game/research.py; then
            echo "No research changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/research.py
          git commit -m "fix(i18n): remove research config display literals"
          git push origin HEAD:fix/i18n-phase3-research-config
