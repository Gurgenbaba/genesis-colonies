name: WB Raid UI i18n hotfix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'hotfix/world-boss-raid-ui-i18n' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/world-boss-raid-ui-i18n
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply canonical raid HUD + all locales
        run: python scripts/_apply_wb_raid_ui_i18n_hotfix.py
      - name: Validate all locale files
        run: python scripts/check_locale_keys.py
      - name: Commit generated product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/world_boss.html static/style.css locales/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(world-boss): canonical raid HUD and complete i18n"
          git push origin HEAD:hotfix/world-boss-raid-ui-i18n
