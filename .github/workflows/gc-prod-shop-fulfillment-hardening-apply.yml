name: GC Production Shop Fulfillment Hardening Apply

on:
  push:
    branches:
      - fix/prod-shop-fulfillment-hardening

concurrency:
  group: gc-prod-shop-fulfillment-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: '0'
      SECRET_KEY: ci-shop-fulfillment-secret-not-production
      GC_SKIP_MIGRATION_CHECK: '1'
      GC_EMBEDDED_CRON: '0'
      GC_DB_BACKEND: sqlite
      SHOP_ENABLED: '1'
      SHOP_TEST_PROVIDER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prod-shop-fulfillment-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Apply fulfillment hardening
        run: python scripts/apply_gc_prod_shop_fulfillment_hardening.py
      - name: Run payment regressions
        run: |
          python -m pytest -q \
            tests/test_gc_prod_shop_fulfillment_hardening.py \
            tests/test_shop_payments.py
          python -m py_compile game/shop.py scripts/repair_shop_fulfillment.py
          git diff --check
      - name: Commit validated source patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            scripts/apply_gc_prod_shop_fulfillment_hardening.py \
            .github/workflows/gc-prod-shop-fulfillment-hardening-apply.yml
          git add \
            game/shop.py \
            migrations/161_shop_fulfillment_repairs.sql \
            scripts/repair_shop_fulfillment.py \
            tests/test_gc_prod_shop_fulfillment_hardening.py
          git commit -m 'fix(shop): make grants atomic and add audited repair'
          git push origin HEAD:fix/prod-shop-fulfillment-hardening
