name: GC PG Ranking Set Apply

on:
  push:
    branches:
      - perf/pg-ranking-set-based-ranks

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gc_rank_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d gc_rank_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      GC_DB_BACKEND: postgres
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gc_rank_test
      GC_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/gc_rank_test
      GC_SKIP_MIGRATION_CHECK: '1'
      APP_ENV: test
      SECRET_KEY: gc-ranking-set-based-test-secret-xxxxxxxx
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/pg-ranking-set-based-ranks
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Materialize ranking fast path and regression
        run: python scripts/gc_pg_ranking_set_apply.py

      - name: Compile
        run: python -m compileall -q game/ranking.py tests/test_gc_pg_ranking_set_based.py

      - name: Migrate PostgreSQL 16
        run: python migrate.py

      - name: PostgreSQL set-based ranking regression
        run: pytest -q -s tests/test_gc_pg_ranking_set_based.py

      - name: Existing ranking regression (SQLite)
        env:
          GC_DB_BACKEND: sqlite
          DATABASE_URL: ''
          GC_TEST_POSTGRES_URL: ''
        run: pytest -q tests/test_ranking.py

      - name: Commit generated source and test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/ranking.py tests/test_gc_pg_ranking_set_based.py
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "perf(pg): set-based ranking rank rewrite"
            git push origin HEAD:perf/pg-ranking-set-based-ranks
          fi
