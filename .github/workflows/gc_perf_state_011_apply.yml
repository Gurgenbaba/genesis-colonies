name: GC PERF STATE 011 Apply

on:
  push:
    branches:
      - fix/gc-perf-state-011
    paths:
      - .github/workflows/gc_perf_state_011_apply.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: gc-perf-state-011-gate
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Apply STATE-011
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('game/vote_rewards.py')
          text = path.read_text(encoding='utf-8')
          old_import = 'from .db import column_exists, db, table_exists\n'
          new_import = 'from .db import column_exists, db, table_columns, table_exists, tables_exist\n'
          if text.count(old_import) != 1:
              raise SystemExit('vote_rewards db import anchor changed')
          text = text.replace(old_import, new_import, 1)

          old = '''def count_vote_center_attention(user_id: int, *, conn, now: Optional[int] = None) -> int:\n    \"\"\"\n    Nav-badge helper: voteable providers plus unclaimed pending rewards.\n\n    Returning inactive players see attention when cooldowns expired and/or rewards await claim.\n    \"\"\"\n    return count_voteable_providers(user_id, conn=conn, now=now) + count_pending_vote_rewards(\n        user_id, conn=conn\n    )\n'''
          new = '''def count_vote_center_attention(user_id: int, *, conn, now: Optional[int] = None) -> int:\n    \"\"\"Diet-safe Vote Center badge: voteable providers + pending rewards.\n\n    The full Vote Center keeps the detailed per-provider serializers. The high-frequency\n    nav path reads schema compatibility once, then resolves all enabled provider cooldowns\n    from one bulk query instead of repeating latest-vote/schema probes per provider.\n    \"\"\"\n    uid = int(user_id)\n    if uid <= 0:\n        return 0\n    if not tables_exist(conn, (\"vote_rewards\", \"vote_providers\")):\n        return 0\n\n    reward_columns = table_columns(conn, \"vote_rewards\")\n    has_channel = \"vote_channel\" in reward_columns\n    has_next_at = \"provider_next_vote_at\" in reward_columns\n    channel_filter = (\n        \" AND COALESCE(vote_channel, 'player') = 'player'\" if has_channel else \"\"\n    )\n    next_at_select = (\n        \"provider_next_vote_at\" if has_next_at else \"NULL AS provider_next_vote_at\"\n    )\n    ts = int(now if now is not None else time.time())\n\n    rows = conn.execute(\n        f\"\"\"\n        WITH latest_ranked AS (\n            SELECT provider, voted_at, {next_at_select},\n                   ROW_NUMBER() OVER (\n                       PARTITION BY provider\n                       ORDER BY voted_at DESC\n                   ) AS rn\n            FROM vote_rewards\n            WHERE user_id = ?{channel_filter}\n        ),\n        pending AS (\n            SELECT COUNT(*) AS c\n            FROM vote_rewards\n            WHERE user_id = ? AND status = 'pending'\n        ),\n        providers AS (\n            SELECT provider_key, cooldown_sec, sort_order\n            FROM vote_providers\n            WHERE enabled = 1\n        )\n        SELECT p.provider_key, p.cooldown_sec,\n               l.voted_at, l.provider_next_vote_at,\n               pending.c AS pending_count\n        FROM pending\n        LEFT JOIN providers p ON 1 = 1\n        LEFT JOIN latest_ranked l\n          ON l.provider = p.provider_key AND l.rn = 1\n        ORDER BY p.sort_order ASC, p.provider_key ASC;\n        \"\"\",\n        (uid, uid),\n    ).fetchall()\n\n    pending_count = int(rows[0][\"pending_count\"] or 0) if rows else 0\n    voteable = 0\n    for row in rows:\n        provider_key = str(row[\"provider_key\"] or \"\")\n        if not provider_key:\n            continue\n        canonical = VOTE_PROVIDERS.get(provider_key) or {}\n        cooldown_sec = int(\n            canonical.get(\"cooldown_seconds\")\n            or row[\"cooldown_sec\"]\n            or VOTE_COOLDOWN_SEC\n        )\n        voted_at = row[\"voted_at\"]\n        if voted_at is None:\n            voteable += 1\n            continue\n\n        next_at = 0\n        next_at_raw = row[\"provider_next_vote_at\"]\n        if next_at_raw is not None:\n            try:\n                next_at = int(next_at_raw)\n            except (TypeError, ValueError):\n                next_at = 0\n        vote_end = next_at if next_at > 0 else int(voted_at) + cooldown_sec\n        if vote_end <= ts:\n            voteable += 1\n\n    return int(voteable + pending_count)\n'''
          if text.count(old) != 1:
              raise SystemExit('count_vote_center_attention anchor changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          cat > tests/test_gc_perf_state_011.py <<'PY'
          import sqlite3

          from game import vote_rewards


          def _conn(*, optional_columns=True):
              conn = sqlite3.connect(":memory:")
              conn.row_factory = sqlite3.Row
              conn.execute(
                  "CREATE TABLE vote_providers ("
                  "provider_key TEXT PRIMARY KEY, enabled INTEGER NOT NULL, "
                  "cooldown_sec INTEGER, sort_order INTEGER"
                  ");"
              )
              optional = (
                  ", provider_next_vote_at INTEGER, vote_channel TEXT"
                  if optional_columns
                  else ""
              )
              conn.execute(
                  "CREATE TABLE vote_rewards ("
                  "id INTEGER PRIMARY KEY, user_id INTEGER NOT NULL, provider TEXT NOT NULL, "
                  "voted_at INTEGER NOT NULL, status TEXT NOT NULL"
                  f"{optional}"
                  ");"
              )
              conn.commit()
              return conn


          def _provider(conn, key, cooldown, *, enabled=1, sort_order=10):
              conn.execute(
                  "INSERT INTO vote_providers (provider_key, enabled, cooldown_sec, sort_order) "
                  "VALUES (?, ?, ?, ?);",
                  (key, enabled, cooldown, sort_order),
              )


          def _reward(
              conn,
              uid,
              provider,
              voted_at,
              *,
              status="claimed",
              next_at=None,
              channel="player",
              optional_columns=True,
          ):
              if optional_columns:
                  conn.execute(
                      "INSERT INTO vote_rewards "
                      "(user_id, provider, voted_at, status, provider_next_vote_at, vote_channel) "
                      "VALUES (?, ?, ?, ?, ?, ?);",
                      (uid, provider, voted_at, status, next_at, channel),
                  )
              else:
                  conn.execute(
                      "INSERT INTO vote_rewards (user_id, provider, voted_at, status) "
                      "VALUES (?, ?, ?, ?);",
                      (uid, provider, voted_at, status),
                  )


          def _read_statements(trace):
              prefixes = ("SELECT", "WITH", "PRAGMA")
              return [sql for sql in trace if sql.lstrip().upper().startswith(prefixes)]


          def test_vote_nav_bulk_read_preserves_canonical_cooldown_and_three_read_shape(monkeypatch):
              conn = _conn(optional_columns=True)
              try:
                  # Stale DB cooldown for topg must not override the canonical 6h value.
                  _provider(conn, "topg", 1, sort_order=1)
                  _provider(conn, "custom", 50, sort_order=2)
                  _reward(conn, 7, "topg", 900)
                  _reward(conn, 7, "custom", 900)
                  # Pending rewards count regardless of provider enablement.
                  _reward(conn, 7, "disabled", 995, status="pending")
                  conn.commit()

                  monkeypatch.setattr(
                      vote_rewards,
                      "list_enabled_providers",
                      lambda **kwargs: (_ for _ in ()).throw(AssertionError("N+1 provider loop used")),
                  )
                  monkeypatch.setattr(
                      vote_rewards,
                      "get_provider_cooldown_status",
                      lambda *args, **kwargs: (_ for _ in ()).throw(AssertionError("per-provider cooldown used")),
                  )

                  trace = []
                  conn.set_trace_callback(trace.append)
                  # custom is voteable (900 + 50 <= 1000), topg is not (canonical 6h), +1 pending.
                  assert vote_rewards.count_vote_center_attention(7, conn=conn, now=1000) == 2
                  reads = _read_statements(trace)
                  assert len(reads) == 3
                  assert reads[0].lstrip().upper().startswith("SELECT")
                  assert "sqlite_master" in reads[0].lower()
                  assert reads[1].lstrip().upper().startswith("PRAGMA TABLE_INFO")
                  assert reads[2].lstrip().upper().startswith("WITH LATEST_RANKED")
                  assert not conn.in_transaction
              finally:
                  conn.close()


          def test_vote_nav_provider_next_at_override_and_reengagement_filter():
              conn = _conn(optional_columns=True)
              try:
                  _provider(conn, "topg", 1)
                  # Real player vote is old enough, while a newer synthetic historical row
                  # would block the vote if the player-channel filter regressed.
                  _reward(conn, 8, "topg", 100, next_at=500, channel="player")
                  _reward(conn, 8, "topg", 990, next_at=99999, channel="reengagement")
                  conn.commit()
                  assert vote_rewards.count_vote_center_attention(8, conn=conn, now=1000) == 1

                  # Positive provider_next_vote_at remains authoritative over derived cooldown.
                  conn.execute("DELETE FROM vote_rewards;")
                  _reward(conn, 8, "topg", 100, next_at=1200, channel="player")
                  conn.commit()
                  assert vote_rewards.count_vote_center_attention(8, conn=conn, now=1000) == 0
              finally:
                  conn.close()


          def test_vote_nav_legacy_optional_columns_missing_is_supported():
              conn = _conn(optional_columns=False)
              try:
                  _provider(conn, "custom", 50)
                  _reward(conn, 9, "custom", 900, optional_columns=False)
                  conn.commit()
                  assert vote_rewards.count_vote_center_attention(9, conn=conn, now=1000) == 1
              finally:
                  conn.close()


          def test_vote_nav_pending_rewards_survive_zero_enabled_providers():
              conn = _conn(optional_columns=True)
              try:
                  _provider(conn, "topg", 1, enabled=0)
                  _reward(conn, 10, "topg", 995, status="pending")
                  _reward(conn, 10, "topg", 996, status="pending")
                  conn.commit()
                  assert vote_rewards.count_vote_center_attention(10, conn=conn, now=1000) == 2
              finally:
                  conn.close()
          PY

          python -m py_compile game/vote_rewards.py tests/test_gc_perf_state_011.py
          git diff --check
      - name: Focused STATE-011 regression
        run: python -m pytest -q --tb=line tests/test_gc_perf_state_011.py
      - name: Commit product and regression files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/vote_rewards.py tests/test_gc_perf_state_011.py
          git commit -m "perf: bulk Vote Center nav attention reads"
          git push origin HEAD:fix/gc-perf-state-011
