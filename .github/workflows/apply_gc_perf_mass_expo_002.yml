name: Apply GC PERF MASS EXPO 002

on:
  push:
    branches:
      - fix/mass-expo-preview-lock-stampede-002
    paths:
      - scripts/apply_gc_perf_mass_expo_002.py
      - tests/test_gc_perf_mass_expo_002.py
      - .github/workflows/apply_gc_perf_mass_expo_002.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: gc-perf-mass-expo-002
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Apply runtime patch
        run: python scripts/apply_gc_perf_mass_expo_002.py
      - name: Compile and regression
        run: |
          python -m py_compile app.py game/fleet.py
          python -m pytest -q --tb=line tests/test_gc_perf_mass_expo_002.py
          git diff --check
      - name: Commit runtime patch
        shell: bash
        run: |
          if git diff --quiet -- app.py game/fleet.py docs/FLEET_SYSTEM.md; then
            echo "No runtime changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py game/fleet.py docs/FLEET_SYSTEM.md
          git commit -m "perf(fleet): keep mass expedition preview read-only"
          git push
