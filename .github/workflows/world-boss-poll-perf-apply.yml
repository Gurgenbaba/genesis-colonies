name: GC World Boss Poll Perf Apply

on:
  push:
    branches:
      - perf/world-boss-adaptive-polling
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Materialize adaptive poller
        run: python scripts/apply_gc_world_boss_poll_perf.py

      - name: JavaScript syntax gate
        run: node --check static/main.js

      - name: World Boss polling regression
        run: python -m pytest -q tests/test_gc_world_boss_poll_perf.py tests/test_world_boss.py

      - name: Verify materializer idempotency
        run: |
          cp static/main.js /tmp/main.js.before
          python scripts/apply_gc_world_boss_poll_perf.py
          cmp /tmp/main.js.before static/main.js

      - name: Commit generated runtime change
        run: |
          if git diff --quiet -- static/main.js; then
            echo "Runtime source already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/main.js
          git commit -m "perf(world-boss): make live polling adaptive"
          git push
