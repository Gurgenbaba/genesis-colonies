name: Fix fleet troop preview blocker
on:
  push:
    branches: [feature/fleet-action-reasons]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements-prod.txt pytest
      - name: Apply troop preview fix
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 anchor, found {count}: {old[:120]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          main_path = Path('static/main.js')
          main = main_path.read_text(encoding='utf-8')
          p0 = main.index('    const runPreview = async (page) => {')
          p1 = main.index('\n    const schedulePreview = (page) => {', p0)
          preview_js = main[p0:p1]
          body_i = preview_js.index('body: JSON.stringify({')
          ships_i = preview_js.index('ships,', body_i)
          line_i = preview_js.rfind('\n', 0, ships_i) + 1
          indent = preview_js[line_i:ships_i]
          insert_at = ships_i + len('ships,')
          if 'troops: getTroopsSelection(page)' not in preview_js[body_i:]:
              preview_js = preview_js[:insert_at] + f'\n{indent}troops: getTroopsSelection(page),' + preview_js[insert_at:]
          main_path.write_text(main[:p0] + preview_js + main[p1:], encoding='utf-8')

          replace_once(
              'app.py',
              '''            mission_type=mission_type,\n            ships=ships,\n            resources=data.get("resources") or {},\n            speed_percent=speed_percent,''',
              '''            mission_type=mission_type,\n            ships=ships,\n            troops=data.get("troops") or {},\n            resources=data.get("resources") or {},\n            speed_percent=speed_percent,''',
          )

          fleet = Path('game/fleet.py')
          s = fleet.read_text(encoding='utf-8')
          helper_anchor = '\ndef build_fleet_send_preview(\n'
          helper = '''\ndef _fleet_preview_has_troop_stock(\n    origin_planet_id: int,\n    troops: Mapping[str, int] | None,\n    *,\n    conn,\n) -> bool:\n    \"\"\"Read-only troop stock check for launch preview; final send still deducts atomically.\"\"\"\n    if not troops:\n        return True\n    from .troop_defs import normalize_troops\n    from .troops import get_planet_troops\n\n    selected = normalize_troops(troops)\n    if not selected:\n        return True\n    stock = get_planet_troops(int(origin_planet_id), conn=conn)\n    return all(int(stock.get(key) or 0) >= int(qty) for key, qty in selected.items())\n\n\ndef build_fleet_send_preview(\n'''
          if s.count(helper_anchor) != 1:
              raise SystemExit(f'game/fleet.py: build preview anchor count={s.count(helper_anchor)}')
          s = s.replace(helper_anchor, helper, 1)

          old_sig = '''    mission_type: str,\n    ships: Mapping[str, int],\n    resources: Mapping[str, Any] | None,\n    speed_percent: int,\n    conn=None,'''
          new_sig = '''    mission_type: str,\n    ships: Mapping[str, int],\n    resources: Mapping[str, Any] | None,\n    troops: Mapping[str, int] | None = None,\n    speed_percent: int = 100,\n    conn=None,'''
          if s.count(old_sig) != 1:
              raise SystemExit(f'game/fleet.py: preview signature anchor count={s.count(old_sig)}')
          s = s.replace(old_sig, new_sig, 1)

          old_call = '''                mission_type=mission,\n                ships=ships_n,\n                resources=resources_n,\n                speed_percent=int(speed_percent),\n                conn=conn,'''
          new_call = '''                mission_type=mission,\n                ships=ships_n,\n                resources=resources_n,\n                troops=troops,\n                speed_percent=int(speed_percent),\n                conn=conn,'''
          if s.count(old_call) != 1:
              raise SystemExit(f'game/fleet.py: validate call anchor count={s.count(old_call)}')
          s = s.replace(old_call, new_call, 1)

          old_result = '''            can_send = ok\n            block_reason = reason or \"\"\n            if (_extra or {}).get(\"mission_lock\"):'''
          new_result = '''            if (\n                ok\n                and mission == \"attack\"\n                and troops\n                and not _fleet_preview_has_troop_stock(int(origin_planet[\"id\"]), troops, conn=conn)\n            ):\n                ok = False\n                reason = \"not_enough_troops\"\n                _extra = None\n            can_send = ok\n            block_reason = reason or \"\"\n            if (_extra or {}).get(\"mission_lock\"):'''
          if s.count(old_result) != 1:
              raise SystemExit(f'game/fleet.py: preview result anchor count={s.count(old_result)}')
          s = s.replace(old_result, new_result, 1)

          old_decl = '''        attack_limit_payload: Optional[Dict[str, Any]] = None\n        noob_protection_payload: Optional[Dict[str, Any]] = None'''
          new_decl = '''        attack_limit_payload: Optional[Dict[str, Any]] = None\n        noob_protection_payload: Optional[Dict[str, Any]] = None\n        troop_slots_needed_payload: Optional[int] = None\n        troop_berths_payload: Optional[int] = None'''
          if s.count(old_decl) != 1:
              raise SystemExit(f'game/fleet.py: preview payload declaration count={s.count(old_decl)}')
          s = s.replace(old_decl, new_decl, 1)

          old_extra = '''            if (_extra or {}).get(\"noob_protection\"):\n                noob_protection_payload = _extra[\"noob_protection\"]'''
          new_extra = '''            if (_extra or {}).get(\"noob_protection\"):\n                noob_protection_payload = _extra[\"noob_protection\"]\n            if (_extra or {}).get(\"troop_slots_needed\") is not None:\n                troop_slots_needed_payload = int(_extra[\"troop_slots_needed\"])\n            if (_extra or {}).get(\"troop_berths\") is not None:\n                troop_berths_payload = int(_extra[\"troop_berths\"])'''
          if s.count(old_extra) != 1:
              raise SystemExit(f'game/fleet.py: preview extra payload anchor count={s.count(old_extra)}')
          s = s.replace(old_extra, new_extra, 1)

          old_payload = '''        if noob_protection_payload:\n            payload[\"noob_protection\"] = noob_protection_payload\n        if mission == \"expedition\":'''
          new_payload = '''        if noob_protection_payload:\n            payload[\"noob_protection\"] = noob_protection_payload\n        if troop_slots_needed_payload is not None:\n            payload[\"troop_slots_needed\"] = troop_slots_needed_payload\n        if troop_berths_payload is not None:\n            payload[\"troop_berths\"] = troop_berths_payload\n        if mission == \"expedition\":'''
          if s.count(old_payload) != 1:
              raise SystemExit(f'game/fleet.py: preview payload output anchor count={s.count(old_payload)}')
          s = s.replace(old_payload, new_payload, 1)
          fleet.write_text(s, encoding='utf-8')

          test_path = Path('tests/test_fleet_action_reasons.py')
          test = test_path.read_text(encoding='utf-8')
          addition = '''\n\ndef test_fleet_preview_validates_selected_troops_before_enabling_launch():\n    main_js = Path(\"static/main.js\").read_text(encoding=\"utf-8\")\n    app_src = Path(\"app.py\").read_text(encoding=\"utf-8\")\n    fleet_src = Path(\"game/fleet.py\").read_text(encoding=\"utf-8\")\n\n    assert \"troops: getTroopsSelection(page)\" in main_js\n    preview_api = app_src[app_src.index('def api_fleet_preview():'):app_src.index('@app.route(\"/api/fleet/resolve-target\"') ]\n    assert 'troops=data.get(\"troops\") or {}' in preview_api\n    preview_src = fleet_src[fleet_src.index('def build_fleet_send_preview('):fleet_src.index('def list_admin_fleet_movements(')]\n    assert \"troops=troops\" in preview_src\n    assert \"_fleet_preview_has_troop_stock\" in preview_src\n    assert 'reason = \"not_enough_troops\"' in preview_src\n    assert 'payload[\"troop_slots_needed\"]' in preview_src\n    assert 'payload[\"troop_berths\"]' in preview_src\n'''
          if 'def test_fleet_preview_validates_selected_troops_before_enabling_launch()' not in test:
              test_path.write_text(test.rstrip() + addition.rstrip() + '\n', encoding='utf-8')
          PY
      - name: Syntax and diff gate
        run: |
          python -m py_compile app.py game/fleet.py tests/test_fleet_action_reasons.py
          node --check static/main.js
          git diff --check
      - name: Focused Fleet regression
        run: |
          python -m pytest -q --tb=line \
            tests/test_fleet_action_reasons.py \
            tests/test_fleet.py \
            tests/test_fleet_mission_locks.py \
            tests/test_noob_protection.py \
            tests/test_gc_perf_fleet_send_001.py \
            tests/test_gc934_fleet_manual_mission.py \
            tests/test_gc590a_fleet_world_target.py
      - name: Remove temporary helper
        run: rm -f .github/workflows/fix-fleet-troop-preview.yml
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(fleet): validate troop stock in launch preview'
          git push
