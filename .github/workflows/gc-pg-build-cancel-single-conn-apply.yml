name: GC PG Build Cancel Single Connection Apply

on:
  push:
    branches:
      - fix/pg-building-cancel-single-connection

concurrency:
  group: gc-pg-build-cancel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: '0'
      SECRET_KEY: ci-build-cancel-secret-key-not-for-production-use
      GC_SKIP_MIGRATION_CHECK: '1'
      GC_EMBEDDED_CRON: '0'
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pg-building-cancel-single-connection
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Apply single-connection patch
        run: python scripts/apply_gc_pg_build_cancel_single_conn.py
      - name: Run queue regressions
        run: |
          python -m pytest -q tests/test_gc_pg_build_cancel_single_connection.py tests/test_gc831_queue_refund.py tests/test_gc833b_queue_cancel_state.py tests/test_queue_static_contract.py
          python -m py_compile game/buildings.py
          git diff --check
      - name: Commit validated source patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/apply_gc_pg_build_cancel_single_conn.py .github/workflows/gc-pg-build-cancel-single-conn-apply.yml
          git add game/buildings.py tests/test_gc_pg_build_cancel_single_connection.py
          git commit -m 'fix(pg): keep building cancel on mutation connection'
          git push origin HEAD:fix/pg-building-cancel-single-connection
