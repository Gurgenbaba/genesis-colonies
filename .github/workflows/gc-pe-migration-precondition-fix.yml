name: GC PE Migration Preconditions Fix

on:
  push:
    branches: [fix/pe-mechanics-reconciliation]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: pe-migration-precondition-not-for-production
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pe-mechanics-reconciliation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Apply migration precondition patch
        run: python scripts/_tmp_apply_migration_preconditions.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Legacy and PE migration compatibility gate
        shell: bash
        run: |
          python -m py_compile migrate.py game/planet_evolution/mechanics.py game/planet_evolution/impact.py
          python -m pytest -q --tb=line tests/test_big_score_migration.py::test_migration_154_preserves_122_populated_legacy_score_rows
          python -m pytest -q --tb=line tests/test_gc_pe_mechanics_contract.py tests/test_gc_pe_clarity.py
          git diff --check
      - name: Commit product fix and remove temporary executor
        shell: bash
        run: |
          rm -f scripts/_tmp_apply_migration_preconditions.py .github/workflows/gc-pe-migration-precondition-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(migrations): skip module data migrations on absent tables"
          git push origin HEAD:fix/pe-mechanics-reconciliation
