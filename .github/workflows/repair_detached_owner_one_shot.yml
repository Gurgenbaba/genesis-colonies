name: Repair Detached Owner One-Shot

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'hotfix/fleet-tx-mutation-isolation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Repair false-positive static assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/hotfix_fleet_detached_owner_once.yml')
          text = p.read_text(encoding='utf-8')
          old = '    assert "conn=None" not in source\\n'
          new = '    assert "conn = db_detached()" in source\\n'
          if old not in text:
              raise SystemExit('assertion anchor not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/repair_detached_owner_one_shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/hotfix_fleet_detached_owner_once.yml
          git commit -m "ci: fix detached-owner false-positive assertion"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
