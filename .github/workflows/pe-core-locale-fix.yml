name: PE Core Locale Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/pe-english-locale-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pe-english-locale-cleanup

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply targeted PE locale patch
        run: python scripts/pe_core_locale_patch.py

      - name: Run locale guards
        run: |
          python scripts/audit_locale_keys.py
          python scripts/audit_visible_i18n.py --locales-only
          python -m pip install -r requirements-prod.txt pytest
          python -m pytest -q --tb=line tests/test_i18n_hardening.py tests/test_gc900_multilanguage.py

      - name: Commit targeted locale cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add locales/*.json tests/test_i18n_hardening.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(i18n): localize Planet Evolution core labels"
          git push origin HEAD:fix/pe-english-locale-cleanup
