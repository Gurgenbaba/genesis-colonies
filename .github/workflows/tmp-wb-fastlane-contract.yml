name: TMP WB Fastlane Contract

on:
  push:
    branches:
      - hotfix/world-boss-action-fastlane

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch contract tests
        run: python .github/tmp_wb_contract_patch.py
      - name: Focused test gate
        run: |
          python -m pip install -r requirements.txt pytest
          python -m py_compile app.py tests/test_world_boss.py
          pytest -q tests/test_world_boss.py -k 'world_boss_attack_response_uses_action_fastlane or api_world_boss_instant_attack'
          git diff --check
      - name: Commit and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/tmp_wb_contract_patch.py .github/workflows/tmp-wb-fastlane-contract.yml
          git add -A
          git diff --cached --check
          git commit -m "test: align World Boss fastlane contract"
          git push
