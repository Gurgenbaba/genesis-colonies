name: Genesis Sentinel

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sentinel:
    name: browser-sentinel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-sentinel-secret-key-not-for-production-use
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt -r requirements-dev.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Sentinel syntax gate
        run: |
          python -m py_compile scripts/browser_test_support.py scripts/browser_sentinel.py scripts/browser_report.py
          git diff --check

      - name: Run sandbox browser journey
        run: python scripts/browser_sentinel.py --mode sandbox --fail-on none

      - name: Evaluate Sentinel gate
        run: python scripts/browser_report.py artifacts/browser/report.json --fail-on high

      - name: Upload Sentinel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-sentinel-${{ github.run_id }}
          path: |
            artifacts/browser/report.json
            artifacts/browser/report.html
            artifacts/browser/gate.json
            artifacts/browser/server.log
            artifacts/browser/screenshots/
            artifacts/browser/dom/
            artifacts/browser/findings/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-sentinel-traces-${{ github.run_id }}
          path: artifacts/browser/traces/
          if-no-files-found: warn
          retention-days: 7
