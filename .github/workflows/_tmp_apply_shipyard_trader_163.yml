name: TEMP Apply Shipyard Trader 163
on:
  push:
    branches: [fix/pg-shipyard-trader-p0-163]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pg-shipyard-trader-p0-163
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scoped dependencies
        run: python -m pip install -r requirements-prod.txt pytest
      - name: Apply exact P0 patch
        run: python scripts/_apply_pg_shipyard_trader_p0_163.py
      - name: Verify syntax and focused regressions
        run: |
          python -m py_compile app.py game/shipyard.py
          node --check static/main.js
          python -m pytest -q tests/test_gc_pg_163_shipyard_trader.py tests/test_gc_trader_max_001.py tests/test_deep_vault_ark.py
      - name: Commit product diff
        run: |
          if git diff --quiet -- app.py static/main.js; then
            echo "P0 patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py static/main.js
          git commit -m "fix(pg): persist shipyard builds and exact trader amounts"
          git push origin HEAD:fix/pg-shipyard-trader-p0-163
