      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Focused tests
        run: |
          python -m py_compile game/fleet_bulk.py
          node --check static/js/fleet-bulk-launch.js
          python -m pytest tests/test_fleet_bulk_launch.py tests/test_fleet_action_reasons.py tests/test_gc_perf_fleet_send_001.py -v
          python -m pytest tests/test_fleet.py -q -k "preset or send or slot"
          git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat(fleet): launch eligible saved fleets in bulk"
          git push origin HEAD:feature/fleet-bulk-launch
