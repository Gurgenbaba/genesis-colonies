name: GC Performance Pass 02 Resample

on:
  push:
    branches:
      - perf/current-hotspot-pass-02

permissions:
  contents: read

env:
  APP_ENV: development
  FLASK_ENV: development
  FLASK_DEBUG: '0'
  SECRET_KEY: ci-perf-pass-02-resample-not-for-production
  GC_SKIP_MIGRATION_CHECK: '1'
  GC_EMBEDDED_CRON: '0'
  GC_DB_BACKEND: sqlite
  GC_REQUEST_PERF_DEBUG: '1'
  GC_REQUEST_PERF_SLOW_MS: '0'
  GC_REQUEST_PERF_SAMPLE: '1.0'
  GC_PERF_INTEL: '1'

jobs:
  resample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Five-sample medians
        shell: bash
        run: |
          cat > tests/_tmp_perf_pass_02_resample.py <<'PY'
          from __future__ import annotations

          import logging
          import re
          import statistics

          import pytest

          pytest_plugins = ["tests.test_game_state_live"]

          ROUTES = [
              ("diet", "/api/game-state"),
              ("overview", "/api/game-state?include_panel=1&panel_page=overview"),
          ]
          KEYS = (
              "total_ms",
              "sql_count",
              "sql_write_count",
              "db_connection_open_count",
              "live_context_ms",
              "live_hud_reads_ms",
              "payload_ms",
              "payload_panel_ms",
              "panel_overview_rows_ms",
              "panel_overview_status_ms",
          )

          def parse(message):
              out = {}
              for key in KEYS:
                  match = re.search(rf"(?:^| )({re.escape(key)})=([^ ]+)", message)
                  if not match:
                      continue
                  raw = match.group(2)
                  try:
                      out[key] = float(raw)
                  except ValueError:
                      pass
              return out

          @pytest.mark.parametrize("label,route", ROUTES)
          def test_resample(game_client, caplog, label, route):
              client, _pid = game_client
              for _ in range(2):
                  assert client.get(route).status_code == 200
              samples = []
              for idx in range(5):
                  caplog.clear()
                  with caplog.at_level(logging.INFO):
                      resp = client.get(route)
                  assert resp.status_code == 200
                  logs = [r.message for r in caplog.records if "[GC REQUEST PERF]" in r.message]
                  assert logs
                  parsed = parse(logs[-1])
                  samples.append(parsed)
                  print(f"\nRESAMPLE {label} #{idx + 1} {logs[-1]}")
              medians = {}
              for key in KEYS:
                  vals = [s[key] for s in samples if key in s]
                  if vals:
                      medians[key] = statistics.median(vals)
              print(f"\nMEDIAN {label} " + " ".join(f"{k}={v:g}" for k, v in medians.items()))
          PY
          python -m pytest -q -s tests/_tmp_perf_pass_02_resample.py
          rm -f tests/_tmp_perf_pass_02_resample.py
