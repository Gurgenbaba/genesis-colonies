name: GC-AL-WAR-01 Apply

on:
  push:
    branches: [feature/alliance-war-peace]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: gc-al-war-01-apply
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-alliance-war-secret-key-not-for-production-use
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alliance-war-peace
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest

      - name: Apply deterministic GC-AL-WAR-01 patch
        run: python scripts/_gc_al_war_01_apply.py

      - name: Focused alliance war regressions
        run: |
          python -m pytest -q --tb=line \
            tests/test_alliance.py::test_diplomacy_war_and_duplicate_request \
            tests/test_alliance.py::test_gc_al_dip_01_fleet_mission_hooks \
            tests/test_alliance.py::test_gc_al_war_01_peace_accept_returns_to_neutral \
            tests/test_alliance.py::test_gc_al_war_01_declined_peace_keeps_war \
            tests/test_alliance.py::test_gc_al_war_01_transition_guards_and_stale_requests \
            tests/test_alliance.py::test_gc_al_war_01_member_cannot_offer_peace \
            tests/test_alliance.py::test_gc_al_war_01_hub_renders_peace_action_for_active_war

      - name: Locale parity and placeholders
        run: |
          python scripts/audit_locale_keys.py
          python scripts/audit_visible_i18n.py --locales-only

      - name: Browser syntax and changed-line I18N gate
        run: |
          node --check static/main.js
          python scripts/audit_visible_i18n.py --raw-only --diff-base origin/main --max-findings 200
          git diff --check

      - name: Commit generated product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            game/alliance.py game/alliance_catalog.py templates/alliance.html \
            tests/test_alliance.py docs/ALLIANCE_SYSTEM.md docs/CAPABILITY_STATUS.md \
            locales/de.json locales/en.json locales/fr.json locales/es.json \
            locales/pl.json locales/tr.json locales/ru.json locales/pt.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "feat(alliance): add peace workflow and harden war transitions"
          git push origin HEAD:feature/alliance-war-peace
