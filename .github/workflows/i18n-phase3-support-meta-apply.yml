name: I18N Phase 3 Support Meta Apply

on:
  push:
    branches:
      - fix/i18n-phase3-support-worldboss
    paths:
      - scripts/_gc_i18n_phase3_support_meta.py
      - .github/workflows/i18n-phase3-support-meta-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply localized support message meta format
        run: python scripts/_gc_i18n_phase3_support_meta.py
      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/main.js locales tests/test_i18n_hardening.py
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "fix(i18n): localize support message metadata"
          git push
