name: Apply WB Auto Lean Codemod

on:
  push:
    branches:
      - perf/world-boss-auto-lean-response
    paths:
      - "scripts/_apply_gc_perf_wb_auto_lean.py"
      - ".github/workflows/apply-wb-auto-lean-codemod.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/world-boss-auto-lean-response
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply deterministic codemod
        run: |
          python scripts/_apply_gc_perf_wb_auto_lean.py
          python -m py_compile game/world_boss.py
          git diff --check
          git diff --exit-code -- game/world_boss.py && {
            echo "Codemod produced no source diff" >&2
            exit 1
          } || true
      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/world_boss.py
          git commit -m "perf(world-boss): use lean response for background auto fire"
          git push origin HEAD:perf/world-boss-auto-lean-response
