          text = text.replace(old, new, 1)
          old = '''    {% if en_route %}{{ T('galaxy_asteroid_en_route', 'Unterwegs') }}{% else %}{{ T('galaxy_asteroid_harvest', 'Abbauen') }}{% endif %}\n'''
          new = '''    {% if returning %}{{ T('fleet_status_returning', 'Rückflug') }}{% elif en_route %}{{ T('galaxy_asteroid_en_route', 'Unterwegs') }}{% else %}{{ T('galaxy_asteroid_harvest', 'Abbauen') }}{% endif %}\n'''
          if old not in text:
              raise SystemExit('missing block button label anchor')
          text = text.replace(old, new, 1)
          block.write_text(text, encoding='utf-8')

          # Add only the two genuinely new user-facing strings; keep locale files stable.
          translations = {
              'de': (
                  'Dein 10%-Anteil an diesem Mega-Belt ist ausgeschöpft.',
                  'Dein 10%-Anteil am Mega-Belt bei %(coords)s ist ausgeschöpft. Die Flotte kehrt leer nach %(origin)s zurück.',
              ),
