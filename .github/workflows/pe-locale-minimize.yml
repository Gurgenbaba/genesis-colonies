name: PE Locale Diff Minimizer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  minimize:
    if: github.head_ref == 'fix/pe-english-locale-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pe-english-locale-cleanup
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Minimize locale diff against main
        run: python scripts/pe_locale_minimize_diff.py

      - name: Run locale guards
        run: |
          python scripts/audit_locale_keys.py
          python scripts/audit_visible_i18n.py --locales-only
          python -m pip install -r requirements-prod.txt pytest
          python -m pytest -q --tb=line tests/test_i18n_hardening.py tests/test_gc900_multilanguage.py

      - name: Commit minimized locale diff
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add locales/*.json
          if git diff --cached --quiet; then
            echo "No locale diff cleanup needed"
            exit 0
          fi
          git commit -m "chore(i18n): minimize Planet Evolution locale diff"
          git push origin HEAD:fix/pe-english-locale-cleanup
