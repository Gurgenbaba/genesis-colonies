name: one-shot asteroid effective ships hotfix

on:
  push:
    branches:
      - hotfix/asteroid-harvest-effective-ships

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/asteroid-harvest-effective-ships
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply hotfix patch
        run: python tools/_hotfix_asteroid_effective_ships.py

      - name: Remove one-shot builder files
        run: |
          rm tools/_hotfix_asteroid_effective_ships.py
          rm .github/workflows/_hotfix_asteroid_effective_ships.yml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m pip install pytest

      - name: Focused regression suite
        run: |
          python -m py_compile game/fleet.py
          python -m pytest -q tests/test_asteroids.py tests/test_recycler.py tests/test_asteroid_value_preview.py

      - name: Commit tested hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(fleet): charge asteroid harvest fuel for effective ships [asteroid-hotfix-built]"
          git push origin HEAD:hotfix/asteroid-harvest-effective-ships
