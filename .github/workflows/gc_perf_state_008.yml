name: GC State 008 Codemod

on:
  push:
    branches:
      - fix/gc-perf-state-008

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply focused state 008 patch
        run: python scripts/gc_perf_state_008.py
      - name: Commit generated source
        shell: bash
        run: |
          if git diff --quiet -- game/db.py game/alliance.py game/auction_house.py game/case_battles.py .github/workflows/ci.yml; then
            echo "No generated change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/db.py game/alliance.py game/auction_house.py game/case_battles.py .github/workflows/ci.yml
          git commit -m "perf: collapse nav badge schema guards"
          git push origin "HEAD:${GITHUB_REF_NAME}"
