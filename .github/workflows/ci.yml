# Smoke CI for Railway "Wait for CI" — keep this job fast and green on push to main.
# Full suite remains local / optional; focused feature gates run on pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-smoke-secret-key-not-for-production-use
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Smoke tests (deploy + cron)
        run: |
          python -m pytest -q --tb=line \
            tests/test_deployment.py tests/test_internal_cron.py tests/test_embedded_cron.py \
            tests/test_fleet_worker.py tests/test_gc_perf_tk_005.py tests/test_gc_perf_fleet_write_001.py \
            tests/test_gc_perf_resource_persist_001.py tests/test_gc_perf_buildings_002.py \
            tests/test_galactic_diplomacy.py::test_ensure_get_set_galaxy_personality \
            tests/test_commander_classes.py::test_linear_gate_and_sp_unlock \
            tests/test_commander_classes.py::test_effect_resolver_includes_class_mods \
            tests/test_inventory_booster_visibility.py::test_use_duration_booster_creates_active_entry \
            tests/test_inventory_booster_visibility.py::test_production_booster_tier_ladder_25_then_50

  big-score:
    name: big-score-ranking
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-big-score-secret-key-not-for-production-use
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Compile and browser syntax
        run: |
          python -m py_compile game/ranking.py game/scoring.py game/number_format.py game/pirates/threat.py game/fleet.py
          node --check static/main.js
          node --check static/js/ranking_page.js
          git diff --check
      - name: Big-score regression suite
        run: |
          python -m pytest -q --tb=line \
            tests/test_ranking.py tests/test_number_format.py tests/test_noob_protection.py \
            tests/test_big_score_migration.py \
            tests/test_gc622_integer_overflow.py::TestGC622SchemaTypes::test_player_scores_use_decimal_text \
            tests/test_gc622_integer_overflow.py::TestGC622Ranking

  i18n:
    name: i18n-hardening
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-i18n-secret-key-not-for-production-use
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Locale key and translation audit (all 8 languages)
        run: |
          python scripts/audit_locale_keys.py
          python scripts/audit_visible_i18n.py --locales-only
      - name: I18N regression tests
        run: |
          python -m pytest -q --tb=line tests/test_gc900_multilanguage.py tests/test_i18n_hardening.py
      - name: Full visible raw-string inventory (advisory)
        run: python scripts/audit_visible_i18n.py --raw-only --report-only --max-findings 120
      - name: Block newly introduced player-facing raw strings
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then BASE="${{ github.event.pull_request.base.sha }}"; else BASE="${{ github.event.before }}"; fi
          python scripts/audit_visible_i18n.py --raw-only --diff-base "$BASE" --max-findings 200

  # PR29_BIGINT_ONE_SHOT_START
  pr29-bigint-one-shot:
    name: pr29-bigint-one-shot
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/fullwidth-ranking-exact-scores'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fullwidth-ranking-exact-scores
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Harden ranking score adapters
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main_path = Path("static/main.js")
          source = main_path.read_text(encoding="utf-8")
          replacements = [
              (
                  "return parseIntNumber(row[tab.scoreKey]);",
                  "return parseDisplayBigInt(row[tab.scoreKey]);",
                  "rankingScoreValue adapter",
              ),
              (
                  "return parseIntNumber(cur[tab.scoreKey]);",
                  "return parseDisplayBigInt(cur[tab.scoreKey]);",
                  "rankingCurrentScore adapter",
              ),
              (
                  """const diff = rankingScoreValue(b, tabId) - rankingScoreValue(a, tabId);\n        if (diff !== 0) return diff;""",
                  """const scoreB = rankingScoreValue(b, tabId);\n        const scoreA = rankingScoreValue(a, tabId);\n        if (scoreB !== scoreA) return scoreB > scoreA ? -1 : 1;""",
                  "ranking BigInt comparator",
              ),
          ]
          for old, new, label in replacements:
              old_count = source.count(old)
              new_count = source.count(new)
              if old_count == 1:
                  source = source.replace(old, new, 1)
              elif old_count == 0 and new_count == 1:
                  pass
              else:
                  raise SystemExit(f"{label}: unexpected old/new matches {old_count}/{new_count}")
          main_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/test_number_format.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "def test_ranking_client_score_path_uses_bigint_exactly():"
          if marker not in tests:
              tests += '''\n\n\ndef test_ranking_client_score_path_uses_bigint_exactly():\n    \"\"\"Ranking must never coerce exact decimal score strings through JS Number.\"\"\"\n    from pathlib import Path\n\n    source = (Path(__file__).resolve().parents[1] / \"static\" / \"main.js\").read_text(encoding=\"utf-8\")\n\n    assert \"return parseDisplayBigInt(row[tab.scoreKey]);\" in source\n    assert \"return parseDisplayBigInt(cur[tab.scoreKey]);\" in source\n    assert \"return parseIntNumber(row[tab.scoreKey]);\" not in source\n    assert \"return parseIntNumber(cur[tab.scoreKey]);\" not in source\n    assert \"rankingScoreValue(b, tabId) - rankingScoreValue(a, tabId)\" not in source\n    assert \"if (scoreB !== scoreA) return scoreB > scoreA ? -1 : 1;\" in source\n'''
              test_path.write_text(tests, encoding="utf-8")
          PY
      - name: Focused verification
        run: |
          node --check static/main.js
          python -m py_compile tests/test_number_format.py
          git diff --check
      - name: Commit exact BigInt ranking path
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/main.js tests/test_number_format.py
          if git diff --cached --quiet; then
            echo "BigInt hardening already present; nothing to commit."
            exit 0
          fi
          git commit -m "fix: keep ranking scores exact with BigInt"
          git push origin HEAD:feature/fullwidth-ranking-exact-scores
  # PR29_BIGINT_ONE_SHOT_END
