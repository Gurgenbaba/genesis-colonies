          text = block.read_text(encoding='utf-8')
          text = text.replace(
              '{% set en_route = asteroid.viewer_en_route if asteroid.viewer_en_route is defined else false %}\n{% set harvest_locked = asteroid.viewer_harvest_locked if asteroid.viewer_harvest_locked is defined else false %}\n',
              '{% set en_route = asteroid.viewer_en_route if asteroid.viewer_en_route is defined else false %}\n{% set returning = asteroid.viewer_returning if asteroid.viewer_returning is defined else false %}\n{% set mega_limit = asteroid.viewer_mega_quota_exhausted if asteroid.viewer_mega_quota_exhausted is defined else false %}\n{% set harvest_locked = asteroid.viewer_harvest_locked if asteroid.viewer_harvest_locked is defined else false %}\n',
