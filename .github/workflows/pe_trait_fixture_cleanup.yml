name: PE Trait Fixture Cleanup

on:
  push:
    branches:
      - test/pe-trait-definition-fixture
    paths:
      - .github/workflows/pe_trait_fixture_cleanup.yml

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: pe-trait-fixture-gate
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Attach migrated fixture to definition tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_planet_evolution_dashboard.py')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'def test_trait_effect_lines_from_definitions():': 'def test_trait_effect_lines_from_definitions(evo_db):',
              'def test_trait_effect_lines_include_blocks():': 'def test_trait_effect_lines_include_blocks(evo_db):',
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f'expected exactly one anchor: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
      - name: Verify complete PE dashboard test module
        run: |
          python -m py_compile tests/test_planet_evolution_dashboard.py
          python -m pytest -q --tb=line tests/test_planet_evolution_dashboard.py
      - name: Commit source cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_planet_evolution_dashboard.py
          git commit -m "test: migrate PE trait definition fixtures"
          git push origin HEAD:test/pe-trait-definition-fixture
