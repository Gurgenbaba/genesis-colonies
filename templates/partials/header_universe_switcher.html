{% if GC_NETWORK_ENABLED and GC_NETWORK_UNI1_OPEN and AUTH_USER and AUTH_USER.id %}
<div class="gc-universe-switcher"
     id="gc-universe-switcher"
     data-universe="{{ GC_NETWORK_UNIVERSE_KEY }}"
     aria-label="{{ T('network_universe_switcher_label') }}">
  <select id="gc-universe-select"
          data-gc-hud-select
          data-gc-universe-select
          aria-label="{{ T('network_universe_switcher_label') }}">
    {% if GC_NETWORK_UNIVERSE_KEY == 'dev' %}
      <option value="" selected>DEV</option>
      <option value="{{ url_for('network_universe_enter', target_key='uni1') }}">UNI 1</option>
    {% else %}
      <option value="{{ GC_NETWORK_AUTHORITY_URL }}/overview">DEV</option>
      <option value="" selected>UNI 1</option>
    {% endif %}
  </select>
</div>

<script>
  (() => {
    const select = document.querySelector("[data-gc-universe-select]");
    if (!select || select.dataset.gcBound === "1") return;
    select.dataset.gcBound = "1";
    select.addEventListener("change", () => {
      const target = String(select.value || "").trim();
      if (!target) return;
      window.location.assign(target);
    });
  })();
</script>
{% endif %}
