name: GC Prod API Auth Pool Fix

on:
  push:
    branches: [fix/prod-api-auth-pool-burst]

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prod-api-auth-pool-burst
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply patch
        run: python scripts/apply_gc_pg_api_auth_cache_fix.py
      - name: Install dependencies
        run: pip install -r requirements-prod.txt pytest
      - name: Regression tests
        run: |
          python -m py_compile game/auth.py tests/test_gc_pg_busy_nav_001.py
          python -m pytest -q tests/test_gc_pg_busy_nav_001.py tests/test_gc_pg_pool_timeout_auth.py
          git diff --check
      - name: Commit generated hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/auth.py tests/test_gc_pg_busy_nav_001.py
          git commit -m "fix(auth): reuse fresh guard cache for API bursts"
          git push origin HEAD:fix/prod-api-auth-pool-burst
