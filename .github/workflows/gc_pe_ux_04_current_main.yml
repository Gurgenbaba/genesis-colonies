name: GC PE UX 04 Current Main

on:
  push:
    branches:
      - fix/gc-pe-ux-04-context-evidence
    paths:
      - .github/workflows/gc_pe_ux_04_current_main.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: gc-pe-ux-04-gate
      GC_SKIP_MIGRATION_CHECK: "1"
      GC_EMBEDDED_CRON: "0"
      GC_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest
      - name: Apply reviewed GC-PE-UX-04 patch to current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ux/pe-goal-context
          git show FETCH_HEAD:scripts/_tmp_apply_pe_ux04.py > scripts/_tmp_apply_pe_ux04_runtime.py
          python scripts/_tmp_apply_pe_ux04_runtime.py
          rm scripts/_tmp_apply_pe_ux04_runtime.py
          git diff --check
      - name: Focused Planet Evolution verification
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile game/planet_evolution/dashboard.py tests/test_planet_evolution_dashboard.py tests/test_gc_pe_clarity.py
          python -m pytest -q --tb=line tests/test_planet_evolution_dashboard.py tests/test_gc_pe_clarity.py
          python scripts/audit_locale_keys.py
      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            game/planet_evolution/dashboard.py \
            templates/planet_evolution.html \
            static/css/planet_evolution_clarity.css \
            tests/test_planet_evolution_dashboard.py \
            tests/test_gc_pe_clarity.py
          git commit -m "fix: show contextual Planet Evolution goal evidence"
          git push origin HEAD:fix/gc-pe-ux-04-context-evidence
